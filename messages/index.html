<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Argentica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3b3a'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.msg-shell { display:flex; height:100vh; overflow:hidden; }
.msg-main { flex:1; display:flex; flex-direction:column; overflow:hidden; max-width:700px; margin:0 auto; width:100%; }
.msg-hdr { padding:12px 16px; border-bottom:1px solid var(--border); background:var(--bg-elevated); display:flex; align-items:center; gap:10px; flex-shrink:0; }
.msg-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#5c2d3f,#0f3b3a); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.msg-hdr-name { font-size:14px; font-weight:700; }
.msg-hdr-status { font-size:11px; color:var(--fg-muted); }
.msg-thread { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg-bubble-wrap { display:flex; gap:8px; align-items:flex-end; }
.msg-bubble-wrap.me { flex-direction:row-reverse; }
.msg-bubble { max-width:70%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; }
.msg-bubble-wrap.them .msg-bubble { background:var(--bg-elevated); border:1px solid var(--border); border-radius:4px 16px 16px 16px; }
.msg-bubble-wrap.me .msg-bubble { background:var(--accent); color:#fff; border-radius:16px 4px 16px 16px; }
.msg-time { font-size:10px; color:var(--fg-muted); margin-top:3px; }
.msg-bubble-wrap.me .msg-time { text-align:right; }
.msg-avatar-sm { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.msg-input-area { border-top:1px solid var(--border); padding:12px 14px; background:var(--bg-elevated); flex-shrink:0; }
.msg-input-row { display:flex; gap:8px; align-items:flex-end; }
.msg-textarea { flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:20px; font-size:14px; font-family:inherit; resize:none; min-height:42px; max-height:120px; background:var(--bg); color:var(--fg); }
.msg-textarea:focus { outline:none; border-color:var(--accent); }
.msg-send { width:42px; height:42px; border-radius:50%; background:var(--accent); color:#fff; border:none; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.msg-send:hover { opacity:0.85; }
.msg-date-divider { text-align:center; font-size:11px; color:var(--fg-muted); padding:4px 0; }
.viewer-toggle { display:flex; gap:6px; margin-left:auto; }
.viewer-btn { padding:4px 10px; border:1px solid var(--border); border-radius:10px; font-size:11px; cursor:pointer; background:var(--bg); color:var(--fg-muted); font-family:inherit; }
.viewer-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="msg-shell">
<div class="msg-main">

  <div class="msg-hdr">
    <div class="msg-avatar">O</div>
    <div>
      <div class="msg-hdr-name">Olivia</div>
      <div class="msg-hdr-status" id="olivia-status">Identity Partners</div>
    </div>
    <div class="viewer-toggle">
      <button class="viewer-btn active" id="btn-simon" onclick="setViewer('simon',this)">Simon</button>
      <button class="viewer-btn" id="btn-olivia" onclick="setViewer('olivia',this)">Olivia</button>
    </div>
  </div>

  <div class="msg-thread" id="msg-thread">
    <div style="text-align:center;padding:30px;color:var(--fg-muted);font-size:13px;">Loading messages...</div>
  </div>

  <div class="msg-input-area">
    <div class="msg-input-row">
      <textarea class="msg-textarea" id="msg-input" placeholder="Message Olivia..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
      <button class="msg-send" onclick="sendMsg()">↑</button>
    </div>
  </div>

</div>
</div>
</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var viewer = 'simon';
var pollTimer = null;
var lastCount = 0;

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/messages/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  loadMessages();
  // Poll for new messages every 5 seconds
  pollTimer = setInterval(loadMessages, 5000);
});

function setViewer(v, btn) {
  viewer = v;
  document.querySelectorAll('.viewer-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var inp = document.getElementById('msg-input');
  if (inp) inp.placeholder = v === 'simon' ? 'Message Olivia...' : 'Message Simon...';
  loadMessages();
}

function loadMessages() {
  fetch(WORKER + '/api/messages?thread=simon-olivia')
    .then(function(r){return r.json();})
    .then(function(d){
      var msgs = d.messages || [];
      if (msgs.length === lastCount) return; // no change
      lastCount = msgs.length;
      renderMessages(msgs);
    })
    .catch(function(){});
}

function renderMessages(msgs) {
  var thread = document.getElementById('msg-thread');
  if (!msgs.length) {
    thread.innerHTML = '<div style="text-align:center;padding:40px;color:var(--fg-muted);font-size:13px;"><div style="font-size:40px;margin-bottom:12px;">💬</div><div>No messages yet. Say hello!</div></div>';
    return;
  }

  var html = '';
  var lastDate = '';
  msgs.forEach(function(m) {
    var isMe = m.from === viewer;
    var date = new Date(m.ts).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    if (date !== lastDate) {
      html += '<div class="msg-date-divider">' + date + '</div>';
      lastDate = date;
    }
    var time = new Date(m.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    var avatarLetter = m.from === 'simon' ? 'S' : 'O';
    var avatarBg = m.from === 'simon' ? 'var(--accent)' : 'linear-gradient(135deg,#5c2d3f,#0f3b3a)';
    html += '<div class="msg-bubble-wrap ' + (isMe?'me':'them') + '">' +
      '<div class="msg-avatar-sm" style="background:' + avatarBg + ';color:#fff;">' + avatarLetter + '</div>' +
      '<div><div class="msg-bubble">' + m.text.replace(/</g,'&lt;').replace(/\n/g,'<br>') + '</div>' +
      '<div class="msg-time">' + time + '</div></div>' +
      '</div>';
  });

  thread.innerHTML = html;
  thread.scrollTop = thread.scrollHeight;
}

function sendMsg() {
  var inp = document.getElementById('msg-input');
  var text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = 'auto';

  fetch(WORKER + '/api/messages', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({from: viewer, text: text, thread: 'simon-olivia'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if (d.success) {
      lastCount = 0; // force refresh
      loadMessages();
    }
  })
  .catch(function(e){ console.error(e); });
}
</script>
</body>
</html>
