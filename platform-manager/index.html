<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform Manager — Prism</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.pm-layout{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - var(--topbar-h));overflow:hidden;}
@media(max-width:1000px){.pm-layout{grid-template-columns:1fr;}.pm-right{display:none;}}
.pm-main{overflow-y:auto;padding:16px 20px;}
.pm-right{border-left:1px solid var(--border);background:var(--bg-surface);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
.cat-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;flex-shrink:0;}
.cat-tab{padding:7px 12px;font-size:12px;font-weight:500;color:var(--fg-muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.15s;}
.cat-tab:hover{color:var(--fg-primary);}
.cat-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.platform-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.plt-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;transition:border-color 0.15s;}
.plt-card:hover{border-color:var(--accent);}
.plt-card.connected{border-color:var(--success);background:#edf5eb;}
.plt-card.in-progress{border-color:var(--warning);background:#fdf3e7;}
.plt-name{font-weight:600;font-size:13px;color:var(--fg-primary);margin-bottom:3px;}
.plt-model{font-size:11px;color:var(--fg-muted);margin-bottom:6px;}
.plt-status-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.plt-actions{display:flex;gap:4px;flex-wrap:wrap;}
.status-flags{display:flex;gap:3px;flex-wrap:wrap;}
.flag{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:600;}
.flag-D{background:#e8f4f4;color:#0f3b3a;}
.flag-F{background:#f5e8ec;color:#5c2d3f;}
.flag-V{background:#fdf3e7;color:#c4925a;}
.flag-UK{background:#e8f0fe;color:#1a73e8;}
.flag-P{background:#f3e5f5;color:#6a1b9a;}
.flag-R{background:#fbeaea;color:#8b3a3a;}
.flag-C{background:#fff3e0;color:#e65100;}
.signup-panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;}
.signup-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--fg-muted);margin-bottom:10px;}
.signup-steps{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--fg-secondary);}
.signup-step{padding:6px 8px;background:var(--bg-surface);border-radius:5px;display:flex;gap:6px;}
.step-num{color:var(--accent);font-weight:600;flex-shrink:0;}
.broadcast-panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;}
.bucket-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.bucket-item:last-child{border-bottom:none;}
.bucket-check{width:16px;height:16px;border:1.5px solid var(--border);border-radius:3px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
.bucket-check.checked{background:var(--accent);border-color:var(--accent);color:#fff;}
</style>
</head>
<body>
<div class="prism-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content" id="main-content">
    <div class="topbar">
      <div class="topbar-title">Platform Manager</div>
      <div class="topbar-actions">
        <span style="font-size:12px;color:var(--fg-muted);" id="connected-count">Loading...</span>
        <button class="btn btn-sm btn-secondary" onclick="refreshStatus()" title="Refresh connection status">↺ Refresh</button>
        <button class="btn btn-sm btn-primary" onclick="startHeadlessSignup()" title="Begin headless signup for selected platforms">🤖 Headless Signup</button>
      </div>
    </div>
    <div class="pm-layout">
      <div class="pm-main">
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
          <input class="input" id="plt-search" type="text" placeholder="Search 150 platforms..." oninput="filterPlatforms(this.value)" style="max-width:280px;">
          <select class="select" id="tier-filter" onchange="filterPlatforms(document.getElementById('plt-search').value)" style="width:160px;font-size:12.5px;" title="Filter by tier">
            <option value="">All tiers</option>
            <option value="tier1">Tier 1 — Deploy now</option>
            <option value="tier2">Tier 2 — Build recurring</option>
            <option value="tier3">Tier 3 — Apply selectively</option>
          </select>
          <label style="font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px;">
            <input type="checkbox" id="show-connected" onchange="filterPlatforms(document.getElementById('plt-search').value)"> Connected only
          </label>
        </div>
        <div class="cat-tabs" id="cat-tabs"></div>
        <div class="platform-grid" id="platform-grid"></div>
      </div>
      <div class="pm-right">
        <div class="signup-panel" id="signup-panel">
          <div class="signup-title">Headless Signup</div>
          <div style="font-size:12.5px;color:var(--fg-muted);margin-bottom:10px;">Select platforms and click "Headless Signup" to automate account creation using hello@identitypartners.uk.</div>
          <div id="selected-platforms" style="font-size:12px;color:var(--fg-secondary);margin-bottom:8px;">No platforms selected.</div>
          <button class="btn btn-primary btn-sm" style="width:100%;" onclick="startHeadlessSignup()" title="Start automated signup">🤖 Start Signup</button>
          <div id="signup-log" style="margin-top:10px;background:#1a1a1a;color:#7ecf7e;border-radius:6px;padding:8px;font-family:monospace;font-size:11px;max-height:120px;overflow-y:auto;display:none;"></div>
        </div>
        <div class="broadcast-panel">
          <div class="signup-title">Content Buckets</div>
          <div style="font-size:12px;color:var(--fg-muted);margin-bottom:8px;">Group platforms to receive the same content simultaneously.</div>
          <div id="bucket-list"></div>
          <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="addBucket()" title="Add content bucket">+ Add Bucket</button>
        </div>
        <div class="signup-panel">
          <div class="signup-title">Platform Status</div>
          <div id="platform-status-list" style="font-size:12px;color:var(--fg-secondary);"></div>
        </div>
      </div>
    </div>
  </div>
</div>

    var tab = document.createElement('div');
    tab.className = 'cat-tab' + (cat === currentCat ? ' active' : '');
    tab.textContent = cat === 'all' ? 'All (' + PLATFORMS.length + ')' : CAT_LABELS[cat] || cat;
    tab.onclick = function() { currentCat = cat; buildCatTabs(); filterPlatforms(currentSearch); };
    tabs.appendChild(tab);
  });
}

function filterPlatforms(q) {
  currentSearch = q || '';
  var tierFilter = document.getElementById('tier-filter').value;
  var connectedOnly = document.getElementById('show-connected').checked;
  var filtered = PLATFORMS.filter(function(p) {
    var catMatch = currentCat === 'all' || p.cat === currentCat;
    var searchMatch = !currentSearch || p.name.toLowerCase().indexOf(currentSearch.toLowerCase()) >= 0 || (p.model||'').toLowerCase().indexOf(currentSearch.toLowerCase()) >= 0;
    var tierMatch = !tierFilter || getTier(p.name) === tierFilter;
    var connMatch = !connectedOnly || connectedPlatforms.indexOf(p.name.toLowerCase()) >= 0 || platformStatuses[p.name] === 'connected';
    return catMatch && searchMatch && tierMatch && connMatch;
  });
  renderPlatforms(filtered);
}

function renderPlatforms(platforms) {
  var grid = document.getElementById('platform-grid');
  if (!grid) return;
  var connected = PLATFORMS.filter(function(p){return connectedPlatforms.indexOf(p.name.toLowerCase())>=0||platformStatuses[p.name]==='connected';}).length;
  var countEl = document.getElementById('connected-count');
  if (countEl) countEl.textContent = connected + ' of ' + PLATFORMS.length + ' connected';
  grid.innerHTML = '';
  platforms.forEach(function(p) {
    var isConnected = connectedPlatforms.indexOf(p.name.toLowerCase()) >= 0 || platformStatuses[p.name] === 'connected';
    var isInProgress = platformStatuses[p.name] === 'in-progress';
    var tier = getTier(p.name);
    var card = document.createElement('div');
    card.className = 'plt-card' + (isConnected ? ' connected' : isInProgress ? ' in-progress' : '');
    if (tier === 'tier1') card.style.borderTop = '3px solid var(--accent)';
    else if (tier === 'tier2') card.style.borderTop = '3px solid var(--warning)';
    var name = document.createElement('div'); name.className = 'plt-name'; name.textContent = p.name;
    var model = document.createElement('div'); model.className = 'plt-model'; model.textContent = p.model || '';
    var statusRow = document.createElement('div'); statusRow.className = 'plt-status-row';
    var badge = document.createElement('span');
    badge.className = 'badge ' + (isConnected ? 'badge-success' : isInProgress ? 'badge-warning' : 'badge-muted');
    badge.textContent = isConnected ? '✓ Connected' : isInProgress ? '⟳ In progress' : 'Not connected';
    var flags = document.createElement('div'); flags.className = 'status-flags';
    (p.status||'').split(',').forEach(function(f) {
      f = f.trim();
      if (f) { var fl = document.createElement('span'); fl.className = 'flag flag-'+f; fl.textContent = f; flags.appendChild(fl); }
    });
    statusRow.appendChild(badge); statusRow.appendChild(flags);
    var actions = document.createElement('div'); actions.className = 'plt-actions';
    if (!isConnected) {
      var signupBtn = document.createElement('button');
      signupBtn.className = 'btn btn-sm btn-primary';
      signupBtn.textContent = '🤖 Signup';
      signupBtn.title = 'Headless signup for ' + p.name;
      signupBtn.onclick = (function(plt) { return function() { signupSingle(plt); }; })(p);
      actions.appendChild(signupBtn);
    }
    if (p.url) {
      var openBtn = document.createElement('a');
      openBtn.className = 'btn btn-sm btn-ghost';
      openBtn.href = 'https://' + p.url;
      openBtn.target = '_blank';
      openBtn.textContent = '↗';
      openBtn.title = 'Open ' + p.name;
      actions.appendChild(openBtn);
    }
    var selectBtn = document.createElement('button');
    selectBtn.className = 'btn btn-sm btn-ghost';
    selectBtn.textContent = selectedForSignup.indexOf(p.name) >= 0 ? '✓' : '+';
    selectBtn.title = 'Select for batch signup';
    selectBtn.onclick = (function(plt, btn) { return function() {
      var idx = selectedForSignup.indexOf(plt.name);
      if (idx >= 0) { selectedForSignup.splice(idx,1); btn.textContent='+'; }
      else { selectedForSignup.push(plt.name); btn.textContent='✓'; }
      updateSelectedCount();
    }; })(p, selectBtn);
    actions.appendChild(selectBtn);
    card.appendChild(name); card.appendChild(model); card.appendChild(statusRow); card.appendChild(actions);
    grid.appendChild(card);
  });
}

function updateSelectedCount() {
  var el = document.getElementById('selected-platforms');
  if (el) el.textContent = selectedForSignup.length > 0 ? selectedForSignup.length + ' platforms selected: ' + selectedForSignup.slice(0,3).join(', ') + (selectedForSignup.length>3?'...':'') : 'No platforms selected.';
}

function signupSingle(platform) {
  selectedForSignup = [platform.name];
  startHeadlessSignup();
}

function startHeadlessSignup() {
  if (selectedForSignup.length === 0) { Toast.warning('Select platforms first'); return; }
  var log = document.getElementById('signup-log');
  if (log) log.style.display = 'block';
  function addLog(msg, type) {
    if (!log) return;
    var line = document.createElement('div');
    line.style.color = type==='ok'?'#7ecf7e':type==='err'?'#f08080':'#a8d4f0';
    line.textContent = '[' + new Date().toLocaleTimeString('en-GB') + '] ' + msg;
    log.appendChild(line); log.scrollTop = log.scrollHeight;
  }
  addLog('Starting headless signup for ' + selectedForSignup.length + ' platforms...', 'info');
  selectedForSignup.forEach(function(name, i) {
    setTimeout(function() {
      addLog('Initiating signup: ' + name, 'info');
      fetch(WORKER + '/api/headless/signup', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          platform: name.toLowerCase().replace(/[^a-z0-9]/g,'-'),
          email: 'hello@identitypartners.uk',
          name: 'Identity Partners',
          bio: 'Evidence-based support for addiction, trauma, and mental health. Non-clinical listening, coaching, mentoring and relational practice.',
          website: 'https://www.identitypartners.uk'
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(r) {
        if (r.success) {
          addLog(name + ': ' + (r.status||'queued') + ' — ' + (r.signupUrl||r.instructions||''), 'ok');
          platformStatuses[name] = 'in-progress';
        } else {
          addLog(name + ': ' + (r.error||'failed'), 'err');
        }
        filterPlatforms(currentSearch);
      })
      .catch(function(e) { addLog(name + ': error — ' + e.message, 'err'); });
    }, i * 500);
  });
}

function renderBuckets() {
  var list = document.getElementById('bucket-list');
  if (!list) return;
  list.innerHTML = '';
  BUCKETS.forEach(function(bucket) {
    var item = document.createElement('div');
    item.style.cssText = 'padding:8px 0;border-bottom:1px solid var(--border);';
    var header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:4px;';
    var dot = document.createElement('div');
    dot.style.cssText = 'width:10px;height:10px;border-radius:50%;background:'+bucket.color+';flex-shrink:0;';
    var name = document.createElement('span');
    name.style.cssText = 'font-weight:600;font-size:12.5px;flex:1;';
    name.textContent = bucket.name;
    var count = document.createElement('span');
    count.style.cssText = 'font-size:11px;color:var(--fg-muted);';
    count.textContent = bucket.platforms.length + ' platforms';
    header.appendChild(dot); header.appendChild(name); header.appendChild(count);
    var plts = document.createElement('div');
    plts.style.cssText = 'font-size:11px;color:var(--fg-muted);';
    plts.textContent = bucket.platforms.join(', ');
    item.appendChild(header); item.appendChild(plts);
    list.appendChild(item);
  });
}

function addBucket() {
  var name = prompt('Bucket name (e.g. "Recovery Community"):');
  if (!name) return;
  BUCKETS.push({id:'b'+Date.now(), name:name, platforms:[], color:'#0f3b3a'});
  renderBuckets();
  Toast.success('Bucket created: ' + name);
}

function refreshStatus() {
  fetch(WORKER + '/api/platform/credentials')
  .then(function(r) { return r.json(); })
  .then(function(r) {
    (r.platforms||[]).forEach(function(p) { platformStatuses[p] = 'connected'; });
    connectedPlatforms = ['bluesky'].concat(r.platforms||[]);
    filterPlatforms(currentSearch);
    Toast.info('Status refreshed');
  })
  .catch(function(e) { Toast.error('Refresh failed: ' + e.message); });
}

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount) { var sb=buildSidebar('/platform-manager/'); mount.parentNode.insertBefore(sb,mount); mount.parentNode.removeChild(mount); }
  buildCatTabs();
  filterPlatforms('');
  renderBuckets();
  refreshStatus();
});
</script>
</body>
</html>
