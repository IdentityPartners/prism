<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform Manager — Prism</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.platform-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
.platform-card { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.platform-card-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.platform-icon { font-size:28px; }
.platform-name { font-weight:600; font-size:14px; }
.platform-category { font-size:11px; color:var(--fg-muted); }
.platform-status { margin-bottom:10px; }
.platform-actions { display:flex; gap:6px; }
.search-bar { margin-bottom:20px; }
.category-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto; }
.cat-tab { padding:8px 16px; font-size:12.5px; font-weight:500; color:var(--fg-muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:all 0.15s; }
.cat-tab:hover { color:var(--fg-primary); }
.cat-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
</style>
</head>
<body>
<div class="prism-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content" id="main-content">
    <div class="topbar">
      <div class="topbar-title">Platform Manager</div>
      <div class="topbar-actions">
        <span style="font-size:12px;color:var(--fg-muted);" id="connected-count">Loading…</span>
      </div>
    </div>
    <div class="page-content">
      <div class="search-bar">
        <input class="input" id="platform-search" type="text" placeholder="Search platforms…" oninput="filterPlatforms(this.value)">
      </div>
      <div class="category-tabs">
        <div class="cat-tab active" onclick="filterCategory(this,'all')">All</div>
        <div class="cat-tab" onclick="filterCategory(this,'social')">Social Media</div>
        <div class="cat-tab" onclick="filterCategory(this,'monetisation')">Monetisation</div>
        <div class="cat-tab" onclick="filterCategory(this,'podcast')">Podcasts</div>
        <div class="cat-tab" onclick="filterCategory(this,'newsletter')">Newsletters</div>
        <div class="cat-tab" onclick="filterCategory(this,'community')">Community</div>
        <div class="cat-tab" onclick="filterCategory(this,'video')">Video</div>
      </div>
      <div class="platform-grid" id="platform-grid"></div>
    </div>
  </div>
</div>
<script src="/shared/prism.js"></script>
<script>
var PLATFORMS = [
  // Social
  {name:'Bluesky',icon:'🦋',cat:'social',connected:true,method:'api',connectUrl:null,note:'Active — posting enabled'},
  {name:'X / Twitter',icon:'𝕏',cat:'social',connected:false,method:'oauth',connectUrl:'/oauth/x/'},
  {name:'LinkedIn',icon:'💼',cat:'social',connected:false,method:'oauth',connectUrl:'/oauth/linkedin/'},
  {name:'Instagram',icon:'📸',cat:'social',connected:false,method:'oauth',connectUrl:'/oauth/meta/'},
  {name:'Facebook',icon:'👥',cat:'social',connected:false,method:'oauth',connectUrl:'/oauth/meta/'},
  {name:'Threads',icon:'🧵',cat:'social',connected:false,method:'oauth',connectUrl:'/oauth/meta/'},
  {name:'Pinterest',icon:'📌',cat:'social',connected:false,method:'oauth',connectUrl:null},
  {name:'TikTok',icon:'🎵',cat:'social',connected:false,method:'oauth',connectUrl:null},
  {name:'Mastodon',icon:'🐘',cat:'social',connected:false,method:'api',connectUrl:null},
  // Monetisation
  {name:'Stripe',icon:'💳',cat:'monetisation',connected:false,method:'api',connectUrl:null,note:'Add STRIPE_SECRET_KEY'},
  {name:'PayPal',icon:'💰',cat:'monetisation',connected:false,method:'api',connectUrl:null},
  {name:'Ko-fi',icon:'☕',cat:'monetisation',connected:false,method:'api',connectUrl:'https://ko-fi.com/account/api'},
  {name:'Patreon',icon:'🎁',cat:'monetisation',connected:false,method:'oauth',connectUrl:null},
  {name:'BuyMeACoffee',icon:'☕',cat:'monetisation',connected:false,method:'api',connectUrl:null},
  {name:'Gumroad',icon:'🛒',cat:'monetisation',connected:false,method:'api',connectUrl:null},
  {name:'Teachable',icon:'📚',cat:'monetisation',connected:false,method:'api',connectUrl:null},
  {name:'Thinkific',icon:'🎓',cat:'monetisation',connected:false,method:'api',connectUrl:null},
  // Podcasts
  {name:'Spotify for Podcasters',icon:'🎙',cat:'podcast',connected:false,method:'oauth',connectUrl:null},
  {name:'Apple Podcasts',icon:'🎧',cat:'podcast',connected:false,method:'rss',connectUrl:null},
  {name:'Amazon Music',icon:'🎶',cat:'podcast',connected:false,method:'rss',connectUrl:null},
  {name:'Pocket Casts',icon:'📻',cat:'podcast',connected:false,method:'rss',connectUrl:null},
  {name:'Podchaser',icon:'🎤',cat:'podcast',connected:false,method:'api',connectUrl:null},
  // Newsletters
  {name:'Substack',icon:'📧',cat:'newsletter',connected:false,method:'api',connectUrl:null},
  {name:'Mailchimp',icon:'🐒',cat:'newsletter',connected:false,method:'api',connectUrl:null},
  {name:'ConvertKit',icon:'✉',cat:'newsletter',connected:false,method:'api',connectUrl:null},
  {name:'Beehiiv',icon:'🐝',cat:'newsletter',connected:false,method:'api',connectUrl:null},
  // Community
  {name:'Reddit',icon:'🤖',cat:'community',connected:false,method:'oauth',connectUrl:null},
  {name:'Quora',icon:'❓',cat:'community',connected:false,method:'api',connectUrl:null},
  {name:'ResearchGate',icon:'🔬',cat:'community',connected:false,method:'api',connectUrl:null},
  {name:'Academia.edu',icon:'🎓',cat:'community',connected:false,method:'api',connectUrl:null},
  // Video
  {name:'YouTube',icon:'▶',cat:'video',connected:false,method:'oauth',connectUrl:null},
  {name:'Vimeo',icon:'🎬',cat:'video',connected:false,method:'api',connectUrl:null},
  {name:'Rumble',icon:'📹',cat:'video',connected:false,method:'api',connectUrl:null},
];

var currentCategory = 'all';
var currentSearch = '';

function filterCategory(el, cat) {
  currentCategory = cat;
  var tabs = document.querySelectorAll('.cat-tab');
  for (var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
  el.classList.add('active');
  renderPlatforms();
}

function filterPlatforms(q) { currentSearch = q.toLowerCase(); renderPlatforms(); }

function renderPlatforms() {
  var grid = document.getElementById('platform-grid');
  if (!grid) return;
  var filtered = PLATFORMS.filter(function(p) {
    var catMatch = currentCategory === 'all' || p.cat === currentCategory;
    var searchMatch = !currentSearch || p.name.toLowerCase().indexOf(currentSearch) >= 0;
    return catMatch && searchMatch;
  });
  grid.innerHTML = '';
  var connected = PLATFORMS.filter(function(p){return p.connected;}).length;
  var countEl = document.getElementById('connected-count');
  if (countEl) countEl.textContent = connected + ' of ' + PLATFORMS.length + ' connected';

  filtered.forEach(function(p) {
    var card = document.createElement('div');
    card.className = 'platform-card';
    var header = document.createElement('div');
    header.className = 'platform-card-header';
    var icon = document.createElement('div');
    icon.className = 'platform-icon';
    icon.textContent = p.icon;
    var info = document.createElement('div');
    var name = document.createElement('div');
    name.className = 'platform-name';
    name.textContent = p.name;
    var cat = document.createElement('div');
    cat.className = 'platform-category';
    cat.textContent = p.cat.charAt(0).toUpperCase() + p.cat.slice(1) + ' · ' + p.method.toUpperCase();
    info.appendChild(name); info.appendChild(cat);
    header.appendChild(icon); header.appendChild(info);

    var status = document.createElement('div');
    status.className = 'platform-status';
    var badge = document.createElement('span');
    badge.className = 'badge ' + (p.connected ? 'badge-success' : 'badge-muted');
    badge.textContent = p.connected ? '✓ Connected' : 'Not connected';
    status.appendChild(badge);
    if (p.note) {
      var note = document.createElement('div');
      note.style.cssText = 'font-size:11px;color:var(--fg-muted);margin-top:4px;';
      note.textContent = p.note;
      status.appendChild(note);
    }

    var actions = document.createElement('div');
    actions.className = 'platform-actions';
    var connectBtn = document.createElement('button');
    connectBtn.className = 'btn btn-sm ' + (p.connected ? 'btn-secondary' : 'btn-primary');
    connectBtn.textContent = p.connected ? '⚙ Manage' : '🔗 Connect';
    connectBtn.title = p.connected ? 'Manage connection' : 'Connect ' + p.name;
    connectBtn.onclick = function() {
      if (p.connectUrl) {
        window.open(p.connectUrl, '_blank');
      } else {
        Toast.info('To connect ' + p.name + ': add the API key via Settings → Secret Ingester, then the platform will activate automatically.');
      }
    };
    actions.appendChild(connectBtn);

    card.appendChild(header);
    card.appendChild(status);
    card.appendChild(actions);
    grid.appendChild(card);
  });
}

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount) { var sb=buildSidebar('/platform-manager/'); mount.parentNode.insertBefore(sb,mount); mount.parentNode.removeChild(mount); }
  renderPlatforms();
});
</script>
</body>
</html>
