<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksheets — Prism</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.ws-preview { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:32px; font-family:'Inter',sans-serif; }
.ws-preview h1 { font-family:'Playfair Display',serif; color:#0f3b3a; font-size:22px; margin-bottom:8px; }
.ws-preview h2 { font-family:'Playfair Display',serif; color:#5c2d3f; font-size:17px; margin:20px 0 8px; }
.ws-preview h3 { font-size:14px; font-weight:600; margin:14px 0 6px; color:#0f3b3a; }
.ws-preview p { color:#555; font-size:14px; line-height:1.7; margin-bottom:10px; }
.ws-preview ul { margin:6px 0 10px 20px; }
.ws-preview li { font-size:14px; color:#555; margin-bottom:4px; line-height:1.6; }
.ws-preview hr { border:none; border-top:1px solid #ddd; margin:20px 0; }
.ws-preview blockquote { border-left:3px solid #0f3b3a; padding:8px 16px; background:#e8f4f4; margin:12px 0; font-style:italic; color:#0f3b3a; }
</style>
</head>
<body>
<div class="prism-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content" id="main-content">
    <div class="topbar">
      <div class="topbar-title">Worksheets</div>
      <div class="topbar-actions">
        <button class="btn btn-sm btn-secondary" id="print-btn" onclick="printWS()" title="Print worksheet">🖨 Print</button>
        <button class="btn btn-sm btn-secondary" id="export-btn" onclick="exportWS()" title="Export as Markdown">⬇ Export</button>
        <button class="btn btn-sm btn-primary" id="gen-btn" onclick="generateWS()" title="Generate worksheet">✨ Generate</button>
      </div>
    </div>
    <div class="page-content">
      <div class="grid-2" style="gap:20px;align-items:start;">
        <div>
          <div class="card" style="margin-bottom:16px;">
            <div class="card-header"><span class="card-title">Worksheet Setup</span></div>
            <div class="form-group">
              <label class="form-label">Topic *</label>
              <input class="input" id="ws-topic" type="text" placeholder="e.g. Identifying personal triggers in addiction recovery">
            </div>
            <div class="form-group">
              <label class="form-label">Type</label>
              <select class="select" id="ws-type">
                <option value="reflection">Reflection — open-ended questions</option>
                <option value="assessment">Self-assessment — scales and ratings</option>
                <option value="planning">Action planning — goals and steps</option>
                <option value="journal">Journal prompts — daily practice</option>
                <option value="cbt">CBT-style — thought records and reframing</option>
                <option value="psychoeducation">Psychoeducation — information + exercises</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Sections</label>
              <select class="select" id="ws-sections">
                <option value="3">3 sections</option>
                <option value="4" selected>4 sections</option>
                <option value="5">5 sections</option>
                <option value="6">6 sections</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Audience</label>
              <input class="input" id="ws-audience" type="text" value="Adults in recovery" placeholder="Who is this for?">
            </div>
            <div class="form-group">
              <label class="form-label">Additional instructions</label>
              <textarea class="textarea" id="ws-instructions" rows="2" placeholder="Any specific elements to include or avoid…"></textarea>
            </div>
            <button class="btn btn-primary" style="width:100%;" id="gen-btn-2" onclick="generateWS()" title="Generate worksheet">✨ Generate Worksheet</button>
          </div>

          <div class="card">
            <div class="card-header"><span class="card-title">Quick Templates</span></div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <button class="btn btn-secondary btn-sm" onclick="quickWS('Identifying and understanding personal triggers in addiction recovery','reflection')" title="Trigger identification">🎯 Trigger Identification</button>
              <button class="btn btn-secondary btn-sm" onclick="quickWS('Clarifying personal values to guide recovery and life decisions','reflection')" title="Values clarification">💎 Values Clarification</button>
              <button class="btn btn-secondary btn-sm" onclick="quickWS('Building a personalised toolkit of healthy coping strategies','planning')" title="Coping strategies">🛡 Coping Strategies</button>
              <button class="btn btn-secondary btn-sm" onclick="quickWS('Setting meaningful, achievable recovery goals using SMART framework','planning')" title="Recovery goals">🎯 Recovery Goals</button>
              <button class="btn btn-secondary btn-sm" onclick="quickWS('Daily gratitude practice to support wellbeing and recovery','journal')" title="Gratitude practice">🙏 Gratitude Practice</button>
              <button class="btn btn-secondary btn-sm" onclick="quickWS('Creating a personalised relapse prevention plan','planning')" title="Relapse prevention">🛡 Relapse Prevention Plan</button>
              <button class="btn btn-secondary btn-sm" onclick="quickWS('Understanding trauma responses and their impact on daily life','psychoeducation')" title="Trauma psychoeducation">🧠 Trauma Psychoeducation</button>
              <button class="btn btn-secondary btn-sm" onclick="quickWS('Identifying and challenging unhelpful thought patterns','cbt')" title="CBT thought records">💭 CBT Thought Records</button>
            </div>
          </div>
        </div>

        <div>
          <div class="card">
            <div class="card-header">
              <span class="card-title" id="ws-preview-title">Preview</span>
              <div style="display:flex;gap:6px;">
                <button class="btn btn-sm btn-ghost" onclick="printWS()" title="Print">🖨</button>
                <button class="btn btn-sm btn-ghost" onclick="exportWS()" title="Export">⬇</button>
                <button class="btn btn-sm btn-ghost" onclick="sendToDrafting()" title="Send to Drafting Desk">✍</button>
              </div>
            </div>
            <div id="ws-preview-container">
              <div style="text-align:center;padding:40px;color:var(--fg-muted);font-size:13px;">
                Choose a topic and click Generate, or select a quick template.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/shared/prism.js"></script>
<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var currentWS = '';

// Inline markdown renderer — does not depend on shared prism.js loading order
function renderMD(text) {
  if (!text) return '';
  var t = text;
  t = t.replace(/```[\s\S]*?```/g, function(m) {
    var code = m.replace(/```\w*
?/, '').replace(/```$/, '');
    return '<pre style="background:#f0e9e0;padding:12px;border-radius:6px;overflow-x:auto;font-family:monospace;font-size:12px;"><code>' + code.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</code></pre>';
  });
  t = t.replace(/`([^`]+)`/g, '<code style="background:#f0e9e0;padding:2px 5px;border-radius:3px;font-family:monospace;font-size:12px;">$1</code>');
  t = t.replace(/^### (.+)$/gm, '<h3 style="font-size:14px;font-weight:600;margin:14px 0 6px;color:#0f3b3a;">$1</h3>');
  t = t.replace(/^## (.+)$/gm, '<h2 style="font-family:'Playfair Display',serif;font-size:17px;font-weight:600;margin:18px 0 8px;color:#5c2d3f;">$1</h2>');
  t = t.replace(/^# (.+)$/gm, '<h1 style="font-family:'Playfair Display',serif;font-size:22px;font-weight:600;margin:20px 0 10px;color:#0f3b3a;">$1</h1>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
  t = t.replace(/^> (.+)$/gm, '<blockquote style="border-left:3px solid #0f3b3a;padding:8px 16px;background:#e8f4f4;margin:10px 0;font-style:italic;color:#0f3b3a;">$1</blockquote>');
  t = t.replace(/^---$/gm, '<hr style="border:none;border-top:1px solid #ddd;margin:16px 0;">');
  t = t.replace(/^\* (.+)$/gm, '<li style="margin-bottom:4px;line-height:1.6;">$1</li>');
  t = t.replace(/^- (.+)$/gm, '<li style="margin-bottom:4px;line-height:1.6;">$1</li>');
  t = t.replace(/(<li[^>]*>[\s\S]*?<\/li>)/g, '<ul style="margin:6px 0 10px 20px;">$1</ul>');
  t = t.replace(/^\d+\. (.+)$/gm, '<li style="margin-bottom:4px;line-height:1.6;">$1</li>');
  t = t.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" style="color:#0f3b3a;">$1</a>');
  t = t.replace(/

/g, '</p><p style="margin-bottom:10px;line-height:1.7;color:#555;">');
  t = '<p style="margin-bottom:10px;line-height:1.7;color:#555;">' + t + '</p>';
  t = t.replace(/<p[^>]*>\s*(<h[1-6])/g, '$1');
  t = t.replace(/(<\/h[1-6]>)\s*<\/p>/g, '$1');
  t = t.replace(/<p[^>]*>\s*(<ul)/g, '$1');
  t = t.replace(/(<\/ul>)\s*<\/p>/g, '$1');
  t = t.replace(/<p[^>]*>\s*(<blockquote)/g, '$1');
  t = t.replace(/(<\/blockquote>)\s*<\/p>/g, '$1');
  t = t.replace(/<p[^>]*>\s*(<hr)/g, '$1');
  t = t.replace(/<p[^>]*>\s*(<pre)/g, '$1');
  t = t.replace(/(<\/pre>)\s*<\/p>/g, '$1');
  t = t.replace(/<p[^>]*>\s*<\/p>/g, '');
  return t;
}

function generateWS() {
  var topic = document.getElementById('ws-topic').value.trim();
  if (!topic) { Toast.warning('Please enter a topic for the worksheet.'); return; }
  var type = document.getElementById('ws-type').value;
  var sections = document.getElementById('ws-sections').value;
  var audience = document.getElementById('ws-audience').value.trim();
  var instructions = document.getElementById('ws-instructions').value.trim();

  var btn = document.getElementById('gen-btn');
  var btn2 = document.getElementById('gen-btn-2');
  var container = document.getElementById('ws-preview-container');

  if (btn) { btn.disabled = true; btn.textContent = '⏳ Generating…'; }
  if (btn2) { btn2.disabled = true; btn2.textContent = '⏳ Generating…'; }
  if (container) container.innerHTML = '<div style="text-align:center;padding:40px;"><div class="spinner"></div><div style="margin-top:12px;font-size:13px;color:var(--fg-muted);">Generating ' + sections + '-section ' + type + ' worksheet…</div></div>';

  var systemPrompt = 'You are a clinical worksheet designer for Identity Partners, specialising in addiction, trauma, and mental health. Create professional, evidence-based worksheets in British English. Format using Markdown with clear sections. Include reflection questions, practical exercises, and space indicators like [Write here...] for fill-in areas. Tone: warm, non-judgmental, empowering. End with an Identity Partners footer.';
  var userPrompt = 'Create a ' + type + ' worksheet with ' + sections + ' sections.

Topic: ' + topic + '
Audience: ' + audience + (instructions ? '

Additional instructions: ' + instructions : '') + '

Include: title, brief introduction, ' + sections + ' clearly labelled sections with questions/exercises, closing reflection, and Identity Partners footer (identitypartners.uk | hello@identitypartners.uk).';

  var xhr = new XMLHttpRequest();
  xhr.open('POST', WORKER + '/api/chat', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.timeout = 90000;

  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (btn) { btn.disabled = false; btn.textContent = '✨ Generate'; }
    if (btn2) { btn2.disabled = false; btn2.textContent = '✨ Generate Worksheet'; }
    try {
      var r = JSON.parse(xhr.responseText);
      if (r.content) {
        currentWS = r.content;
        var div = document.createElement('div');
        div.className = 'ws-preview';
        div.style.cssText = 'background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:32px;';
        div.innerHTML = renderMD(currentWS);
        if (container) { container.innerHTML = ''; container.appendChild(div); }
        var titleEl = document.getElementById('ws-preview-title');
        if (titleEl) titleEl.textContent = topic.substring(0, 40) + (topic.length > 40 ? '…' : '');
        Toast.success('Worksheet generated');
      } else {
        if (container) container.innerHTML = '<div style="color:var(--danger);padding:20px;">Generation failed: ' + (r.error || 'No content returned') + '</div>';
      }
    } catch(e) {
      if (container) container.innerHTML = '<div style="color:var(--danger);padding:20px;">Error: ' + e.message + '</div>';
    }
  };

  xhr.ontimeout = function() {
    if (btn) { btn.disabled = false; btn.textContent = '✨ Generate'; }
    if (btn2) { btn2.disabled = false; btn2.textContent = '✨ Generate Worksheet'; }
    if (container) container.innerHTML = '<div style="color:var(--danger);padding:20px;">Request timed out. Please try again.</div>';
  };

  xhr.onerror = function() {
    if (btn) { btn.disabled = false; btn.textContent = '✨ Generate'; }
    if (btn2) { btn2.disabled = false; btn2.textContent = '✨ Generate Worksheet'; }
    if (container) container.innerHTML = '<div style="color:var(--danger);padding:20px;">Network error. Check your connection.</div>';
  };

  xhr.send(JSON.stringify({
    messages: [
      {role: 'system', content: systemPrompt},
      {role: 'user', content: userPrompt}
    ],
    profile: 'balanced'
  }));
}

function quickWS(topic, type) {
  document.getElementById('ws-topic').value = topic;
  document.getElementById('ws-type').value = type;
  generateWS();
}

function printWS() {
  if (!currentWS) { Toast.warning('Generate a worksheet first'); return; }
  var win = window.open('', '_blank');
  win.document.write('<!DOCTYPE html><html><head><title>Worksheet</title><style>body{font-family:Inter,sans-serif;max-width:700px;margin:40px auto;padding:20px;color:#333;}h1,h2,h3{font-family:"Playfair Display",serif;}h1{color:#0f3b3a;}h2{color:#5c2d3f;}p,li{line-height:1.7;}hr{border-color:#ddd;}</style></head><body>');
  win.document.write(renderMD(currentWS));
  win.document.write('</body></html>');
  win.document.close();
  setTimeout(function() { win.print(); }, 500);
}

function exportWS() {
  if (!currentWS) { Toast.warning('Generate a worksheet first'); return; }
  var topic = document.getElementById('ws-topic').value || 'worksheet';
  var blob = new Blob([currentWS], {type: 'text/markdown'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = topic.replace(/[^a-z0-9]/gi, '-').toLowerCase() + '.md';
  a.click();
}

function sendToDrafting() {
  if (!currentWS) { Toast.warning('Generate a worksheet first'); return; }
  try { sessionStorage.setItem('prism-draft', currentWS); } catch(e) {}
  window.open('/drafting/', '_blank');
}

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount) {
    var sb = buildSidebar('/creator/worksheets/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
});
</script>
</body>
</html>
