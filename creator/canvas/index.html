<!DOCTYPE html>
<html lang="en-GB">
<head>
<!-- cache-bust-1792933321 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas — Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<!-- Fabric.js — production canvas editor library (MIT) -->
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
.canvas-shell{display:flex;height:100vh;overflow:hidden;}
.canvas-left{width:220px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface);overflow-y:auto;}
.canvas-centre{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#525659;}
.canvas-right{width:220px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface);overflow-y:auto;}
.panel-section{padding:10px 12px;border-bottom:1px solid var(--border);}
.panel-section h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--fg-muted);margin:0 0 8px;}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.tool-btn{padding:7px 6px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;background:var(--bg);color:var(--fg);font-family:inherit;text-align:center;transition:all 0.15s;}
.tool-btn:hover{border-color:var(--accent);color:var(--accent);}
.tool-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.canvas-toolbar{padding:6px 10px;background:var(--bg-elevated);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.tb-btn{padding:5px 10px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:12px;background:var(--bg);color:var(--fg);font-family:inherit;transition:all 0.15s;}
.tb-btn:hover{border-color:var(--accent);color:var(--accent);}
.tb-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.canvas-wrap{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:20px;}
.size-btn{padding:4px 8px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;background:var(--bg);color:var(--fg-muted);font-family:inherit;}
.size-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.colour-swatch{width:24px;height:24px;border-radius:4px;cursor:pointer;border:2px solid transparent;display:inline-block;}
.colour-swatch:hover,.colour-swatch.active{border-color:var(--fg);}
.prop-input{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:5px;font-size:12px;background:var(--bg);color:var(--fg);box-sizing:border-box;font-family:inherit;}
.prop-label{font-size:10px;font-weight:600;color:var(--fg-muted);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.4px;}
.template-thumb{width:100%;aspect-ratio:1;border-radius:6px;cursor:pointer;border:2px solid var(--border);overflow:hidden;margin-bottom:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;transition:border-color 0.15s;}
.template-thumb:hover{border-color:var(--accent);}
.image-result{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;cursor:pointer;border:2px solid transparent;}
.image-result:hover{border-color:var(--accent);}
.image-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="canvas-shell">

<!-- Left: Tools + Templates -->
<div class="canvas-left">
  <div class="panel-section">
    <h4>Canvas Size</h4>
    <div style="display:flex;gap:3px;flex-wrap:wrap;">
      <button class="size-btn active" onclick="setSize(1080,1080,this)">1:1</button>
      <button class="size-btn" onclick="setSize(1080,1920,this)">9:16</button>
      <button class="size-btn" onclick="setSize(1920,1080,this)">16:9</button>
      <button class="size-btn" onclick="setSize(1080,566,this)">1.91:1</button>
      <button class="size-btn" onclick="setSize(794,1123,this)">A4</button>
    </div>
  </div>

  <div class="panel-section">
    <h4>Add Elements</h4>
    <div class="tool-grid">
      <button class="tool-btn" onclick="addText()">✏ Text</button>
      <button class="tool-btn" onclick="addRect()">▭ Shape</button>
      <button class="tool-btn" onclick="addCircle()">○ Circle</button>
      <button class="tool-btn" onclick="addLine()">— Line</button>
      <button class="tool-btn" onclick="addIPLogo()">🏷 IP Logo</button>
      <button class="tool-btn" onclick="addIPGrid()">⊞ IP Grid</button>
      <button class="tool-btn" onclick="triggerImageUpload()">🖼 Image</button>
      <button class="tool-btn" onclick="addQRCode()">⬛ QR</button>
    </div>
    <input type="file" id="img-upload" accept="image/*" style="display:none" onchange="addUploadedImage(this)">
  </div>

  <div class="panel-section">
    <h4>IP Brand Colours</h4>
    <div style="display:flex;gap:4px;flex-wrap:wrap;">
      <div class="colour-swatch" style="background:#0f3b3a;" onclick="setFill('#0f3b3a')" title="Deep Teal"></div>
      <div class="colour-swatch" style="background:#5c2d3f;" onclick="setFill('#5c2d3f')" title="Deep Rose"></div>
      <div class="colour-swatch" style="background:#f7f3e9;" onclick="setFill('#f7f3e9')" title="Warm Ivory"></div>
      <div class="colour-swatch" style="background:#ddd0c8;" onclick="setFill('#ddd0c8')" title="Warm Grey"></div>
      <div class="colour-swatch" style="background:#7ecfcd;" onclick="setFill('#7ecfcd')" title="Teal Light"></div>
      <div class="colour-swatch" style="background:#d4899a;" onclick="setFill('#d4899a')" title="Rose Light"></div>
      <div class="colour-swatch" style="background:#ffffff;" onclick="setFill('#ffffff')" title="White"></div>
      <div class="colour-swatch" style="background:#1a1a1a;" onclick="setFill('#1a1a1a')" title="Near Black"></div>
    </div>
    <div style="margin-top:6px;">
      <label class="prop-label">Custom colour</label>
      <input type="color" id="custom-colour" value="#0f3b3a" onchange="setFill(this.value)" style="width:100%;height:28px;border:1px solid var(--border);border-radius:5px;cursor:pointer;">
    </div>
  </div>

  <div class="panel-section">
    <h4>IP Logos</h4>
    <div style="display:flex;gap:4px;flex-wrap:wrap;">
      <button class="tool-btn" onclick="addIPLogo('square')" style="font-size:10px;">Square</button>
      <button class="tool-btn" onclick="addIPLogo('rect-right')" style="font-size:10px;">Rect R</button>
      <button class="tool-btn" onclick="addIPLogo('rect-left')" style="font-size:10px;">Rect L</button>
      <button class="tool-btn" onclick="addIPLogo('hero')" style="font-size:10px;">Hero</button>
    </div>
  </div>

  <div class="panel-section">
    <h4>Quick Templates</h4>
    <div id="template-list"></div>
  </div>

  <div class="panel-section">
    <h4>Image Search</h4>
    <div style="display:flex;gap:4px;margin-bottom:6px;">
      <input class="prop-input" id="img-search" type="text" placeholder="Search Pexels..." style="flex:1;">
      <button class="tb-btn" onclick="searchImages()">Go</button>
    </div>
    <div style="display:flex;gap:3px;margin-bottom:6px;">
      <button class="size-btn active" id="src-pexels" onclick="setImgSource('pexels',this)">Pexels</button>
      <button class="size-btn" id="src-unsplash" onclick="setImgSource('unsplash',this)">Unsplash</button>
      <button class="size-btn" id="src-openverse" onclick="setImgSource('openverse',this)">Openverse</button>
    </div>
    <div class="image-grid" id="image-results"></div>
  </div>
</div>

<!-- Centre: Canvas -->
<div class="canvas-centre">
  <div class="canvas-toolbar">
    <button class="tb-btn" onclick="canvas.undo && canvas.undo()">↩ Undo</button>
    <button class="tb-btn" onclick="deleteSelected()">🗑 Delete</button>
    <button class="tb-btn" onclick="bringForward()">↑ Forward</button>
    <button class="tb-btn" onclick="sendBackward()">↓ Back</button>
    <button class="tb-btn" onclick="duplicateSelected()">⧉ Duplicate</button>
    <button class="tb-btn" onclick="alignCenter()">⊕ Centre</button>
    <div style="flex:1;"></div>
    <button class="tb-btn" onclick="clearCanvas()">✕ Clear</button>
    <button class="tb-btn primary" onclick="exportCanvas('png')">⬇ PNG</button>
    <button class="tb-btn primary" onclick="exportCanvas('svg')">⬇ SVG</button>
    <button class="tb-btn" onclick="queueForPosting()">📤 Queue</button>
  </div>
  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="fabric-canvas"></canvas>
  </div>
</div>

<!-- Right: Properties -->
<div class="canvas-right">
  <div class="panel-section">
    <h4>Background</h4>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;">
      <div class="colour-swatch" style="background:#0f3b3a;" onclick="setBg('#0f3b3a')"></div>
      <div class="colour-swatch" style="background:#5c2d3f;" onclick="setBg('#5c2d3f')"></div>
      <div class="colour-swatch" style="background:#f7f3e9;" onclick="setBg('#f7f3e9')"></div>
      <div class="colour-swatch" style="background:#1a1a1a;" onclick="setBg('#1a1a1a')"></div>
      <div class="colour-swatch" style="background:#ffffff;" onclick="setBg('#ffffff')"></div>
    </div>
    <input type="color" id="bg-colour" value="#0f3b3a" onchange="setBg(this.value)" style="width:100%;height:28px;border:1px solid var(--border);border-radius:5px;cursor:pointer;">
  </div>

  <div class="panel-section" id="text-props" style="display:none;">
    <h4>Text Properties</h4>
    <div style="margin-bottom:6px;">
      <label class="prop-label">Font</label>
      <select class="prop-input" id="font-family" onchange="updateTextProp('fontFamily',this.value)">
        <option value="Playfair Display">Playfair Display (IP brand)</option>
      <option value="Georgia">Georgia (serif)</option>
        <option value="Playfair Display">Playfair Display</option>
        <option value="Inter">Inter (sans)</option>
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New (mono)</option>
      </select>
    </div>
    <div style="display:flex;gap:5px;margin-bottom:6px;">
      <div style="flex:1;">
        <label class="prop-label">Size</label>
        <input class="prop-input" type="number" id="font-size" value="48" min="8" max="200" onchange="updateTextProp('fontSize',parseInt(this.value))">
      </div>
      <div style="flex:1;">
        <label class="prop-label">Colour</label>
        <input type="color" id="text-colour" value="#f7f3e9" onchange="updateTextProp('fill',this.value)" style="width:100%;height:30px;border:1px solid var(--border);border-radius:5px;cursor:pointer;">
      </div>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:6px;">
      <button class="tool-btn" onclick="toggleBold()" id="btn-bold"><strong>B</strong></button>
      <button class="tool-btn" onclick="toggleItalic()" id="btn-italic"><em>I</em></button>
      <button class="tool-btn" onclick="updateTextProp('textAlign','left')">⬅</button>
      <button class="tool-btn" onclick="updateTextProp('textAlign','center')">≡</button>
      <button class="tool-btn" onclick="updateTextProp('textAlign','right')">➡</button>
    </div>
    <div>
      <label class="prop-label">Text content</label>
      <textarea class="prop-input" id="text-content" rows="3" onchange="updateTextContent(this.value)" style="resize:vertical;"></textarea>
    </div>
  </div>

  <div class="panel-section" id="shape-props" style="display:none;">
    <h4>Shape Properties</h4>
    <div style="margin-bottom:6px;">
      <label class="prop-label">Fill colour</label>
      <input type="color" id="shape-fill" value="#0f3b3a" onchange="updateShapeProp('fill',this.value)" style="width:100%;height:28px;border:1px solid var(--border);border-radius:5px;cursor:pointer;">
    </div>
    <div style="margin-bottom:6px;">
      <label class="prop-label">Border colour</label>
      <input type="color" id="shape-stroke" value="#ddd0c8" onchange="updateShapeProp('stroke',this.value)" style="width:100%;height:28px;border:1px solid var(--border);border-radius:5px;cursor:pointer;">
    </div>
    <div>
      <label class="prop-label">Border width</label>
      <input class="prop-input" type="range" min="0" max="20" value="0" id="shape-stroke-width" oninput="updateShapeProp('strokeWidth',parseInt(this.value))">
    </div>
    <div style="margin-top:6px;">
      <label class="prop-label">Opacity</label>
      <input class="prop-input" type="range" min="0" max="100" value="100" id="shape-opacity" oninput="updateShapeProp('opacity',parseInt(this.value)/100)">
    </div>
  </div>

  <div class="panel-section">
    <h4>Position & Size</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">
      <div><label class="prop-label">X</label><input class="prop-input" type="number" id="obj-x" onchange="updatePosition()"></div>
      <div><label class="prop-label">Y</label><input class="prop-input" type="number" id="obj-y" onchange="updatePosition()"></div>
      <div><label class="prop-label">W</label><input class="prop-input" type="number" id="obj-w" onchange="updateSize()"></div>
      <div><label class="prop-label">H</label><input class="prop-input" type="number" id="obj-h" onchange="updateSize()"></div>
      <div><label class="prop-label">Angle</label><input class="prop-input" type="number" id="obj-angle" onchange="updateAngle()"></div>
    </div>
  </div>

  <div class="panel-section">
    <h4>AI Design Assist</h4>
    <textarea class="prop-input" id="ai-prompt" rows="2" placeholder="Describe what to create..." style="resize:vertical;margin-bottom:5px;"></textarea>
    <button class="tb-btn primary" onclick="aiDesign()" style="width:100%;">Generate</button>
  </div>
</div>

</div>
</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var canvas = null;
var canvasW = 1080, canvasH = 1080;
var imgSource = 'pexels';
var IP_LOGO_URL = 'https://prism.identitypartners.uk/shared/assets/logo-rect-right.png';
var IP_LOGO_SQUARE = 'https://prism.identitypartners.uk/shared/assets/logo-square.png';

var TEMPLATES = [
  {name:'Teal Quote', bg:'#0f3b3a', fg:'#f7f3e9'},
  {name:'Rose Quote', bg:'#5c2d3f', fg:'#f7f3e9'},
  {name:'Ivory', bg:'#f7f3e9', fg:'#0f3b3a'},
  {name:'Midnight', bg:'#0d1520', fg:'#e8f0f8'},
  {name:'Forest', bg:'#1a3a2a', fg:'#f0fdf4'},
];

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/creator/canvas/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  initCanvas();
  renderTemplates();
});

function initCanvas() {
  var wrap = document.getElementById('canvas-wrap');
  var scale = Math.min((wrap.clientWidth - 40) / canvasW, (wrap.clientHeight - 40) / canvasH, 1);
  var displayW = Math.floor(canvasW * scale);
  var displayH = Math.floor(canvasH * scale);

  canvas = new fabric.Canvas('fabric-canvas', {
    width: displayW,
    height: displayH,
    backgroundColor: '#0f3b3a',
    preserveObjectStacking: true,
  });
  canvas._scale = scale;

  canvas.on('selection:created', onSelect);
  canvas.on('selection:updated', onSelect);
  canvas.on('selection:cleared', onDeselect);
  canvas.on('object:modified', updatePropsPanel);

  // Add IP tagline at bottom
  addTagline();
}

function setSize(w, h, btn) {
  canvasW = w; canvasH = h;
  document.querySelectorAll('.size-btn').forEach(function(b){b.classList.remove('active');});
  if (btn) btn.classList.add('active');
  var wrap = document.getElementById('canvas-wrap');
  var scale = Math.min((wrap.clientWidth - 40) / w, (wrap.clientHeight - 40) / h, 1);
  canvas.setWidth(Math.floor(w * scale));
  canvas.setHeight(Math.floor(h * scale));
  canvas._scale = scale;
  canvas.renderAll();
}

function setBg(colour) {
  canvas.setBackgroundColor(colour, canvas.renderAll.bind(canvas));
  document.getElementById('bg-colour').value = colour;
}

function setFill(colour) {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  obj.set('fill', colour);
  canvas.renderAll();
}

function addText() {
  var text = new fabric.IText('Your text here', {
    left: canvasW * canvas._scale / 2 - 100,
    top: canvasH * canvas._scale / 2 - 30,
    fontFamily: 'Georgia',
    fontSize: Math.floor(48 * canvas._scale),
    fill: '#f7f3e9',
    fontStyle: 'italic',
    textAlign: 'center',
  });
  canvas.add(text);
  canvas.setActiveObject(text);
  canvas.renderAll();
}

function addRect() {
  var rect = new fabric.Rect({
    left: 50, top: 50,
    width: Math.floor(200 * canvas._scale),
    height: Math.floor(100 * canvas._scale),
    fill: '#0f3b3a',
    stroke: '#ddd0c8',
    strokeWidth: 0,
    rx: 8, ry: 8,
  });
  canvas.add(rect);
  canvas.setActiveObject(rect);
  canvas.renderAll();
}

function addCircle() {
  var circle = new fabric.Circle({
    left: 50, top: 50,
    radius: Math.floor(60 * canvas._scale),
    fill: '#5c2d3f',
  });
  canvas.add(circle);
  canvas.setActiveObject(circle);
  canvas.renderAll();
}

function addLine() {
  var line = new fabric.Line([50, 100, 300, 100], {
    stroke: '#ddd0c8',
    strokeWidth: 2,
  });
  canvas.add(line);
  canvas.setActiveObject(line);
  canvas.renderAll();
}

function addIPLogo(variant) {
  var url = variant === 'square' ? IP_LOGO_SQUARE : IP_LOGO_URL;
  fabric.Image.fromURL(url, function(img) {
    img.scaleToWidth(Math.floor(200 * canvas._scale));
    img.set({left: canvas.width - img.getScaledWidth() - 20, top: canvas.height - img.getScaledHeight() - 20});
    canvas.add(img);
    canvas.setActiveObject(img);
    canvas.renderAll();
  }, {crossOrigin:'anonymous'});
}

function addIPGrid() {
  var s = Math.floor(40 * canvas._scale);
  var gap = Math.floor(4 * canvas._scale);
  var colours = ['#0f3b3a','#5c2d3f','#1a5550','#7a4254'];
  var group = [];
  [[0,0],[1,0],[0,1],[1,1]].forEach(function(pos, i) {
    group.push(new fabric.Rect({
      left: pos[0] * (s + gap),
      top: pos[1] * (s + gap),
      width: s, height: s,
      fill: colours[i],
      rx: Math.floor(5 * canvas._scale),
      ry: Math.floor(5 * canvas._scale),
    }));
  });
  var grp = new fabric.Group(group, {left: 20, top: 20});
  canvas.add(grp);
  canvas.setActiveObject(grp);
  canvas.renderAll();
}

function addTagline() {
  var text = new fabric.Text('identitypartners.uk  ·  hello@identitypartners.uk  ·  @identitypartners', {
    left: canvas.width / 2,
    top: canvas.height - Math.floor(30 * canvas._scale),
    fontFamily: 'Arial',
    fontSize: Math.floor(14 * canvas._scale),
    fill: '#ddd0c8',
    opacity: 0.8,
    textAlign: 'center',
    originX: 'center',
    selectable: true,
  });
  canvas.add(text);
  canvas.renderAll();
}

function triggerImageUpload() {
  document.getElementById('img-upload').click();
}

function addUploadedImage(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    fabric.Image.fromURL(e.target.result, function(img) {
      img.scaleToWidth(Math.min(canvas.width * 0.8, img.width));
      img.set({left: 20, top: 20});
      canvas.add(img);
      canvas.setActiveObject(img);
      canvas.renderAll();
    });
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function addQRCode() {
  // Simple QR placeholder — in production use a QR library
  var text = new fabric.Text('QR: identitypartners.uk', {
    left: 50, top: 50,
    fontFamily: 'Courier New',
    fontSize: Math.floor(16 * canvas._scale),
    fill: '#0f3b3a',
    backgroundColor: '#ffffff',
    padding: 10,
  });
  canvas.add(text);
  canvas.renderAll();
}

function deleteSelected() {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  if (obj.type === 'activeSelection') {
    obj.forEachObject(function(o){canvas.remove(o);});
    canvas.discardActiveObject();
  } else {
    canvas.remove(obj);
  }
  canvas.renderAll();
}

function bringForward() { var o=canvas.getActiveObject(); if(o){canvas.bringForward(o);canvas.renderAll();} }
function sendBackward() { var o=canvas.getActiveObject(); if(o){canvas.sendBackwards(o);canvas.renderAll();} }

function duplicateSelected() {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  obj.clone(function(clone) {
    clone.set({left:obj.left+20, top:obj.top+20});
    canvas.add(clone);
    canvas.setActiveObject(clone);
    canvas.renderAll();
  });
}

function alignCenter() {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  obj.set({left: (canvas.width - obj.getScaledWidth()) / 2, top: (canvas.height - obj.getScaledHeight()) / 2});
  canvas.renderAll();
}

function clearCanvas() {
  if (!confirm('Clear all objects?')) return;
  canvas.clear();
  canvas.setBackgroundColor('#0f3b3a', canvas.renderAll.bind(canvas));
}

// ── Selection handlers ────────────────────────────────────────────────────────
function onSelect(e) {
  var obj = e.selected ? e.selected[0] : canvas.getActiveObject();
  if (!obj) return;
  updatePropsPanel();
  document.getElementById('text-props').style.display = (obj.type === 'i-text' || obj.type === 'text') ? 'block' : 'none';
  document.getElementById('shape-props').style.display = (obj.type === 'rect' || obj.type === 'circle' || obj.type === 'ellipse') ? 'block' : 'none';
}

function onDeselect() {
  document.getElementById('text-props').style.display = 'none';
  document.getElementById('shape-props').style.display = 'none';
}

function updatePropsPanel() {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  document.getElementById('obj-x').value = Math.round(obj.left);
  document.getElementById('obj-y').value = Math.round(obj.top);
  document.getElementById('obj-w').value = Math.round(obj.getScaledWidth());
  document.getElementById('obj-h').value = Math.round(obj.getScaledHeight());
  document.getElementById('obj-angle').value = Math.round(obj.angle || 0);
  if (obj.type === 'i-text' || obj.type === 'text') {
    document.getElementById('text-content').value = obj.text || '';
    document.getElementById('font-size').value = Math.round((obj.fontSize || 48) / canvas._scale);
    document.getElementById('font-family').value = obj.fontFamily || 'Georgia';
  }
}

function updateTextProp(prop, value) {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  obj.set(prop, value);
  canvas.renderAll();
}

function updateTextContent(value) {
  var obj = canvas.getActiveObject();
  if (obj && (obj.type === 'i-text' || obj.type === 'text')) {
    obj.set('text', value);
    canvas.renderAll();
  }
}

function updateShapeProp(prop, value) {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  obj.set(prop, value);
  canvas.renderAll();
}

function toggleBold() {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  obj.set('fontWeight', obj.fontWeight === 'bold' ? 'normal' : 'bold');
  canvas.renderAll();
}

function toggleItalic() {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  obj.set('fontStyle', obj.fontStyle === 'italic' ? 'normal' : 'italic');
  canvas.renderAll();
}

function updatePosition() {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  obj.set({left:parseInt(document.getElementById('obj-x').value)||0, top:parseInt(document.getElementById('obj-y').value)||0});
  canvas.renderAll();
}

function updateSize() {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  var w = parseInt(document.getElementById('obj-w').value)||100;
  var h = parseInt(document.getElementById('obj-h').value)||100;
  obj.scaleToWidth(w);
  obj.scaleToHeight(h);
  canvas.renderAll();
}

function updateAngle() {
  var obj = canvas.getActiveObject();
  if (!obj) return;
  obj.set('angle', parseInt(document.getElementById('obj-angle').value)||0);
  canvas.renderAll();
}

// ── Templates ─────────────────────────────────────────────────────────────────
function renderTemplates() {
  var list = document.getElementById('template-list');
  list.innerHTML = '';
  TEMPLATES.forEach(function(t) {
    var div = document.createElement('div');
    div.className = 'template-thumb';
    div.style.background = t.bg;
    div.style.color = t.fg;
    div.textContent = t.name;
    div.onclick = (function(tmpl){return function(){applyTemplate(tmpl);};})(t);
    list.appendChild(div);
  });
}

function applyTemplate(t) {
  canvas.clear();
  canvas.setBackgroundColor(t.bg, canvas.renderAll.bind(canvas));
  addIPGrid();
  addTagline();
  var quote = new fabric.IText('Your powerful quote here.', {
    left: canvas.width / 2,
    top: canvas.height / 2 - Math.floor(60 * canvas._scale),
    fontFamily: 'Georgia',
    fontSize: Math.floor(52 * canvas._scale),
    fill: t.fg,
    fontStyle: 'italic',
    textAlign: 'center',
    originX: 'center',
  });
  canvas.add(quote);
  addIPLogo('rect-right');
  canvas.renderAll();
}

// ── Image search ──────────────────────────────────────────────────────────────
function setImgSource(src, btn) {
  imgSource = src;
  document.querySelectorAll('[id^="src-"]').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
}

function searchImages() {
  var q = document.getElementById('img-search').value.trim();
  if (!q) return;
  var grid = document.getElementById('image-results');
  grid.innerHTML = '<div style="font-size:11px;color:var(--fg-muted);grid-column:1/-1;">Searching...</div>';

  var url = WORKER + '/api/image-search?q=' + encodeURIComponent(q) + '&source=' + imgSource;
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(d){
      var results = d.results || d.images || [];
      grid.innerHTML = '';
      if (!results.length) { grid.innerHTML = '<div style="font-size:11px;color:var(--fg-muted);grid-column:1/-1;">No results.</div>'; return; }
      results.slice(0,8).forEach(function(img) {
        var el = document.createElement('img');
        el.className = 'image-result';
        el.src = img.thumbnail || img.url || img.src?.small || '';
        el.title = img.alt || img.description || '';
        el.onclick = (function(imgUrl){return function(){addImageFromUrl(imgUrl);};})(img.url || img.src?.medium || img.src?.original || el.src);
        grid.appendChild(el);
      });
    })
    .catch(function(e){ grid.innerHTML = '<div style="font-size:11px;color:#dc2626;grid-column:1/-1;">Error: '+e.message+'</div>'; });
}

function addImageFromUrl(url) {
  fabric.Image.fromURL(url, function(img) {
    img.scaleToWidth(canvas.width);
    img.set({left:0, top:0, selectable:true});
    canvas.add(img);
    canvas.sendToBack(img);
    canvas.renderAll();
  }, {crossOrigin:'anonymous'});
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportCanvas(format) {
  var scale = 1 / canvas._scale; // export at full resolution
  if (format === 'png') {
    var dataUrl = canvas.toDataURL({format:'png', multiplier:scale});
    var a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'canvas-' + Date.now() + '.png';
    a.click();
  } else if (format === 'svg') {
    var svg = canvas.toSVG();
    var blob = new Blob([svg], {type:'image/svg+xml'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'canvas-' + Date.now() + '.svg';
    a.click();
  }
}

function queueForPosting() {
  var dataUrl = canvas.toDataURL({format:'png', multiplier:1/canvas._scale});
  var b64 = dataUrl.split(',')[1];
  fetch(WORKER + '/api/imgbb/upload', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({image:b64, name:'canvas-'+Date.now()})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if (d.url) {
      return fetch(WORKER + '/api/canvas/social', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:'', imageUrl:d.url, platforms:['instagram','facebook','bluesky']})
      }).then(function(r){return r.json();});
    }
    throw new Error(d.error||'Upload failed');
  })
  .then(function(d){ alert(d.message || 'Queued for Media Manager approval.'); })
  .catch(function(e){ alert('Error: '+e.message); });
}

// ── AI Design ─────────────────────────────────────────────────────────────────
function aiDesign() {
  var prompt = document.getElementById('ai-prompt').value.trim();
  if (!prompt) return;
  fetch(WORKER + '/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:[{role:'system',content:'You are a canvas design assistant for Identity Partners. When asked to create a design, respond with a JSON object describing the canvas: {background:"#hex", elements:[{type:"text",text:"...",x:540,y:400,fontSize:52,fill:"#hex",fontStyle:"italic"},{type:"rect",x:30,y:30,w:44,h:44,fill:"#hex"},...]}. Keep it simple and on-brand (teal #0f3b3a, rose #5c2d3f, ivory #f7f3e9).'},{role:'user',content:prompt}],profile:'balanced'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var content = d.content || '';
    var match = content.match(/\{[\s\S]*\}/);
    if (!match) { alert('AI response: ' + content.substring(0,200)); return; }
    try {
      var design = JSON.parse(match[0]);
      canvas.clear();
      if (design.background) canvas.setBackgroundColor(design.background, canvas.renderAll.bind(canvas));
      (design.elements||[]).forEach(function(el) {
        if (el.type === 'text') {
          var t = new fabric.IText(el.text||'', {left:el.x||100,top:el.y||100,fontSize:Math.floor((el.fontSize||48)*canvas._scale),fill:el.fill||'#f7f3e9',fontStyle:el.fontStyle||'normal',fontFamily:el.fontFamily||'Georgia',textAlign:el.textAlign||'center',originX:'center'});
          canvas.add(t);
        } else if (el.type === 'rect') {
          var r = new fabric.Rect({left:el.x||0,top:el.y||0,width:Math.floor((el.w||100)*canvas._scale),height:Math.floor((el.h||100)*canvas._scale),fill:el.fill||'#0f3b3a',rx:el.rx||0,ry:el.ry||0});
          canvas.add(r);
        }
      });
      canvas.renderAll();
    } catch(e) { alert('Could not parse AI design: '+e.message); }
  })
  .catch(function(e){alert('Error: '+e.message);});
}
</script>
