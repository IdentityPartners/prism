<!DOCTYPE html>

<html lang="en-GB">
<head>

<style>
.canvas-shell { display:flex; height:calc(100vh - var(--topbar-h)); overflow:hidden; }
.canvas-sidebar { width:260px; flex-shrink:0; border-right:1px solid var(--border); background:var(--bg-surface); display:flex; flex-direction:column; overflow-y:auto; }
.canvas-main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.canvas-toolbar { height:44px; background:var(--bg-elevated); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 12px; gap:6px; flex-shrink:0; overflow-x:auto; }
.canvas-frame { flex:1; overflow:hidden; position:relative; background:#d0d0d0; }
#main-canvas { position:absolute; box-shadow:0 4px 24px rgba(0,0,0,0.2); cursor:default; }
.sb-section { padding:10px 12px; border-bottom:1px solid var(--border); }
.sb-title { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.07em; color:var(--fg-muted); margin-bottom:8px; }
.tpl-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.tpl-card { aspect-ratio:1; background:var(--bg-elevated); border:1px solid var(--border); border-radius:6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10px; color:var(--fg-muted); transition:all 0.15s; padding:4px; text-align:center; }
.tpl-card:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-light); }
.tpl-icon { font-size:20px; }
.sz-btn { padding:3px 7px; border:1px solid var(--border); border-radius:4px; font-size:10.5px; background:var(--bg-elevated); color:var(--fg-secondary); cursor:pointer; white-space:nowrap; transition:all 0.15s; }
.sz-btn:hover,.sz-btn.active { border-color:var(--accent); color:var(--accent); background:var(--accent-light); }
.cv-btn { padding:4px 9px; border:1px solid var(--border); border-radius:5px; font-size:11px; background:var(--bg-elevated); color:var(--fg-secondary); cursor:pointer; white-space:nowrap; transition:all 0.15s; }
.cv-btn:hover { border-color:var(--accent); color:var(--accent); }
.brand-swatches { display:flex; gap:4px; flex-wrap:wrap; }
.b-swatch { width:22px; height:22px; border-radius:4px; cursor:pointer; border:2px solid transparent; transition:border-color 0.15s; }
.b-swatch:hover { border-color:var(--fg-primary); }
.ai-area { padding:10px 12px; border-top:1px solid var(--border); flex-shrink:0; }
.ai-ta { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:12px; font-family:var(--font-ui); resize:none; outline:none; background:var(--bg-primary); color:var(--fg-primary); min-height:56px; }
.ai-ta:focus { border-color:var(--accent); }
.prop-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; font-size:12px; }
.prop-label { color:var(--fg-muted); width:60px; flex-shrink:0; }
.prop-input { flex:1; padding:4px 7px; border:1px solid var(--border); border-radius:4px; font-size:12px; outline:none; background:var(--bg-primary); color:var(--fg-primary); }
.prop-input:focus { border-color:var(--accent); }

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var canvas = document.getElementById('main-canvas');
var ctx = canvas.getContext('2d');
var CW = 1080, CH = 1080, scale = 1;
var elements = [], sel = null, hist = [], histIdx = -1;
var dragging = false, resizing = false, dragOX = 0, dragOY = 0;

var B = {teal:'#0f3b3a',rose:'#5c2d3f',ivory:'#f7f3e9',teal2:'#1a5550',rose2:'#7a4254',grey:'#ddd0c8'};

// ── Resize canvas to fit frame ────────────────────────────────────────────────
function fitCanvas() {
  var frame = document.getElementById('canvas-frame');
  if (!frame) return;
  var fw = frame.offsetWidth - 48, fh = frame.offsetHeight - 48;
  scale = Math.min(fw/CW, fh/CH, 1);
  canvas.width = CW; canvas.height = CH;
  canvas.style.width = (CW*scale)+'px';
  canvas.style.height = (CH*scale)+'px';
  canvas.style.left = Math.max(24, (fw - CW*scale)/2 + 24)+'px';
  canvas.style.top = Math.max(24, (fh - CH*scale)/2 + 24)+'px';
  render();
}

function setSize(w, h, btn) {
  CW = w; CH = h;
  var lbl = document.getElementById('size-label');
  if (lbl) lbl.textContent = w+' × '+h;
  var btns = document.querySelectorAll('.sz-btn');
  for (var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  if (btn) btn.classList.add('active');
  elements = []; sel = null;
  fitCanvas(); saveHist();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,CW,CH);
  for (var i=0;i<elements.length;i++) drawEl(elements[i]);
  if (sel) drawSelection(sel);
}

function drawEl(el) {
  ctx.save();
  ctx.globalAlpha = el.opacity !== undefined ? el.opacity : 1;
  if (el.type==='rect') {
    ctx.fillStyle = el.fill||B.teal;
    if (el.r) { rrect(el.x,el.y,el.w,el.h,el.r); ctx.fill(); }
    else ctx.fillRect(el.x,el.y,el.w,el.h);
  } else if (el.type==='circle') {
    ctx.fillStyle = el.fill||B.rose;
    ctx.beginPath();
    ctx.ellipse(el.x+el.w/2,el.y+el.h/2,el.w/2,el.h/2,0,0,Math.PI*2);
    ctx.fill();
  } else if (el.type==='text') {
    ctx.fillStyle = el.color||'#fff';
    var style = (el.bold?'bold ':'')+(el.italic?'italic ':'');
    ctx.font = style+(el.fs||48)+'px '+(el.ff||'Inter, sans-serif');
    ctx.textAlign = el.align||'left';
    ctx.textBaseline = 'top';
    wrapText(el.text||'Text', el.x, el.y, el.w, (el.fs||48)*1.35);
  } else if (el.type==='img' && el._img) {
    ctx.drawImage(el._img, el.x, el.y, el.w, el.h);
  }
  ctx.restore();
}

function wrapText(text, x, y, maxW, lh) {
  var words = text.split(' '), line='', ly=y;
  for (var i=0;i<words.length;i++) {
    var test = line+words[i]+' ';
    if (ctx.measureText(test).width > maxW && i>0) {
      ctx.fillText(line, x, ly); line=words[i]+' '; ly+=lh;
    } else line=test;
  }
  ctx.fillText(line, x, ly);
}

function rrect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function drawSelection(el) {
  ctx.save();
  ctx.strokeStyle='#0f3b3a'; ctx.lineWidth=3; ctx.setLineDash([6,3]);
  ctx.strokeRect(el.x-3,el.y-3,el.w+6,el.h+6);
  ctx.setLineDash([]);
  ctx.fillStyle='#0f3b3a';
  [[el.x,el.y],[el.x+el.w,el.y],[el.x,el.y+el.h],[el.x+el.w,el.y+el.h]].forEach(function(p){
    ctx.fillRect(p[0]-5,p[1]-5,10,10);
  });
  ctx.restore();
}

// ── Add elements ──────────────────────────────────────────────────────────────
function addText() {
  var el={id:uid(),type:'text',x:100,y:100,w:CW-200,h:200,text:'Double-click to edit',fs:48,color:B.teal,ff:'Inter, sans-serif',align:'left'};
  elements.push(el); sel=el; saveHist(); render(); showProps();
}
function addRect() {
  var el={id:uid(),type:'rect',x:CW/2-150,y:CH/2-100,w:300,h:200,fill:B.teal,r:12};
  elements.push(el); sel=el; saveHist(); render(); showProps();
}
function addCircle() {
  var el={id:uid(),type:'circle',x:CW/2-100,y:CH/2-100,w:200,h:200,fill:B.rose};
  elements.push(el); sel=el; saveHist(); render(); showProps();
}
function addImageURL() {
  var url=prompt('Image URL:'); if(!url) return; loadImg(url);
}
function handleUpload(input) {
  if(!input.files||!input.files[0]) return;
  var reader=new FileReader();
  reader.onload=function(e){loadImg(e.target.result);};
  reader.readAsDataURL(input.files[0]);
}
function loadImg(src) {
  var img=new Image(); img.crossOrigin='anonymous';
  img.onload=function(){
    var asp=img.width/img.height, w=Math.min(CW*0.6,600), h=w/asp;
    var el={id:uid(),type:'img',x:CW/2-w/2,y:CH/2-h/2,w:w,h:h,src:src,_img:img};
    elements.push(el); sel=el; saveHist(); render(); showProps();
  };
  img.onerror=function(){Toast.error('Could not load image');};
  img.src=src;
}
function addIPLogo() {
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80"><text x="0" y="56" font-family="Playfair Display,serif" font-size="40" fill="#0f3b3a" font-weight="600">Identity</text><text x="148" y="56" font-family="Playfair Display,serif" font-size="40" fill="#5c2d3f" font-weight="600">Partners</text></svg>';
  loadImg('data:image/svg+xml;base64,'+btoa(svg));
}

// ── Properties panel ──────────────────────────────────────────────────────────
function showProps() {
  var panel=document.getElementById('props-panel');
  var content=document.getElementById('props-content');
  if(!panel||!content||!sel) { if(panel) panel.style.display='none'; return; }
  panel.style.display='block';
  content.innerHTML='';
  function row(label, inputHtml) {
    var d=document.createElement('div'); d.className='prop-row';
    d.innerHTML='<span class="prop-label">'+label+'</span>'+inputHtml;
    content.appendChild(d);
  }
  if(sel.type==='text') {
    var ta=document.createElement('textarea');
    ta.style.cssText='width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:4px;font-size:12px;resize:vertical;min-height:60px;outline:none;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-ui);';
    ta.value=sel.text||'';
    ta.oninput=function(){sel.text=ta.value;render();};
    content.appendChild(ta);
    row('Size','<input class="prop-input" type="number" value="'+(sel.fs||48)+'" min="8" max="400" onchange="sel.fs=parseInt(this.value);render();">');
    row('Colour','<input class="prop-input" type="color" value="'+(sel.color||'#ffffff')+'" oninput="sel.color=this.value;render();">');
    row('Align','<select class="prop-input" onchange="sel.align=this.value;render();"><option value="left"'+(sel.align==='left'?' selected':'')+'>Left</option><option value="center"'+(sel.align==='center'?' selected':'')+'>Centre</option><option value="right"'+(sel.align==='right'?' selected':'')+'>Right</option></select>');
    row('Bold','<input type="checkbox"'+(sel.bold?' checked':'')+' onchange="sel.bold=this.checked;render();">');
  } else if(sel.type==='rect'||sel.type==='circle') {
    row('Fill','<input class="prop-input" type="color" value="'+(sel.fill||'#0f3b3a')+'" oninput="sel.fill=this.value;render();">');
    row('Opacity','<input class="prop-input" type="range" min="0" max="1" step="0.05" value="'+(sel.opacity!==undefined?sel.opacity:1)+'" oninput="sel.opacity=parseFloat(this.value);render();">');
    if(sel.type==='rect') row('Radius','<input class="prop-input" type="number" value="'+(sel.r||0)+'" min="0" max="200" onchange="sel.r=parseInt(this.value);render();">');
  } else if(sel.type==='img') {
    row('Opacity','<input class="prop-input" type="range" min="0" max="1" step="0.05" value="'+(sel.opacity!==undefined?sel.opacity:1)+'" oninput="sel.opacity=parseFloat(this.value);render();">');
  }
  row('X','<input class="prop-input" type="number" value="'+Math.round(sel.x)+'" onchange="sel.x=parseInt(this.value);render();">');
  row('Y','<input class="prop-input" type="number" value="'+Math.round(sel.y)+'" onchange="sel.y=parseInt(this.value);render();">');
  row('W','<input class="prop-input" type="number" value="'+Math.round(sel.w)+'" onchange="sel.w=parseInt(this.value);render();">');
  row('H','<input class="prop-input" type="number" value="'+Math.round(sel.h)+'" onchange="sel.h=parseInt(this.value);render();">');
}

function applyColour(c) {
  if(!sel){Toast.info('Select an element first');return;}
  if(sel.type==='text') sel.color=c; else sel.fill=c;
  render(); showProps();
}

// ── Mouse ─────────────────────────────────────────────────────────────────────
function getPos(e) {
  var r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale};
}
canvas.addEventListener('mousedown',function(e){
  var p=getPos(e); sel=null;
  for(var i=elements.length-1;i>=0;i--){
    var el=elements[i];
    if(p.x>=el.x&&p.x<=el.x+el.w&&p.y>=el.y&&p.y<=el.y+el.h){
      sel=el; dragging=true; dragOX=p.x-el.x; dragOY=p.y-el.y; break;
    }
  }
  render(); showProps();
});
canvas.addEventListener('mousemove',function(e){
  if(!dragging||!sel) return;
  var p=getPos(e);
  sel.x=Math.max(0,p.x-dragOX); sel.y=Math.max(0,p.y-dragOY);
  render();
});
canvas.addEventListener('mouseup',function(){if(dragging){dragging=false;saveHist();}});
canvas.addEventListener('dblclick',function(e){
  var p=getPos(e);
  for(var i=elements.length-1;i>=0;i--){
    var el=elements[i];
    if(el.type==='text'&&p.x>=el.x&&p.x<=el.x+el.w&&p.y>=el.y&&p.y<=el.y+el.h){
      var t=prompt('Edit text:',el.text);
      if(t!==null){el.text=t;saveHist();render();}
      break;
    }
  }
});

// ── Operations ────────────────────────────────────────────────────────────────
function alignEl(dir) {
  if(!sel) return;
  if(dir==='left') sel.x=0;
  else if(dir==='center') sel.x=CW/2-sel.w/2;
  else if(dir==='right') sel.x=CW-sel.w;
  else if(dir==='top') sel.y=0;
  else if(dir==='middle') sel.y=CH/2-sel.h/2;
  else if(dir==='bottom') sel.y=CH-sel.h;
  render(); saveHist();
}
function bringFwd() { if(!sel) return; var i=elements.indexOf(sel); if(i<elements.length-1){elements.splice(i,1);elements.splice(i+1,0,sel);render();} }
function sendBck() { if(!sel) return; var i=elements.indexOf(sel); if(i>0){elements.splice(i,1);elements.splice(i-1,0,sel);render();} }
function duplicate() {
  if(!sel) return;
  var copy=Object.assign({},sel,{id:uid(),x:sel.x+20,y:sel.y+20});
  if(sel._img) copy._img=sel._img;
  elements.push(copy); sel=copy; saveHist(); render(); showProps();
}
function deleteEl() { if(!sel) return; elements=elements.filter(function(e){return e.id!==sel.id;}); sel=null; saveHist(); render(); showProps(); }

// ── History ───────────────────────────────────────────────────────────────────
function saveHist() {
  hist=hist.slice(0,histIdx+1);
  hist.push(JSON.stringify(elements.map(function(e){var c=Object.assign({},e);delete c._img;return c;})));
  histIdx=hist.length-1;
}
function undo() { if(histIdx<=0) return; histIdx--; restoreHist(); }
function redo() { if(histIdx>=hist.length-1) return; histIdx++; restoreHist(); }
function restoreHist() {
  elements=JSON.parse(hist[histIdx]);
  elements.forEach(function(el){
    if(el.type==='img'&&el.src){
      var img=new Image(); img.crossOrigin='anonymous';
      img.onload=function(){el._img=img;render();};
      img.src=el.src;
    }
  });
  sel=null; render(); showProps();
}

// ── Export ────────────────────────────────────────────────────────────────────
function downloadPNG() { sel=null; render(); var a=document.createElement('a'); a.download='prism-canvas-'+Date.now()+'.png'; a.href=canvas.toDataURL('image/png',0.95); a.click(); Toast.success('Downloaded PNG'); }
function downloadJPG() { sel=null; render(); var a=document.createElement('a'); a.download='prism-canvas-'+Date.now()+'.jpg'; a.href=canvas.toDataURL('image/jpeg',0.92); a.click(); Toast.success('Downloaded JPG'); }
function saveToAssets() {
  sel=null; render();
  var assets=[]; try{assets=JSON.parse(localStorage.getItem('prism-canvas-assets')||'[]');}catch(e){}
  assets.unshift({id:'asset-'+Date.now(),dataUrl:canvas.toDataURL('image/png',0.85),created:new Date().toISOString(),size:CW+'x'+CH});
  if(assets.length>30) assets=assets.slice(0,30);
  try{localStorage.setItem('prism-canvas-assets',JSON.stringify(assets));}catch(e){}
  Toast.success('Saved to Assets library');
}

// ── AI Design ─────────────────────────────────────────────────────────────────
function aiDesign() {
  var prompt=document.getElementById('ai-prompt').value.trim();
  if(!prompt){Toast.warning('Describe what you want to create');return;}
  Toast.info('Generating…');
  var xhr=new XMLHttpRequest();
  xhr.open('POST',WORKER+'/api/chat',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4) return;
    try{
      var r=JSON.parse(xhr.responseText);
      var content=r.content||'';
      var qm=content.match(/["\u201c]([^"\u201d]{20,200})["\u201d]/);
      if(qm){
        loadTemplate('quote');
        var te=elements.find(function(e){return e.type==='text'&&e.fs>=50;});
        if(te) te.text='\u201c'+qm[1]+'\u201d';
      } else {
        loadTemplate('announcement');
        var te=elements.find(function(e){return e.type==='text'&&e.fs>=60;});
        if(te) te.text=content.split('\n')[0].substring(0,60);
      }
      render();
      Toast.success('Design generated \u2014 click elements to edit');
    }catch(e){Toast.error('AI design failed');}
  };
  xhr.onerror=function(){Toast.error('Network error');};
  xhr.send(JSON.stringify({messages:[
    {role:'system',content:'You are a graphic design assistant for Identity Partners (addiction, trauma, mental health). Generate compelling text for social media graphics. British English. Be concise and impactful.'},
    {role:'user',content:'Create content for: '+prompt+'. Return a powerful quote (in \u201ccurly quotes\u201d) and a brief supporting line.'}
  ],profile:'fast'}));
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo();}
  if(e.ctrlKey&&e.key==='y'){e.preventDefault();redo();}
  if(e.ctrlKey&&e.key==='d'){e.preventDefault();duplicate();}
  if((e.key==='Delete'||e.key==='Backspace')&&sel&&document.activeElement===document.body){deleteEl();}
});

window.addEventListener('resize',fitCanvas);

document.addEventListener('DOMContentLoaded',function(){
  var mount=document.getElementById('sidebar-mount');
  if(mount){var sb=buildSidebar('/creator/canvas/');mount.parentNode.insertBefore(sb,mount);mount.parentNode.removeChild(mount);}
  fitCanvas();
  loadTemplate('quote');
});
</script>
