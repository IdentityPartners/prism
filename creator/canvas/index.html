<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas — Prism</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<!-- Polotno SDK from CDN -->
<script src="https://unpkg.com/polotno-studio/polotno.js"></script>
<style>
.cv-shell{display:flex;height:calc(100vh - var(--topbar-h));overflow:hidden;}
.cv-sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);background:var(--bg-surface);display:flex;flex-direction:column;overflow-y:auto;padding:10px;gap:8px;}
.cv-main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
#polotno-root{flex:1;overflow:hidden;}
.sb-sec{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:10px;}
.sb-ttl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--fg-muted);margin-bottom:7px;}
.sz-btn{padding:3px 7px;border:1px solid var(--border);border-radius:4px;font-size:10.5px;background:var(--bg-surface);color:var(--fg-secondary);cursor:pointer;margin:2px;transition:all 0.15s;}
.sz-btn:hover{border-color:var(--accent);color:var(--accent);}
.b-sw{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent;display:inline-block;margin:2px;transition:border-color 0.15s;}
.b-sw:hover{border-color:var(--fg-primary);}
.lg-btn{width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:5px;background:var(--bg-surface);cursor:pointer;font-size:11.5px;color:var(--fg-secondary);margin-bottom:3px;text-align:left;transition:all 0.15s;}
.lg-btn:hover{border-color:var(--accent);color:var(--accent);}
.ai-ta{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:var(--font-ui);resize:none;outline:none;background:var(--bg-primary);color:var(--fg-primary);min-height:52px;}
.ai-ta:focus{border-color:var(--accent);}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.tpl-btn{aspect-ratio:1;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:10px;color:var(--fg-muted);background:var(--bg-elevated);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all 0.15s;padding:3px;text-align:center;}
.tpl-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.saved-th{width:56px;height:56px;border-radius:5px;border:1px solid var(--border);object-fit:cover;cursor:pointer;}
.saved-th:hover{border-color:var(--accent);}
.polotno-loading{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;color:var(--fg-muted);}
</style>
</head>
<body>
<div class="prism-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content" id="main-content">
    <div class="topbar">
      <div class="topbar-title">Canvas</div>
      <div class="topbar-actions">
        <button class="btn btn-sm btn-secondary" id="dl-png" title="Download PNG">PNG</button>
        <button class="btn btn-sm btn-secondary" id="dl-jpg" title="Download JPG">JPG</button>
        <button class="btn btn-sm btn-secondary" id="save-btn" title="Save to Assets">Save</button>
        <button class="btn btn-sm btn-ghost" id="load-btn" title="Load saved assets">Assets</button>
      </div>
    </div>
    <div class="cv-shell">
      <div class="cv-sidebar">
        <div class="sb-sec">
          <div class="sb-ttl">Canvas Size</div>
          <div id="size-btns"></div>
        </div>
        <div class="sb-sec">
          <div class="sb-ttl">IP Brand Colours</div>
          <div id="colour-swatches"></div>
        </div>
        <div class="sb-sec">
          <div class="sb-ttl">IP Logos</div>
          <div id="logo-btns"></div>
        </div>
        <div class="sb-sec">
          <div class="sb-ttl">Templates</div>
          <div class="tpl-grid" id="tpl-grid"></div>
        </div>
        <div class="sb-sec">
          <div class="sb-ttl">AI Design Assist</div>
          <textarea class="ai-ta" id="ai-prompt" placeholder="Describe what to create..."></textarea>
          <button class="btn btn-primary btn-sm" id="ai-btn" style="width:100%;margin-top:5px;">Generate</button>
        </div>
        <div class="sb-sec" id="saved-sec" style="display:none;">
          <div class="sb-ttl">Saved Assets</div>

    </div>
  </div>
</div>
<input type="file" id="img-upload" accept="image/*" style="display:none;">
<script src="/shared/prism.js"></script>
<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var POLOTNO_KEY = null;
var store = null;
var polotnoLoaded = false;

var B = {teal:'#0f3b3a',rose:'#5c2d3f',ivory:'#f7f3e9',teal2:'#1a5550',rose2:'#7a4254',grey:'#ddd0c8'};
var LOGOS = {
  square: '/shared/assets/logo-square.png',
  hero: '/shared/assets/logo-hero-tag.png',
  'rect-left': '/shared/assets/logo-rect-left.png',
  'rect-right': '/shared/assets/logo-rect-right.png'
};

// ── Try to init Polotno ───────────────────────────────────────────────────────
function tryInitPolotno() {
  // Get Polotno key from Worker KV
  var xhr = new XMLHttpRequest();
  xhr.open('GET', WORKER + '/api/kv?prefix=__secrets__', true);
  xhr.timeout = 5000;
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    // Try to get POLOTNO_KEY from secrets
    var polotnoXhr = new XMLHttpRequest();
    polotnoXhr.open('POST', WORKER + '/api/chat', true);
    polotnoXhr.setRequestHeader('Content-Type', 'application/json');
    polotnoXhr.timeout = 5000;
    polotnoXhr.onreadystatechange = function() {
      // Fall back to HTML5 canvas regardless
      initFallbackCanvas();
    };
    polotnoXhr.onerror = function() { initFallbackCanvas(); };
    // Check if Polotno SDK loaded
    if (typeof window.PolotnoContainer !== 'undefined' || typeof window.createStore !== 'undefined') {
      initPolotnoEditor();
    } else {
      initFallbackCanvas();
    }
  };
  xhr.onerror = function() { initFallbackCanvas(); };
  xhr.send();
}

function initPolotnoEditor() {
  try {
    var container = document.getElementById('polotno-root');
    if (!container) { initFallbackCanvas(); return; }
    
    // Try Polotno initialization
    if (typeof createStore !== 'undefined') {
      store = createStore({key: POLOTNO_KEY || 'nFA5H9elEytDyPyvKL7T'});
      store.setSize(1080, 1080);
      
      var app = document.createElement('div');
      app.id = 'polotno-app';
      app.style.cssText = 'width:100%;height:100%;';
      container.innerHTML = '';
      container.appendChild(app);
      
      // Render Polotno
      if (typeof PolotnoContainer !== 'undefined') {
        PolotnoContainer.render(app, {store: store});
        polotnoLoaded = true;
        Toast.success('Polotno editor loaded');
        return;
      }
    }
    initFallbackCanvas();
  } catch(e) {
    console.log('Polotno init failed:', e.message);
    initFallbackCanvas();
  }
}

// ── Fallback HTML5 canvas ─────────────────────────────────────────────────────
var cv = null, ctx = null;
var elements = [], sel = null, hist = [], histIdx = -1;
var dragging = false, dragOX = 0, dragOY = 0;
var CW = 1080, CH = 1080, scale = 1;

function initFallbackCanvas() {
  var container = document.getElementById('polotno-root');
  if (!container) return;
  container.style.cssText = 'flex:1;overflow:hidden;position:relative;background:#c8c8c8;display:flex;flex-direction:column;';

  // Toolbar
  var tb = document.createElement('div');
  tb.style.cssText = 'height:40px;background:var(--bg-elevated);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:5px;flex-shrink:0;';
  var tbItems = [
    {l:'Undo',fn:undo},{l:'Redo',fn:redo},{l:'Delete',fn:deleteEl,d:true},
    {l:'Centre H',fn:function(){alignEl('center');}},{l:'Centre V',fn:function(){alignEl('middle');}},
    {l:'Fwd',fn:bringFwd},{l:'Back',fn:sendBck},{l:'Dupe',fn:duplicate}
  ];
  tbItems.forEach(function(item) {
    var btn = document.createElement('button');
    btn.textContent = item.l;
    btn.style.cssText = 'padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:11px;cursor:pointer;background:var(--bg-surface);' + (item.d ? 'color:var(--danger);' : '');
    btn.onclick = item.fn;
    tb.appendChild(btn);
  });
  var lbl = document.createElement('span');
  lbl.id = 'size-label';
  lbl.style.cssText = 'margin-left:auto;font-size:11px;color:var(--fg-muted);';
  lbl.textContent = '1080 x 1080';
  tb.appendChild(lbl);
  container.appendChild(tb);

  // Canvas frame
  var frame = document.createElement('div');
  frame.id = 'cv-frame';
  frame.style.cssText = 'flex:1;overflow:hidden;position:relative;background:#c8c8c8;';
  container.appendChild(frame);

  cv = document.createElement('canvas');
  cv.style.cssText = 'position:absolute;box-shadow:0 4px 24px rgba(0,0,0,0.2);cursor:crosshair;';
  frame.appendChild(cv);
  ctx = cv.getContext('2d');

  cv.addEventListener('mousedown', onMouseDown);
  cv.addEventListener('mousemove', onMouseMove);
  cv.addEventListener('mouseup', onMouseUp);
  cv.addEventListener('dblclick', onDblClick);
  window.addEventListener('resize', fitCanvas);
  fitCanvas();
  loadTemplate('quote');
}

function fitCanvas() {
  var frame = document.getElementById('cv-frame');
  if (!frame || !cv) return;
  var fw = frame.offsetWidth - 40, fh = frame.offsetHeight - 40;
  scale = Math.min(fw/CW, fh/CH, 1);
  cv.width = CW; cv.height = CH;
  cv.style.width = (CW*scale) + 'px';
  cv.style.height = (CH*scale) + 'px';
  cv.style.left = Math.max(20, (fw-CW*scale)/2+20) + 'px';
  cv.style.top = '20px';
  render();
}

function setSize(w, h) {
  CW=w; CH=h;
  var lbl=document.getElementById('size-label');
  if(lbl) lbl.textContent = w + ' x ' + h;
  elements=[]; sel=null;
  if(store) { store.setSize(w,h); } else { fitCanvas(); saveHist(); }
}

function render() {
  if(!ctx) return;
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,CW,CH);
  elements.forEach(function(el){drawEl(el);});
  if(sel) drawSel(sel);
}

function drawEl(el) {
  ctx.save();
  ctx.globalAlpha = el.opacity||1;
  if(el.type==='rect'){
    ctx.fillStyle=el.fill||B.teal;
    ctx.fillRect(el.x,el.y,el.w,el.h);
  } else if(el.type==='text'){
    ctx.fillStyle=el.color||'#fff';
    ctx.font=(el.bold?'bold ':'')+(el.italic?'italic ':'')+(el.fs||48)+'px '+(el.ff||'Playfair Display, serif');
    ctx.textAlign=el.align||'left';
    ctx.textBaseline='top';
    wrapText(el.text||'Text',el.x,el.y,el.w,(el.fs||48)*1.35);
  } else if(el.type==='img'&&el._img){
    ctx.drawImage(el._img,el.x,el.y,el.w,el.h);
  }
  ctx.restore();
}

function wrapText(text,x,y,maxW,lh){
  var words=text.split(' '),line='',ly=y;
  for(var i=0;i<words.length;i++){
    var test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxW&&i>0){ctx.fillText(line,x,ly);line=words[i]+' ';ly+=lh;}
    else line=test;
  }
  ctx.fillText(line,x,ly);
}

function drawSel(el){
  ctx.save();
  ctx.strokeStyle='#0f3b3a';ctx.lineWidth=3;ctx.setLineDash([6,3]);
  ctx.strokeRect(el.x-3,el.y-3,el.w+6,el.h+6);
  ctx.setLineDash([]);
  ctx.fillStyle='#0f3b3a';
  [[el.x,el.y],[el.x+el.w,el.y],[el.x,el.y+el.h],[el.x+el.w,el.y+el.h]].forEach(function(p){ctx.fillRect(p[0]-5,p[1]-5,10,10);});
  ctx.restore();
}

function uid(){return 'e'+Date.now()+Math.random().toString(36).slice(2,5);}

function loadTemplate(name){
  if(store) { loadPolotnoTemplate(name); return; }
  elements=[]; sel=null;
  var T={
    blank:function(){elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:CH,fill:'#fff'});},
    quote:function(){
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:CH,fill:B.ivory});
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:10,fill:B.teal});
      elements.push({id:uid(),type:'rect',x:0,y:CH-10,w:CW,h:10,fill:B.rose});
      elements.push({id:uid(),type:'text',x:80,y:120,w:CW-160,h:500,text:'“Your powerful quote about recovery, growth, or change.”',fs:54,color:B.teal,ff:'Playfair Display, serif',align:'left',italic:true});
      elements.push({id:uid(),type:'text',x:80,y:660,w:CW-160,h:60,text:'— Identity Partners',fs:30,color:B.rose,ff:'Inter, sans-serif',align:'left'});
      elements.push({id:uid(),type:'text',x:80,y:CH-80,w:CW-160,h:50,text:'identitypartners.uk',fs:24,color:B.teal,ff:'Inter, sans-serif',align:'left'});
    },
    announce:function(){
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:CH,fill:B.ivory});
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:200,fill:B.teal});
      elements.push({id:uid(),type:'text',x:60,y:70,w:CW-120,h:100,text:'ANNOUNCEMENT',fs:32,color:B.ivory,bold:true,ff:'Inter, sans-serif',align:'left'});
      elements.push({id:uid(),type:'text',x:60,y:240,w:CW-120,h:200,text:'Your Headline Here',fs:72,color:B.teal,bold:true,ff:'Playfair Display, serif',align:'left'});
      elements.push({id:uid(),type:'text',x:60,y:480,w:CW-120,h:300,text:'Supporting detail.',fs:38,color:B.rose2,ff:'Inter, sans-serif',align:'left'});
    },
    stat:function(){
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:CH,fill:B.rose});
      elements.push({id:uid(),type:'text',x:80,y:180,w:CW-160,h:320,text:'73%',fs:240,color:'#fff',bold:true,ff:'Inter, sans-serif',align:'center'});
      elements.push({id:uid(),type:'text',x:80,y:520,w:CW-160,h:140,text:'of people in recovery say peer support was essential',fs:38,color:B.grey,ff:'Merriweather, serif',align:'center'});
    },
    tip:function(){
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:CH,fill:'#fff'});
      elements.push({id:uid(),type:'rect',x:0,y:0,w:18,h:CH,fill:B.teal});
      elements.push({id:uid(),type:'text',x:80,y:80,w:CW-120,h:80,text:'TIP',fs:38,color:B.teal,bold:true,ff:'Inter, sans-serif',align:'left'});
      elements.push({id:uid(),type:'text',x:80,y:200,w:CW-160,h:560,text:'Your practical, actionable tip goes here.',fs:50,color:'#1a1a1a',ff:'Playfair Display, serif',align:'left',italic:true});
    },
    carousel:function(){
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:CH,fill:B.ivory});
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:130,fill:B.teal});
      elements.push({id:uid(),type:'text',x:40,y:38,w:CW-200,h:80,text:'Slide 1 of 5',fs:30,color:B.ivory,ff:'Inter, sans-serif',align:'left'});
      elements.push({id:uid(),type:'text',x:60,y:180,w:CW-120,h:200,text:'Slide Title',fs:80,color:B.teal,bold:true,ff:'Playfair Display, serif',align:'left'});
      elements.push({id:uid(),type:'text',x:60,y:420,w:CW-120,h:400,text:'Your slide content.',fs:44,color:B.rose2,ff:'Inter, sans-serif',align:'left'});
    },
    event:function(){
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:CH,fill:B.teal});
      elements.push({id:uid(),type:'text',x:80,y:100,w:CW-160,h:80,text:"YOU'RE INVITED",fs:30,color:B.grey,bold:true,ff:'Inter, sans-serif',align:'center'});
      elements.push({id:uid(),type:'text',x:80,y:220,w:CW-160,h:200,text:'Event Name Here',fs:80,color:'#fff',bold:true,ff:'Playfair Display, serif',align:'center'});
      elements.push({id:uid(),type:'text',x:80,y:460,w:CW-160,h:80,text:'Date · Time · Location',fs:34,color:B.grey,ff:'Inter, sans-serif',align:'center'});
    },
    profile:function(){
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:CH,fill:'#fff'});
      elements.push({id:uid(),type:'rect',x:0,y:0,w:CW,h:380,fill:B.teal});
      elements.push({id:uid(),type:'text',x:80,y:480,w:CW-160,h:100,text:'Your Name',fs:64,color:B.teal,bold:true,ff:'Playfair Display, serif',align:'center'});
      elements.push({id:uid(),type:'text',x:80,y:590,w:CW-160,h:60,text:'Title · Identity Partners',fs:30,color:B.rose2,ff:'Inter, sans-serif',align:'center'});
    },
  };
  if(T[name]) T[name]();
  saveHist(); render();
}

function loadPolotnoTemplate(name) {
  if(!store) return;
  store.clear();
  var page = store.pages[0] || store.addPage();
  // Add background
  page.addElement({type:'rect',x:0,y:0,width:CW,height:CH,fill:B.ivory});
  if(name==='quote') {
    page.addElement({type:'rect',x:0,y:0,width:CW,height:10,fill:B.teal});
    page.addElement({type:'text',x:80,y:120,width:CW-160,text:'“Your powerful quote.”',fontSize:54,fill:B.teal,fontFamily:'Playfair Display',fontStyle:'italic'});
    page.addElement({type:'text',x:80,y:660,width:CW-160,text:'— Identity Partners',fontSize:30,fill:B.rose,fontFamily:'Inter'});
  }
}

function addText(){if(store){var p=store.pages[0];if(p)p.addElement({type:'text',x:100,y:100,width:CW-200,text:'Double-click to edit',fontSize:48,fill:B.teal,fontFamily:'Playfair Display'});return;}var el={id:uid(),type:'text',x:100,y:100,w:CW-200,h:200,text:'Double-click to edit',fs:48,color:B.teal,ff:'Playfair Display, serif',align:'left'};elements.push(el);sel=el;saveHist();render();}
function addRect(){if(store){var p=store.pages[0];if(p)p.addElement({type:'rect',x:CW/2-150,y:CH/2-100,width:300,height:200,fill:B.teal});return;}var el={id:uid(),type:'rect',x:CW/2-150,y:CH/2-100,w:300,h:200,fill:B.teal};elements.push(el);sel=el;saveHist();render();}
function addImageURL(){var url=prompt('Image URL:');if(!url) return;if(store){var p=store.pages[0];if(p)p.addElement({type:'image',x:100,y:100,width:400,height:400,src:url});return;}loadImg(url);}
function loadImg(src){var img=new Image();img.crossOrigin='anonymous';img.onload=function(){var asp=img.width/img.height,w=Math.min(CW*0.6,600),h=w/asp;var el={id:uid(),type:'img',x:CW/2-w/2,y:CH/2-h/2,w:w,h:h,src:src,_img:img};elements.push(el);sel=el;saveHist();render();};img.onerror=function(){Toast.error('Could not load image');};img.src=src;}
function addLogo(type){var url=LOGOS[type]||LOGOS.square;if(store){var p=store.pages[0];if(p)p.addElement({type:'image',x:CW-300,y:CH-150,width:250,height:100,src:url});return;}loadImg(url);}
function applyBg(color){if(store){var p=store.pages[0];var bg=p&&p.children.find(function(e){return e.type==='rect'&&e.x===0&&e.y===0;});if(bg)bg.set({fill:color});return;}var bg=elements.find(function(e){return e.type==='rect'&&e.x===0&&e.y===0&&e.w===CW&&e.h===CH;});if(bg){bg.fill=color;render();}else{elements.unshift({id:uid(),type:'rect',x:0,y:0,w:CW,h:CH,fill:color});render();}}
function alignEl(dir){if(!sel) return;if(dir==='center')sel.x=CW/2-sel.w/2;else if(dir==='middle')sel.y=CH/2-sel.h/2;render();saveHist();}
function deleteEl(){if(!sel) return;elements=elements.filter(function(e){return e.id!==sel.id;});sel=null;saveHist();render();}
function bringFwd(){if(!sel) return;var i=elements.indexOf(sel);if(i<elements.length-1){elements.splice(i,1);elements.splice(i+1,0,sel);render();}}
function sendBck(){if(!sel) return;var i=elements.indexOf(sel);if(i>0){elements.splice(i,1);elements.splice(i-1,0,sel);render();}}
function duplicate(){if(!sel) return;var copy=Object.assign({},sel,{id:uid(),x:sel.x+20,y:sel.y+20});if(sel._img)copy._img=sel._img;elements.push(copy);sel=copy;saveHist();render();}
function saveHist(){hist=hist.slice(0,histIdx+1);hist.push(JSON.stringify(elements.map(function(e){var c=Object.assign({},e);delete c._img;return c;})));histIdx=hist.length-1;}
function undo(){if(histIdx<=0) return;histIdx--;restoreHist();}
function redo(){if(histIdx>=hist.length-1) return;histIdx++;restoreHist();}
function restoreHist(){elements=JSON.parse(hist[histIdx]);elements.forEach(function(el){if(el.type==='img'&&el.src){var img=new Image();img.crossOrigin='anonymous';img.onload=function(){el._img=img;render();};img.src=el.src;}});sel=null;render();}
function getPos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
function onMouseDown(e){var p=getPos(e);sel=null;for(var i=elements.length-1;i>=0;i--){var el=elements[i];if(p.x>=el.x&&p.x<=el.x+el.w&&p.y>=el.y&&p.y<=el.y+el.h){sel=el;dragging=true;dragOX=p.x-el.x;dragOY=p.y-el.y;break;}}render();}
function onMouseMove(e){if(!dragging||!sel) return;var p=getPos(e);sel.x=Math.max(0,p.x-dragOX);sel.y=Math.max(0,p.y-dragOY);render();}
function onMouseUp(){if(dragging){dragging=false;saveHist();}}
function onDblClick(e){var p=getPos(e);for(var i=elements.length-1;i>=0;i--){var el=elements[i];if(el.type==='text'&&p.x>=el.x&&p.x<=el.x+el.w&&p.y>=el.y&&p.y<=el.y+el.h){var t=prompt('Edit text:',el.text);if(t!==null){el.text=t;saveHist();render();}break;}}}

function getCanvas(){
  if(store) {
    // Polotno export
    return store.toDataURL({pixelRatio:1});
  }
  if(cv) { sel=null; render(); return cv.toDataURL('image/png',0.95); }
  return null;
}

function downloadPNG(){var d=getCanvas();if(!d) return;var a=document.createElement('a');a.download='ip-canvas-'+Date.now()+'.png';a.href=d;a.click();Toast.success('Downloaded PNG');}
function downloadJPG(){if(cv){sel=null;render();var a=document.createElement('a');a.download='ip-canvas-'+Date.now()+'.jpg';a.href=cv.toDataURL('image/jpeg',0.92);a.click();Toast.success('Downloaded JPG');}else Toast.info('Use PNG for Polotno export');}

function saveToAssets(){
  var d=getCanvas();if(!d) return;
  var assets=[];try{assets=JSON.parse(localStorage.getItem('prism-canvas-assets')||'[]');}catch(e){}
  assets.unshift({id:'asset-'+Date.now(),dataUrl:d,created:new Date().toISOString(),size:CW+'x'+CH});
  if(assets.length>50)assets=assets.slice(0,50);
  try{localStorage.setItem('prism-canvas-assets',JSON.stringify(assets));}catch(e){}
  Toast.success('Saved to Assets');
  loadSavedAssets();
}

function loadSavedAssets(){
  var sec=document.getElementById('saved-sec');
  var thumbs=document.getElementById('saved-thumbs');
  if(!sec||!thumbs) return;
  var assets=[];try{assets=JSON.parse(localStorage.getItem('prism-canvas-assets')||'[]');}catch(e){}
  if(!assets.length){sec.style.display='none';return;}
  sec.style.display='block';
  thumbs.innerHTML='';
  assets.slice(0,12).forEach(function(asset){
    var img=document.createElement('img');
    img.src=asset.dataUrl;img.className='saved-th';img.title=asset.size;
    img.onclick=function(){if(store){var p=store.pages[0];if(p)p.addElement({type:'image',x:0,y:0,width:CW,height:CH,src:asset.dataUrl});}else{var i=new Image();i.onload=function(){var el={id:uid(),type:'img',x:0,y:0,w:CW,h:CH,src:asset.dataUrl,_img:i};elements=[el];sel=null;saveHist();render();};i.src=asset.dataUrl;}};
    thumbs.appendChild(img);
  });
}

function aiDesign(){
  var prompt=document.getElementById('ai-prompt').value.trim();
  if(!prompt){Toast.warning('Describe what to create');return;}
  Toast.info('Generating...');
  var xhr=new XMLHttpRequest();
  xhr.open('POST',WORKER+'/api/chat',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4) return;
    try{
      var r=JSON.parse(xhr.responseText);
      var content=r.content||'';
      var qm=content.match(/[“"]([^"”]{20,200})[”"]/);
      if(qm){
        loadTemplate('quote');
        if(!store){var te=elements.find(function(e){return e.type==='text'&&e.fs>=50;});if(te){te.text='“'+qm[1]+'”';render();}}
      } else {
        loadTemplate('announce');
        if(!store){var te=elements.find(function(e){return e.type==='text'&&e.fs>=60;});if(te){te.text=content.substring(0,60);render();}}
      }
      Toast.success('Design generated');
    }catch(e){Toast.error('AI design failed');}
  };
  xhr.onerror=function(){Toast.error('Network error');};
  xhr.send(JSON.stringify({messages:[{role:'system',content:'You are a graphic design assistant for Identity Partners. Generate compelling text for social media graphics. British English. Be concise.'},{role:'user',content:'Create content for: '+prompt+'. Return a powerful quote in curly quotes.'}],profile:'fast'}));
}

function buildUI(){
  var sizes=[{l:'1:1',w:1080,h:1080},{l:'9:16',w:1080,h:1920},{l:'1.91:1',w:1200,h:628},{l:'Quote',w:800,h:800},{l:'16:9',w:1920,h:1080},{l:'A4',w:2480,h:3508}];
  var sb=document.getElementById('size-btns');
  if(sb) sizes.forEach(function(s){var btn=document.createElement('button');btn.className='sz-btn';btn.textContent=s.l;btn.title=s.w+'x'+s.h;btn.onclick=function(){setSize(s.w,s.h);};sb.appendChild(btn);});

  var colours=[{c:'#f7f3e9',t:'Ivory',b:true},{c:'#0f3b3a',t:'Teal'},{c:'#5c2d3f',t:'Rose'},{c:'#1a5550',t:'Teal2'},{c:'#7a4254',t:'Rose2'},{c:'#ddd0c8',t:'Grey',b:true},{c:'#ffffff',t:'White',b:true}];
  var cs=document.getElementById('colour-swatches');
  if(cs) colours.forEach(function(col){var sw=document.createElement('div');sw.className='b-sw';sw.style.background=col.c;if(col.b)sw.style.border='2px solid #ccc';sw.title=col.t;sw.onclick=function(){applyBg(col.c);};cs.appendChild(sw);});

  var logos=[{k:'square',l:'Square Logo'},{k:'hero',l:'Hero + Tagline'},{k:'rect-left',l:'Rect Left'},{k:'rect-right',l:'Rect Right'}];
  var lb=document.getElementById('logo-btns');
  if(lb) logos.forEach(function(logo){var btn=document.createElement('button');btn.className='lg-btn';btn.textContent=logo.l;btn.onclick=function(){addLogo(logo.k);};lb.appendChild(btn);});

  var tpls=[{k:'quote',l:'Quote',i:'&#x275D;'},{k:'carousel',l:'Carousel',i:'&#x1F4F1;'},{k:'announce',l:'Announce',i:'&#x1F4E2;'},{k:'stat',l:'Stat',i:'&#x1F4CA;'},{k:'tip',l:'Tip',i:'&#x1F4A1;'},{k:'event',l:'Event',i:'&#x1F4C5;'},{k:'profile',l:'Profile',i:'&#x1F464;'},{k:'blank',l:'Blank',i:'&#x2B1C;'}];
  var tg=document.getElementById('tpl-grid');
  if(tg) tpls.forEach(function(t){var btn=document.createElement('div');btn.className='tpl-btn';btn.innerHTML='<span style="font-size:18px;">'+t.i+'</span>'+t.l;btn.onclick=function(){loadTemplate(t.k);};tg.appendChild(btn);});

  document.getElementById('dl-png').onclick=downloadPNG;
  document.getElementById('dl-jpg').onclick=downloadJPG;
  document.getElementById('save-btn').onclick=saveToAssets;
  document.getElementById('load-btn').onclick=loadSavedAssets;
  document.getElementById('ai-btn').onclick=aiDesign;
  document.getElementById('img-upload').onchange=function(){if(this.files&&this.files[0]){var r=new FileReader();r.onload=function(e){if(store){var p=store.pages[0];if(p)p.addElement({type:'image',x:100,y:100,width:400,height:400,src:e.target.result});}else loadImg(e.target.result);};r.readAsDataURL(this.files[0]);}};
}

document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo();}
  if(e.ctrlKey&&e.key==='y'){e.preventDefault();redo();}
  if(e.ctrlKey&&e.key==='d'){e.preventDefault();duplicate();}
  if((e.key==='Delete'||e.key==='Backspace')&&sel&&document.activeElement===document.body){deleteEl();}
});

document.addEventListener('DOMContentLoaded',function(){
  var mount=document.getElementById('sidebar-mount');
  if(mount){var sb=buildSidebar('/creator/canvas/');mount.parentNode.insertBefore(sb,mount);mount.parentNode.removeChild(mount);}
  buildUI();
  // Try Polotno first, fall back to HTML5
  setTimeout(tryInitPolotno, 500);
  loadSavedAssets();
  var prefill='';
  try{prefill=sessionStorage.getItem('prism-canvas-text')||'';sessionStorage.removeItem('prism-canvas-text');}catch(e){}
  if(prefill){setTimeout(function(){loadTemplate('quote');if(!store){var te=elements.find(function(e){return e.type==='text'&&e.fs>=50;});if(te){te.text='“'+prefill.replace(/^[“"]|[”"]$/g,'')+'”';render();}}},1000);}
});
</script>
</body>
