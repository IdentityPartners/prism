<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assets — Prism</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.assets-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
.asset-thumb { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; cursor:pointer; transition:border-color 0.15s; }
.asset-thumb:hover { border-color:var(--accent); }
.asset-thumb img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
.asset-thumb-info { padding:8px 10px; }
.asset-thumb-name { font-size:11.5px; font-weight:500; color:var(--fg-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.asset-thumb-meta { font-size:10.5px; color:var(--fg-muted); margin-top:2px; }
.asset-thumb-actions { display:flex; gap:4px; padding:6px 10px; border-top:1px solid var(--border); }
.gen-section { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:20px; }
</style>
</head>
<body>
<div class="prism-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content" id="main-content">
    <div class="topbar">
      <div class="topbar-title">Assets</div>
      <div class="topbar-actions">
        <button class="btn btn-sm btn-secondary" onclick="clearAssets()" title="Clear all saved assets">🗑 Clear All</button>
        <a href="/creator/canvas/" class="btn btn-sm btn-primary" title="Create new asset in Canvas">＋ New in Canvas</a>
      </div>
    </div>
    <div class="page-content">
      <!-- Image generation -->
      <div class="gen-section">
        <div style="font-size:13px;font-weight:600;margin-bottom:10px;">🎨 Generate Image</div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px;">
          <div style="flex:1;min-width:200px;">
            <input class="input" id="gen-prompt" type="text" placeholder="Describe the image… e.g. 'Serene forest path at dawn, warm light, peaceful'">
          </div>
          <button class="btn btn-primary" onclick="generateImage()" title="Generate with selected model">🖼 Generate</button>
          <button class="btn btn-secondary" onclick="generateMultiImage()" title="Generate with multiple models and compare">⚡ Compare Models</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
          <label style="font-size:11px;font-weight:600;color:var(--fg-muted);align-self:center;">Single model:</label>
          <select class="select" style="width:220px;" id="gen-model" title="Image model">
            <optgroup label="Free">
              <option value="auto">Auto (Flux Schnell)</option>
              <option value="gemini-image">Gemini 3.1 Flash Image</option>
              <option value="gemini-image-pro">Gemini 3 Pro Image</option>
              <option value="gemini-2.5-image">Gemini 2.5 Flash Image</option>
              <option value="pollinations">Pollinations Flux (always free)</option>
            </optgroup>
            <optgroup label="Paid">
              <option value="grok-2-image">Grok-2 Image ($0.07)</option>
              <option value="flux-dev">Flux Dev ($0.025)</option>
              <option value="flux-pro">Flux Pro ($0.05)</option>
              <option value="recraft-v3">Recraft V3 ($0.04)</option>
            </optgroup>
          </select>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;">
          <label style="font-size:11px;font-weight:600;color:var(--fg-muted);">Compare models:</label>
          <label style="font-size:11px;cursor:pointer;"><input type="checkbox" class="multi-model-check" value="gemini-image" checked> Gemini Flash (free)</label>
          <label style="font-size:11px;cursor:pointer;"><input type="checkbox" class="multi-model-check" value="gemini-image-pro" checked> Gemini Pro (free)</label>
          <label style="font-size:11px;cursor:pointer;"><input type="checkbox" class="multi-model-check" value="pollinations" checked> Pollinations (free)</label>
          <label style="font-size:11px;cursor:pointer;"><input type="checkbox" class="multi-model-check" value="auto"> Flux Schnell (paid)</label>
          <label style="font-size:11px;cursor:pointer;"><input type="checkbox" class="multi-model-check" value="grok-2-image"> Grok-2 (paid)</label>
        </div>
        <div id="gen-result" style="margin-top:12px;"></div>
        <div id="multi-gen-result" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:12px;"></div>
      </div>

      <!-- Saved assets -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div style="font-size:13px;font-weight:600;">Saved Assets <span id="asset-count" style="color:var(--fg-muted);font-weight:400;font-size:12px;"></span></div>
        <input class="input" style="width:200px;" type="text" placeholder="Search assets…" oninput="filterAssets(this.value)">
      </div>
      <div class="assets-grid" id="assets-grid">
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--fg-muted);font-size:13px;">No saved assets yet. Generate images or save from Canvas.</div>
      </div>
    </div>
  </div>
</div>
<script src="/shared/prism.js"></script>
<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var allAssets = [];

function loadAssets() {
  try { allAssets = JSON.parse(localStorage.getItem('prism-canvas-assets') || '[]'); } catch(e) { allAssets = []; }
  renderAssets(allAssets);
}

function renderAssets(assets) {
  var grid = document.getElementById('assets-grid');
  var count = document.getElementById('asset-count');
  if (count) count.textContent = '(' + assets.length + ')';
  if (!grid) return;
  grid.innerHTML = '';
  if (assets.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--fg-muted);font-size:13px;">No saved assets yet. Generate images or save from Canvas.</div>';
    return;
  }
  for (var i = 0; i < assets.length; i++) {
    (function(asset) {
      var card = document.createElement('div');
      card.className = 'asset-thumb';
      var img = document.createElement('img');
      img.src = asset.dataUrl || asset.url || '';
      img.alt = asset.id;
      img.loading = 'lazy';
      var info = document.createElement('div');
      info.className = 'asset-thumb-info';
      var name = document.createElement('div');
      name.className = 'asset-thumb-name';
      name.textContent = asset.prompt || asset.id || 'Asset';
      var meta = document.createElement('div');
      meta.className = 'asset-thumb-meta';
      meta.textContent = (asset.size || '') + (asset.created ? ' · ' + new Date(asset.created).toLocaleDateString('en-GB') : '');
      info.appendChild(name); info.appendChild(meta);
      var actions = document.createElement('div');
      actions.className = 'asset-thumb-actions';
      var dlBtn = document.createElement('a');
      dlBtn.className = 'btn btn-sm btn-ghost';
      dlBtn.textContent = '⬇';
      dlBtn.title = 'Download';
      dlBtn.href = asset.dataUrl || asset.url || '#';
      dlBtn.download = (asset.id || 'asset') + '.png';
      var delBtn = document.createElement('button');
      delBtn.className = 'btn btn-sm btn-ghost';
      delBtn.textContent = '🗑';
      delBtn.title = 'Delete';
      delBtn.onclick = function() { allAssets = allAssets.filter(function(a){return a.id!==asset.id;}); try{localStorage.setItem('prism-canvas-assets',JSON.stringify(allAssets));}catch(e){} renderAssets(allAssets); };
      actions.appendChild(dlBtn); actions.appendChild(delBtn);
      card.appendChild(img); card.appendChild(info); card.appendChild(actions);
      grid.appendChild(card);
    })(assets[i]);
  }
}

function filterAssets(q) {
  if (!q) { renderAssets(allAssets); return; }
  var filtered = allAssets.filter(function(a) { return (a.prompt||a.id||'').toLowerCase().indexOf(q.toLowerCase()) >= 0; });
  renderAssets(filtered);
}

function generateImage() {
  var prompt = document.getElementById('gen-prompt').value.trim();
  if (!prompt) { alert('Enter a prompt first.'); return; }
  var model = document.getElementById('gen-model').value;
  var result = document.getElementById('gen-result');
  if (result) result.innerHTML = '<div style="font-size:12px;color:var(--fg-muted);">Generating...</div>';

  fetch(WORKER + '/api/image', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({prompt: prompt, model: model})
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (!result) return;
    if (d.url) {
      var img = document.createElement('img');
      img.src = d.url;
      img.style.cssText = 'max-width:100%;max-height:400px;border-radius:8px;border:1px solid var(--border);display:block;margin-bottom:8px;';
      img.alt = prompt;
      var meta = document.createElement('div');
      meta.style.cssText = 'font-size:11px;color:var(--fg-muted);margin-bottom:8px;';
      meta.textContent = 'Generated by ' + (d.provider || 'AI') + ' · ' + (d.model || model);
      var actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:8px;';
      var saveBtn = document.createElement('button');
      saveBtn.className = 'btn btn-sm btn-primary';
      saveBtn.textContent = '💾 Save to Assets';
      saveBtn.onclick = function() {
        var assets2 = JSON.parse(localStorage.getItem('prism-assets') || '[]');
        assets2.unshift({id: 'img-' + Date.now(), url: d.url, prompt: prompt, model: d.model || model, created: new Date().toISOString(), type: 'image'});
        localStorage.setItem('prism-assets', JSON.stringify(assets2.slice(0, 200)));
        loadAssets();
        Toast.success('Saved to Assets');
      };
      var dlBtn = document.createElement('a');
      dlBtn.href = d.url;
      dlBtn.download = 'ai-image.png';
      dlBtn.className = 'btn btn-sm btn-secondary';
      dlBtn.textContent = '⬇ Download';
      actions.appendChild(saveBtn);
      actions.appendChild(dlBtn);
      result.innerHTML = '';
      result.appendChild(img);
      result.appendChild(meta);
      result.appendChild(actions);
    } else {
      result.innerHTML = '<div style="color:#dc2626;font-size:12px;">Error: ' + (d.error || 'Generation failed') + '</div>';
    }
  })
  .catch(function(e) {
    if (result) result.innerHTML = '<div style="color:#dc2626;font-size:12px;">Error: ' + e.message + '</div>';
  });
}

function clearAssets() {
  if (!confirm('Clear all saved assets? This cannot be undone.')) return;
  allAssets = [];
  try { localStorage.removeItem('prism-canvas-assets'); } catch(e) {}
  renderAssets([]);
}

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount) { var sb = buildSidebar('/creator/assets/'); mount.parentNode.insertBefore(sb, mount); mount.parentNode.removeChild(mount); }
  loadAssets();
});

function generateMultiImage() {
  var prompt = document.getElementById('gen-prompt').value.trim();
  if (!prompt) { alert('Enter a prompt first.'); return; }
  var checks = document.querySelectorAll('.multi-model-check:checked');
  var models = Array.from(checks).map(function(c){return c.value;});
  if (!models.length) { alert('Select at least one model to compare.'); return; }
  var result = document.getElementById('multi-gen-result');
  if (result) result.innerHTML = '<div style="font-size:12px;color:var(--fg-muted);">Generating with ' + models.length + ' models in parallel...</div>';

  fetch(WORKER + '/api/image/multi', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({prompt: prompt, models: models})
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (!result) return;
    result.innerHTML = '';
    (d.results || []).forEach(function(r2) {
      var card = document.createElement('div');
      card.style.cssText = 'border:1px solid var(--border);border-radius:8px;overflow:hidden;width:220px;flex-shrink:0;';
      var label = document.createElement('div');
      label.style.cssText = 'padding:6px 8px;font-size:10px;font-weight:600;background:var(--bg-sunken);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;';
      label.innerHTML = '<span>' + r2.model + '</span><span style="color:var(--fg-muted);">' + (r2.provider||'') + '</span>';
      card.appendChild(label);
      if (r2.url) {
        var img = document.createElement('img');
        img.src = r2.url;
        img.style.cssText = 'width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:pointer;';
        img.title = 'Click to save';
        img.onclick = function() {
          var assets2 = JSON.parse(localStorage.getItem('prism-assets')||'[]');
          assets2.unshift({id:'img-'+Date.now(),url:r2.url,prompt:prompt,model:r2.model,created:new Date().toISOString(),type:'image'});
          localStorage.setItem('prism-assets',JSON.stringify(assets2.slice(0,200)));
          loadAssets();
          Toast.success('Saved: ' + r2.model);
        };
        card.appendChild(img);
        var dl = document.createElement('a');
        dl.href = r2.url;
        dl.download = 'ai-' + r2.model + '.png';
        dl.style.cssText = 'display:block;text-align:center;padding:4px;font-size:10px;color:var(--accent);border-top:1px solid var(--border);';
        dl.textContent = '⬇ Download';
        card.appendChild(dl);
      } else {
        var err = document.createElement('div');
        err.style.cssText = 'padding:20px;font-size:11px;color:#dc2626;text-align:center;';
        err.textContent = r2.error || 'Failed';
        card.appendChild(err);
      }
      result.appendChild(card);
    });
  })
  .catch(function(e) {
    if (result) result.innerHTML = '<div style="color:#dc2626;font-size:12px;">Error: ' + e.message + '</div>';
  });
}
</script>
</body>
</html>
