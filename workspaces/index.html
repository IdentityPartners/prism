<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspaces — Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.ws-shell { display:flex; height:100vh; overflow:hidden; }
.ws-list-panel { width:280px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--bg-surface); overflow:hidden; }
.ws-detail-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

/* List panel */
.ws-list-hdr { padding:12px 14px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.ws-list-hdr h3 { font-size:13px; font-weight:600; margin:0; }
.ws-list-body { flex:1; overflow-y:auto; padding:8px; }
.ws-card { padding:10px 12px; border:1px solid var(--border); border-radius:8px; cursor:pointer; margin-bottom:6px; transition:all 0.15s; background:var(--bg-elevated); }
.ws-card:hover { border-color:var(--accent); }
.ws-card.active { border-color:var(--accent); background:var(--accent-light,#e8f0f8); }
.ws-card-hdr { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.ws-icon { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.ws-name { font-size:13px; font-weight:600; color:var(--fg); }
.ws-desc { font-size:11px; color:var(--fg-muted); }
.ws-meta { font-size:10px; color:var(--fg-muted); margin-top:4px; display:flex; gap:10px; }

/* Detail panel */
.ws-detail-hdr { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; background:var(--bg-elevated); flex-shrink:0; }
.ws-detail-icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.ws-detail-name { font-size:16px; font-weight:700; }
.ws-detail-desc { font-size:12px; color:var(--fg-muted); }
.ws-detail-actions { margin-left:auto; display:flex; gap:6px; }

/* Tabs */
.ws-tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg-elevated); flex-shrink:0; }
.ws-tab { padding:8px 16px; font-size:12px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; color:var(--fg-muted); }
.ws-tab.active { border-bottom-color:var(--accent); color:var(--accent); }
.ws-tab-body { flex:1; overflow-y:auto; padding:16px; }

/* Documents */
.doc-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; background:var(--bg-elevated); }
.doc-icon { font-size:20px; flex-shrink:0; }
.doc-info { flex:1; min-width:0; }
.doc-name { font-size:13px; font-weight:500; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.doc-meta { font-size:10px; color:var(--fg-muted); margin-top:2px; }
.doc-actions { display:flex; gap:4px; flex-shrink:0; }
.doc-btn { padding:4px 10px; font-size:11px; border:1px solid var(--border); border-radius:5px; cursor:pointer; background:var(--bg); color:var(--fg); font-family:inherit; }
.doc-btn:hover { border-color:var(--accent); color:var(--accent); }
.doc-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }

/* Notes */
.note-item { padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; background:var(--bg-elevated); cursor:pointer; }
.note-item:hover { border-color:var(--accent); }
.note-title { font-size:13px; font-weight:500; margin-bottom:3px; }
.note-preview { font-size:11px; color:var(--fg-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.note-meta { font-size:10px; color:var(--fg-muted); margin-top:4px; }

/* WIP */
.wip-item { padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; background:var(--bg-elevated); }
.wip-name { font-size:13px; font-weight:500; margin-bottom:4px; }
.wip-bar { height:5px; background:var(--border); border-radius:3px; overflow:hidden; margin-bottom:4px; }
.wip-fill { height:100%; background:var(--accent); border-radius:3px; transition:width 0.5s; }
.wip-meta { font-size:10px; color:var(--fg-muted); display:flex; justify-content:space-between; }

/* Upload zone */
.upload-zone { border:2px dashed var(--border); border-radius:10px; padding:30px; text-align:center; cursor:pointer; transition:all 0.15s; }
.upload-zone:hover { border-color:var(--accent); background:var(--accent-light,#e8f0f8); }
.upload-zone.drag { border-color:var(--accent); background:var(--accent-light,#e8f0f8); }

/* Empty state */
.empty-state { text-align:center; padding:40px 20px; color:var(--fg-muted); }
.empty-state .icon { font-size:40px; margin-bottom:12px; }
.empty-state p { font-size:13px; }

/* Note editor */
.note-editor-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:9000; display:flex; align-items:center; justify-content:center; }
.note-editor { background:var(--bg-elevated); border-radius:12px; width:600px; max-height:80vh; display:flex; flex-direction:column; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
.note-editor-hdr { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.note-editor-title { flex:1; padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; font-weight:600; background:var(--bg); color:var(--fg); }
.note-editor-body { flex:1; overflow:hidden; }
.note-editor-ta { width:100%; height:100%; min-height:300px; padding:14px 16px; border:none; font-size:14px; font-family:inherit; resize:none; background:var(--bg); color:var(--fg); line-height:1.7; box-sizing:border-box; }
.note-editor-ta:focus { outline:none; }
.note-editor-footer { padding:10px 16px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="ws-shell">

<!-- List panel -->
<div class="ws-list-panel">
  <div class="ws-list-hdr">
    <h3>📁 Workspaces</h3>
    <button class="doc-btn primary" onclick="createWorkspace()" style="font-size:11px;padding:4px 10px;">+ New</button>
  </div>
  <div class="ws-list-body" id="ws-list">
    <div style="padding:20px;text-align:center;font-size:12px;color:var(--fg-muted);">Loading...</div>
  </div>
</div>

<!-- Detail panel -->
<div class="ws-detail-panel" id="ws-detail">
  <div class="empty-state" style="margin:auto;">
    <div class="icon">📁</div>
    <p>Select a workspace to view its contents.</p>
  </div>
</div>

</div>
</div>

<!-- Note editor modal -->
<div class="note-editor-overlay" id="note-editor-overlay" style="display:none;">
  <div class="note-editor">
    <div class="note-editor-hdr">
      <input class="note-editor-title" id="note-title" type="text" placeholder="Note title...">
      <button class="doc-btn" onclick="closeNoteEditor()">✕</button>
    </div>
    <div class="note-editor-body">
      <textarea class="note-editor-ta" id="note-body" placeholder="Write your note..."></textarea>
    </div>
    <div class="note-editor-footer">
      <button class="doc-btn" onclick="closeNoteEditor()">Cancel</button>
      <button class="doc-btn primary" onclick="saveNote()">Save Note</button>
    </div>
  </div>
</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var workspaces = [];
var currentWS = null;
var currentTab = 'documents';
var editingNoteId = null;

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/workspaces/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  loadWorkspaces();
});

// ── Load workspaces ───────────────────────────────────────────────────────────
function loadWorkspaces() {
  fetch(WORKER + '/api/workspaces')
    .then(function(r){return r.json();})
    .then(function(d){
      workspaces = d.workspaces || [];
      renderList();
      // Auto-open first workspace
      if (workspaces.length > 0) openWorkspace(workspaces[0].id);
    })
    .catch(function(e){
      document.getElementById('ws-list').innerHTML = '<div style="padding:12px;font-size:12px;color:var(--fg-muted);">Error: ' + e.message + '</div>';
    });
}

function renderList() {
  var list = document.getElementById('ws-list');
  if (!workspaces.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📁</div><p>No workspaces yet.</p></div>';
    return;
  }
  list.innerHTML = workspaces.map(function(ws) {
    var active = currentWS && currentWS.id === ws.id ? ' active' : '';
    return '<div class="ws-card' + active + '" id="wsc-' + ws.id + '" onclick="openWorkspace(\'' + ws.id + '\')">' +
      '<div class="ws-card-hdr">' +
        '<div class="ws-icon" style="background:' + (ws.colour||'#2d6a9f') + '22;">' + (ws.icon||'📁') + '</div>' +
        '<div><div class="ws-name">' + (ws.name||'Workspace').replace(/</g,'&lt;') + '</div>' +
        '<div class="ws-desc">' + (ws.desc||'').replace(/</g,'&lt;') + '</div></div>' +
      '</div>' +
      '<div class="ws-meta"><span>' + (ws.docCount||0) + ' docs</span><span>' + (ws.noteCount||0) + ' notes</span></div>' +
      '</div>';
  }).join('');
}

// ── Open workspace ────────────────────────────────────────────────────────────
function openWorkspace(id) {
  fetch(WORKER + '/api/workspaces/' + id)
    .then(function(r){return r.json();})
    .then(function(ws){
      currentWS = ws;
      document.querySelectorAll('.ws-card').forEach(function(el){el.classList.remove('active');});
      var card = document.getElementById('wsc-' + id);
      if (card) card.classList.add('active');
      renderDetail();
    });
}

function renderDetail() {
  if (!currentWS) return;
  var detail = document.getElementById('ws-detail');
  detail.innerHTML = '';

  // Header
  var hdr = document.createElement('div');
  hdr.className = 'ws-detail-hdr';
  hdr.innerHTML = '<div class="ws-detail-icon" style="background:' + (currentWS.colour||'#2d6a9f') + '22;">' + (currentWS.icon||'📁') + '</div>' +
    '<div><div class="ws-detail-name">' + (currentWS.name||'Workspace').replace(/</g,'&lt;') + '</div>' +
    '<div class="ws-detail-desc">' + (currentWS.desc||'').replace(/</g,'&lt;') + '</div></div>' +
    '<div class="ws-detail-actions">' +
      '<button class="doc-btn" onclick="editWorkspace()">✏ Edit</button>' +
      '<button class="doc-btn" onclick="deleteWorkspace()" style="color:#dc2626;">🗑 Delete</button>' +
    '</div>';
  detail.appendChild(hdr);

  // Tabs
  var tabs = document.createElement('div');
  tabs.className = 'ws-tabs';
  [['documents','📄 Documents'],['notes','📝 Notes'],['wip','⏳ WIP / Spool']].forEach(function(t) {
    var tab = document.createElement('div');
    tab.className = 'ws-tab' + (currentTab === t[0] ? ' active' : '');
    tab.textContent = t[1];
    tab.onclick = function() { currentTab = t[0]; renderDetail(); };
    tabs.appendChild(tab);
  });
  detail.appendChild(tabs);

  // Tab body
  var body = document.createElement('div');
  body.className = 'ws-tab-body';

  if (currentTab === 'documents') renderDocuments(body);
  else if (currentTab === 'notes') renderNotes(body);
  else if (currentTab === 'wip') renderWIP(body);

  detail.appendChild(body);
}

// ── Documents ─────────────────────────────────────────────────────────────────
function renderDocuments(body) {
  var docs = currentWS.documents || [];

  // Upload zone
  var zone = document.createElement('div');
  zone.className = 'upload-zone';
  zone.innerHTML = '<div style="font-size:32px;margin-bottom:8px;">📎</div><div style="font-size:14px;font-weight:600;margin-bottom:4px;">Drop files here or click to upload</div><div style="font-size:12px;color:var(--fg-muted);">.md .txt .pdf .csv .json .docx — large files are chunked for analysis</div>';
  zone.onclick = function() { document.getElementById('doc-file-input').click(); };
  zone.ondragover = function(e) { e.preventDefault(); zone.classList.add('drag'); };
  zone.ondragleave = function() { zone.classList.remove('drag'); };
  zone.ondrop = function(e) { e.preventDefault(); zone.classList.remove('drag'); handleDocFiles(e.dataTransfer.files); };
  body.appendChild(zone);

  var fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.id = 'doc-file-input'; fileInput.multiple = true;
  fileInput.accept = '.md,.txt,.pdf,.csv,.json,.docx,.png,.jpg';
  fileInput.style.display = 'none';
  fileInput.onchange = function() { handleDocFiles(this.files); };
  body.appendChild(fileInput);

  if (!docs.length) {
    var empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<div class="icon">📄</div><p>No documents yet. Upload one above.</p>';
    body.appendChild(empty);
    return;
  }

  docs.forEach(function(doc) {
    var item = document.createElement('div');
    item.className = 'doc-item';
    var ext = (doc.name||'').split('.').pop().toLowerCase();
    var icons = {md:'📝',txt:'📄',pdf:'📕',csv:'📊',json:'🔧',docx:'📘',png:'🖼',jpg:'🖼'};
    item.innerHTML = '<div class="doc-icon">' + (icons[ext]||'📄') + '</div>' +
      '<div class="doc-info"><div class="doc-name">' + (doc.name||'').replace(/</g,'&lt;') + '</div>' +
      '<div class="doc-meta">' + (doc.size ? Math.round(doc.size/1024) + 'KB' : '') + (doc.created ? ' · ' + new Date(doc.created).toLocaleDateString('en-GB') : '') + '</div></div>' +
      '<div class="doc-actions">' +
        '<button class="doc-btn primary" onclick="analyseDoc(\'' + doc.id + '\')">🔍 Analyse</button>' +
        '<button class="doc-btn" onclick="indexDoc(\'' + doc.id + '\')">📚 Index RAG</button>' +
        '<button class="doc-btn" onclick="deleteDoc(\'' + doc.id + '\')" style="color:#dc2626;">✕</button>' +
      '</div>';
    body.appendChild(item);
  });
}

function handleDocFiles(files) {
  Array.from(files).forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var doc = { id: 'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2,6), name: file.name, size: file.size, content: e.target.result, created: new Date().toISOString() };
      if (!currentWS.documents) currentWS.documents = [];
      currentWS.documents.push(doc);
      saveWorkspace();
      renderDetail();
    };
    reader.readAsText(file);
  });
}

function analyseDoc(docId) {
  var doc = (currentWS.documents||[]).find(function(d){return d.id===docId;});
  if (!doc || !doc.content) { alert('No content in this document.'); return; }
  var task = prompt('What do you want to analyse?', 'Extract all key facts, themes, and findings. Organise by topic.');
  if (!task) return;

  // Send to Agent Hub via jobs API
  fetch(WORKER + '/api/jobs/create', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      document: doc.content,
      document_name: doc.name,
      task: task,
      agent_name: 'Research Agent',
      workspace_id: currentWS.id
    })
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if (d.success) {
      alert('Analysis started: ' + d.total_chunks + ' chunks. Check WIP/Spool tab for progress.');
      currentTab = 'wip';
      renderDetail();
    } else {
      alert('Error: ' + (d.error||'Unknown'));
    }
  });
}

function indexDoc(docId) {
  var doc = (currentWS.documents||[]).find(function(d){return d.id===docId;});
  if (!doc || !doc.content) { alert('No content in this document.'); return; }
  if (!confirm('Index "' + doc.name + '" into RAG? This will make it searchable in all chats.')) return;

  fetch(WORKER + '/api/rag/index', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      text: doc.content,
      name: doc.name,
      doc_id: doc.id,
      workspace_id: currentWS.id,
      tags: [currentWS.name]
    })
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if (d.success) alert('Indexed: ' + d.chunks_embedded + '/' + d.chunks_total + ' chunks embedded.');
    else alert('Error: ' + (d.error||'Unknown'));
  });
}

function deleteDoc(docId) {
  if (!confirm('Delete this document?')) return;
  currentWS.documents = (currentWS.documents||[]).filter(function(d){return d.id!==docId;});
  saveWorkspace();
  renderDetail();
}

// ── Notes ─────────────────────────────────────────────────────────────────────
function renderNotes(body) {
  var notes = currentWS.notes || [];

  var addBtn = document.createElement('button');
  addBtn.className = 'doc-btn primary';
  addBtn.style.cssText = 'margin-bottom:12px;';
  addBtn.textContent = '+ New Note';
  addBtn.onclick = function() { openNoteEditor(null); };
  body.appendChild(addBtn);

  if (!notes.length) {
    var empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<div class="icon">📝</div><p>No notes yet.</p>';
    body.appendChild(empty);
    return;
  }

  notes.slice().reverse().forEach(function(note) {
    var item = document.createElement('div');
    item.className = 'note-item';
    item.onclick = function() { openNoteEditor(note); };
    item.innerHTML = '<div class="note-title">' + (note.title||'Untitled').replace(/</g,'&lt;') + '</div>' +
      '<div class="note-preview">' + (note.content||'').replace(/<[^>]+>/g,'').substring(0,100).replace(/</g,'&lt;') + '</div>' +
      '<div class="note-meta">' + (note.updated ? new Date(note.updated).toLocaleDateString('en-GB') : '') + '</div>';
    body.appendChild(item);
  });
}

function openNoteEditor(note) {
  editingNoteId = note ? note.id : null;
  document.getElementById('note-title').value = note ? (note.title||'') : '';
  document.getElementById('note-body').value = note ? (note.content||'').replace(/<br>/g,'\n').replace(/<[^>]+>/g,'') : '';
  document.getElementById('note-editor-overlay').style.display = 'flex';
  document.getElementById('note-title').focus();
}

function closeNoteEditor() {
  document.getElementById('note-editor-overlay').style.display = 'none';
  editingNoteId = null;
}

function saveNote() {
  var title = document.getElementById('note-title').value.trim() || 'Untitled';
  var content = document.getElementById('note-body').value;
  if (!currentWS.notes) currentWS.notes = [];
  if (editingNoteId) {
    var note = currentWS.notes.find(function(n){return n.id===editingNoteId;});
    if (note) { note.title = title; note.content = content; note.updated = new Date().toISOString(); }
  } else {
    currentWS.notes.push({ id: 'note-'+Date.now(), title: title, content: content, created: new Date().toISOString(), updated: new Date().toISOString() });
  }
  saveWorkspace();
  closeNoteEditor();
  renderDetail();
}

// ── WIP ───────────────────────────────────────────────────────────────────────
function renderWIP(body) {
  fetch(WORKER + '/api/jobs')
    .then(function(r){return r.json();})
    .then(function(d){
      var jobs = (d.jobs||[]).filter(function(j){return !j.workspace_id || j.workspace_id === currentWS.id;});
      if (!jobs.length) {
        body.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>No jobs in progress for this workspace.<br>Use "Analyse" on a document to start.</p></div>';
        return;
      }
      jobs.forEach(function(job) {
        var pct = job.total_chunks ? Math.round(100*(job.completed_chunks||0)/job.total_chunks) : 0;
        var sc = job.status==='complete'?'#16a34a':job.status==='error'?'#dc2626':'var(--accent)';
        var sl = job.status==='complete'?'Complete':job.status==='error'?'Error':'Processing '+( job.completed_chunks||0)+'/'+( job.total_chunks||'?');
        var item = document.createElement('div');
        item.className = 'wip-item';
        item.innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:4px;">' +
          '<div class="wip-name">' + (job.document_name||'Job').replace(/</g,'&lt;') + '</div>' +
          '<span style="font-size:10px;color:'+sc+';font-weight:600;">'+sl+'</span></div>' +
          '<div style="font-size:11px;color:var(--fg-muted);margin-bottom:6px;">' + (job.task||'').substring(0,80).replace(/</g,'&lt;') + '</div>' +
          '<div class="wip-bar"><div class="wip-fill" style="width:'+pct+'%;background:'+sc+';"></div></div>' +
          '<div class="wip-meta"><span>'+pct+'%</span>' +
          (job.status==='complete'?'<button class="doc-btn" onclick="viewResult(\''+job.id+'\')">View Result</button>':'') +
          '</div>';
        body.appendChild(item);
      });
    })
    .catch(function(){
      body.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>Could not load jobs.</p></div>';
    });
}

function viewResult(jobId) {
  fetch(WORKER + '/api/jobs/' + jobId)
    .then(function(r){return r.json();})
    .then(function(job){
      if (job.synthesis) {
        // Save as a note
        if (!currentWS.notes) currentWS.notes = [];
        currentWS.notes.push({
          id: 'note-'+Date.now(),
          title: 'Analysis: ' + (job.document_name||'Document'),
          content: job.synthesis,
          created: new Date().toISOString(),
          updated: new Date().toISOString()
        });
        saveWorkspace();
        currentTab = 'notes';
        renderDetail();
      }
    });
}

// ── Workspace CRUD ────────────────────────────────────────────────────────────
function saveWorkspace() {
  fetch(WORKER + '/api/workspaces/' + currentWS.id, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(currentWS)
  }).catch(function(){});
  // Update local list
  var idx = workspaces.findIndex(function(w){return w.id===currentWS.id;});
  if (idx !== -1) {
    workspaces[idx] = Object.assign({}, currentWS, {
      docCount: (currentWS.documents||[]).length,
      noteCount: (currentWS.notes||[]).length
    });
    renderList();
  }
}

function createWorkspace() {
  var name = prompt('Workspace name:');
  if (!name) return;
  var icons = ['📁','📚','💼','🔬','✍','🎨','📊','🌍'];
  var icon = icons[Math.floor(Math.random()*icons.length)];
  var colours = ['#2d6a9f','#0f3b3a','#5c2d3f','#16a34a','#dc2626','#f59e0b'];
  var colour = colours[Math.floor(Math.random()*colours.length)];
  fetch(WORKER + '/api/workspaces', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name:name,icon:icon,colour:colour,desc:'',documents:[],notes:[]})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if (d.success) {
      loadWorkspaces();
    }
  });
}

function editWorkspace() {
  var name = prompt('Workspace name:', currentWS.name);
  if (!name) return;
  var desc = prompt('Description:', currentWS.desc||'');
  currentWS.name = name;
  currentWS.desc = desc;
  saveWorkspace();
  renderDetail();
}

function deleteWorkspace() {
  if (!confirm('Delete workspace "' + currentWS.name + '"? This cannot be undone.')) return;
  fetch(WORKER + '/api/workspaces/' + currentWS.id, {method:'DELETE'}).catch(function(){});
  workspaces = workspaces.filter(function(w){return w.id!==currentWS.id;});
  currentWS = null;
  renderList();
  document.getElementById('ws-detail').innerHTML = '<div class="empty-state" style="margin:auto;"><div class="icon">📁</div><p>Select a workspace.</p></div>';
}
</script>
</body>
</html>
