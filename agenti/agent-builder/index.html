<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Builder — Prism</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
</head>
<body>
<div class="prism-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content" id="main-content">
    <div class="topbar"><div class="topbar-title">Agent Builder</div><div class="topbar-actions"><button class="btn btn-sm btn-primary" onclick="saveAgent()" title="Save agent">Save Agent</button></div></div>
    <div class="page-content">
      <div class="grid-2" style="gap:20px;align-items:start;">
        <div class="card">
          <div class="card-header"><span class="card-title">New Agent</span></div>
          <div class="form-group"><label class="form-label">Agent Name *</label><input class="input" id="agent-name" type="text" placeholder="e.g. Research Assistant"></div>
          <div class="form-group"><label class="form-label">Description</label><input class="input" id="agent-desc" type="text" placeholder="What does this agent do?"></div>
          <div class="form-group"><label class="form-label">System Prompt</label><textarea class="textarea textarea-lg" id="agent-prompt" placeholder="You are a specialist in…"></textarea></div>
          <div class="form-group"><label class="form-label">Routing Profile</label>
            <select class="select" id="agent-profile" title="Routing profile">
              <option value="balanced">⚖ Balanced</option>
              <option value="free">🆓 Free</option>
              <option value="frontier">💎 Full Frontier</option>
              <option value="fast">⚡ Fast</option>
              <option value="reasoning">🧠 Reasoning</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="saveAgent()" title="Save this agent">Save Agent</button>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Saved Agents</span></div>
          <div id="agents-list"></div>
        </div>
      </div></div>
  </div>
</div>
<script src="/shared/prism.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount) { var sb = buildSidebar('/agenti/agent-builder/'); mount.parentNode.insertBefore(sb, mount); mount.parentNode.removeChild(mount); }
  loadAgents();
});

var WORKER = 'https://prism-api.identitypartners.workers.dev';
var agents = [];
function loadAgents() { try { agents = JSON.parse(localStorage.getItem('prism-agents') || '[]'); } catch(e) { agents = []; } renderAgents(); }
function saveAgents() { try { localStorage.setItem('prism-agents', JSON.stringify(agents)); } catch(e) {} }
function saveAgent() {
  var name = document.getElementById('agent-name').value.trim();
  if (!name) { Toast.warning('Enter an agent name'); return; }
  var agent = {id:'agent-'+Date.now(), name:name, description:document.getElementById('agent-desc').value, systemPrompt:document.getElementById('agent-prompt').value, profile:document.getElementById('agent-profile').value, created:new Date().toISOString()};
  agents.push(agent); saveAgents(); renderAgents(); Toast.success('Agent saved: ' + name);
}
function renderAgents() {
  var list = document.getElementById('agents-list');
  if (!list) return;
  list.innerHTML = '';
  if (agents.length === 0) { list.innerHTML = '<div style="font-size:12.5px;color:var(--fg-muted);">No agents yet. Create your first agent.</div>'; return; }
  for (var i = 0; i < agents.length; i++) {
    (function(agent) {
      var el = document.createElement('div');
      el.style.cssText = 'padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;';
      var name = document.createElement('div');
      name.style.cssText = 'font-weight:600;font-size:13px;margin-bottom:3px;';
      name.textContent = agent.name;
      var desc = document.createElement('div');
      desc.style.cssText = 'font-size:11.5px;color:var(--fg-muted);';
      desc.textContent = agent.description || agent.profile;
      var delBtn = document.createElement('button');
      delBtn.className = 'btn btn-ghost btn-sm';
      delBtn.textContent = '🗑';
      delBtn.title = 'Delete agent';
      delBtn.onclick = function() { agents = agents.filter(function(a){return a.id!==agent.id;}); saveAgents(); renderAgents(); };
      el.appendChild(name); el.appendChild(desc); el.appendChild(delBtn);
      list.appendChild(el);
    })(agents[i]);
  }
}

</script>
</body>
</html>
