<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3b3a'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Hub — Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.hub-shell { display:flex; height:100vh; overflow:hidden; }
.hub-agents { width:260px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--bg-surface); overflow:hidden; }
.hub-workspace { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.hub-right { width:260px; flex-shrink:0; border-left:1px solid var(--border); display:flex; flex-direction:column; background:var(--bg-surface); overflow-y:auto; }
@media(max-width:1100px){.hub-right{display:none;}}

/* Agent list */
.agent-list-hdr { padding:10px 12px 8px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.agent-list-hdr h3 { font-size:13px; font-weight:600; margin:0; }
.agent-list-body { flex:1; overflow-y:auto; padding:6px; }
.agent-card { padding:10px 12px; border:1px solid var(--border); border-radius:8px; cursor:pointer; margin-bottom:5px; transition:all 0.15s; background:var(--bg-elevated); }
.agent-card:hover { border-color:var(--accent); }
.agent-card.active { border-color:var(--accent); background:var(--accent-light,#e8f0f8); }
.agent-card-name { font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; }
.agent-card-desc { font-size:11px; color:var(--fg-muted); margin-top:2px; }
.agent-card-status { display:flex; align-items:center; gap:4px; margin-top:4px; font-size:10px; color:var(--fg-muted); }
.status-dot { width:6px; height:6px; border-radius:50%; background:#9ca3af; }
.status-dot.running { background:#f59e0b; animation:pulse 1s infinite; }
.status-dot.done { background:#16a34a; }
.status-dot.error { background:#dc2626; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

/* Workspace */
.hub-ws-hdr { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; background:var(--bg-elevated); flex-shrink:0; }
.agent-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#0f3b3a,#5c2d3f); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.hub-ws-name { font-size:14px; font-weight:600; }
.hub-ws-status { font-size:11px; color:var(--fg-muted); }
.hub-ws-actions { margin-left:auto; display:flex; gap:6px; }

/* Output tabs */
.hub-tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg-elevated); flex-shrink:0; }
.hub-tab { padding:7px 14px; font-size:11px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; color:var(--fg-muted); }
.hub-tab.active { border-bottom-color:var(--accent); color:var(--accent); }

/* Chat */
.hub-chat { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
.hub-msg { display:flex; gap:8px; align-items:flex-start; }
.hub-msg.user { flex-direction:row-reverse; }
.hub-bubble { max-width:85%; padding:8px 12px; border-radius:10px; font-size:13px; line-height:1.5; }
.hub-msg.agent .hub-bubble { background:var(--bg-elevated); border:1px solid var(--border); color:var(--fg); border-radius:4px 10px 10px 10px; }
.hub-msg.user .hub-bubble { background:var(--accent); color:#fff; border-radius:10px 4px 10px 10px; }
.hub-msg.system .hub-bubble { background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); color:var(--fg); font-size:11px; font-style:italic; }
.hub-msg-avatar { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; background:linear-gradient(135deg,#0f3b3a,#5c2d3f); color:#fff; }
.hub-msg.user .hub-msg-avatar { background:var(--accent); }

/* WIP panel */
.wip-panel { padding:10px 14px; }
.wip-job { padding:10px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--bg-elevated); }
.wip-job-name { font-size:12.5px; font-weight:600; margin-bottom:4px; display:flex; justify-content:space-between; }
.wip-job-task { font-size:11px; color:var(--fg-muted); margin-bottom:6px; }
.wip-bar { height:5px; background:var(--border); border-radius:3px; overflow:hidden; margin-bottom:4px; }
.wip-fill { height:100%; border-radius:3px; transition:width 0.5s; }
.wip-meta { font-size:10px; color:var(--fg-muted); display:flex; justify-content:space-between; align-items:center; }

/* Input */
.hub-input-area { border-top:1px solid var(--border); padding:10px 12px; background:var(--bg-elevated); flex-shrink:0; }
.hub-attach-strip { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
.hub-attach-badge { display:flex; align-items:center; gap:4px; padding:2px 8px; background:var(--accent-light,#e8f0f8); border:1px solid var(--accent); border-radius:10px; font-size:11px; color:var(--accent); }
.hub-attach-badge button { background:none; border:none; cursor:pointer; color:var(--accent); font-size:11px; padding:0; }
.hub-input-row { display:flex; gap:6px; align-items:flex-end; }
.hub-textarea { flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; resize:none; min-height:40px; max-height:120px; background:var(--bg); color:var(--fg); }
.hub-send { padding:8px 14px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px; }
.hub-quick-btns { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
.hub-quick { padding:3px 9px; border:1px solid var(--border); border-radius:8px; font-size:11px; cursor:pointer; background:var(--bg); color:var(--fg-muted); font-family:inherit; }
.hub-quick:hover { border-color:var(--accent); color:var(--accent); }

/* Right panel */
.right-sec { padding:10px 12px; border-bottom:1px solid var(--border); }
.right-sec h4 { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--fg-muted); margin:0 0 8px; }
.output-item { padding:8px 10px; border:1px solid var(--border); border-radius:6px; margin-bottom:5px; font-size:11.5px; }
.output-item-hdr { font-size:10px; color:var(--fg-muted); margin-bottom:3px; display:flex; justify-content:space-between; }

/* Create agent modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:9999; display:none; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal-box { background:var(--bg-elevated); border-radius:12px; padding:20px; width:480px; max-height:80vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
.modal-box h3 { margin:0 0 14px; font-size:15px; }
.form-row { margin-bottom:10px; }
.form-label { font-size:11px; font-weight:600; color:var(--fg-muted); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:0.4px; }
.form-input, .form-select, .form-textarea { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; background:var(--bg); color:var(--fg); box-sizing:border-box; }
.form-textarea { min-height:70px; resize:vertical; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="hub-shell">

<!-- Agent list -->
<div class="hub-agents">
  <div class="agent-list-hdr">
    <h3>🤖 Agents</h3>
    <button onclick="openCreateModal()" style="padding:3px 9px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;">+ New</button>
  </div>
  <div class="agent-list-body" id="agent-list"></div>
</div>

<!-- Workspace -->
<div class="hub-workspace">
  <div class="hub-ws-hdr">
    <div class="agent-avatar" id="active-avatar">🤖</div>
    <div>
      <div class="hub-ws-name" id="active-name">Select an agent</div>
      <div class="hub-ws-status" id="active-status">idle</div>
    </div>
    <div class="hub-ws-actions">
      <button onclick="clearChat()" style="padding:4px 10px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:11px;background:var(--bg);color:var(--fg);">Clear</button>
      <button id="run-btn" onclick="runAgent()" disabled style="padding:4px 12px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;opacity:0.5;">▶ Run</button>
    </div>
  </div>

  <div class="hub-tabs">
    <div class="hub-tab active" onclick="switchTab('chat',this)">Chat</div>
    <div class="hub-tab" onclick="switchTab('wip',this)" id="wip-tab-btn">WIP / Spool</div>
    <div class="hub-tab" onclick="switchTab('output',this)">Output</div>
  </div>

  <div id="tab-chat" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div class="hub-chat" id="hub-chat">
      <div style="text-align:center;padding:30px;color:var(--fg-muted);font-size:13px;">Select an agent from the left, then describe your task.</div>
    </div>
    <div class="hub-input-area">
      <div class="hub-attach-strip" id="hub-attach-strip"></div>
      <div class="hub-input-row">
        <input type="file" id="hub-file-input" multiple accept=".md,.txt,.pdf,.csv,.json,.docx" style="display:none" onchange="handleHubFiles(this)">
        <textarea class="hub-textarea" id="hub-input" placeholder="Describe the task for this agent..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendTask();}"></textarea>
        <button class="hub-send" onclick="sendTask()">Send</button>
      </div>
      <div class="hub-quick-btns">
        <button class="hub-quick" onclick="document.getElementById('hub-file-input').click()">📎 Attach doc</button>
        <button class="hub-quick" onclick="setQuickTask('Check status and report.')">Check status</button>
        <button class="hub-quick" onclick="setQuickTask('Generate a summary report.')">Summary</button>
        <button class="hub-quick" onclick="setQuickTask('What tasks are pending?')">Pending tasks</button>
      </div>
    </div>
  </div>

  <div id="tab-wip" style="flex:1;overflow-y:auto;display:none;">
    <div class="wip-panel" id="wip-panel">
      <div style="font-size:12px;color:var(--fg-muted);padding:8px 0;">No jobs in progress.</div>
    </div>
  </div>

  <div id="tab-output" style="flex:1;overflow-y:auto;padding:12px;display:none;">
    <div id="output-list" style="font-size:12px;color:var(--fg-muted);">No output yet.</div>
  </div>
</div>

<!-- Right panel -->
<div class="hub-right">
  <div class="right-sec">
    <h4>Active Agent</h4>
    <div id="agent-info" style="font-size:12px;color:var(--fg-muted);">None selected</div>
  </div>
  <div class="right-sec">
    <h4>Recent Output</h4>
    <div id="recent-output" style="font-size:11.5px;color:var(--fg-muted);">—</div>
  </div>
  <div class="right-sec">
    <h4>System Status</h4>
    <div id="system-status" style="font-size:11px;color:var(--fg-muted);">Loading...</div>
  </div>
</div>

</div>
</div>

<!-- Create agent modal -->
<div class="modal-overlay" id="create-modal">
<div class="modal-box">
  <h3>Create Agent</h3>
  <div class="form-row">
    <label class="form-label">Name</label>
    <input class="form-input" id="new-name" type="text" placeholder="e.g. Research Assistant">
  </div>
  <div class="form-row">
    <label class="form-label">Avatar</label>
    <input class="form-input" id="new-avatar" type="text" placeholder="🤖" style="width:80px;">
  </div>
  <div class="form-row">
    <label class="form-label">Description</label>
    <input class="form-input" id="new-desc" type="text" placeholder="What does this agent do?">
  </div>
  <div class="form-row">
    <label class="form-label">System Prompt / Persona</label>
    <textarea class="form-textarea" id="new-prompt" placeholder="You are a research assistant for Identity Partners. Find, synthesise, and structure information. British English. No sycophancy. Cite sources."></textarea>
  </div>
  <div class="form-row">
    <label class="form-label">Routing Profile</label>
    <select class="form-select" id="new-profile">
      <option value="balanced">Balanced (default)</option>
      <option value="frontier">Frontier (best quality)</option>
      <option value="fast">Fast (low latency)</option>
    </select>
  </div>
  <div class="modal-actions">
    <button onclick="closeCreateModal()" style="padding:6px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--bg);">Cancel</button>
    <button onclick="createAgent()" style="padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;">Create Agent</button>
  </div>
</div>
</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';

var BUILTIN_AGENTS = [
  {id:'orchestrator',name:'Orchestrator',avatar:'🧠',desc:'Oversees all agents, routes tasks, manages memory',profile:'balanced',builtIn:true},
  {id:'researcher',name:'Research Agent',avatar:'🔍',desc:'Finds, synthesises, and structures information',profile:'balanced',builtIn:true},
  {id:'media-manager',name:'Media Manager',avatar:'📋',desc:'Owns all content publication and scheduling',profile:'balanced',builtIn:true},
  {id:'creator',name:'Creator Agent',avatar:'✍',desc:'Creates social posts, scripts, and content',profile:'balanced',builtIn:true},
  {id:'api-champion',name:'API Champion',avatar:'⚡',desc:'Monitors model providers, updates routing chain',profile:'fast',builtIn:true},
  {id:'harms-analyst',name:'Harms Analyst',avatar:'🔬',desc:'Analyses documents to map harms and flag issues',profile:'frontier',builtIn:true},
];

var agents = [];
var activeAgent = null;
var chatHistory = [];
var hubAttachments = [];
var wipJobs = {};
var currentTab = 'chat';

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/agenti/agent-builder/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  loadAgents();
  loadSystemStatus();
  setInterval(refreshWIP, 10000);
});

// ── Agents ────────────────────────────────────────────────────────────────────
function loadAgents() {
  fetch(WORKER + '/api/agents/list')
    .then(function(r){return r.json();})
    .then(function(d){
      var custom = (d.agents||[]).filter(function(a){return !a.builtIn;});
      agents = [...BUILTIN_AGENTS, ...custom];
      renderAgentList();
    })
    .catch(function(){
      agents = [...BUILTIN_AGENTS];
      renderAgentList();
    });
}

function renderAgentList() {
  var list = document.getElementById('agent-list');
  list.innerHTML = agents.map(function(a) {
    var active = activeAgent && activeAgent.id === a.id ? ' active' : '';
    return '<div class="agent-card' + active + '" id="ac-' + a.id + '" onclick="selectAgent(\'' + a.id + '\')">' +
      '<div class="agent-card-name"><span>' + (a.avatar||'🤖') + '</span>' + a.name + (a.builtIn?'<span style="font-size:9px;color:var(--fg-muted);margin-left:auto;">built-in</span>':'') + '</div>' +
      '<div class="agent-card-desc">' + (a.desc||'').replace(/</g,'&lt;') + '</div>' +
      '<div class="agent-card-status"><span class="status-dot" id="dot-' + a.id + '"></span><span id="status-' + a.id + '">idle</span>' +
      (!a.builtIn ? '<button onclick="deleteAgent(\'' + a.id + '\',event)" style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--fg-muted);font-size:10px;">✕</button>' : '') +
      '</div></div>';
  }).join('');
}

function selectAgent(id) {
  activeAgent = agents.find(function(a){return a.id===id;});
  if (!activeAgent) return;
  document.querySelectorAll('.agent-card').forEach(function(el){el.classList.remove('active');});
  var card = document.getElementById('ac-' + id);
  if (card) card.classList.add('active');
  document.getElementById('active-avatar').textContent = activeAgent.avatar || '🤖';
  document.getElementById('active-name').textContent = activeAgent.name;
  document.getElementById('active-status').textContent = 'ready';
  document.getElementById('run-btn').disabled = false;
  document.getElementById('run-btn').style.opacity = '1';
  document.getElementById('agent-info').innerHTML = '<strong>' + activeAgent.name + '</strong><br>' + (activeAgent.desc||'');
  chatHistory = [];
  var chat = document.getElementById('hub-chat');
  chat.innerHTML = '<div class="hub-msg system"><div class="hub-bubble">' + activeAgent.name + ' is ready. Describe your task below.</div></div>';
  document.getElementById('hub-input').focus();
}

function deleteAgent(id, e) {
  e.stopPropagation();
  if (!confirm('Delete this agent?')) return;
  fetch(WORKER + '/api/agents/' + id, {method:'DELETE'}).catch(function(){});
  agents = agents.filter(function(a){return a.id!==id;});
  renderAgentList();
  if (activeAgent && activeAgent.id === id) {
    activeAgent = null;
    document.getElementById('active-name').textContent = 'Select an agent';
    document.getElementById('run-btn').disabled = true;
    document.getElementById('run-btn').style.opacity = '0.5';
  }
}

// ── Task execution ────────────────────────────────────────────────────────────
function sendTask() {
  var input = document.getElementById('hub-input');
  var task = input.value.trim();
  if (!task && !hubAttachments.length) return;
  if (!activeAgent) { alert('Select an agent first.'); return; }
  input.value = '';

  addHubMsg('user', task);

  // Check for large text documents → use chunked analysis
  var largeDoc = hubAttachments.find(function(a){return a.type==='text'&&a.size>50000;});
  if (largeDoc) {
    runDocumentAnalysis(task, largeDoc);
    return;
  }

  // Build messages
  var sysPrompt = activeAgent.systemPrompt ||
    ('You are ' + activeAgent.name + ' for Identity Partners. ' + (activeAgent.desc||'') +
     ' British English. Execute tasks completely. Never truncate. Show all your work.');

  var fileContext = '';
  hubAttachments.forEach(function(att) {
    if (att.content) fileContext += '\n\n[Attached: ' + att.name + ']\n' + att.content.substring(0,30000);
  });

  hubAttachments = [];
  updateHubAttachStrip();

  chatHistory.push({role:'user', content: task + fileContext});
  var messages = [{role:'system',content:sysPrompt}].concat(chatHistory);

  setAgentStatus(activeAgent.id, 'running');
  addHubMsg('system', activeAgent.name + ' is working...');

  fetch(WORKER + '/api/devteam', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      agent: activeAgent.id,
      agentName: activeAgent.name,
      systemPrompt: sysPrompt,
      messages: messages,
      message: task + fileContext,
      profile: activeAgent.profile || 'balanced'
    })
  })
  .then(function(r){return r.json();})
  .then(function(d){
    setAgentStatus(activeAgent.id, 'done');
    var response = d.content || 'No response.';
    chatHistory.push({role:'assistant',content:response});
    // Remove "working" message
    var chat = document.getElementById('hub-chat');
    var systemMsgs = chat.querySelectorAll('.hub-msg.system');
    if (systemMsgs.length) systemMsgs[systemMsgs.length-1].remove();
    addHubMsg('agent', response, d.provider);
    addOutput(activeAgent.name, task, response);
    document.getElementById('recent-output').textContent = response.substring(0,150) + '...';
  })
  .catch(function(e){
    setAgentStatus(activeAgent.id, 'error');
    addHubMsg('system', 'Error: ' + e.message);
  });
}

function runAgent() {
  document.getElementById('hub-input').value = 'Check status and report.';
  sendTask();
}

function setQuickTask(text) {
  document.getElementById('hub-input').value = text;
  document.getElementById('hub-input').focus();
}

// ── Document analysis (chunked) ───────────────────────────────────────────────
function runDocumentAnalysis(task, doc) {
  addHubMsg('system', 'Chunking ' + doc.name + ' (' + Math.round(doc.size/1024) + 'KB)...');
  var sysPrompt = activeAgent.systemPrompt ||
    ('You are ' + activeAgent.name + ' for Identity Partners. British English. Execute tasks completely. Never truncate.');

  fetch(WORKER + '/api/jobs/create', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      document: doc.content,
      document_name: doc.name,
      task: task,
      agent_name: activeAgent.name,
      system_prompt: sysPrompt
    })
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if (!d.success || !d.job_id) {
      addHubMsg('system', 'Error creating job: ' + (d.error||'unknown'));
      return;
    }
    var jobId = d.job_id;
    var total = d.total_chunks;
    addHubMsg('system', 'Document split into ' + total + ' chunks. Starting analysis...');
    addToWIP(jobId, doc.name, task, 0, total);
    hubAttachments = [];
    updateHubAttachStrip();
    processNextChunk(jobId, doc.name, task, 0, total);
  })
  .catch(function(e){addHubMsg('system','Job creation failed: '+e.message);});
}

function processNextChunk(jobId, docName, task, done, total) {
  updateWIP(jobId, done, total, 'running');
  fetch(WORKER + '/api/jobs/' + jobId + '/process', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chunk_index:done})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if (d.error) {
      addHubMsg('system','Chunk '+(done+1)+' error: '+d.error+'. Retrying...');
      setTimeout(function(){processNextChunk(jobId,docName,task,done,total);},3000);
      return;
    }
    if (d.status==='complete'&&d.synthesis) {
      addHubMsg('agent', d.synthesis);
      addOutput(activeAgent?activeAgent.name:'Agent', task, d.synthesis);
      updateWIP(jobId, total, total, 'complete');
      setAgentStatus(activeAgent?activeAgent.id:'agent','done');
      return;
    }
    var nextDone = d.chunk || done+1;
    if (nextDone >= total) {
      addHubMsg('system','All '+total+' sections processed. Synthesising...');
      updateWIP(jobId, total, total, 'synthesising');
    }
    setTimeout(function(){processNextChunk(jobId,docName,task,nextDone,total);},800);
  })
  .catch(function(e){
    addHubMsg('system','Network error: '+e.message+'. Retrying...');
    setTimeout(function(){processNextChunk(jobId,docName,task,done,total);},5000);
  });
}

// ── WIP ───────────────────────────────────────────────────────────────────────
function addToWIP(jobId, docName, task, done, total) {
  wipJobs[jobId] = {jobId:jobId,docName:docName,task:task,done:done,total:total,status:'running',started:new Date().toLocaleTimeString('en-GB')};
  renderWIP();
  switchTab('wip', document.getElementById('wip-tab-btn'));
}

function updateWIP(jobId, done, total, status) {
  if (wipJobs[jobId]) { wipJobs[jobId].done=done; wipJobs[jobId].total=total; wipJobs[jobId].status=status; wipJobs[jobId].updated=new Date().toLocaleTimeString('en-GB'); }
  renderWIP();
}

function renderWIP() {
  var panel = document.getElementById('wip-panel');
  var jobs = Object.values(wipJobs);
  var running = jobs.filter(function(j){return j.status==='running'||j.status==='synthesising';}).length;
  var tabBtn = document.getElementById('wip-tab-btn');
  if (tabBtn) tabBtn.textContent = 'WIP / Spool' + (running>0?' ('+running+')':'');
  if (!jobs.length) { panel.innerHTML = '<div style="font-size:12px;color:var(--fg-muted);padding:8px 0;">No jobs in progress.</div>'; return; }
  panel.innerHTML = jobs.map(function(job){
    var pct = job.total>0?Math.round(100*job.done/job.total):0;
    var sc = job.status==='complete'?'#16a34a':job.status==='error'?'#dc2626':'var(--accent)';
    var sl = job.status==='complete'?'Complete':job.status==='synthesising'?'Synthesising...':job.status==='error'?'Error':'Processing '+job.done+'/'+job.total;
    return '<div class="wip-job">' +
      '<div class="wip-job-name"><span>'+job.docName.replace(/</g,'&lt;')+'</span><span style="font-size:10px;color:'+sc+';font-weight:600;">'+sl+'</span></div>' +
      '<div class="wip-job-task">'+(job.task||'').substring(0,80).replace(/</g,'&lt;')+'</div>' +
      '<div class="wip-bar"><div class="wip-fill" style="width:'+pct+'%;background:'+sc+';"></div></div>' +
      '<div class="wip-meta"><span>'+pct+'% · Started: '+job.started+'</span>' +
      (job.status!=='complete'?'<button onclick="discardJob(\''+job.jobId+'\')" style="padding:1px 7px;font-size:10px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--bg);">Discard</button>':'') +
      '</div></div>';
  }).join('');
}

function refreshWIP() {
  fetch(WORKER + '/api/jobs')
    .then(function(r){return r.json();})
    .then(function(d){
      (d.jobs||[]).forEach(function(job){
        if (!wipJobs[job.id]) {
          wipJobs[job.id] = {jobId:job.id,docName:job.document_name||'Job',task:job.task||'',done:job.completed_chunks||0,total:job.total_chunks||1,status:job.status||'running',started:new Date(job.created).toLocaleTimeString('en-GB')};
        } else {
          wipJobs[job.id].done = job.completed_chunks||0;
          wipJobs[job.id].status = job.status||'running';
        }
      });
      renderWIP();
    }).catch(function(){});
}

function discardJob(jobId) {
  fetch(WORKER + '/api/jobs/' + jobId, {method:'DELETE'}).catch(function(){});
  delete wipJobs[jobId];
  renderWIP();
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function addHubMsg(role, text, provider) {
  var chat = document.getElementById('hub-chat');
  var welcome = chat.querySelector('[style*="text-align:center"]');
  if (welcome) welcome.remove();
  var div = document.createElement('div');
  div.className = 'hub-msg ' + role;
  var avatar = document.createElement('div');
  avatar.className = 'hub-msg-avatar';
  avatar.textContent = role==='user'?'S':(activeAgent?activeAgent.avatar:'🤖');
  var bubble = document.createElement('div');
  bubble.className = 'hub-bubble';
  bubble.textContent = text;
  if (provider) {
    var meta = document.createElement('div');
    meta.style.cssText = 'font-size:10px;color:rgba(255,255,255,0.6);margin-top:4px;';
    meta.textContent = provider;
    bubble.appendChild(meta);
  }
  if (role==='user') { div.appendChild(avatar); div.appendChild(bubble); }
  else { div.appendChild(avatar); div.appendChild(bubble); }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addOutput(agentName, task, response) {
  var list = document.getElementById('output-list');
  if (list.textContent === 'No output yet.') list.innerHTML = '';
  var item = document.createElement('div');
  item.className = 'output-item';
  item.innerHTML = '<div class="output-item-hdr"><span>' + agentName + ' · ' + new Date().toLocaleTimeString('en-GB') + '</span>' +
    '<button onclick="copyOutput(this)" data-text="' + response.replace(/"/g,'&quot;') + '" style="padding:1px 7px;font-size:10px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--bg);">Copy</button></div>' +
    '<div style="font-size:11px;color:var(--fg-muted);margin-bottom:3px;">' + task.substring(0,60).replace(/</g,'&lt;') + '</div>' +
    '<div style="font-size:12px;">' + response.substring(0,300).replace(/</g,'&lt;') + (response.length>300?'...':'') + '</div>';
  list.insertBefore(item, list.firstChild);
}

function copyOutput(btn) {
  navigator.clipboard.writeText(btn.dataset.text);
  btn.textContent = 'Copied!';
  setTimeout(function(){btn.textContent='Copy';},2000);
}

function setAgentStatus(id, status) {
  var dot = document.getElementById('dot-' + id);
  var lbl = document.getElementById('status-' + id);
  if (dot) dot.className = 'status-dot' + (status==='running'?' running':status==='done'?' done':status==='error'?' error':'');
  if (lbl) lbl.textContent = status;
  document.getElementById('active-status').textContent = status;
}

function clearChat() {
  chatHistory = [];
  var chat = document.getElementById('hub-chat');
  chat.innerHTML = '<div class="hub-msg system"><div class="hub-bubble">Chat cleared.</div></div>';
}

function switchTab(tab, el) {
  document.querySelectorAll('.hub-tab').forEach(function(t){t.classList.remove('active');});
  if (el) el.classList.add('active');
  document.getElementById('tab-chat').style.display = tab==='chat'?'flex':'none';
  document.getElementById('tab-wip').style.display = tab==='wip'?'block':'none';
  document.getElementById('tab-output').style.display = tab==='output'?'block':'none';
  currentTab = tab;
  if (tab==='wip') renderWIP();
}

// ── File attachments ──────────────────────────────────────────────────────────
function handleHubFiles(input) {
  Array.from(input.files).forEach(function(file){
    var reader = new FileReader();
    reader.onload = function(e){
      hubAttachments.push({name:file.name,size:file.size,type:'text',content:e.target.result});
      updateHubAttachStrip();
    };
    reader.readAsText(file);
  });
  input.value = '';
}

function updateHubAttachStrip() {
  var strip = document.getElementById('hub-attach-strip');
  if (!hubAttachments.length){strip.innerHTML='';return;}
  strip.innerHTML = hubAttachments.map(function(att,i){
    return '<div class="hub-attach-badge">📎 '+att.name+' ('+Math.round(att.size/1024)+'KB)<button onclick="hubAttachments.splice('+i+',1);updateHubAttachStrip()">✕</button></div>';
  }).join('');
}

// ── Create agent ──────────────────────────────────────────────────────────────
function openCreateModal() { document.getElementById('create-modal').classList.add('open'); }
function closeCreateModal() { document.getElementById('create-modal').classList.remove('open'); }

function createAgent() {
  var name = document.getElementById('new-name').value.trim();
  if (!name) { alert('Enter an agent name.'); return; }
  var agent = {
    id: 'agent-' + Date.now(),
    name: name,
    avatar: document.getElementById('new-avatar').value || '🤖',
    desc: document.getElementById('new-desc').value,
    systemPrompt: document.getElementById('new-prompt').value,
    profile: document.getElementById('new-profile').value,
    builtIn: false,
    created: new Date().toISOString()
  };
  fetch(WORKER + '/api/agents/save', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(agent)
  }).catch(function(){});
  agents.push(agent);
  renderAgentList();
  closeCreateModal();
  selectAgent(agent.id);
}

// ── System status ─────────────────────────────────────────────────────────────
function loadSystemStatus() {
  fetch(WORKER + '/')
    .then(function(r){return r.json();})
    .then(function(d){
      document.getElementById('system-status').innerHTML =
        '<div style="color:#16a34a;">✓ Worker v' + d.version + '</div>' +
        '<div style="margin-top:4px;">' + new Date(d.timestamp).toLocaleTimeString('en-GB') + '</div>';
    })
    .catch(function(){
      document.getElementById('system-status').innerHTML = '<div style="color:#dc2626;">✗ Worker unreachable</div>';
    });
}
</script>
