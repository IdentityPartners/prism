name: Argentica Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker via CF API (with bindings)
        run: |
          echo "Deploying worker/index.js to prism-api with KV+D1+R2 bindings..."
          METADATA='{"main_module":"index.js","compatibility_date":"2024-09-01","compatibility_flags":["nodejs_compat"],"bindings":[{"type":"kv_namespace","name":"PRISM_KV","namespace_id":"8d1a583cc99a482380aacb526d873030"},{"type":"d1","name":"PRISM_D1","id":"e953848b-7d62-4629-bb4d-271da0d03fd5"},{"type":"r2_bucket","name":"PRISM_ASSETS","bucket_name":"prism-assets"}]}'
          RESPONSE=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/prism-api" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -F "metadata=$METADATA;type=application/json" \
            -F "index.js=@worker/index.js;type=application/javascript+module")
          SUCCESS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success','false'))")
          echo "Deploy success: $SUCCESS"
          if [ "$SUCCESS" != "True" ]; then
            echo "Errors: $(echo $RESPONSE | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("errors",[]))')"
            exit 1
          fi

  deploy-static:
    name: Deploy Pages (static front-end)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Pages project serving arch.identitypartners.uk
        id: findproject
        run: |
          PROJECTS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          NAME=$(echo "$PROJECTS" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if not d.get('success'):
              print(''); sys.exit(0)
          for p in d.get('result', []):
              for dom in (p.get('domains') or []):
                  if dom.startswith('arch.') or dom == 'arch.identitypartners.uk':
                      print(p['name']); sys.exit(0)
          for p in d.get('result', []):
              n = p['name'].lower()
              if 'prism' in n or 'arch' in n or 'argentic' in n:
                  print(p['name']); sys.exit(0)
          print('')
          ")
          echo "Found Pages project: '${NAME}'"
          if [ -z "$NAME" ]; then
            echo "ERROR: no matching Pages project found. Listing all:"
            echo "$PROJECTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print([p['name'] for p in d.get('result',[])])"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler@latest pages deploy . \
            --project-name="${{ steps.findproject.outputs.name }}" \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Verify live front-end updated
        run: |
          sleep 45
          JS=$(curl -s "https://arch.identitypartners.uk/shared/argentica.js")
          if echo "$JS" | grep -q "Drafting desk"; then
            echo "WARNING: live argentica.js still contains 'Drafting desk' — Pages deploy may still be propagating."
          else
            echo "OK: live front-end serving new code."
          fi
