<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Viewer &mdash; Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
.viewer-shell{display:flex;height:100vh;overflow:hidden;}
.viewer-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.viewer-hdr{padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg-elevated);display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.viewer-hdr h2{font-size:14px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vt-btn{padding:5px 10px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:12px;background:var(--bg);color:var(--fg);font-family:inherit;transition:all 0.15s;}
.vt-btn:hover{border-color:var(--accent);color:var(--accent);}
.pdf-controls{padding:5px 14px;border-bottom:1px solid var(--border);background:var(--bg-elevated);display:none;align-items:center;gap:8px;flex-shrink:0;font-size:12px;}
.doc-pane{flex:1;overflow-y:auto;padding:20px 40px;background:var(--bg);}
.doc-pane.pdf-mode{padding:10px;background:#525659;display:flex;flex-direction:column;align-items:center;}
.doc-content{max-width:800px;margin:0 auto;font-size:16px;line-height:1.75;color:var(--fg);}
.doc-content h1{font-size:26px;font-weight:700;margin:20px 0 10px;font-family:var(--font-heading,Georgia,serif);}
.doc-content h2{font-size:20px;font-weight:700;margin:16px 0 8px;}
.doc-content h3{font-size:16px;font-weight:600;margin:12px 0 6px;}
.doc-content p{margin:0 0 10px;}
.doc-content ul,.doc-content ol{padding-left:24px;margin:8px 0;}
.doc-content li{margin:4px 0;}
.doc-content table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;}
.doc-content th,.doc-content td{border:1px solid var(--border);padding:6px 10px;text-align:left;}
.doc-content th{background:var(--bg-sunken);font-weight:600;}
.doc-content code{background:var(--bg-sunken);padding:2px 5px;border-radius:3px;font-family:monospace;font-size:0.9em;}
.doc-content pre{background:var(--bg-sunken);padding:12px;border-radius:6px;overflow-x:auto;margin:10px 0;}
.doc-content blockquote{border-left:3px solid var(--accent);padding-left:14px;margin:10px 0;color:var(--fg-muted);font-style:italic;}
.annot-panel{width:260px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface);overflow:hidden;}
.annot-hdr{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.annot-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.annot-tab{flex:1;padding:7px;font-size:11px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--fg-muted);text-align:center;}
.annot-tab.active{border-bottom-color:var(--accent);color:var(--accent);}
.annot-body{flex:1;overflow-y:auto;padding:10px;}
.annot-add{border-top:1px solid var(--border);padding:10px;flex-shrink:0;}
.annot-ta{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;font-family:inherit;resize:none;min-height:60px;background:var(--bg);color:var(--fg);box-sizing:border-box;}
.annot-send{width:100%;padding:6px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;margin-top:5px;}
.ai-msg{padding:7px 9px;border-radius:8px;font-size:12px;line-height:1.5;margin-bottom:6px;}
.ai-msg.user{background:var(--accent);color:#fff;}
.ai-msg.assistant{background:var(--bg-elevated);border:1px solid var(--border);color:var(--fg);}
.tts-bar{padding:6px 14px;border-top:1px solid var(--border);background:var(--bg-elevated);display:none;align-items:center;gap:8px;font-size:12px;flex-shrink:0;}
.empty-state{text-align:center;padding:60px 20px;color:var(--fg-muted);}
.empty-state .icon{font-size:48px;margin-bottom:12px;}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="viewer-shell">
<div class="viewer-main">
  <div class="viewer-hdr">
    <h2 id="doc-title">Document Viewer</h2>
    <div style="display:flex;gap:5px;flex-wrap:wrap;">
      <button class="vt-btn" onclick="zoomIn()">+ Zoom</button>
      <button class="vt-btn" onclick="zoomOut()">- Zoom</button>
      <button class="vt-btn" onclick="readAloudDoc()">&#x1F50A; Read</button>
      <button class="vt-btn" id="stop-btn" onclick="stopReading()" style="display:none;">&#x23F9; Stop</button>
      <button class="vt-btn" onclick="exportAnnotations()">&#x2B07; Notes</button>
      <button class="vt-btn" onclick="window.history.back()">&#x2715; Close</button>
    </div>
  </div>
  <div class="pdf-controls" id="pdf-controls">
    <button class="vt-btn" onclick="prevPage()">&#x2039; Prev</button>
    <span>Page</span>
    <input type="number" id="page-num" value="1" min="1" style="width:50px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;text-align:center;background:var(--bg);color:var(--fg);" onchange="goToPage(parseInt(this.value))">
    <span id="page-total">of ?</span>
    <button class="vt-btn" onclick="nextPage()">Next &#x203A;</button>
    <div style="flex:1;"></div>
    <label style="font-size:11px;">Zoom:</label>
    <input type="range" min="50" max="200" value="100" id="pdf-zoom" style="width:80px;" oninput="setPdfZoom(parseInt(this.value))">
    <span id="pdf-zoom-label" style="font-size:11px;">100%</span>
  </div>
  <div class="doc-pane" id="doc-pane">
    <div class="empty-state">
      <div class="icon">&#x1F4C4;</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:8px;">No document loaded</div>
      <div style="font-size:13px;">Open from Study Hub by clicking a resource.</div>
    </div>
  </div>
  <div class="tts-bar" id="tts-bar">
    <span>&#x1F50A;</span>
    <span id="tts-status" style="flex:1;color:var(--fg-muted);">Ready</span>
    <select id="tts-voice" style="padding:4px 7px;border:1px solid var(--border);border-radius:5px;font-size:11px;background:var(--bg);color:var(--fg);">
      <option value="aura-arcas-en">Arcas (British Male)</option>
      <option value="aura-asteria-en">Asteria (Female)</option>
      <option value="aura-luna-en">Luna (Female, warm)</option>
    </select>
    <button class="vt-btn" onclick="stopReading()">&#x23F9; Stop</button>
  </div>
</div>
<div class="annot-panel">
  <div class="annot-hdr"><span>&#x1F4DD; Annotations</span><span id="annot-count" style="font-size:10px;color:var(--fg-muted);">0</span></div>
  <div class="annot-tabs">
    <div class="annot-tab active" onclick="switchAnnotTab('notes',this)">Notes</div>
    <div class="annot-tab" onclick="switchAnnotTab('draw',this)">&#x270F; Draw</div>
    <div class="annot-tab" onclick="switchAnnotTab('ai',this)">Ask AI</div>
  </div>
  <div class="annot-body" id="annot-body"><div style="font-size:12px;color:var(--fg-muted);padding:8px 0;">No annotations yet.</div></div>
  <div class="annot-add" id="annot-add">
    <textarea class="annot-ta" id="annot-input" placeholder="Add a note..."></textarea>
    <button class="annot-send" onclick="addNote()">Add Note</button>
  </div>
</div>
</div>
</div>
<script>

var WORKER = 'https://prism-api.identitypartners.workers.dev';
var docData = null;
var annotations = [];
var pdfDoc = null;
var pdfPage = 1;
var pdfZoom = 1.0;
var ttsAudio = null;
var aiHistory = [];
var hwStrokes = [];
var hwCurrent = null;
var hwDrawing = false;
var hwTool = 'pen';
var hwColor = '#dc2626';
var hwSize = 3;

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/doc-viewer/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var name = params.get('name');
  var type = params.get('type');
  var url = params.get('url');
  if (id || url || name) loadDocumentFromParams(id, name, type, url);
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'load-document') loadDocument(e.data.doc);
  });
});

function loadDocumentFromParams(id, name, type, url) {
  // Try localStorage (Study Hub)
  try {
    var modules = JSON.parse(localStorage.getItem('study:modules') || '[]');
    for (var i = 0; i < modules.length; i++) {
      var m = modules[i];
      for (var j = 0; j < (m.weeks || []).length; j++) {
        var w = m.weeks[j];
        for (var k = 0; k < (w.resources || []).length; k++) {
          var res = w.resources[k];
          if (res.id === id || res.name === decodeURIComponent(name || '')) {
            loadDocument(res);
            return;
          }
        }
      }
    }
  } catch(e) {}
  // Try sessionStorage
  if (id) {
    try {
      var stored = sessionStorage.getItem('doc-viewer-content-' + id);
      if (stored) {
        loadDocument({id: id, name: decodeURIComponent(name || 'Document'), type: type || '', content: stored, url: url ? decodeURIComponent(url) : null});
        return;
      }
    } catch(e) {}
  }
  if (url) {
    var decodedUrl = decodeURIComponent(url);
    var decodedName = decodeURIComponent(name || 'Document');
    var ext = decodedName.split('.').pop().toLowerCase();
    loadDocument({id: id || 'doc', name: decodedName, type: type || ext, url: decodedUrl, content: ''});
  } else if (name) {
    var decodedName = decodeURIComponent(name);
    document.getElementById('doc-title').textContent = decodedName;
    // Show viewer options with helpful message
    showViewerOptions({name: decodedName, url: '', type: type || ''});
  }
}

function loadDocument(doc) {
  docData = doc;
  document.getElementById('doc-title').textContent = doc.name || 'Document';
  loadAnnotations(doc.id);
  var ext = (doc.name || '').split('.').pop().toLowerCase();
  var type = doc.type || ext;
  var isBinary = doc.content && doc.content.length > 50 &&
    doc.content.split('').filter(function(c) { var code = c.charCodeAt(0); return code < 32 && code !== 10 && code !== 13 && code !== 9; }).length > doc.content.length * 0.05;
  if (type === 'pdf' || ext === 'pdf') renderPDF(doc);
  else if ((type === 'docx' || type === 'doc' || ext === 'docx' || ext === 'doc') && !isBinary) renderDOCX(doc);
  else if (isBinary || type === 'pptx' || type === 'ppt' || ext === 'pptx' || ext === 'ppt' || ext === 'xlsx' || ext === 'xls') showViewerOptions(doc);
  else if (ext === 'md' || type === 'md') renderMarkdown(doc);
  else if (doc.url) showViewerOptions(doc);
  else if (doc.content) renderText(doc);
  else showViewerOptions(doc);
}

function renderPDF(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane pdf-mode';
  pane.innerHTML = '<div style="color:#fff;text-align:center;padding:20px;font-size:13px;">Loading PDF...</div>';
  document.getElementById('pdf-controls').style.display = 'flex';
  var src = null;
  if (doc.content && doc.content.startsWith('data:')) {
    var b64 = doc.content.split(',')[1];
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    src = {data: bytes};
  } else if (doc.url) {
    src = doc.url;
  } else { showViewerOptions(doc); return; }
  if (typeof pdfjsLib === 'undefined') {
    pane.innerHTML = '<div style="color:#fff;text-align:center;padding:40px;">PDF.js not loaded. Refresh and try again.</div>';
    return;
  }
  pdfjsLib.getDocument(src).promise.then(function(pdf) {
    pdfDoc = pdf;
    document.getElementById('page-total').textContent = 'of ' + pdf.numPages;
    renderPDFPage(1);
  }).catch(function(e) { showViewerOptions(doc); });
}

function renderPDFPage(num) {
  if (!pdfDoc) return;
  pdfPage = Math.max(1, Math.min(num, pdfDoc.numPages));
  document.getElementById('page-num').value = pdfPage;
  pdfDoc.getPage(pdfPage).then(function(page) {
    var viewport = page.getViewport({scale: pdfZoom});
    var canvas = document.createElement('canvas');
    canvas.style.cssText = 'display:block;margin:0 auto 10px;box-shadow:0 2px 8px rgba(0,0,0,0.3);';
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    var ctx = canvas.getContext('2d');
    var pane = document.getElementById('doc-pane');
    pane.innerHTML = '';
    pane.appendChild(canvas);
    page.render({canvasContext: ctx, viewport: viewport});
  });
}

function prevPage() { renderPDFPage(pdfPage - 1); }
function nextPage() { renderPDFPage(pdfPage + 1); }
function goToPage(n) { renderPDFPage(n); }
function setPdfZoom(pct) { pdfZoom = pct / 100; document.getElementById('pdf-zoom-label').textContent = pct + '%'; renderPDFPage(pdfPage); }

function renderDOCX(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';
  if (!doc.content || doc.content.length < 10) { showViewerOptions(doc); return; }
  if (doc.content.startsWith('data:')) {
    if (typeof mammoth === 'undefined') { showViewerOptions(doc); return; }
    var b64 = doc.content.split(',')[1];
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    mammoth.convertToHtml({arrayBuffer: bytes.buffer}).then(function(result) {
      pane.innerHTML = '<div class="doc-content">' + result.value + '</div>';
    }).catch(function() { showViewerOptions(doc); });
  } else {
    pane.innerHTML = '<div class="doc-content"><pre style="white-space:pre-wrap;font-size:15px;line-height:1.7;">' + doc.content.replace(/</g, '&lt;') + '</pre></div>';
  }
}

function renderMarkdown(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';
  var content = doc.content || '';
  if (typeof marked !== 'undefined') {
    pane.innerHTML = '<div class="doc-content">' + marked.parse(content) + '</div>';
  } else {
    pane.innerHTML = '<div class="doc-content"><pre style="white-space:pre-wrap;">' + content.replace(/</g, '&lt;') + '</pre></div>';
  }
}

function renderText(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';
  pane.innerHTML = '<div class="doc-content"><pre style="white-space:pre-wrap;font-size:15px;line-height:1.7;">' + (doc.content || '').replace(/</g, '&lt;') + '</pre></div>';
}

function showViewerOptions(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';
  var card = document.createElement('div');
  card.style.cssText = 'background:rgba(45,106,159,0.08);border:1px solid rgba(45,106,159,0.2);border-radius:10px;padding:16px;margin-bottom:16px;';
  var titleEl = document.createElement('div');
  titleEl.style.cssText = 'font-size:16px;font-weight:700;margin-bottom:6px;';
  titleEl.textContent = '\uD83D\uDCC4 ' + (doc ? doc.name || 'Document' : 'Document');
  var descEl = document.createElement('div');
  descEl.style.cssText = 'font-size:13px;color:var(--fg-muted);margin-bottom:12px;';
  descEl.textContent = 'Choose a viewer:';
  card.appendChild(titleEl);
  card.appendChild(descEl);
  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';
  if (doc && doc.url) {
    var gdBtn = document.createElement('a');
    gdBtn.href = 'https://docs.google.com/viewer?url=' + encodeURIComponent(doc.url) + '&embedded=true';
    gdBtn.target = '_blank';
    gdBtn.style.cssText = 'padding:8px 14px;background:#4285f4;color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;';
    gdBtn.textContent = 'Google Docs Viewer';
    var offBtn = document.createElement('a');
    offBtn.href = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(doc.url);
    offBtn.target = '_blank';
    offBtn.style.cssText = 'padding:8px 14px;background:#d83b01;color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;';
    offBtn.textContent = 'Office Online';
    var directBtn = document.createElement('a');
    directBtn.href = doc.url;
    directBtn.target = '_blank';
    directBtn.style.cssText = 'padding:8px 14px;background:var(--accent);color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;';
    directBtn.textContent = '\u2197 Open directly';
    var embedBtn = document.createElement('button');
    embedBtn.style.cssText = 'padding:8px 14px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;';
    embedBtn.textContent = '\uD83D\uDDA5 Embed viewer';
    embedBtn.onclick = (function(u) { return function() { loadInFrame('https://docs.google.com/viewer?url=' + encodeURIComponent(u) + '&embedded=true'); }; })(doc.url);
    btnRow.appendChild(gdBtn);
    btnRow.appendChild(offBtn);
    btnRow.appendChild(directBtn);
    btnRow.appendChild(embedBtn);
    // Upload to OneDrive for better rendering
    var odBtn = document.createElement('button');
    odBtn.style.cssText = 'padding:8px 14px;background:#0078d4;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;';
    odBtn.textContent = '\u2601 Upload to OneDrive';
    odBtn.onclick = function() { uploadToOneDrive(doc); };
    btnRow.appendChild(odBtn);
  } else {
    var noUrl = document.createElement('div');
    noUrl.style.cssText = 'font-size:13px;color:var(--fg-muted);';
    noUrl.textContent = 'No public URL. Add a URL when uploading to use external viewers.';
    btnRow.appendChild(noUrl);
  }
  card.appendChild(btnRow);
  pane.appendChild(card);
}

function loadInFrame(url) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';
  pane.style.padding = '0';
  var iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.style.cssText = 'width:100%;height:100%;border:none;';
  iframe.allow = 'fullscreen';
  pane.innerHTML = '';
  pane.appendChild(iframe);
}

function uploadToOneDrive(doc) {
  if (!doc || !doc.content) { alert('No content to upload.'); return; }
  var b64 = doc.content.startsWith('data:') ? doc.content.split(',')[1] : btoa(doc.content);
  fetch(WORKER + '/api/onedrive/upload', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({fileName: doc.name, content: b64, folder: 'Argentica/Study'})
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.shareUrl) {
      doc.url = d.shareUrl;
      showViewerOptions(doc);
      alert('Uploaded to OneDrive. Click Office Online to view.');
    } else {
      alert('Upload failed: ' + (d.error || 'Unknown'));
    }
  })
  .catch(function(e) { alert('Error: ' + e.message); });
}

// ── Annotations ───────────────────────────────────────────────────────────────
function loadAnnotations(docId) {
  try { annotations = JSON.parse(localStorage.getItem('annot:' + docId) || '[]'); } catch(e) { annotations = []; }
  renderAnnotations();
}
function saveAnnotations() {
  if (!docData) return;
  try { localStorage.setItem('annot:' + docData.id, JSON.stringify(annotations)); } catch(e) {}
  // Also save to KV
  fetch(WORKER + '/api/kv/set', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({key: 'annot:' + docData.id, value: JSON.stringify(annotations)})
  }).catch(function() {});
}
function addNote() {
  var inp = document.getElementById('annot-input');
  var note = inp ? inp.value.trim() : '';
  if (!note) return;
  annotations.push({id: 'n-' + Date.now(), type: 'note', note: note, created: new Date().toISOString()});
  if (inp) inp.value = '';
  saveAnnotations();
  renderAnnotations();
}
function renderAnnotations() {
  var body = document.getElementById('annot-body');
  var count = document.getElementById('annot-count');
  if (count) count.textContent = annotations.length;
  if (!annotations.length) { body.innerHTML = '<div style="font-size:12px;color:var(--fg-muted);padding:8px 0;">No annotations yet.</div>'; return; }
  body.innerHTML = '';
  annotations.slice().reverse().forEach(function(a) {
    var div = document.createElement('div');
    div.style.cssText = 'padding:8px 10px;border:1px solid var(--border);border-radius:7px;margin-bottom:6px;background:var(--bg-elevated);font-size:12px;';
    div.textContent = a.note || '';
    var meta = document.createElement('div');
    meta.style.cssText = 'font-size:10px;color:var(--fg-muted);margin-top:4px;';
    meta.textContent = new Date(a.created).toLocaleString('en-GB', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
    div.appendChild(meta);
    body.appendChild(div);
  });
}
function exportAnnotations() {
  var lines = ['# Annotations: ' + (docData ? docData.name : 'Document'), ''];
  annotations.forEach(function(a) { lines.push(a.note || ''); lines.push(''); });
  var blob = new Blob([lines.join('\n')], {type: 'text/markdown'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (docData ? docData.name : 'doc') + '-notes.md';
  a.click();
}
function switchAnnotTab(tab, btn) {
  document.querySelectorAll('.annot-tab').forEach(function(t) { t.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  var addArea = document.getElementById('annot-add');
  var body = document.getElementById('annot-body');
  if (tab === 'ai') {
    if (addArea) addArea.innerHTML = '<textarea class="annot-ta" id="annot-input" placeholder="Ask about this document..."></textarea><button class="annot-send" onclick="sendAI()">Ask</button>';
    renderAIChat();
  } else if (tab === 'draw') {
    if (addArea) addArea.innerHTML = '<div style="display:flex;gap:4px;flex-wrap:wrap;padding:6px 0;"><button onclick="hwSetTool(\'pen\')" style="padding:3px 8px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;background:var(--bg);">Pen</button><button onclick="hwSetTool(\'hi\')" style="padding:3px 8px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;background:rgba(255,220,0,0.3);">Highlight</button><button onclick="hwSetTool(\'erase\')" style="padding:3px 8px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;background:var(--bg);">Erase</button><button onclick="hwClear()" style="padding:3px 8px;border:1px solid #dc2626;border-radius:4px;cursor:pointer;font-size:11px;color:#dc2626;background:var(--bg);">Clear</button><button onclick="hwSave()" style="padding:3px 8px;border:1px solid var(--accent);border-radius:4px;cursor:pointer;font-size:11px;color:var(--accent);background:var(--bg);">Save</button></div>';
    initHWCanvas();
  } else {
    if (addArea) addArea.innerHTML = '<textarea class="annot-ta" id="annot-input" placeholder="Add a note..."></textarea><button class="annot-send" onclick="addNote()">Add Note</button>';
    renderAnnotations();
  }
}
function renderAIChat() {
  var body = document.getElementById('annot-body');
  if (!aiHistory.length) { body.innerHTML = '<div style="font-size:12px;color:var(--fg-muted);padding:8px 0;">Ask anything about this document.</div>'; return; }
  body.innerHTML = '';
  aiHistory.forEach(function(m) {
    var div = document.createElement('div');
    div.className = 'ai-msg ' + m.role;
    div.textContent = m.content;
    body.appendChild(div);
  });
  body.scrollTop = body.scrollHeight;
}
function sendAI() {
  var inp = document.getElementById('annot-input');
  var text = inp ? inp.value.trim() : '';
  if (!text) return;
  if (inp) inp.value = '';
  aiHistory.push({role: 'user', content: text});
  renderAIChat();
  var docCtx = docData ? 'Document: ' + docData.name + '. ' : '';
  fetch(WORKER + '/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({messages: [{role: 'system', content: 'You are a study assistant. ' + docCtx + 'British English. Be precise.'}, {role: 'user', content: text}], profile: 'balanced'})})
    .then(function(r) { return r.json(); })
    .then(function(d) { aiHistory.push({role: 'assistant', content: d.content || 'No response.'}); renderAIChat(); })
    .catch(function(e) { aiHistory.push({role: 'assistant', content: 'Error: ' + e.message}); renderAIChat(); });
}

// ── Handwriting annotations ───────────────────────────────────────────────────
function initHWCanvas() {
  var body = document.getElementById('annot-body');
  body.innerHTML = '';
  var canvas = document.createElement('canvas');
  canvas.id = 'hw-annot-canvas';
  canvas.style.cssText = 'width:100%;height:200px;border:1px solid var(--border);border-radius:6px;cursor:crosshair;touch-action:none;background:#fff;';
  canvas.width = 240;
  canvas.height = 200;
  body.appendChild(canvas);
  canvas.addEventListener('pointerdown', hwStart);
  canvas.addEventListener('pointermove', hwMove);
  canvas.addEventListener('pointerup', hwEnd);
  canvas.addEventListener('pointercancel', hwEnd);
  hwRedraw();
}
function hwPos(e) {
  var c = document.getElementById('hw-annot-canvas');
  if (!c) return {x: 0, y: 0};
  var r = c.getBoundingClientRect();
  return {x: (e.clientX - r.left) * (c.width / r.width), y: (e.clientY - r.top) * (c.height / r.height)};
}
function hwStart(e) { e.preventDefault(); hwDrawing = true; hwCurrent = {tool: hwTool, col: hwColor, sz: hwSize, pts: [hwPos(e)]}; }
function hwMove(e) { if (!hwDrawing || !hwCurrent) return; e.preventDefault(); hwCurrent.pts.push(hwPos(e)); hwDrawStroke(hwCurrent, true); }
function hwEnd(e) { if (!hwDrawing || !hwCurrent) return; hwDrawing = false; if (hwCurrent.pts.length > 1) hwStrokes.push(hwCurrent); hwCurrent = null; }
function hwDrawStroke(stroke, inc) {
  var c = document.getElementById('hw-annot-canvas');
  if (!c) return;
  var ctx = c.getContext('2d');
  if (!inc) ctx.clearRect(0, 0, c.width, c.height);
  if (!stroke.pts || stroke.pts.length < 2) return;
  ctx.save();
  if (stroke.tool === 'erase') { ctx.globalCompositeOperation = 'destination-out'; ctx.strokeStyle = 'rgba(0,0,0,1)'; ctx.lineWidth = stroke.sz * 4; }
  else if (stroke.tool === 'hi') { ctx.strokeStyle = 'rgba(255,220,0,0.4)'; ctx.lineWidth = stroke.sz * 6; ctx.lineCap = 'square'; }
  else { ctx.strokeStyle = stroke.col; ctx.lineWidth = stroke.sz; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
  ctx.beginPath();
  ctx.moveTo(stroke.pts[0].x, stroke.pts[0].y);
  for (var i = 1; i < stroke.pts.length; i++) ctx.lineTo(stroke.pts[i].x, stroke.pts[i].y);
  ctx.stroke();
  ctx.restore();
}
function hwRedraw() {
  var c = document.getElementById('hw-annot-canvas');
  if (!c) return;
  var ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  hwStrokes.forEach(function(s) { hwDrawStroke(s, false); });
}
function hwSetTool(t) { hwTool = t; }
function hwClear() { hwStrokes = []; hwRedraw(); }
function hwSave() {
  var c = document.getElementById('hw-annot-canvas');
  if (!c) return;
  var dataUrl = c.toDataURL('image/png');
  annotations.push({id: 'hw-' + Date.now(), type: 'drawing', dataUrl: dataUrl, created: new Date().toISOString()});
  saveAnnotations();
  alert('Handwriting annotation saved.');
}

// ── TTS ───────────────────────────────────────────────────────────────────────
function readAloudDoc() {
  var pane = document.getElementById('doc-pane');
  var text = pane.innerText || pane.textContent || '';
  if (!text.trim()) return;
  var voice = document.getElementById('tts-voice') ? document.getElementById('tts-voice').value : 'aura-arcas-en';
  document.getElementById('tts-bar').style.display = 'flex';
  document.getElementById('tts-status').textContent = 'Generating audio...';
  document.getElementById('stop-btn').style.display = 'inline-block';
  fetch(WORKER + '/api/tts/read', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: text.substring(0, 5000), voice: voice, provider: 'deepgram'})})
    .then(function(r) { if (!r.ok) throw new Error('TTS failed: ' + r.status); return r.blob(); })
    .then(function(blob) {
      if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
      ttsAudio = new Audio(URL.createObjectURL(blob));
      ttsAudio.play();
      document.getElementById('tts-status').textContent = 'Playing...';
      ttsAudio.onended = function() { document.getElementById('tts-status').textContent = 'Done'; document.getElementById('stop-btn').style.display = 'none'; };
    })
    .catch(function(e) { document.getElementById('tts-status').textContent = 'Error: ' + e.message; document.getElementById('stop-btn').style.display = 'none'; });
}
function stopReading() { if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; } document.getElementById('tts-status').textContent = 'Stopped'; document.getElementById('stop-btn').style.display = 'none'; }
function zoomIn() { var c = document.querySelector('.doc-content'); if (c) c.style.fontSize = (parseFloat(c.style.fontSize || '16') + 1) + 'px'; }
function zoomOut() { var c = document.querySelector('.doc-content'); if (c) c.style.fontSize = Math.max(10, parseFloat(c.style.fontSize || '16') - 1) + 'px'; }

</script>
