<style>
.viewer-shell { display:flex; height:100vh; overflow:hidden; }
.viewer-main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.viewer-hdr { padding:8px 14px; border-bottom:1px solid var(--border); background:var(--bg-elevated); display:flex; align-items:center; gap:8px; flex-shrink:0; flex-wrap:wrap; }
.viewer-hdr h2 { font-size:14px; font-weight:700; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.vt-btn { padding:4px 10px; border:1px solid var(--border); border-radius:5px; cursor:pointer; font-size:12px; background:var(--bg); color:var(--fg); font-family:inherit; transition:all 0.15s; }

/* Document pane */

/* PDF canvas */

.pdf-controls input[type=number] { width:50px; padding:3px 6px; border:1px solid var(--border); border-radius:4px; font-size:12px; text-align:center; background:var(--bg); color:var(--fg); }

/* Rendered content */
.doc-content { max-width:800px; margin:0 auto; font-size:16px; line-height:1.75; color:var(--fg); }

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var docData = null; // {id, name, type, content, url}
var annotations = [];
var currentAnnotTab = 'notes';
var pdfDoc = null;
var pdfPage = 1;
var pdfZoom = 1.0;
var ttsAudio = null;
var zoom = 1.0;
var selectedText = '';
var selectedRange = null;

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/study-hub/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }

  // Load document from URL params or postMessage
  var params = new URLSearchParams(window.location.search);
  var docId = params.get('id');
  var docName = params.get('name');
  var docType = params.get('type');
  var docUrl = params.get('url');

  if (docId || docUrl) {
    loadDocumentFromParams(docId, docName, docType, docUrl);
  }

  // Listen for postMessage from Study Hub
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'load-document') {
      loadDocument(e.data.doc);
    }
  });

  // Selection detection
  document.addEventListener('mouseup', onMouseUp);
  document.addEventListener('touchend', onMouseUp);
  document.addEventListener('mousedown', function(e) {
    if (!e.target.closest('#sel-toolbar')) hideSelToolbar();
  });
});

// ── Load document ─────────────────────────────────────────────────────────────
function loadDocumentFromParams(id, name, type, url) {
  // Try to get from Study Hub localStorage
  try {
    var modules = JSON.parse(localStorage.getItem('study:modules') || '[]');
    for (var m of modules) {
      for (var w of (m.weeks||[])) {
        for (var r of (w.resources||[])) {
          if (r.id === id) {
            loadDocument(r);
            return;
          }
        }
      }
    }
  } catch(e) {}

  // Fallback: load from URL
  if (url) {
    loadDocument({id: id||'doc', name: name||'Document', type: type||'link', url: url, content: ''});
  }
}

function loadDocument(doc) {
  docData = doc;
  document.getElementById('doc-title').textContent = doc.name || 'Document';
  loadAnnotations(doc.id);

  var ext = (doc.name||'').split('.').pop().toLowerCase();
  var type = doc.type || ext;

  if (type === 'pdf' || ext === 'pdf') {
    renderPDF(doc);
  } else if (type === 'ppt' || type === 'pptx' || ext === 'ppt' || ext === 'pptx') {
    renderPPT(doc);
  } else if (type === 'docx' || type === 'doc' || ext === 'docx' || ext === 'doc') {
    renderDOCX(doc);
  } else if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
    renderSpreadsheet(doc);
  } else if (ext === 'md' || type === 'md') {
    renderMarkdown(doc);
  } else if (ext === 'txt' || type === 'txt' || type === 'note') {
    renderText(doc);
  } else if (doc.url) {
    renderURL(doc);
  } else if (doc.content) {
    renderText(doc);
  } else {
    renderEmpty(doc);
  }
}

// ── PDF rendering ─────────────────────────────────────────────────────────────
function renderPDF(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane pdf-mode';
  pane.innerHTML = '<div style="text-align:center;padding:20px;color:#fff;font-size:13px;">Loading PDF...</div>';
  document.getElementById('pdf-controls').style.display = 'flex';

  // Use PDF.js
  var loadPDF = function(src) {
    if (typeof pdfjsLib === 'undefined') {
      // Try loading via script tag
      pane.innerHTML = '<div style="text-align:center;padding:40px;color:#fff;font-size:13px;">PDF.js loading... please wait.</div>';
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.js';
      script.onload = function() {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.js';
        loadPDFWithLib(src);
      };
      document.head.appendChild(script);
    } else {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.js';
      loadPDFWithLib(src);
    }
  };

  if (doc.content && doc.content.startsWith('data:')) {
    // Base64 data URL
    var b64 = doc.content.split(',')[1];
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    loadPDF({data: bytes});
  } else if (doc.url) {
    loadPDF(doc.url);
  } else if (doc.content) {
    // Try as text
    renderText(doc);
  }
}

function loadPDFWithLib(src) {
  pdfjsLib.getDocument(src).promise.then(function(pdf) {
    pdfDoc = pdf;
    var total = pdf.numPages;
    document.getElementById('page-total').textContent = 'of ' + total;
    renderPDFPage(1);
  }).catch(function(e) {
    document.getElementById('doc-pane').innerHTML = '<div style="text-align:center;padding:40px;color:#fff;font-size:13px;">PDF load error: ' + e.message + '</div>';
  });
}

function renderPDFPage(num) {
  if (!pdfDoc) return;
  pdfPage = Math.max(1, Math.min(num, pdfDoc.numPages));
  document.getElementById('page-num').value = pdfPage;
  pdfDoc.getPage(pdfPage).then(function(page) {
    var viewport = page.getViewport({scale: pdfZoom});
    var canvas = document.createElement('canvas');
    canvas.className = 'pdf-page';
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    var ctx = canvas.getContext('2d');
    var pane = document.getElementById('doc-pane');
    pane.innerHTML = '';
    pane.appendChild(canvas);
    page.render({canvasContext: ctx, viewport: viewport});
  });
}

function prevPage() { renderPDFPage(pdfPage - 1); }
function nextPage() { renderPDFPage(pdfPage + 1); }
function goToPage(n) { renderPDFPage(n); }
function setPdfZoom(pct) {
  pdfZoom = pct / 100;
  document.getElementById('pdf-zoom-label').textContent = pct + '%';
  renderPDFPage(pdfPage);
}

// ── DOCX rendering ────────────────────────────────────────────────────────────
function renderDOCX(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';

  if (typeof mammoth === 'undefined') {
    pane.innerHTML = '<div class="doc-content"><p style="color:var(--fg-muted);">Loading DOCX renderer...</p></div>';
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
    script.onload = function() { renderDOCX(doc); };
    document.head.appendChild(script);
    return;
  }

  if (doc.content && doc.content.startsWith('data:')) {
    var b64 = doc.content.split(',')[1];
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    mammoth.convertToHtml({arrayBuffer: bytes.buffer}).then(function(result) {
      pane.innerHTML = '<div class="doc-content">' + result.value + '</div>';
      setupAnnotationLayer();
    }).catch(function(e) {
      pane.innerHTML = '<div class="doc-content"><p style="color:#dc2626;">DOCX error: ' + e.message + '</p></div>';
    });
  } else if (doc.content) {
    // Plain text fallback
    pane.innerHTML = '<div class="doc-content"><pre style="white-space:pre-wrap;">' + doc.content.replace(/</g,'&lt;') + '</pre></div>';
    setupAnnotationLayer();
  } else {
    pane.innerHTML = '<div class="doc-content"><p style="color:var(--fg-muted);">No content available. Upload the file to view it.</p></div>';
  }
}

// ── PPT rendering ─────────────────────────────────────────────────────────────
function renderPPT(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';
  // PPT/PPTX requires server-side conversion — show content as text or link
  if (doc.url) {
    pane.innerHTML = '<div class="doc-content">' +
      '<div style="background:rgba(45,106,159,0.08);border:1px solid rgba(45,106,159,0.2);border-radius:8px;padding:16px;margin-bottom:16px;">' +
      '<div style="font-size:14px;font-weight:600;margin-bottom:6px;">📊 PowerPoint Presentation</div>' +
      '<div style="font-size:13px;color:var(--fg-muted);margin-bottom:10px;">PPT/PPTX files require conversion for in-browser viewing.</div>' +
      '<a href="' + doc.url + '" target="_blank" style="padding:7px 14px;background:var(--accent);color:#fff;border-radius:6px;text-decoration:none;font-size:13px;">Open in new tab ↗</a>' +
      '</div>' +
      (doc.content ? '<div style="font-size:13px;color:var(--fg-muted);margin-bottom:8px;">Extracted text:</div><pre style="white-space:pre-wrap;font-size:13px;">' + doc.content.substring(0,5000).replace(/</g,'&lt;') + '</pre>' : '') +
      '</div>';
  } else if (doc.content) {
    pane.innerHTML = '<div class="doc-content"><pre style="white-space:pre-wrap;">' + doc.content.replace(/</g,'&lt;') + '</pre></div>';
    setupAnnotationLayer();
  }
}

// ── Spreadsheet rendering ─────────────────────────────────────────────────────
function renderSpreadsheet(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';

  var renderFromContent = function(content) {
    try {
      var wb;
      if (content.startsWith('data:')) {
        var b64 = content.split(',')[1];
        wb = XLSX.read(b64, {type:'base64'});
      } else {
        wb = XLSX.read(content, {type:'string'});
      }
      var html = '<div class="doc-content">';
      wb.SheetNames.forEach(function(name) {
        html += '<h3 style="margin:16px 0 8px;">' + name + '</h3>';
        html += XLSX.utils.sheet_to_html(wb.Sheets[name], {editable:false});
      });
      html += '</div>';
      pane.innerHTML = html;
      // Style the generated table
      pane.querySelectorAll('table').forEach(function(t) {
        t.style.cssText = 'border-collapse:collapse;width:100%;margin-bottom:16px;font-size:13px;';
        t.querySelectorAll('td,th').forEach(function(c) {
          c.style.cssText = 'border:1px solid var(--border);padding:5px 8px;';
        });
      });
      setupAnnotationLayer();
    } catch(e) {
      pane.innerHTML = '<div class="doc-content"><p style="color:#dc2626;">Spreadsheet error: ' + e.message + '</p></div>';
    }
  };

  if (typeof XLSX === 'undefined') {
    pane.innerHTML = '<div class="doc-content"><p>Loading spreadsheet renderer...</p></div>';
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    script.onload = function() { renderSpreadsheet(doc); };
    document.head.appendChild(script);
    return;
  }

  if (doc.content) {
    renderFromContent(doc.content);
  } else {
    pane.innerHTML = '<div class="doc-content"><p style="color:var(--fg-muted);">No spreadsheet content. Upload the file.</p></div>';
  }
}

// ── Markdown rendering ────────────────────────────────────────────────────────
function renderMarkdown(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';
  var content = doc.content || '';
  if (typeof marked !== 'undefined') {
    pane.innerHTML = '<div class="doc-content">' + marked.parse(content) + '</div>';
  } else {
    // Simple fallback
    var html = content
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/^# (.+)$/gm,'<h1>$1</h1>')
      .replace(/^## (.+)$/gm,'<h2>$1</h2>')
      .replace(/^### (.+)$/gm,'<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/\n\n/g,'</p><p>')
      .replace(/\n/g,'<br>');
    pane.innerHTML = '<div class="doc-content"><p>' + html + '</p></div>';
  }
  setupAnnotationLayer();
}

// ── Text rendering ────────────────────────────────────────────────────────────
function renderText(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';
  var content = doc.content || '';
  pane.innerHTML = '<div class="doc-content"><pre style="white-space:pre-wrap;font-size:15px;line-height:1.7;">' + content.replace(/</g,'&lt;') + '</pre></div>';
  setupAnnotationLayer();
}

// ── URL rendering ─────────────────────────────────────────────────────────────
function renderURL(doc) {
  var pane = document.getElementById('doc-pane');
  pane.className = 'doc-pane';
  pane.innerHTML = '<div class="doc-content">' +
    '<div style="background:rgba(45,106,159,0.08);border:1px solid rgba(45,106,159,0.2);border-radius:8px;padding:16px;margin-bottom:16px;">' +
    '<div style="font-size:14px;font-weight:600;margin-bottom:6px;">🔗 ' + (doc.name||'Link') + '</div>' +
    '<a href="' + doc.url + '" target="_blank" style="color:var(--accent);font-size:13px;">' + doc.url + ' ↗</a>' +
    '</div>' +
    (doc.content ? '<div class="doc-content"><p>' + doc.content.replace(/</g,'&lt;').replace(/\n/g,'<br>') + '</p></div>' : '') +
    '</div>';
}

function renderEmpty(doc) {
  document.getElementById('doc-pane').innerHTML = '<div class="empty-state"><div class="icon">📄</div><div style="font-size:15px;font-weight:600;">' + (doc.name||'Document') + '</div><div style="font-size:13px;margin-top:6px;">No content available. Upload the file to view it.</div></div>';
}

// ── Annotation layer ──────────────────────────────────────────────────────────
function setupAnnotationLayer() {
  // Re-apply saved highlights
  annotations.filter(function(a){return a.type==='highlight';}).forEach(function(a) {
    // Highlights are stored as text ranges — re-apply on render
    // (simplified: just show in panel)
  });
}

// ── Text selection ────────────────────────────────────────────────────────────
function onMouseUp(e) {
  setTimeout(function() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) {
      hideSelToolbar();
      return;
    }
    selectedText = sel.toString().trim();
    selectedRange = sel.getRangeAt(0).cloneRange();
    var rect = sel.getRangeAt(0).getBoundingClientRect();
    var toolbar = document.getElementById('sel-toolbar');
    toolbar.style.left = Math.min(rect.left, window.innerWidth - 280) + 'px';
    toolbar.style.top = (rect.top + window.scrollY - 44) + 'px';
    toolbar.classList.add('show');
  }, 10);
}

function hideSelToolbar() {
  document.getElementById('sel-toolbar').classList.remove('show');
}

function highlight(colour) {
  if (!selectedRange) return;
  var span = document.createElement('span');
  span.className = 'highlight-' + colour;
  span.title = 'Click to annotate';
  span.onclick = function() { annotateHighlight(span); };
  try {
    selectedRange.surroundContents(span);
  } catch(e) {
    // Range spans multiple elements — wrap each text node
    var frag = selectedRange.extractContents();
    span.appendChild(frag);
    selectedRange.insertNode(span);
  }
  var annot = {
    id: 'h-' + Date.now(),
    type: 'highlight',
    colour: colour,
    text: selectedText.substring(0, 200),
    note: '',
    created: new Date().toISOString()
  };
  annotations.push(annot);
  saveAnnotations();
  renderAnnotations();
  hideSelToolbar();
}

function annotateSelection() {
  hideSelToolbar();
  var note = prompt('Add annotation for: "' + selectedText.substring(0,80) + '"');
  if (!note) return;
  var annot = {
    id: 'n-' + Date.now(),
    type: 'note',
    text: selectedText.substring(0, 200),
    note: note,
    created: new Date().toISOString()
  };
  annotations.push(annot);
  saveAnnotations();
  renderAnnotations();
}

function annotateHighlight(span) {
  var note = prompt('Add note to highlight:');
  if (!note) return;
  var id = span.dataset.annotId;
  var annot = annotations.find(function(a){return a.id===id;});
  if (annot) { annot.note = note; saveAnnotations(); renderAnnotations(); }
}

function askAIAboutSelection() {
  hideSelToolbar();
  switchAnnotTab('ai');
  var input = document.getElementById('annot-input');
  if (input) input.value = 'Explain this passage: "' + selectedText.substring(0,300) + '"';
  sendAI();
}

function readSelection() {
  hideSelToolbar();
  if (!selectedText) return;
  readTextAloud(selectedText);
}

// ── Annotations ───────────────────────────────────────────────────────────────
function loadAnnotations(docId) {
  try {
    annotations = JSON.parse(localStorage.getItem('annot:' + docId) || '[]');
  } catch(e) { annotations = []; }
  renderAnnotations();
}

function saveAnnotations() {
  if (!docData) return;
  try { localStorage.setItem('annot:' + docData.id, JSON.stringify(annotations)); } catch(e) {}
}

function addNote() {
  var input = document.getElementById('annot-input');
  var note = input ? input.value.trim() : '';
  if (!note) return;
  annotations.push({
    id: 'n-' + Date.now(),
    type: 'note',
    text: '',
    note: note,
    created: new Date().toISOString()
  });
  if (input) input.value = '';
  saveAnnotations();
  renderAnnotations();
}

function renderAnnotations() {
  var body = document.getElementById('annot-body');
  var count = document.getElementById('annot-count');
  if (count) count.textContent = annotations.length;

  var filtered = annotations.filter(function(a) {
    if (currentAnnotTab === 'notes') return a.type === 'note';
    if (currentAnnotTab === 'highlights') return a.type === 'highlight';
    return false;
  });

  if (!filtered.length) {
    body.innerHTML = '<div style="font-size:12px;color:var(--fg-muted);padding:8px 0;">' +
      (currentAnnotTab === 'notes' ? 'No notes yet. Select text and click 📝, or type below.' :
       currentAnnotTab === 'highlights' ? 'No highlights yet. Select text and click a colour.' :
       '') + '</div>';
    return;
  }

  body.innerHTML = '';
  filtered.slice().reverse().forEach(function(a) {
    var div = document.createElement('div');
    div.className = 'annot-item';
    var colourDot = a.colour ? '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + {yellow:'#ffdd00',blue:'#2d6a9f',green:'#16a34a',red:'#dc2626'}[a.colour] + ';margin-right:4px;"></span>' : '';
    div.innerHTML = (a.text ? '<div class="annot-item-text">' + colourDot + '"' + a.text.substring(0,80) + (a.text.length>80?'...':'"') + '</div>' : '') +
      (a.note ? '<div class="annot-item-note">' + a.note.replace(/</g,'&lt;') + '</div>' : '') +
      '<div class="annot-item-meta">' + new Date(a.created).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) +
      ' <button onclick="deleteAnnotation(\'' + a.id + '\')" style="background:none;border:none;cursor:pointer;color:#dc2626;font-size:10px;margin-left:6px;">✕</button></div>';
    body.appendChild(div);
  });
}

function deleteAnnotation(id) {
  annotations = annotations.filter(function(a){return a.id!==id;});
  saveAnnotations();
  renderAnnotations();
}

function exportAnnotations() {
  var lines = ['# Annotations: ' + (docData ? docData.name : 'Document'), ''];
  annotations.forEach(function(a) {
    lines.push('## ' + (a.type==='highlight'?'Highlight':'Note') + ' — ' + new Date(a.created).toLocaleString('en-GB'));
    if (a.text) lines.push('> ' + a.text);
    if (a.note) lines.push(a.note);
    lines.push('');
  });
  var blob = new Blob([lines.join('\n')], {type:'text/markdown'});
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = (docData ? docData.name : 'document') + '-annotations.md';
  link.click();
}

// ── AI chat ───────────────────────────────────────────────────────────────────
var aiHistory = [];

function switchAnnotTab(tab, btn) {
  currentAnnotTab = tab;
  document.querySelectorAll('.annot-tab').forEach(function(t){t.classList.remove('active');});
  if (btn) btn.classList.add('active');
  else document.querySelectorAll('.annot-tab').forEach(function(t){if(t.textContent.toLowerCase()===tab)t.classList.add('active');});

  var addArea = document.getElementById('annot-add');
  if (tab === 'ai') {
    if (addArea) {
      addArea.innerHTML = '<textarea class="annot-textarea" id="annot-input" placeholder="Ask about this document..."></textarea><button class="annot-send" onclick="sendAI()">Ask</button>';
    }
    renderAIChat();
  } else {
    if (addArea) {
      addArea.innerHTML = '<textarea class="annot-textarea" id="annot-input" placeholder="Add a note about this document..."></textarea><button class="annot-send" onclick="addNote()">Add Note</button>';
    }
    renderAnnotations();
  }
}

function renderAIChat() {
  var body = document.getElementById('annot-body');
  if (!aiHistory.length) {
    body.innerHTML = '<div style="font-size:12px;color:var(--fg-muted);padding:8px 0;">Ask anything about this document. Select text first to ask about a specific passage.</div>';
    return;
  }
  body.innerHTML = '';
  aiHistory.forEach(function(m) {
    var div = document.createElement('div');
    div.className = 'ai-msg ' + m.role;
    div.textContent = m.content;
    body.appendChild(div);
  });
  body.scrollTop = body.scrollHeight;
}

function sendAI() {
  var input = document.getElementById('annot-input');
  var text = input ? input.value.trim() : '';
  if (!text) return;
  if (input) input.value = '';

  var docContext = docData ? 'Document: ' + docData.name + '. ' : '';
  if (docData && docData.content) docContext += 'Content excerpt: ' + docData.content.substring(0, 3000) + '. ';

  aiHistory.push({role:'user', content:text});
  renderAIChat();

  var messages = [
    {role:'system', content:'You are a study assistant helping Simon analyse academic documents. ' + docContext + 'British English. Be precise and cite specific passages when possible.'}
  ].concat(aiHistory);

  fetch(WORKER + '/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:messages, profile:'balanced'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var response = d.content || 'No response.';
    aiHistory.push({role:'assistant', content:response});
    renderAIChat();
  })
  .catch(function(e){
    aiHistory.push({role:'assistant', content:'Error: ' + e.message});
    renderAIChat();
  });
}

// ── TTS ───────────────────────────────────────────────────────────────────────
function readAloudDoc() {
  var pane = document.getElementById('doc-pane');
  var text = pane.innerText || pane.textContent || '';
  readTextAloud(text.substring(0, 5000));
}

function readTextAloud(text) {
  if (!text) return;
  var voice = document.getElementById('tts-voice') ? document.getElementById('tts-voice').value : 'aura-arcas-en';
  document.getElementById('tts-bar').style.display = 'flex';
  document.getElementById('tts-status').textContent = 'Generating audio...';
  document.getElementById('stop-btn').style.display = 'inline-block';

  fetch(WORKER + '/api/tts/read', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:text, voice:voice, provider:'deepgram'})
  })
  .then(function(r){
    if (!r.ok) throw new Error('TTS failed: ' + r.status);
    return r.blob();
  })
  .then(function(blob){
    if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
    var url = URL.createObjectURL(blob);
    ttsAudio = new Audio(url);
    ttsAudio.play();
    document.getElementById('tts-status').textContent = 'Playing...';
    ttsAudio.onended = function() {
      document.getElementById('tts-status').textContent = 'Done';
      document.getElementById('stop-btn').style.display = 'none';
    };
  })
  .catch(function(e){
    document.getElementById('tts-status').textContent = 'Error: ' + e.message;
    document.getElementById('stop-btn').style.display = 'none';
  });
}

function stopReading() {
  if (ttsAudio) { ttsAudio.pause(); ttsAudio = null; }
  document.getElementById('tts-status').textContent = 'Stopped';
  document.getElementById('stop-btn').style.display = 'none';
}

// ── Zoom ──────────────────────────────────────────────────────────────────────
function zoomIn() { zoom = Math.min(zoom + 0.1, 2.0); applyZoom(); }
function zoomOut() { zoom = Math.max(zoom - 0.1, 0.5); applyZoom(); }
function zoomReset() { zoom = 1.0; applyZoom(); }
function applyZoom() {
  var content = document.querySelector('.doc-content');
  if (content) content.style.fontSize = Math.round(16 * zoom) + 'px';
}
</script>
