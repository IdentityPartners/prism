<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3b3a'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
/* ── Chat layout ── */
.chat-shell {
  display: flex;
  height: 100vh;
  overflow: hidden;
}
.chat-sidebar {
  width: 240px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  overflow: hidden;
}
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.chat-right {
  width: 240px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  overflow-y: auto;
}
@media(max-width:1200px){.chat-right{display:none;}}
@media(max-width:900px){.chat-sidebar{display:none;}}
@media(max-width:800px){.chat-sidebar{display:none;}}

/* ── Conversation list ── */
.conv-header {
  padding: 12px 12px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.conv-header h3 { font-size: 13px; font-weight: 600; margin: 0; }
.conv-search {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.conv-search input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  background: var(--bg);
  color: var(--fg);
  box-sizing: border-box;
}
.conv-list { flex: 1; overflow-y: auto; }
.conv-item {
  padding: 10px 12px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.conv-item:hover { background: var(--bg-sunken); }
.conv-item.active { background: var(--accent-light, #e8f0f8); border-left: 3px solid var(--accent); }
.conv-title { font-size: 12.5px; font-weight: 500; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-meta { font-size: 10px; color: var(--fg-muted); margin-top: 2px; display: flex; justify-content: space-between; }
.conv-actions { display: none; gap: 4px; }
.conv-item:hover .conv-actions { display: flex; }
.conv-action-btn { padding: 2px 6px; font-size: 10px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: var(--bg); color: var(--fg-muted); }
.conv-action-btn:hover { color: var(--accent); border-color: var(--accent); }
.conv-action-btn.del:hover { color: #dc2626; border-color: #dc2626; }

/* ── Chat header ── */
.chat-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-elevated);
  flex-shrink: 0;
}
.chat-persona-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0f3b3a, #5c2d3f);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.chat-persona-name { font-size: 14px; font-weight: 600; }
.chat-persona-status { font-size: 11px; color: var(--fg-muted); }
.chat-header-actions { margin-left: auto; display: flex; gap: 6px; }

/* ── Messages ── */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.msg { display: flex; gap: 10px; align-items: flex-start; max-width: 85%; }
.msg.user { flex-direction: row-reverse; align-self: flex-end; }
.msg.assistant { align-self: flex-start; }
.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
  background: linear-gradient(135deg, #0f3b3a, #5c2d3f);
  color: #fff;
}
.msg.user .msg-avatar { background: var(--accent); }
.msg-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.msg-bubble {
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.6;
  word-wrap: break-word;
}
.msg.assistant .msg-bubble {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--fg);
  border-radius: 4px 12px 12px 12px;
}
.msg.user .msg-bubble {
  background: var(--accent);
  color: #fff;
  border-radius: 12px 4px 12px 12px;
}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3 { margin: 12px 0 6px; font-size: 1em; font-weight: 700; }
.msg-bubble p { margin: 0 0 8px; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble ul,.msg-bubble ol { margin: 6px 0; padding-left: 20px; }
.msg-bubble li { margin: 3px 0; }
.msg-bubble code { background: rgba(0,0,0,0.08); padding: 1px 5px; border-radius: 3px; font-size: 0.9em; font-family: monospace; }
.msg-bubble pre { background: rgba(0,0,0,0.06); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
.msg-bubble pre code { background: none; padding: 0; }
.msg-bubble strong { font-weight: 700; }
.msg-bubble em { font-style: italic; }
.msg-bubble blockquote { border-left: 3px solid var(--accent); padding-left: 10px; margin: 8px 0; color: var(--fg-muted); }
.msg-bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
.msg-bubble th,.msg-bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.msg-bubble th { background: var(--bg-sunken); font-weight: 600; }
.msg-meta {
  font-size: 10px;
  color: var(--fg-muted);
  display: flex;
  gap: 8px;
  align-items: center;
}
.msg.user .msg-meta { justify-content: flex-end; }
.msg-actions { display: none; gap: 4px; }
.msg:hover .msg-actions { display: flex; }
.msg-action { padding: 2px 7px; font-size: 10px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: var(--bg); color: var(--fg-muted); }
.msg-action:hover { color: var(--accent); border-color: var(--accent); }

/* ── Typing indicator ── */
.typing-indicator { display: none; align-items: center; gap: 4px; padding: 8px 14px; }
.typing-indicator.show { display: flex; }
.typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-muted); animation: typingBounce 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

/* ── Input area ── */
.chat-input-area {
  border-top: 1px solid var(--border);
  background: var(--bg-elevated);
  padding: 10px 12px;
  flex-shrink: 0;
}
.attach-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 6px;
  min-height: 0;
}
.attach-badge {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: var(--accent-light, #e8f0f8);
  border: 1px solid var(--accent);
  border-radius: 12px;
  font-size: 11px;
  color: var(--accent);
}
.attach-badge button { background: none; border: none; cursor: pointer; color: var(--accent); font-size: 12px; padding: 0; line-height: 1; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.chat-textarea {
  flex: 1;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  min-height: 44px;
  max-height: 200px;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  transition: border-color 0.15s;
}
.chat-textarea:focus { outline: none; border-color: var(--accent); }
.send-btn {
  width: 44px; height: 44px;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.15s;
}
.send-btn:hover { opacity: 0.85; }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.input-toolbar {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.toolbar-btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  background: var(--bg);
  color: var(--fg-muted);
  font-family: inherit;
  transition: all 0.15s;
}
.toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
.toolbar-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── Right panel ── */
.right-section { padding: 12px; border-bottom: 1px solid var(--border); }
.right-section h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fg-muted); margin: 0 0 8px; }
.model-select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--bg); color: var(--fg); cursor: pointer; }
.profile-btns { display: flex; flex-wrap: wrap; gap: 4px; }
.profile-btn { padding: 4px 10px; border: 1px solid var(--border); border-radius: 12px; font-size: 11px; cursor: pointer; background: var(--bg); color: var(--fg-muted); font-family: inherit; }
.profile-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.routing-log { font-size: 10px; color: var(--fg-muted); font-family: monospace; line-height: 1.6; max-height: 120px; overflow-y: auto; }
.action-btn { display: block; width: 100%; padding: 7px 10px; margin-bottom: 5px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer; background: var(--bg); color: var(--fg); font-family: inherit; text-align: left; transition: all 0.15s; }
.action-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── OSK ── */
#osk-container {
  border-top: 1px solid var(--border);
  background: var(--bg-elevated);
  display: none;
  flex-shrink: 0;
}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>

<div class="chat-shell" id="chat-shell">

<!-- ── Left: Conversation list ── -->
<div class="chat-sidebar">
  <div class="conv-header">
    <h3>💬 Conversations</h3>
    <button onclick="newConversation()" style="padding:4px 10px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">+ New</button>
  </div>
  <div class="conv-search">
    <input type="text" id="conv-search" placeholder="Search conversations..." oninput="filterConversations(this.value)">
  </div>
  <div class="conv-list" id="conv-list">
    <div style="padding:20px;text-align:center;font-size:12px;color:var(--fg-muted);">Loading...</div>
  </div>
</div>

<!-- ── Centre: Chat ── -->
<div class="chat-main">
  <div class="chat-header">
    <div class="chat-persona-avatar" id="persona-avatar">🎩</div>
    <div>
      <div class="chat-persona-name" id="persona-name">Gerald</div>
      <div class="chat-persona-status" id="persona-status">Argentica · ready</div>
    </div>
    <div class="chat-header-actions">
      <button class="toolbar-btn" onclick="toggleOSK()" title="On-screen keyboard" id="osk-toggle-btn">⌨</button>
      <button class="toolbar-btn" onclick="clearChat()" title="Clear conversation">✕ Clear</button>
      <button class="toolbar-btn" onclick="exportChat()" title="Export conversation">⬇ Export</button>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div style="text-align:center;padding:40px 20px;color:var(--fg-muted);">
      <div style="font-size:32px;margin-bottom:12px;">🎩</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:6px;">Good day, sir.</div>
      <div style="font-size:13px;">What are we working on?</div>
    </div>
  </div>

  <div class="typing-indicator" id="typing-indicator">
    <div class="chat-persona-avatar" style="width:24px;height:24px;font-size:11px;">🎩</div>
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:8px 12px;display:flex;gap:4px;">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <div class="chat-input-area">
    <div class="attach-strip" id="attach-strip"></div>
    <div class="input-row">
      <input type="file" id="file-input" multiple accept=".md,.txt,.pdf,.csv,.json,.docx,.png,.jpg,.jpeg" style="display:none" onchange="handleFiles(this)">
      <textarea class="chat-textarea" id="chat-input" placeholder="What are we working on? (Enter to send, Shift+Enter for new line)"
        onkeydown="handleKey(event)" oninput="autoGrow(this)" rows="1"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">↑</button>
    </div>
    <div class="input-toolbar">
      <button class="toolbar-btn" onclick="document.getElementById('file-input').click()" title="Attach file">📎 Attach</button>
      <button class="toolbar-btn" onclick="quickAction('research')" title="Research mode">🔍 Research</button>
      <button class="toolbar-btn" onclick="quickAction('draft')" title="Draft mode">✍ Draft</button>
      <button class="toolbar-btn" onclick="quickAction('atomise')" title="Atomise content">⚡ Atomise</button>
      <button class="toolbar-btn" onclick="quickAction('image')" title="Generate image">🎨 Image</button>
      <button class="toolbar-btn" onclick="startDictation()" title="Voice input" id="dictate-btn">🎤 Dictate</button>
      <button class="toolbar-btn" onclick="toggleMultiModel()" id="multi-btn" title="Compare multiple models">⚡ Multi</button>
    </div>
  </div>

  <div id="osk-container" style="display:none;"></div>
</div>

<!-- ── Right: Settings ── -->
<div class="chat-right">
  <div class="right-section">
    <h4>Model</h4>
    <select class="model-select" id="model-select" onchange="setModelOverride(this.value)">
      <option value="">Auto (Orchestrator)</option>
      <optgroup label="Frontier — Thinking">
        <option value="mistral:zai-glm-5-3">GLM 5.3 via Mistral (1M, thinking)</option>
        <option value="mistral:mistral-large-4">Mistral Large 4 (1M, thinking)</option>
      </optgroup>
      <optgroup label="Frontier — Fast">
        <option value="nvidia:google/gemma-4-31b-it">Gemma 4 31B NVIDIA (269ms)</option>
        <option value="gemini:gemma-4-31b-it">Gemma 4 31B Gemini (Search)</option>
        <option value="deepseek:deepseek-chat">DeepSeek V4 Flash (1M)</option>
        <option value="xai:grok-3-mini">Grok 3 Mini (real-time X)</option>
      </optgroup>
      <optgroup label="Balanced">
        <option value="cohere:command-r-plus-08-2024">Cohere Command R+ (RAG)</option>
        <option value="openrouter:minimax/minimax-m3.1-flash:free">MiniMax M3.1 (free, 1M)</option>
      </optgroup>
      <optgroup label="Fast">
        <option value="cerebras:gpt-oss-120b">GPT-OSS Cerebras (300+ tok/s)</option>
        <option value="groq:meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout Groq (131K)</option>
      </optgroup>
    </select>
  </div>

  <div class="right-section">
    <h4>Routing Profile</h4>
    <div class="profile-btns">
      <button class="profile-btn active" onclick="setProfile('balanced',this)">Balanced</button>
      <button class="profile-btn" onclick="setProfile('fast',this)">Fast</button>
      <button class="profile-btn" onclick="setProfile('frontier',this)">Frontier</button>
    </div>
  </div>

  <div class="right-section">
    <h4>Last Response</h4>
    <div class="routing-log" id="routing-log">—</div>
  </div>

  <div class="right-section">
    <h4>Actions</h4>
    <button class="action-btn" onclick="saveToMemory()">🧠 Save to Memory</button>
    <button class="action-btn" onclick="sendToDrafting()">✍ Send to Drafting</button>
    <button class="action-btn" onclick="sendToAtomise()">⚡ Send to Atomise</button>
    <button class="action-btn" onclick="saveToWorkspace()">📁 Save to Workspace</button>
  </div>

  <div class="right-section">
    <h4>Conversation</h4>
    <div id="conv-info" style="font-size:11px;color:var(--fg-muted);">New conversation</div>
  </div>
</div>

</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var currentThreadId = null;
var chatHistory = [];
var attachments = [];
var profile = 'balanced';
var modelOverride = null;
var multiModelActive = false;
var allConversations = [];
var isStreaming = false;

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  // Build sidebar
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/chat/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }


  // Load conversations
  loadConversations();

  // Focus input
  setTimeout(function() {
    var inp = document.getElementById('chat-input');
    if (inp) inp.focus();
  }, 300);

  // Load saved profile
  try {
    var saved = localStorage.getItem('chat-profile');
    if (saved) setProfile(saved);
  } catch(e) {}
});

// ── Conversations ─────────────────────────────────────────────────────────────
function loadConversations() {
  fetch(WORKER + '/api/threads')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      allConversations = d.threads || [];
      renderConversations(allConversations);
    })
    .catch(function() {
      document.getElementById('conv-list').innerHTML = '<div style="padding:12px;font-size:12px;color:var(--fg-muted);">Could not load conversations.</div>';
    });
}

function renderConversations(convs) {
  var list = document.getElementById('conv-list');
  if (!convs.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:var(--fg-muted);">No conversations yet.</div>';
    return;
  }
  list.innerHTML = convs.map(function(c) {
    var date = c.updated ? new Date(c.updated).toLocaleDateString('en-GB', {day:'numeric',month:'short'}) : '';
    var active = c.id === currentThreadId ? ' active' : '';
    return '<div class="conv-item' + active + '" id="conv-' + c.id + '" onclick="loadConversation(\'' + c.id + '\')">' +
      '<div class="conv-title">' + (c.title || 'Conversation').replace(/</g,'&lt;') + '</div>' +
      '<div class="conv-meta"><span>' + (c.messageCount || 0) + ' messages</span><span>' + date + '</span>' +
      '<div class="conv-actions">' +
        '<button class="conv-action-btn del" onclick="deleteConversation(\'' + c.id + '\',event)" title="Delete">✕</button>' +
      '</div></div>' +
      '</div>';
  }).join('');
}

function filterConversations(q) {
  var filtered = q ? allConversations.filter(function(c) { return (c.title||'').toLowerCase().includes(q.toLowerCase()); }) : allConversations;
  renderConversations(filtered);
}

function loadConversation(id) {
  currentThreadId = id;
  document.querySelectorAll('.conv-item').forEach(function(el) { el.classList.remove('active'); });
  var el = document.getElementById('conv-' + id);
  if (el) el.classList.add('active');

  fetch(WORKER + '/api/threads/' + id)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      chatHistory = [];
      var msgs = document.getElementById('chat-messages');
      msgs.innerHTML = '';
      (d.messages || []).forEach(function(m) {
        chatHistory.push({ role: m.role, content: m.content });
        if (m.role !== 'system') appendMessage(m.role, m.content, m.provider, m.ts);
      });
      msgs.scrollTop = msgs.scrollHeight;
      document.getElementById('conv-info').textContent = d.title || 'Conversation';
    });
}

function newConversation() {
  currentThreadId = null;
  chatHistory = [];
  attachments = [];
  updateAttachStrip();
  var msgs = document.getElementById('chat-messages');
  msgs.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--fg-muted);"><div style="font-size:32px;margin-bottom:12px;">🎩</div><div style="font-size:15px;font-weight:600;margin-bottom:6px;">Good day, sir.</div><div style="font-size:13px;">What are we working on?</div></div>';
  document.querySelectorAll('.conv-item').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('conv-info').textContent = 'New conversation';
  document.getElementById('routing-log').textContent = '—';
  document.getElementById('chat-input').focus();
}

function deleteConversation(id, e) {
  e.stopPropagation();
  if (!confirm('Delete this conversation?')) return;
  fetch(WORKER + '/api/threads/' + id, { method: 'DELETE' })
    .then(function() {
      allConversations = allConversations.filter(function(c) { return c.id !== id; });
      renderConversations(allConversations);
      if (currentThreadId === id) newConversation();
    });
}

// ── Send message ──────────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function sendMessage() {
  var input = document.getElementById('chat-input');
  var text = input.value.trim();
  if (!text && !attachments.length) return;
  if (isStreaming) return;

  var fullText = text;

  // Add file context
  if (attachments.length > 0) {
    attachments.forEach(function(att) {
      if (att.content) fullText += '\n\n[Attached: ' + att.name + ']\n' + att.content.substring(0, 30000);
      else fullText += '\n\n[Image attached: ' + att.name + ']';
    });
  }

  input.value = '';
  input.style.height = 'auto';
  attachments = [];
  updateAttachStrip();

  chatHistory.push({ role: 'user', content: fullText });
  appendMessage('user', text);

  if (!currentThreadId) currentThreadId = 't' + Date.now();

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('typing-indicator').classList.add('show');
  scrollToBottom();

  var body = {
    messages: chatHistory,
    profile: profile,
    threadId: currentThreadId,
  };
  if (modelOverride) {
    var parts = modelOverride.split(':');
    body.providerOverride = parts[0];
    body.modelOverride = parts.slice(1).join(':');
  }

  fetch(WORKER + '/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    document.getElementById('typing-indicator').classList.remove('show');
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;

    var content = d.content || 'No response.';
    chatHistory.push({ role: 'assistant', content: content });
    appendMessage('assistant', content, d.provider, Date.now());

    // Update routing log
    if (d.routingLog) {
      document.getElementById('routing-log').textContent = d.routingLog.join('\n');
    } else if (d.provider) {
      document.getElementById('routing-log').textContent = d.provider + ' / ' + (d.model || '');
    }

    // Update conversation list
    loadConversations();
    scrollToBottom();
  })
  .catch(function(e) {
    document.getElementById('typing-indicator').classList.remove('show');
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    appendMessage('assistant', 'Error: ' + e.message);
    scrollToBottom();
  });
}

// ── Render messages ───────────────────────────────────────────────────────────
function appendMessage(role, content, provider, ts) {
  var msgs = document.getElementById('chat-messages');

  // Remove welcome screen
  var welcome = msgs.querySelector('[style*="text-align:center"]');
  if (welcome) welcome.remove();

  var div = document.createElement('div');
  div.className = 'msg ' + role;

  var avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'user' ? 'S' : '🎩';

  var body = document.createElement('div');
  body.className = 'msg-body';

  var bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = renderMarkdown(content);

  var meta = document.createElement('div');
  meta.className = 'msg-meta';
  var timeStr = ts ? new Date(ts).toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}) : '';
  var provStr = provider ? ' · ' + provider : '';
  meta.innerHTML = '<span>' + timeStr + provStr + '</span>';

  // Action buttons
  var actions = document.createElement('div');
  actions.className = 'msg-actions';
  if (role === 'assistant') {
    [['📋 Copy', function() { navigator.clipboard.writeText(content); }],
     ['✍ Draft', function() { window.location.href = '/drafting/?q=' + encodeURIComponent(content.substring(0,200)); }],
     ['⚡ Atomise', function() { window.location.href = '/atomise/?q=' + encodeURIComponent(content.substring(0,500)); }],
     ['🧠 Memory', function() { saveToMemoryDirect(content); }],
    ].forEach(function(item) {
      var btn = document.createElement('button');
      btn.className = 'msg-action';
      btn.textContent = item[0];
      btn.onclick = item[1];
      actions.appendChild(btn);
    });
  }

  body.appendChild(bubble);
  body.appendChild(meta);
  body.appendChild(actions);
  div.appendChild(avatar);
  div.appendChild(body);
  msgs.appendChild(div);
}

// ── Markdown renderer ─────────────────────────────────────────────────────────
function renderMarkdown(text) {
  if (!text) return '';
  // Escape HTML first
  var escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Code blocks
  escaped = escaped.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m, lang, code) {
    return '<pre><code>' + code.trim() + '</code></pre>';
  });
  // Inline code
  escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headers
  escaped = escaped.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  escaped = escaped.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  escaped = escaped.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Bold/italic
  escaped = escaped.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  escaped = escaped.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Blockquote
  escaped = escaped.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Horizontal rule
  escaped = escaped.replace(/^---+$/gm, '<hr>');
  // Tables
  escaped = escaped.replace(/^\|(.+)\|$/gm, function(m) {
    var cells = m.split('|').filter(function(c,i,a){return i>0&&i<a.length-1;});
    return '<tr>' + cells.map(function(c){return '<td>'+c.trim()+'</td>';}).join('') + '</tr>';
  });
  escaped = escaped.replace(/(<tr>.*<\/tr>\n?)+/g, function(m) {
    var rows = m.trim().split('\n');
    var header = rows[0];
    var body = rows.slice(2); // skip separator row
    return '<table><thead>' + header.replace(/td/g,'th') + '</thead><tbody>' + body.join('') + '</tbody></table>';
  });
  // Lists
  escaped = escaped.replace(/^(\s*[-*+] .+\n?)+/gm, function(m) {
    var items = m.trim().split('\n').map(function(l) { return '<li>' + l.replace(/^\s*[-*+] /,'') + '</li>'; });
    return '<ul>' + items.join('') + '</ul>';
  });
  escaped = escaped.replace(/^(\s*\d+\. .+\n?)+/gm, function(m) {
    var items = m.trim().split('\n').map(function(l) { return '<li>' + l.replace(/^\s*\d+\. /,'') + '</li>'; });
    return '<ol>' + items.join('') + '</ol>';
  });
  // Paragraphs
  escaped = escaped.replace(/\n\n+/g, '</p><p>');
  escaped = escaped.replace(/\n/g, '<br>');
  if (!escaped.startsWith('<')) escaped = '<p>' + escaped + '</p>';
  return escaped;
}

// ── File attachments ──────────────────────────────────────────────────────────
function handleFiles(input) {
  Array.from(input.files).forEach(function(file) {
    var isImage = /\.(png|jpg|jpeg|gif|webp)$/i.test(file.name);
    var reader = new FileReader();
    if (isImage) {
      reader.onload = function(e) {
        attachments.push({ name: file.name, size: file.size, type: 'image', dataUrl: e.target.result, content: null });
        updateAttachStrip();
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = function(e) {
        attachments.push({ name: file.name, size: file.size, type: 'text', content: e.target.result });
        updateAttachStrip();
      };
      reader.readAsText(file);
    }
  });
  input.value = '';
}

function updateAttachStrip() {
  var strip = document.getElementById('attach-strip');
  if (!attachments.length) { strip.innerHTML = ''; return; }
  strip.innerHTML = attachments.map(function(att, i) {
    var icon = att.type === 'image' ? '🖼' : '📎';
    var size = att.size > 1024 ? Math.round(att.size/1024) + 'KB' : att.size + 'B';
    return '<div class="attach-badge">' + icon + ' ' + att.name + ' (' + size + ')' +
      '<button onclick="removeAttachment(' + i + ')" title="Remove">✕</button></div>';
  }).join('');
}

function removeAttachment(i) {
  attachments.splice(i, 1);
  updateAttachStrip();
}

// ── Quick actions ─────────────────────────────────────────────────────────────
function quickAction(type) {
  var input = document.getElementById('chat-input');
  var prefixes = {
    research: 'Research: ',
    draft: 'Draft: ',
    atomise: 'Atomise this for social media: ',
    image: 'Generate an image of: ',
  };
  input.value = prefixes[type] || '';
  input.focus();
}

// ── Model / profile ───────────────────────────────────────────────────────────
function setModelOverride(val) {
  modelOverride = val || null;
}

function setProfile(p, btn) {
  profile = p;
  document.querySelectorAll('.profile-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  else {
    var btns = document.querySelectorAll('.profile-btn');
    btns.forEach(function(b) { if (b.textContent.toLowerCase().includes(p)) b.classList.add('active'); });
  }
  try { localStorage.setItem('chat-profile', p); } catch(e) {}
}

// ── Multi-model ───────────────────────────────────────────────────────────────
function toggleMultiModel() {
  multiModelActive = !multiModelActive;
  var btn = document.getElementById('multi-btn');
  btn.classList.toggle('active', multiModelActive);
  btn.textContent = multiModelActive ? '⚡ Multi ON' : '⚡ Multi';
}

// ── OSK ───────────────────────────────────────────────────────────────────────
function toggleOSK() {
  var container = document.getElementById('osk-container');
  var isHidden = container.style.display === 'none' || container.style.display === '';
  if (isHidden) {
    container.style.display = 'block';
    if (!container.children.length && typeof buildOSK === 'function') {
      buildOSK('chat-input');
    }
  } else {
    container.style.display = 'none';
  }
}

// ── Dictation ─────────────────────────────────────────────────────────────────
function startDictation() {
  if (typeof startDictation === 'function') {
    startDictation(document.getElementById('chat-input'));
  } else {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Speech recognition not supported.'); return; }
    var rec = new SR();
    rec.lang = 'en-GB';
    rec.onresult = function(e) {
      var inp = document.getElementById('chat-input');
      inp.value += e.results[0][0].transcript + ' ';
      autoGrow(inp);
    };
    rec.start();
    document.getElementById('dictate-btn').textContent = '🔴 Recording...';
    rec.onend = function() { document.getElementById('dictate-btn').textContent = '🎤 Dictate'; };
  }
}

// ── Actions ───────────────────────────────────────────────────────────────────
function saveToMemory() {
  var lastAssistant = chatHistory.filter(function(m){return m.role==='assistant';}).pop();
  if (!lastAssistant) { alert('No assistant message to save.'); return; }
  saveToMemoryDirect(lastAssistant.content);
}

function saveToMemoryDirect(content) {
  var fact = prompt('Save to memory as:', content.substring(0, 100));
  if (!fact) return;
  fetch(WORKER + '/api/memory/about-me', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ fact: fact })
  }).then(function() { alert('Saved to memory.'); });
}

function sendToDrafting() {
  var last = chatHistory.filter(function(m){return m.role==='assistant';}).pop();
  if (last) window.location.href = '/drafting/?q=' + encodeURIComponent(last.content.substring(0,500));
}

function sendToAtomise() {
  var last = chatHistory.filter(function(m){return m.role==='assistant';}).pop();
  if (last) window.location.href = '/atomise/?q=' + encodeURIComponent(last.content.substring(0,500));
}

function saveToWorkspace() {
  var last = chatHistory.filter(function(m){return m.role==='assistant';}).pop();
  if (!last) return;
  var wsId = prompt('Workspace ID (or leave blank for default):') || 'ws-ip-main';
  fetch(WORKER + '/api/workspaces/' + wsId, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ notes: [{ id: 'note-'+Date.now(), content: last.content, created: new Date().toISOString() }] })
  }).then(function() { alert('Saved to workspace.'); });
}

function clearChat() {
  if (!confirm('Clear this conversation?')) return;
  newConversation();
}

function exportChat() {
  var text = chatHistory.map(function(m) { return m.role.toUpperCase() + ':\n' + m.content; }).join('\n\n---\n\n');
  var blob = new Blob([text], {type:'text/plain'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'conversation-' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
}

function scrollToBottom() {
  var msgs = document.getElementById('chat-messages');
  msgs.scrollTop = msgs.scrollHeight;
}
</script>
