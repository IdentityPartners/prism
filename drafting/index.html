<style>
.draft-shell { display:flex; height:100vh; overflow:hidden; flex-direction:column; }
.draft-toolbar { padding:5px 10px; border-bottom:1px solid var(--border); background:var(--bg-elevated); display:flex; align-items:center; gap:3px; flex-wrap:wrap; flex-shrink:0; }
.tb { padding:5px 9px; border:1px solid var(--border); border-radius:5px; cursor:pointer; font-size:13px; background:var(--bg); color:var(--fg); font-family:inherit; transition:all 0.15s; display:flex; align-items:center; gap:4px; }
.tb:hover { border-color:var(--accent); color:var(--accent); }
.tb.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.tb-sep { width:1px; height:22px; background:var(--border); margin:0 3px; flex-shrink:0; }
.tb-sel { padding:5px 7px; border:1px solid var(--border); border-radius:5px; font-size:13px; background:var(--bg); color:var(--fg); cursor:pointer; }
.draft-body { flex:1; overflow:hidden; display:flex; flex-direction:column; }

/* View switcher */
.view-tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg-elevated); flex-shrink:0; }
.view-tab { padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; color:var(--fg-muted); }
.view-tab.active { border-bottom-color:var(--accent); color:var(--accent); }

/* Write view (full screen WriteHandy) */
.write-view { flex:1; display:none; flex-direction:column; overflow:hidden; }
.write-view.active { display:flex; }
.write-toolbar { padding:6px 10px; border-bottom:1px solid var(--border); background:var(--bg-elevated); display:flex; gap:5px; flex-wrap:wrap; flex-shrink:0; }
.write-canvas-wrap { flex:1; overflow:hidden; background:#fff; position:relative; }
.write-canvas-wrap canvas { display:block; touch-action:none; }
.write-status { padding:4px 12px; border-top:1px solid var(--border); background:var(--bg-elevated); font-size:12px; color:var(--fg-muted); flex-shrink:0; display:flex; gap:12px; align-items:center; }

/* Type view (Quill) */
.type-view { flex:1; display:none; flex-direction:column; overflow:hidden; }
.type-view.active { display:flex; }
.quill-wrap { flex:1; overflow:hidden; display:flex; flex-direction:column; }
.ql-container { flex:1; overflow-y:auto; font-size:17px !important; font-family:var(--font-ui,Inter,sans-serif) !important; border:none !important; }
.ql-editor { min-height:100%; padding:32px 60px !important; max-width:860px; margin:0 auto; color:var(--fg) !important; line-height:1.8 !important; }
.ql-editor.ql-blank::before { color:var(--fg-muted) !important; font-style:italic; }
.ql-toolbar { display:none !important; }
.ql-editor h1 { font-size:28px; font-weight:700; font-family:var(--font-heading,Georgia,serif); }
.ql-editor h2 { font-size:22px; font-weight:700; }
.ql-editor h3 { font-size:18px; font-weight:600; }
.ql-editor blockquote { border-left:3px solid var(--accent); padding-left:14px; color:var(--fg-muted); font-style:italic; }
.ql-editor code { background:var(--bg-sunken); padding:2px 5px; border-radius:3px; font-family:monospace; }
.ql-editor pre { background:var(--bg-sunken); padding:12px; border-radius:6px; }

/* AI panel */
.ai-panel { width:0; flex-shrink:0; border-left:1px solid var(--border); display:flex; flex-direction:column; background:var(--bg-surface); overflow:hidden; transition:width 0.2s; }
.ai-panel.open { width:280px; }
.ai-panel-hdr { padding:9px 12px; border-bottom:1px solid var(--border); font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.ai-panel-body { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:6px; }
.ai-action { padding:8px 10px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:13px; background:var(--bg); color:var(--fg); font-family:inherit; text-align:left; transition:all 0.15s; display:flex; align-items:center; gap:6px; }
.ai-action:hover { border-color:var(--accent); color:var(--accent); }
.ai-result { background:var(--bg-elevated); border:1px solid var(--border); border-radius:6px; padding:9px; font-size:13px; line-height:1.5; max-height:200px; overflow-y:auto; }
.ai-input { width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; resize:none; min-height:60px; background:var(--bg); color:var(--fg); box-sizing:border-box; }
.ai-send { width:100%; padding:7px; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-family:inherit; margin-top:5px; }

.draft-status { padding:4px 12px; border-top:1px solid var(--border); background:var(--bg-elevated); display:flex; gap:14px; font-size:12px; color:var(--fg-muted); flex-shrink:0; }

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var quill = null;
var saveTimer = null;
var docId = 'draft-' + Date.now();
var hwStrokes = [], hwCurrent = null, hwDrawing = false;
var hwToolName = 'pen', hwSz = 2, hwCol = '#1a2332';
var currentView = 'type';

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/drafting/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  initQuill();
  loadSaved();
});

// ── Quill init ────────────────────────────────────────────────────────────────
function initQuill() {
  if (typeof Quill === 'undefined') {
    setTimeout(initQuill, 100);
    return;
  }
  quill = new Quill('#quill-editor', {
    theme: 'snow',
    placeholder: 'Start writing… or switch to Handwrite mode above.',
    modules: { toolbar: false, history: { delay: 1000, maxStack: 200 } }
  });
  var qlEditor = document.querySelector('#quill-editor .ql-editor');
  if (qlEditor) qlEditor.style.cssText = 'min-height:calc(100vh - 200px);padding:32px 60px;font-size:17px;line-height:1.8;color:var(--fg);outline:none;';
  var qlContainer = document.querySelector('#quill-editor .ql-container');
  if (qlContainer) qlContainer.style.cssText = 'border:none;font-size:17px;flex:1;overflow-y:auto;';
  quill.on('text-change', function() { updateCounts(); scheduleSave(); });
  console.log('Quill ready');
}

function qcmd(format, value) {
  if (!quill) return;
  var current = quill.getFormat();
  if (value === undefined) {
    quill.format(format, !current[format]);
  } else {
    quill.format(format, current[format] === value ? false : value);
  }
}

function qHighlight() {
  if (!quill) return;
  var f = quill.getFormat();
  quill.format('background', f.background ? false : '#ffff00');
}

function qUndo() { if (quill) quill.history.undo(); }
function qRedo() { if (quill) quill.history.redo(); }

function applyFormat(tag) {
  if (!quill) return;
  if (tag === 'p') quill.format('header', false);
  else quill.format('header', parseInt(tag.replace('h','')));
}

// ── View switching ────────────────────────────────────────────────────────────
function switchView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(function(t){t.classList.remove('active');});
  if (btn) btn.classList.add('active');
  else {
    var tabEl = document.getElementById('tab-' + view);
    if (tabEl) tabEl.classList.add('active');
  }
  document.getElementById('view-type').classList.toggle('active', view === 'type');
  document.getElementById('view-write').classList.toggle('active', view === 'write');
  document.getElementById('view-split').classList.toggle('active', view === 'split');
  if (view === 'write' || view === 'split') {
    setTimeout(initHWCanvas, 100);
  }
  if (view === 'type' && quill) {
    setTimeout(function() { quill.focus(); }, 100);
  }
}

// ── Counts & save ─────────────────────────────────────────────────────────────
function updateCounts() {
  if (!quill) return;
  var text = quill.getText() || '';
  var words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('word-count').textContent = words + ' words';
  document.getElementById('char-count').textContent = text.length + ' chars';
}

function scheduleSave() {
  clearTimeout(saveTimer);
  document.getElementById('save-status').textContent = 'Unsaved';
  saveTimer = setTimeout(autoSave, 1500);
}

function autoSave() {
  if (!quill) return;
  var title = document.getElementById('doc-title').value || 'Untitled';
  var html = quill.root.innerHTML;
  try { localStorage.setItem('draft:' + docId, JSON.stringify({title:title,html:html,saved:new Date().toISOString()})); } catch(e) {}
  fetch(WORKER + '/api/notes/save', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:docId, title:title, content:html, module:'Drafting'})
  }).then(function(){
    document.getElementById('save-status').textContent = 'Saved ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  }).catch(function(){
    document.getElementById('save-status').textContent = 'Saved locally';
  });
}

function loadSaved() {
  var params = new URLSearchParams(window.location.search);
  var q = params.get('q');
  if (q && quill) {
    setTimeout(function() { quill.setText(q); }, 300);
    return;
  }
  var keys = Object.keys(localStorage).filter(function(k){return k.startsWith('draft:');});
  if (!keys.length) return;
  var latest = keys.sort().pop();
  try {
    var d = JSON.parse(localStorage.getItem(latest));
    if (d && d.html && quill) {
      docId = latest.replace('draft:','');
      document.getElementById('doc-title').value = d.title || '';
      setTimeout(function() {
        quill.root.innerHTML = d.html;
        updateCounts();
      }, 300);
    }
  } catch(e) {}
}

// ── Export / import ───────────────────────────────────────────────────────────
function exportDoc(fmt) {
  var title = document.getElementById('doc-title').value || 'document';
  var html = quill ? quill.root.innerHTML : '';
  var text = quill ? quill.getText() : '';
  var content, mime, ext;
  if (fmt === 'md') {
    content = html
      .replace(/<h1[^>]*>([\s\S]*?)<\/h1>/gi,'# $1\n\n')
      .replace(/<h2[^>]*>([\s\S]*?)<\/h2>/gi,'## $1\n\n')
      .replace(/<h3[^>]*>([\s\S]*?)<\/h3>/gi,'### $1\n\n')
      .replace(/<strong[^>]*>([\s\S]*?)<\/strong>/gi,'**$1**')
      .replace(/<em[^>]*>([\s\S]*?)<\/em>/gi,'*$1*')
      .replace(/<li[^>]*>([\s\S]*?)<\/li>/gi,'- $1\n')
      .replace(/<p[^>]*>([\s\S]*?)<\/p>/gi,'$1\n\n')
      .replace(/<[^>]+>/g,'')
      .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ');
    mime='text/markdown'; ext='.md';
  } else if (fmt === 'html') {
    content='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+title+'</title><style>body{font-family:Georgia,serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.7;font-size:17px;}</style></head><body>'+html+'</body></html>';
    mime='text/html'; ext='.html';
  } else {
    content=text; mime='text/plain'; ext='.txt';
  }
  var blob=new Blob([content],{type:mime});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=title+ext;
  a.click();
}

function importFile(input) {
  var file=input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result;
    if(quill) {
      quill.root.innerHTML='<p>'+text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')+'</p>';
      document.getElementById('doc-title').value=file.name.replace(/\.[^.]+$/,'');
      updateCounts(); scheduleSave();
    }
  };
  reader.readAsText(file);
  input.value='';
}

// ── AI ────────────────────────────────────────────────────────────────────────
function getSelOrAll() {
  if (quill) {
    var range=quill.getSelection();
    if(range&&range.length>0) return quill.getText(range.index,range.length);
    return quill.getText().substring(0,2000);
  }
  return '';
}

function aiDo(type) {
  var text=getSelOrAll();
  var prompts={
    improve:'Improve the writing quality. Keep the same meaning. British English. Return only the improved text:\n\n',
    expand:'Expand with more detail. British English. Return only the expanded text:\n\n',
    summarise:'Summarise concisely. British English. Return only the summary:\n\n',
    academic:'Rewrite in formal academic tone for sociology. British English. Return only the rewritten text:\n\n',
    citations:'Suggest 3-5 academic citations. Format: Author (Year). Title. Journal. Return only the list:\n\n',
    continue:'Continue writing from where this ends. Match the style. British English. Return only the continuation:\n\n'
  };
  runAI((prompts[type]||'')+text);
}

function aiCustom() {
  var instruction=document.getElementById('ai-custom').value.trim();
  var text=getSelOrAll();
  if(!instruction) return;
  runAI(instruction+'\n\nText:\n\n'+text);
}

function runAI(prompt) {
  var resultEl=document.getElementById('ai-result');
  resultEl.style.display='block';
  resultEl.textContent='Working…';
  fetch(WORKER+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],profile:'balanced'})})
  .then(function(r){return r.json();})
  .then(function(d){
    var result=d.content||'No response.';
    resultEl.textContent=result;
    var btn=document.createElement('button');
    btn.textContent='Insert into document';
    btn.style.cssText='display:block;width:100%;margin-top:6px;padding:6px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:12px;';
    btn.onclick=function(){
      if(quill){var range=quill.getSelection(true);quill.insertText(range.index,result+'\n');}
      resultEl.style.display='none';
      scheduleSave();
    };
    resultEl.appendChild(btn);
  })
  .catch(function(e){resultEl.textContent='Error: '+e.message;});
}

function toggleAI() {
  var panel=document.getElementById('ai-panel');
  panel.classList.toggle('open');
  document.getElementById('ai-btn').classList.toggle('on',panel.classList.contains('open'));
}

// ── Dictation ─────────────────────────────────────────────────────────────────
function dictate() {
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Speech recognition not supported.');return;}
  var rec=new SR();
  rec.lang='en-GB';
  rec.onresult=function(e){
    if(quill){var range=quill.getSelection(true);quill.insertText(range.index,e.results[0][0].transcript+' ');}
    scheduleSave();
  };
  rec.start();
  var btn=document.getElementById('dictate-btn');
  btn.innerHTML='<span style="color:#dc2626;">&#x1F534;</span>';
  rec.onend=function(){btn.innerHTML='<span class="iconify" data-icon="ph:microphone-bold" style="font-size:16px;"></span>';};
}

// ── Handwriting ───────────────────────────────────────────────────────────────
function initHWCanvas() {
  var canvasId = currentView === 'split' ? 'hw-canvas-split' : 'hw-canvas';
  var wrapId = currentView === 'split' ? 'hw-wrap-split' : 'hw-wrap';
  var wrap=document.getElementById(wrapId);
  var canvas=document.getElementById(canvasId);
  if(!wrap||!canvas) return;
  var dpr=window.devicePixelRatio||1;
  canvas.width=Math.floor(wrap.clientWidth*dpr);
  canvas.height=Math.floor(wrap.clientHeight*dpr);
  canvas.style.width=wrap.clientWidth+'px';
  canvas.style.height=wrap.clientHeight+'px';
  canvas._dpr=dpr;
  canvas.removeEventListener('pointerdown',hwStart);
  canvas.removeEventListener('pointermove',hwMove);
  canvas.removeEventListener('pointerup',hwEnd);
  canvas.addEventListener('pointerdown',hwStart);
  canvas.addEventListener('pointermove',hwMove);
  canvas.addEventListener('pointerup',hwEnd);
  canvas.addEventListener('pointercancel',hwEnd);
  hwRedraw(); // draws ruled lines + existing strokes
}

function hwPos(e) {
  var canvasId = currentView === 'split' ? 'hw-canvas-split' : 'hw-canvas';
  var c=document.getElementById(canvasId);
  var r=c.getBoundingClientRect();
  var dpr=c._dpr||1;
  return {x:(e.clientX-r.left)*dpr,y:(e.clientY-r.top)*dpr,pressure:e.pressure||0.5};
}

function hwStart(e){e.preventDefault();hwDrawing=true;hwCurrent={tool:hwToolName,col:hwCol,sz:hwSz,pts:[hwPos(e)]};}
function hwMove(e){if(!hwDrawing||!hwCurrent)return;e.preventDefault();hwCurrent.pts.push(hwPos(e));hwDrawStroke(hwCurrent,true);}
function hwEnd(e){
  if(!hwDrawing||!hwCurrent)return;
  hwDrawing=false;
  if(hwCurrent.pts.length>1){hwStrokes.push(hwCurrent);}
  hwCurrent=null;
  var sc=document.getElementById('hw-stroke-count');
  if(sc) sc.textContent=hwStrokes.length+' strokes';
}

function hwDrawStroke(stroke,inc) {
  var canvasId = currentView === 'split' ? 'hw-canvas-split' : 'hw-canvas';
  var c=document.getElementById(canvasId);
  if(!c) return;
  var ctx=c.getContext('2d');
  if(!inc) ctx.clearRect(0,0,c.width,c.height);
  if(!stroke.pts||stroke.pts.length<2) return;
  ctx.save();
  var toolProps={
    pen:{lw:stroke.sz,alpha:1,cap:'round',join:'round'},
    pencil:{lw:stroke.sz*0.8,alpha:0.7,cap:'round',join:'round'},
    marker:{lw:stroke.sz*4,alpha:0.9,cap:'square',join:'miter'},
    hi:{lw:stroke.sz*8,alpha:0.3,cap:'square',join:'miter'},
    erase:{lw:stroke.sz*5,alpha:1,cap:'round',join:'round'}
  };
  var tp=toolProps[stroke.tool]||toolProps.pen;
  if(stroke.tool==='erase'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='rgba(0,0,0,1)';}
  else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=stroke.col;ctx.globalAlpha=tp.alpha;}
  ctx.lineWidth=tp.lw;
  ctx.lineCap=tp.cap;
  ctx.lineJoin=tp.join;
  ctx.beginPath();
  ctx.moveTo(stroke.pts[0].x,stroke.pts[0].y);
  for(var i=1;i<stroke.pts.length;i++){
    if(i<stroke.pts.length-1){
      var mx=(stroke.pts[i].x+stroke.pts[i+1].x)/2;
      var my=(stroke.pts[i].y+stroke.pts[i+1].y)/2;
      ctx.quadraticCurveTo(stroke.pts[i].x,stroke.pts[i].y,mx,my);
    } else {ctx.lineTo(stroke.pts[i].x,stroke.pts[i].y);}
  }
  ctx.stroke();
  ctx.restore();
}

var hwShowLines = true;
var hwLineSpacing = 40; // px between lines

function drawRuledLines(canvas) {
  if (!hwShowLines) return;
  var ctx = canvas.getContext('2d');
  var dpr = canvas._dpr || 1;
  ctx.save();
  ctx.strokeStyle = 'rgba(180,200,220,0.5)';
  ctx.lineWidth = 1;
  // Horizontal ruled lines
  for (var y = hwLineSpacing * dpr; y < canvas.height; y += hwLineSpacing * dpr) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
  // Left margin line
  ctx.strokeStyle = 'rgba(220,150,150,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(60 * dpr, 0);
  ctx.lineTo(60 * dpr, canvas.height);
  ctx.stroke();
  ctx.restore();
}

function toggleRuledLines() {
  hwShowLines = !hwShowLines;
  var btn = document.getElementById('hw-lines-btn');
  if (btn) btn.classList.toggle('on', hwShowLines);
  hwRedraw();
}

function hwRedraw() {
  var canvasId = currentView === 'split' ? 'hw-canvas-split' : 'hw-canvas';
  var c=document.getElementById(canvasId);
  if(!c) return;
  var ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  drawRuledLines(c);
  hwStrokes.forEach(function(s){hwDrawStroke(s,false);});
}

function hwTool(t) {
  hwToolName=t;
  ['pen','pencil','marker','hi','erase'].forEach(function(n){
    var b=document.getElementById('hw-'+n);
    if(b) b.classList.toggle('on',n===t);
  });
  var lbl=document.getElementById('hw-tool-label');
  if(lbl) lbl.textContent=t.charAt(0).toUpperCase()+t.slice(1)+' · '+hwSz+'px';
}

function hwColor(col) {
  hwCol=col;
  document.querySelectorAll('.write-toolbar div[onclick^="hwColor"]').forEach(function(el){
    el.style.borderColor=el.style.background===col?'var(--fg)':'transparent';
  });
}

function hwUndo() {
  if(hwStrokes.length===0) return;
  hwStrokes.pop();
  hwRedraw();
  var sc=document.getElementById('hw-stroke-count');
  if(sc) sc.textContent=hwStrokes.length+' strokes';
}

function hwClear() {
  if(!confirm('Clear all handwriting?')) return;
  hwStrokes=[];
  hwRedraw();
  var sc=document.getElementById('hw-stroke-count');
  if(sc) sc.textContent='0 strokes';
}

function hwOCR() {
  var canvasId = currentView === 'split' ? 'hw-canvas-split' : 'hw-canvas';
  var c=document.getElementById(canvasId);
  if(!c) return;
  var ocrCanvas=document.createElement('canvas');
  var dpr=c._dpr||1;
  ocrCanvas.width=Math.floor(c.width/dpr);
  ocrCanvas.height=Math.floor(c.height/dpr);
  ocrCanvas.getContext('2d').drawImage(c,0,0,ocrCanvas.width,ocrCanvas.height);
  var b64=ocrCanvas.toDataURL('image/png').split(',')[1];
  var status=document.getElementById('hw-ocr-status');
  if(status) status.textContent='Running OCR…';
  fetch(WORKER+'/api/ocr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,mime_type:'image/png'})})
  .then(function(r){return r.json();})
  .then(function(d){
    var text=d.text||d.content||'';
    if(status) status.textContent=text?'OCR done':'No text detected';
    if(text&&quill){
      var range=quill.getSelection(true);
      quill.insertText(range.index,text+'\n');
      scheduleSave();
      if(currentView==='split'||currentView==='write') switchView('type');
    } else if(text) {
      alert('OCR result: '+text+'\n\nSwitch to Type view to insert.');
    }
  })
  .catch(function(e){if(status) status.textContent='OCR error: '+e.message;});
}
</script>
