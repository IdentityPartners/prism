<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drafting Desk &mdash; Argentica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3b3a'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<!-- cache-bust-1792755442 -->
<style>
.draft-shell{display:flex;height:100vh;overflow:hidden;}
.draft-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.draft-toolbar{padding:6px 12px;border-bottom:1px solid var(--border);background:var(--bg-elevated);display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.tb{padding:5px 9px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:13px;background:var(--bg);color:var(--fg);font-family:inherit;transition:all 0.15s;min-width:28px;text-align:center;}
.tb:hover{border-color:var(--accent);color:var(--accent);}
.tb.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 3px;flex-shrink:0;}
.tb-sel{padding:5px 7px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:var(--bg);color:var(--fg);cursor:pointer;}
.draft-body{flex:1;overflow:hidden;display:flex;}
.draft-editor-wrap{flex:1;overflow-y:auto;padding:32px 60px;max-width:860px;margin:0 auto;width:100%;box-sizing:border-box;}
.draft-editor{outline:none;font-size:17px;line-height:1.8;color:var(--fg);min-height:calc(100vh - 160px);font-family:var(--font-ui,Inter,sans-serif);}
.draft-editor:empty::before{content:"Start writing6";color:var(--fg-muted);pointer-events:none;}
.draft-editor h1{font-size:28px;font-weight:700;margin:20px 0 10px;font-family:var(--font-heading,Georgia,serif);}
.draft-editor h2{font-size:22px;font-weight:700;margin:16px 0 8px;}
.draft-editor h3{font-size:18px;font-weight:600;margin:12px 0 6px;}
.draft-editor p{margin:0 0 10px;}
.draft-editor ul,.draft-editor ol{padding-left:24px;margin:8px 0;}
.draft-editor li{margin:4px 0;}
.draft-editor blockquote{border-left:3px solid var(--accent);padding-left:14px;margin:10px 0;color:var(--fg-muted);font-style:italic;}
.draft-editor code{background:var(--bg-sunken);padding:2px 5px;border-radius:3px;font-family:monospace;font-size:0.9em;}
.draft-editor pre{background:var(--bg-sunken);padding:12px;border-radius:6px;overflow-x:auto;margin:10px 0;}
.draft-editor table{border-collapse:collapse;width:100%;margin:10px 0;}
.draft-editor td,.draft-editor th{border:1px solid var(--border);padding:6px 10px;}
.draft-editor th{background:var(--bg-sunken);font-weight:600;}
.draft-status{padding:4px 12px;border-top:1px solid var(--border);background:var(--bg-elevated);display:flex;gap:14px;font-size:12px;color:var(--fg-muted);flex-shrink:0;}
.ai-panel{width:260px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface);overflow:hidden;transition:width 0.2s;}
.ai-panel.closed{width:0;overflow:hidden;}
.ai-panel-hdr{padding:9px 12px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.ai-panel-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px;}
.ai-action{padding:7px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;background:var(--bg);color:var(--fg);font-family:inherit;text-align:left;transition:all 0.15s;}
.ai-action:hover{border-color:var(--accent);color:var(--accent);}
.ai-result{background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;padding:9px;font-size:12px;line-height:1.5;max-height:180px;overflow-y:auto;}
.ai-input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;resize:none;min-height:55px;background:var(--bg);color:var(--fg);box-sizing:border-box;}
.ai-send{width:100%;padding:6px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;margin-top:4px;}
.hw-panel{width:0;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface);overflow:hidden;transition:width 0.2s;}
.hw-panel.open{width:340px;}
.hw-panel-hdr{padding:9px 12px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hw-canvas-wrap{flex:1;overflow:hidden;position:relative;background:#fff;}
.hw-canvas-wrap canvas{display:block;touch-action:none;cursor:crosshair;}
.hw-toolbar{padding:6px 8px;border-top:1px solid var(--border);display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="draft-shell">
<div class="draft-main">
  <div class="draft-toolbar">
    <select class="tb-sel" id="fmt-sel" onchange="applyFormat(this.value)">
      <option value="p">Paragraph</option>
      <option value="h1">Heading 1</option>
      <option value="h2">Heading 2</option>
      <option value="h3">Heading 3</option>
    </select>
    <div class="tb-sep"></div>
    <button class="tb" onclick="cmd('bold')" title="Bold"><strong>B</strong></button>
    <button class="tb" onclick="cmd('italic')" title="Italic"><em>I</em></button>
    <button class="tb" onclick="cmd('strikeThrough')" title="Strikethrough"><s>S</s></button>
    <button class="tb" onclick="cmd('hiliteColor','#ffff00')" title="Highlight">&#x1F7E1;</button>
    <div class="tb-sep"></div>
    <button class="tb" onclick="cmd('insertUnorderedList')" title="Bullet list">&#x2022;&#x2014;</button>
    <button class="tb" onclick="cmd('insertOrderedList')" title="Numbered list">1.</button>
    <button class="tb" onclick="wrapBlock('blockquote')" title="Blockquote">&ldquo;</button>
    <button class="tb" onclick="cmd('insertHorizontalRule')" title="Divider">&mdash;</button>
    <div class="tb-sep"></div>
    <button class="tb" onclick="cmd('undo')" title="Undo">&#x21B6;</button>
    <button class="tb" onclick="cmd('redo')" title="Redo">&#x21B7;</button>
    <div class="tb-sep"></div>
    <button class="tb" onclick="document.getElementById('file-attach').click()" title="Import file">&#x1F4CE; Import</button>
    <input type="file" id="file-attach" style="display:none" accept=".md,.txt,.csv" onchange="importFile(this)">
    <button class="tb" onclick="exportDoc('md')" title="Export Markdown">&#x2B07; MD</button>
    <button class="tb" onclick="exportDoc('html')" title="Export HTML">&#x2B07; HTML</button>
    <button class="tb" onclick="exportDoc('txt')" title="Export text">&#x2B07; TXT</button>
    <div class="tb-sep"></div>
    <button class="tb" onclick="toggleAI()" id="ai-btn" title="AI assistant">&#x2728; AI</button>
    <button class="tb" onclick="toggleHW()" id="hw-btn" title="Handwriting panel">&#x2712; Write</button>
    <button class="tb" onclick="dictate()" id="dictate-btn" title="Voice dictation">&#x1F3A4;</button>
    <div class="tb-sep"></div>
    <input id="doc-title" type="text" placeholder="Document title&hellip;" style="padding:4px 8px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-weight:600;background:var(--bg);color:var(--fg);width:160px;" oninput="scheduleSave()">
  </div>
  <div class="draft-body">
    <div class="draft-editor-wrap">
      <div class="draft-editor" id="editor" contenteditable="true"
           onkeyup="onEdit()" onmouseup="onEdit()" oninput="scheduleSave()"></div>
    </div>
    <div class="ai-panel closed" id="ai-panel">
      <div class="ai-panel-hdr"><span>&#x2728; AI Assistant</span><button onclick="toggleAI()" style="background:none;border:none;cursor:pointer;color:var(--fg-muted);">&#x2715;</button></div>
      <div class="ai-panel-body">
        <button class="ai-action" onclick="aiDo('improve')">&#x270F; Improve writing</button>
        <button class="ai-action" onclick="aiDo('expand')">&#x2B06; Expand selection</button>
        <button class="ai-action" onclick="aiDo('summarise')">&#x2B07; Summarise</button>
        <button class="ai-action" onclick="aiDo('academic')">&#x1F393; Academic tone</button>
        <button class="ai-action" onclick="aiDo('citations')">&#x1F4DA; Suggest citations</button>
        <button class="ai-action" onclick="aiDo('continue')">&#x27A1; Continue writing</button>
        <div style="border-top:1px solid var(--border);margin:5px 0;padding-top:5px;">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--fg-muted);margin-bottom:4px;">Custom</div>
          <textarea class="ai-input" id="ai-custom" placeholder="Tell AI what to do with selected text&hellip;"></textarea>
          <button class="ai-send" onclick="aiCustom()">Apply</button>
        </div>
        <div id="ai-result" class="ai-result" style="display:none;"></div>
      </div>
    </div>
    <div class="hw-panel" id="hw-panel">
      <div class="hw-panel-hdr"><span>&#x2712; Handwriting</span><button onclick="toggleHW()" style="background:none;border:none;cursor:pointer;color:var(--fg-muted);">&#x2715;</button></div>
      <div class="hw-canvas-wrap" id="hw-wrap"><canvas id="hw-canvas"></canvas></div>
      <div class="hw-toolbar">
        <button class="tb on" id="hw-pen" onclick="hwTool('pen')">&#x2712; Pen</button>
        <button class="tb" id="hw-hi" onclick="hwTool('hi')">&#x1F7E1; Hi</button>
        <button class="tb" id="hw-erase" onclick="hwTool('erase')">&#x2B1C; Erase</button>
        <input type="range" min="1" max="16" value="2" id="hw-size" style="width:60px;" oninput="hwSz=parseInt(this.value)">
        <button class="tb" onclick="hwClear()">&#x1F5D1;</button>
        <button class="tb" onclick="hwOCR()">OCR &#x2192; Text</button>
      </div>
    </div>
  </div>
  <div class="draft-status">
    <span id="word-count">0 words</span>
    <span id="char-count">0 chars</span>
    <span id="save-status">Not saved</span>
  </div>
</div>
</div>
</div>
<script>

var WORKER = 'https://prism-api.identitypartners.workers.dev';
var saveTimer = null;
var docId = 'draft-' + Date.now();
var hwStrokes = [], hwCurrent = null, hwDrawing = false, hwToolName = 'pen', hwSz = 2;

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/drafting/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  loadSaved();
  document.getElementById('editor').focus();
});

function cmd(command, value) {
  document.getElementById('editor').focus();
  document.execCommand(command, false, value || null);
  scheduleSave();
}

function applyFormat(tag) {
  document.getElementById('editor').focus();
  document.execCommand('formatBlock', false, tag === 'p' ? 'p' : tag);
  scheduleSave();
}

function wrapBlock(tag) {
  document.getElementById('editor').focus();
  document.execCommand('formatBlock', false, tag);
  scheduleSave();
}

function onEdit() {
  var editor = document.getElementById('editor');
  var text = editor.innerText || '';
  var words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('word-count').textContent = words + ' words';
  document.getElementById('char-count').textContent = text.length + ' chars';
}

function scheduleSave() {
  onEdit();
  clearTimeout(saveTimer);
  document.getElementById('save-status').textContent = 'Unsaved';
  saveTimer = setTimeout(autoSave, 1500);
}

function autoSave() {
  var title = document.getElementById('doc-title').value || 'Untitled';
  var html = document.getElementById('editor').innerHTML;
  try { localStorage.setItem('draft:' + docId, JSON.stringify({title:title,html:html,saved:new Date().toISOString()})); } catch(e) {}
  fetch(WORKER + '/api/notes/save', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:docId, title:title, content:html, module:'Drafting'})
  }).then(function(){
    document.getElementById('save-status').textContent = 'Saved ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  }).catch(function(){
    document.getElementById('save-status').textContent = 'Saved locally';
  });
}

function loadSaved() {
  var params = new URLSearchParams(window.location.search);
  var q = params.get('q');
  if (q) {
    document.getElementById('editor').innerHTML = '<p>' + q.replace(/</g,'&lt;') + '</p>';
    onEdit();
    return;
  }
  var keys = Object.keys(localStorage).filter(function(k){return k.startsWith('draft:');});
  if (!keys.length) return;
  var latest = keys.sort().pop();
  try {
    var d = JSON.parse(localStorage.getItem(latest));
    if (d && d.html) {
      docId = latest.replace('draft:','');
      document.getElementById('doc-title').value = d.title || '';
      document.getElementById('editor').innerHTML = d.html;
      onEdit();
    }
  } catch(e) {}
}

function exportDoc(fmt) {
  var title = document.getElementById('doc-title').value || 'document';
  var html = document.getElementById('editor').innerHTML;
  var text = document.getElementById('editor').innerText || '';
  var content, mime, ext;
  if (fmt === 'md') {
    content = html
      .replace(/<h1[^>]*>([\s\S]*?)<\/h1>/gi, '# $1\n\n')
      .replace(/<h2[^>]*>([\s\S]*?)<\/h2>/gi, '## $1\n\n')
      .replace(/<h3[^>]*>([\s\S]*?)<\/h3>/gi, '### $1\n\n')
      .replace(/<strong[^>]*>([\s\S]*?)<\/strong>/gi, '**$1**')
      .replace(/<em[^>]*>([\s\S]*?)<\/em>/gi, '*$1*')
      .replace(/<li[^>]*>([\s\S]*?)<\/li>/gi, '- $1\n')
      .replace(/<p[^>]*>([\s\S]*?)<\/p>/gi, '$1\n\n')
      .replace(/<[^>]+>/g, '')
      .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ');
    mime = 'text/markdown'; ext = '.md';
  } else if (fmt === 'html') {
    content = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + title + '</title><style>body{font-family:Georgia,serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.7;font-size:17px;}</style></head><body>' + html + '</body></html>';
    mime = 'text/html'; ext = '.html';
  } else {
    content = text; mime = 'text/plain'; ext = '.txt';
  }
  var blob = new Blob([content],{type:mime});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = title + ext;
  a.click();
}

function importFile(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var html = text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/^# (.+)$/gm,'<h1>$1</h1>')
      .replace(/^## (.+)$/gm,'<h2>$1</h2>')
      .replace(/^### (.+)$/gm,'<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/\n\n/g,'</p><p>')
      .replace(/\n/g,'<br>');
    document.getElementById('editor').innerHTML = '<p>' + html + '</p>';
    document.getElementById('doc-title').value = file.name.replace(/\.[^.]+$/,'');
    onEdit(); scheduleSave();
  };
  reader.readAsText(file);
  input.value = '';
}

function getSelOrAll() {
  var sel = window.getSelection();
  if (sel && sel.toString().trim()) return sel.toString().trim();
  return (document.getElementById('editor').innerText || '').substring(0,2000);
}

function aiDo(type) {
  var text = getSelOrAll();
  var prompts = {
    improve: 'Improve the writing quality. Keep the same meaning. British English. Return only the improved text:\n\n',
    expand: 'Expand with more detail. British English. Return only the expanded text:\n\n',
    summarise: 'Summarise concisely. British English. Return only the summary:\n\n',
    academic: 'Rewrite in formal academic tone for sociology. British English. Return only the rewritten text:\n\n',
    citations: 'Suggest 3-5 academic citations that support this. Format: Author (Year). Title. Journal. Return only the list:\n\n',
    continue: 'Continue writing from where this ends. Match the style. British English. Return only the continuation:\n\n'
  };
  runAI((prompts[type]||'') + text);
}

function aiCustom() {
  var instruction = document.getElementById('ai-custom').value.trim();
  var text = getSelOrAll();
  if (!instruction) return;
  runAI(instruction + '\n\nText:\n\n' + text);
}

function runAI(prompt) {
  var resultEl = document.getElementById('ai-result');
  resultEl.style.display = 'block';
  resultEl.textContent = 'Working...';
  fetch(WORKER + '/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:[{role:'user',content:prompt}],profile:'balanced'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var result = d.content || 'No response.';
    resultEl.textContent = result;
    var insertBtn = document.createElement('button');
    insertBtn.textContent = 'Insert into document';
    insertBtn.style.cssText = 'display:block;width:100%;margin-top:6px;padding:5px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;';
    insertBtn.onclick = function() {
      document.getElementById('editor').focus();
      document.execCommand('insertHTML', false, '<p>' + result.replace(/\n/g,'<br>') + '</p>');
      resultEl.style.display = 'none';
      scheduleSave();
    };
    resultEl.appendChild(insertBtn);
  })
  .catch(function(e){ resultEl.textContent = 'Error: ' + e.message; });
}

function toggleAI() {
  var panel = document.getElementById('ai-panel');
  panel.classList.toggle('closed');
  document.getElementById('ai-btn').classList.toggle('on', !panel.classList.contains('closed'));
}

function toggleHW() {
  var panel = document.getElementById('hw-panel');
  panel.classList.toggle('open');
  document.getElementById('hw-btn').classList.toggle('on', panel.classList.contains('open'));
  if (panel.classList.contains('open')) initHWCanvas();
}

function initHWCanvas() {
  var wrap = document.getElementById('hw-wrap');
  var canvas = document.getElementById('hw-canvas');
  canvas.width = wrap.clientWidth || 320;
  canvas.height = wrap.clientHeight || 400;
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
  canvas.removeEventListener('pointerdown', hwStart);
  canvas.removeEventListener('pointermove', hwMove);
  canvas.removeEventListener('pointerup', hwEnd);
  canvas.addEventListener('pointerdown', hwStart);
  canvas.addEventListener('pointermove', hwMove);
  canvas.addEventListener('pointerup', hwEnd);
  canvas.addEventListener('pointercancel', hwEnd);
}

function hwPos(e) {
  var c = document.getElementById('hw-canvas');
  var r = c.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function hwStart(e) { e.preventDefault(); hwDrawing=true; hwCurrent={tool:hwToolName,sz:hwSz,pts:[hwPos(e)]}; }
function hwMove(e) { if(!hwDrawing||!hwCurrent) return; e.preventDefault(); hwCurrent.pts.push(hwPos(e)); hwDraw(hwCurrent,true); }
function hwEnd(e) { if(!hwDrawing||!hwCurrent) return; hwDrawing=false; if(hwCurrent.pts.length>1) hwStrokes.push(hwCurrent); hwCurrent=null; }

function hwDraw(stroke, inc) {
  var c = document.getElementById('hw-canvas');
  var ctx = c.getContext('2d');
  if (!inc) ctx.clearRect(0,0,c.width,c.height);
  if (!stroke.pts||stroke.pts.length<2) return;
  ctx.save();
  if (stroke.tool==='erase') { ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='rgba(0,0,0,1)'; ctx.lineWidth=stroke.sz*4; }
  else if (stroke.tool==='hi') { ctx.strokeStyle='rgba(255,220,0,0.4)'; ctx.lineWidth=stroke.sz*6; ctx.lineCap='square'; }
  else { ctx.strokeStyle='#1a2332'; ctx.lineWidth=stroke.sz; ctx.lineCap='round'; ctx.lineJoin='round'; }
  ctx.beginPath();
  ctx.moveTo(stroke.pts[0].x,stroke.pts[0].y);
  for(var i=1;i<stroke.pts.length;i++) ctx.lineTo(stroke.pts[i].x,stroke.pts[i].y);
  ctx.stroke();
  ctx.restore();
}

function hwTool(t) {
  hwToolName=t;
  ['pen','hi','erase'].forEach(function(n){
    var b=document.getElementById('hw-'+n);
    if(b) b.classList.toggle('on',n===t);
  });
}

function hwClear() { hwStrokes=[]; var c=document.getElementById('hw-canvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); }

function hwOCR() {
  var c = document.getElementById('hw-canvas');
  var b64 = c.toDataURL('image/png').split(',')[1];
  fetch(WORKER+'/api/ocr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,mime_type:'image/png'})})
  .then(function(r){return r.json();})
  .then(function(d){
    var text = d.text||d.content||'';
    if (text) {
      document.getElementById('editor').focus();
      document.execCommand('insertHTML',false,'<p>'+text.replace(/\n/g,'<br>')+'</p>');
      scheduleSave();
    } else { alert('No text detected.'); }
  })
  .catch(function(e){alert('OCR error: '+e.message);});
}

function dictate() {
  var SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition not supported.'); return; }
  var rec = new SR();
  rec.lang = 'en-GB';
  rec.onresult = function(e) {
    document.getElementById('editor').focus();
    document.execCommand('insertText',false,e.results[0][0].transcript+' ');
    scheduleSave();
  };
  rec.start();
  var btn = document.getElementById('dictate-btn');
  btn.innerHTML = '&#x1F534;';
  rec.onend = function() { btn.innerHTML = '&#x1F3A4;'; };
}

</script>
</body>
</html>
