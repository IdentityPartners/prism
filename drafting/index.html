<!-- TipTap (primary editor) - correct UMD bundle -->
<script>
// Load TipTap UMD bundles
(function() {
  var scripts = [
    'https://cdn.jsdelivr.net/npm/@tiptap/pm@2.10.3/dist/index.umd.min.js',
    'https://cdn.jsdelivr.net/npm/@tiptap/core@2.10.3/dist/index.umd.min.js',
    'https://cdn.jsdelivr.net/npm/@tiptap/starter-kit@2.10.3/dist/index.umd.min.js',
  ];
  var loaded = 0;
  function loadNext(i) {
    if (i >= scripts.length) { window._tiptapLoaded = true; return; }
    var s = document.createElement('script');
    s.src = scripts[i];
    s.onload = function() { loaded++; loadNext(i+1); };
    s.onerror = function() { window._tiptapFailed = true; loadQuill(); };
    document.head.appendChild(s);
  }
  loadNext(0);
})();
</script>

<style>
.draft-shell { display:flex; height:100vh; overflow:hidden; }
.draft-main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

/* Toolbar */
.draft-toolbar {

/* Editor area */

.draft-editor-wrap { flex:1; overflow-y:auto; padding:40px 60px; max-width:860px; margin:0 auto; width:100%; box-sizing:border-box; }

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var editor = null;
var saveTimer = null;
var currentDocId = 'draft-' + Date.now();

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/drafting/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }

  // Check if TipTap loaded
  if (typeof tiptap === 'undefined' && typeof StarterKit === 'undefined') {
    // Fallback: use contenteditable
    initFallbackEditor();
    return;
  }

  initTipTap();
  loadSavedDoc();
});

function initTipTap() {
  var container = document.getElementById('editor-container');
  if (!container) { console.error('No editor-container'); return; }

  // Use Quill directly — ProseMirror UMD bundles don't expose globals reliably
  if (typeof Quill !== 'undefined') {
    initQuillEditor(container);
    return;
  }

  // Wait for Quill to load (up to 4s)
  var attempts = 0;
  var check = setInterval(function() {
    attempts++;
    if (typeof Quill !== 'undefined') {
      clearInterval(check);
      initQuillEditor(container);
    } else if (attempts > 20) {
      clearInterval(check);
      initFallbackEditor(container);
    }
  }, 200);
}

function initProseMirror(container) {
  // Build a ProseMirror editor (TipTap-compatible schema)
  var schema = prosemirrorSchemaBasic.schema;
  var plugins = [
    prosemirrorHistory.history(),
    prosemirrorKeymap.keymap(prosemirrorCommands.baseKeymap),
    prosemirrorKeymap.keymap({
      'Mod-z': prosemirrorHistory.undo,
      'Mod-y': prosemirrorHistory.redo,
      'Mod-b': prosemirrorCommands.toggleMark(schema.marks.strong),
      'Mod-i': prosemirrorCommands.toggleMark(schema.marks.em),
    }),
    prosemirrorInputrules.inputRules({rules: prosemirrorInputrules.allInputRules}),
  ];

  var state = prosemirrorState.EditorState.create({
    schema: schema,
    plugins: plugins
  });

  var view = new prosemirrorView.EditorView(container, {
    state: state,
    dispatchTransaction: function(tr) {
      var newState = view.state.apply(tr);
      view.updateState(newState);
      updateCounts();
      scheduleSave();
      updateToolbarState();
    }
  });

  // Style the editor
  container.querySelector('.ProseMirror').style.cssText = 'min-height:calc(100vh - 200px);padding:20px 0;font-size:17px;line-height:1.75;color:var(--fg);outline:none;';

  editor = {
    _view: view,
    _type: 'prosemirror',
    chain: function() {
      var v = view;
      var s = schema;
      return {
        focus: function() { v.focus(); return this; },
        toggleBold: function() { prosemirrorCommands.toggleMark(s.marks.strong)(v.state, v.dispatch); return this; },
        toggleItalic: function() { prosemirrorCommands.toggleMark(s.marks.em)(v.state, v.dispatch); return this; },
        toggleStrike: function() { if(s.marks.strikethrough) prosemirrorCommands.toggleMark(s.marks.strikethrough)(v.state, v.dispatch); return this; },
        toggleHighlight: function() { return this; },
        toggleBulletList: function() { prosemirrorSchemaList.wrapInList(s.nodes.bullet_list)(v.state, v.dispatch); return this; },
        toggleOrderedList: function() { prosemirrorSchemaList.wrapInList(s.nodes.ordered_list)(v.state, v.dispatch); return this; },
        toggleTaskList: function() { return this; },
        toggleBlockquote: function() { prosemirrorCommands.wrapIn(s.nodes.blockquote)(v.state, v.dispatch); return this; },
        toggleCodeBlock: function() { prosemirrorCommands.setBlockType(s.nodes.code_block)(v.state, v.dispatch); return this; },
        setHorizontalRule: function() { return this; },
        undo: function() { prosemirrorHistory.undo(v.state, v.dispatch); return this; },
        redo: function() { prosemirrorHistory.redo(v.state, v.dispatch); return this; },
        setHeading: function(opts) {
          var lvl = opts && opts.level ? opts.level : 1;
          prosemirrorCommands.setBlockType(s.nodes.heading, {level: lvl})(v.state, v.dispatch);
          return this;
        },
        setParagraph: function() { prosemirrorCommands.setBlockType(s.nodes.paragraph)(v.state, v.dispatch); return this; },
        insertContent: function(html) {
          var div = document.createElement('div');
          div.innerHTML = html;
          var slice = prosemirrorView.DOMParser.fromSchema(s).parseSlice(div);
          var tr = v.state.tr.replaceSelection(slice);
          v.dispatch(tr);
          return this;
        },
        setContent: function(html) {
          var div = document.createElement('div');
          div.innerHTML = html;
          var doc = prosemirrorView.DOMParser.fromSchema(s).parse(div);
          v.updateState(prosemirrorState.EditorState.create({schema: s, doc: doc, plugins: v.state.plugins}));
          return this;
        },
        run: function() {}
      };
    },
    getText: function() {
      var text = '';
      view.state.doc.forEach(function(node) { text += node.textContent + '\n'; });
      return text;
    },
    getHTML: function() {
      var div = document.createElement('div');
      div.appendChild(prosemirrorView.DOMSerializer.fromSchema(schema).serializeFragment(view.state.doc.content));
      return div.innerHTML;
    },
    isActive: function(type) { return false; },
    commands: {
      focus: function() { view.focus(); },
      setContent: function(html) {
        var div = document.createElement('div');
        div.innerHTML = html;
        var doc = prosemirrorView.DOMParser.fromSchema(schema).parse(div);
        view.updateState(prosemirrorState.EditorState.create({schema: schema, doc: doc, plugins: view.state.plugins}));
      }
    }
  };

  loadSavedDoc();
  console.log('ProseMirror editor ready');
}

function initQuillEditor(container) {
  var quill = new Quill(container, {
    theme: 'snow',
    placeholder: 'Start writing... or use the AI assistant.',
    modules: { toolbar: false, history: { delay: 1000, maxStack: 200 } }
  });

  var qlEditor = container.querySelector('.ql-editor');
  if (qlEditor) qlEditor.style.cssText = 'min-height:calc(100vh - 200px);padding:20px 0;font-size:17px;line-height:1.75;color:var(--fg);outline:none;';
  var qlContainer = container.querySelector('.ql-container');
  if (qlContainer) qlContainer.style.cssText = 'border:none;font-size:17px;';

  editor = {
    _quill: quill,
    _type: 'quill',
    chain: function() {
      var q = quill;
      return {
        focus: function() { q.focus(); return this; },
        toggleBold: function() { var f=q.getFormat(); q.format('bold',!f.bold); return this; },
        toggleItalic: function() { var f=q.getFormat(); q.format('italic',!f.italic); return this; },
        toggleStrike: function() { var f=q.getFormat(); q.format('strike',!f.strike); return this; },
        toggleHighlight: function() { var f=q.getFormat(); q.format('background',f.background?false:'#ffff00'); return this; },
        toggleBulletList: function() { var f=q.getFormat(); q.format('list',f.list==='bullet'?false:'bullet'); return this; },
        toggleOrderedList: function() { var f=q.getFormat(); q.format('list',f.list==='ordered'?false:'ordered'); return this; },
        toggleTaskList: function() { return this; },
        toggleBlockquote: function() { var f=q.getFormat(); q.format('blockquote',!f.blockquote); return this; },
        toggleCodeBlock: function() { var f=q.getFormat(); q.format('code-block',!f['code-block']); return this; },
        setHorizontalRule: function() { var r=q.getSelection(true); q.insertText(r?r.index:q.getLength(),'\n---\n'); return this; },
        undo: function() { q.history.undo(); return this; },
        redo: function() { q.history.redo(); return this; },
        setHeading: function(opts) { q.format('header',opts&&opts.level?opts.level:false); return this; },
        setParagraph: function() { q.format('header',false); return this; },
        insertContent: function(html) { var r=q.getSelection(true); q.clipboard.dangerouslyPasteHTML(r?r.index:q.getLength(),html); return this; },
        setContent: function(html) { q.setContents([]); q.clipboard.dangerouslyPasteHTML(0,html); return this; },
        run: function() {}
      };
    },
    getText: function() { return quill.getText(); },
    getHTML: function() { return quill.root.innerHTML; },
    isActive: function(type, opts) {
      var f = quill.getFormat();
      if (type==='bold') return !!f.bold;
      if (type==='italic') return !!f.italic;
      if (type==='bulletList') return f.list==='bullet';
      if (type==='orderedList') return f.list==='ordered';
      if (type==='heading'&&opts) return f.header===opts.level;
      return false;
    },
    commands: {
      focus: function() { quill.focus(); },
      setContent: function(html) { quill.setContents([]); quill.clipboard.dangerouslyPasteHTML(0,html); }
    }
  };

  quill.on('text-change', function() { updateCounts(); scheduleSave(); updateToolbarState(); });
  quill.on('selection-change', function() { updateToolbarState(); });
  loadSavedDoc();
  console.log('Quill editor ready (fallback)');
}

function initFallbackEditor(container) {
  if (!container) container = document.getElementById('editor-container');
  if (!container) return;
  container.contentEditable = 'true';
  container.style.cssText = 'min-height:calc(100vh - 200px);padding:20px 0;font-size:17px;line-height:1.75;color:var(--fg);outline:none;';
  container.addEventListener('input', function() { updateCounts(); scheduleSave(); });
  editor = {
    _type: 'fallback',
    chain: function() {
      return {
        focus: function() { container.focus(); return this; },
        toggleBold: function() { document.execCommand('bold'); return this; },
        toggleItalic: function() { document.execCommand('italic'); return this; },
        toggleStrike: function() { document.execCommand('strikeThrough'); return this; },
        toggleHighlight: function() { document.execCommand('backColor',false,'#ffff00'); return this; },
        toggleBulletList: function() { document.execCommand('insertUnorderedList'); return this; },
        toggleOrderedList: function() { document.execCommand('insertOrderedList'); return this; },
        toggleTaskList: function() { return this; },
        toggleBlockquote: function() { return this; },
        toggleCodeBlock: function() { return this; },
        setHorizontalRule: function() { document.execCommand('insertHorizontalRule'); return this; },
        undo: function() { document.execCommand('undo'); return this; },
        redo: function() { document.execCommand('redo'); return this; },
        setHeading: function() { return this; },
        setParagraph: function() { return this; },
        insertContent: function(html) { document.execCommand('insertHTML',false,html); return this; },
        setContent: function(html) { container.innerHTML = html; return this; },
        run: function() {}
      };
    },
    getText: function() { return container.innerText || ''; },
    getHTML: function() { return container.innerHTML || ''; },
    isActive: function() { return false; },
    commands: {
      focus: function() { container.focus(); },
      setContent: function(html) { container.innerHTML = html; }
    }
  };
  loadSavedDoc();
  console.log('Fallback contenteditable editor ready');
}

function updateToolbarState() {
  if (!editor || !editor.isActive) return;
  var btns = {
    'btn-bold': 'bold',
    'btn-italic': 'italic',
    'btn-ul': 'bulletList',
    'btn-ol': 'orderedList',
    'btn-task': 'taskList',
    'btn-quote': 'blockquote',
    'btn-code': 'codeBlock',
    'btn-highlight': 'highlight'
  };
  Object.keys(btns).forEach(function(id) {
    var btn = document.getElementById(id);
    if (btn) btn.classList.toggle('active', editor.isActive(btns[id]));
  });
  // Update heading select
  var sel = document.getElementById('heading-select');
  if (sel) {
    for (var i = 1; i <= 3; i++) {
      if (editor.isActive('heading', {level: i})) { sel.value = i; return; }
    }
    sel.value = 0;
  }
}

function setHeading(level) {
  if (!editor) return;
  var lvl = parseInt(level);
  if (lvl === 0) {
    editor.chain().focus().setParagraph().run();
  } else {
    editor.chain().focus().setHeading({level: lvl}).run();
  }
  updateToolbarState();
}

function updateCounts() {
  var text = editor ? (editor.getText ? editor.getText() : '') : '';
  var words = text.trim() ? text.trim().split(/\s+/).length : 0;
  var chars = text.length;
  document.getElementById('word-count').textContent = words + ' words';
  document.getElementById('char-count').textContent = chars + ' chars';
}

function scheduleSave() {
  clearTimeout(saveTimer);
  document.getElementById('save-status').textContent = 'Unsaved';
  saveTimer = setTimeout(autoSave, 2000);
}

function autoSave() {
  var title = document.getElementById('doc-title').value || 'Untitled';
  var content = editor ? (editor.getHTML ? editor.getHTML() : '') : '';
  var doc = {id: currentDocId, title: title, content: content, updated: new Date().toISOString()};
  try { localStorage.setItem('draft-' + currentDocId, JSON.stringify(doc)); } catch(e) {}
  fetch(WORKER + '/api/notes/save', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: currentDocId, title: title, content: content, module: 'Drafting'})
  }).then(function() {
    document.getElementById('save-status').textContent = 'Saved ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
  }).catch(function() {
    document.getElementById('save-status').textContent = 'Saved locally';
  });
}

function loadSavedDoc() {
  var params = new URLSearchParams(window.location.search);
  var q = params.get('q');
  if (q && editor && editor.commands) {
    setTimeout(function() {
      if (editor.chain) editor.chain().focus().setContent('<p>' + q + '</p>').run();
    }, 500);
  }
  // Load from localStorage
  var keys = Object.keys(localStorage).filter(function(k) { return k.startsWith('draft-'); });
  if (keys.length > 0) {
    var latest = keys.sort().pop();
    try {
      var doc = JSON.parse(localStorage.getItem(latest));
      if (doc && doc.content && editor && editor.chain) {
        currentDocId = doc.id || currentDocId;
        document.getElementById('doc-title').value = doc.title || '';
        setTimeout(function() {
          editor.chain().focus().setContent(doc.content).run();
          updateCounts();
        }, 600);
      }
    } catch(e) {}
  }
}

// ── AI actions ────────────────────────────────────────────────────────────────
function getSelectedOrAll() {
  if (!editor) return '';
  // For Quill: check Quill selection first
  if (editor._quill) {
    var range = editor._quill.getSelection();
    if (range && range.length > 0) {
      return editor._quill.getText(range.index, range.length);
    }
  }
  // Browser selection
  try {
    var sel = window.getSelection();
    if (sel && sel.toString().trim()) return sel.toString().trim();
  } catch(e) {}
  return editor.getText ? editor.getText().substring(0, 3000) : '';
}

function aiAction(type) {
  var text = getSelectedOrAll();
  if (!text) { alert('Select some text first, or write something.'); return; }
  var prompts = {
    improve: 'Improve the writing quality of this text. Keep the same meaning and length. British English. Return only the improved text:\n\n' + text,
    expand: 'Expand this text with more detail and depth. British English. Return only the expanded text:\n\n' + text,
    summarise: 'Summarise this text concisely. British English. Return only the summary:\n\n' + text,
    academic: 'Rewrite this in a formal academic tone suitable for a sociology dissertation. British English. Return only the rewritten text:\n\n' + text,
    citations: 'Suggest 3-5 academic citations that would support this argument. Format as: Author (Year). Title. Journal. Return only the citation list:\n\n' + text,
    continue: 'Continue writing from where this text ends. Match the style and tone. British English. Return only the continuation:\n\n' + text
  };
  runAI(prompts[type] || text);
}

function aiCustom() {
  var instruction = document.getElementById('ai-custom-input').value.trim();
  var text = getSelectedOrAll();
  if (!instruction) { alert('Enter an instruction.'); return; }
  runAI(instruction + '\n\nText:\n\n' + text);
}

function runAI(prompt) {
  var resultEl = document.getElementById('ai-result');
  resultEl.style.display = 'block';
  resultEl.textContent = 'Working...';
  fetch(WORKER + '/api/chat', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({messages: [{role:'user',content:prompt}], profile: 'balanced'})
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    var result = d.content || 'No response.';
    resultEl.textContent = result;
    document.getElementById('provider-badge').textContent = d.provider || '';
    // Add "Insert" button
    var insertBtn = document.createElement('button');
    insertBtn.textContent = 'Insert into document';
    insertBtn.style.cssText = 'display:block;width:100%;margin-top:6px;padding:5px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;';
    insertBtn.onclick = function() {
      if (editor && editor.chain) {
        editor.chain().focus().insertContent('<p>' + result.replace(/\n/g, '</p><p>') + '</p>').run();
      }
      resultEl.style.display = 'none';
    };
    resultEl.appendChild(insertBtn);
  })
  .catch(function(e) { resultEl.textContent = 'Error: ' + e.message; });
}

// ── Export ────────────────────────────────────────────────────────────────────
function openExport() { document.getElementById('export-modal').classList.add('open'); }
function closeExport() { document.getElementById('export-modal').classList.remove('open'); }

function exportAs(format) {
  closeExport();
  var title = document.getElementById('doc-title').value || 'document';
  var html = editor ? (editor.getHTML ? editor.getHTML() : '') : '';
  var text = editor ? (editor.getText ? editor.getText() : '') : '';

  if (format === 'md') {
    // Simple HTML to Markdown conversion
    var md = html
      .replace(/<h1[^>]*>(.*?)<\/h1>/gi, '# $1\n\n')
      .replace(/<h2[^>]*>(.*?)<\/h2>/gi, '## $1\n\n')
      .replace(/<h3[^>]*>(.*?)<\/h3>/gi, '### $1\n\n')
      .replace(/<strong[^>]*>(.*?)<\/strong>/gi, '**$1**')
      .replace(/<em[^>]*>(.*?)<\/em>/gi, '*$1*')
      .replace(/<blockquote[^>]*>(.*?)<\/blockquote>/gis, '> $1\n\n')
      .replace(/<li[^>]*>(.*?)<\/li>/gi, '- $1\n')
      .replace(/<p[^>]*>(.*?)<\/p>/gi, '$1\n\n')
      .replace(/<[^>]+>/g, '')
      .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ');
    download(title + '.md', md, 'text/markdown');
  } else if (format === 'txt') {
    download(title + '.txt', text, 'text/plain');
  } else if (format === 'html') {
    var fullHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + title + '</title><style>body{font-family:Georgia,serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.7;font-size:16px;}</style></head><body>' + html + '</body></html>';
    download(title + '.html', fullHtml, 'text/html');
  } else if (format === 'docx') {
    // Send to Worker for DOCX generation
    fetch(WORKER + '/api/document/generate-docx', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title: title, html: html, text: text})
    })
    .then(function(r) {
      if (r.ok) return r.blob();
      throw new Error('DOCX generation failed');
    })
    .then(function(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = title + '.docx'; a.click();
    })
    .catch(function(e) {
      // Fallback: download as HTML with .doc extension (opens in Word)
      alert('DOCX generation not available. Downloading as HTML (open in Word).');
      var fullHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + title + '</title></head><body>' + html + '</body></html>';
      download(title + '.doc', fullHtml, 'application/msword');
    });
  }
}

function download(filename, content, mimeType) {
  var blob = new Blob([content], {type: mimeType});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// ── Other actions ─────────────────────────────────────────────────────────────
function saveToWorkspace() {
  var title = document.getElementById('doc-title').value || 'Untitled';
  var content = editor ? (editor.getHTML ? editor.getHTML() : '') : '';
  fetch(WORKER + '/api/notes/save', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: currentDocId, title: title, content: content, module: 'Drafting', tags: ['draft']})
  }).then(function() { alert('Saved to Workspace.'); });
}

function sendToAtomise() {
  var text = editor ? (editor.getText ? editor.getText() : '') : '';
  window.location.href = '/atomise/?q=' + encodeURIComponent(text.substring(0, 1000));
}

function toggleAI() {
  var panel = document.getElementById('ai-panel');
  panel.classList.toggle('collapsed');
}

function dictate() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition not supported in this browser.'); return; }
  var rec = new SR();
  rec.lang = 'en-GB';
  rec.onresult = function(e) {
    var text = e.results[0][0].transcript;
    if (editor && editor.chain) {
      editor.chain().focus().insertContent(text + ' ').run();
    }
  };
  rec.start();
  var btn = document.getElementById('dictate-btn');
  btn.textContent = '&#x1F534;';
  btn.style.color = '#dc2626';
  rec.onend = function() { btn.innerHTML = '&#x1F3A4;'; btn.style.color = ''; };
}

// Handwriting panel
var hwOpen = false;
var hwTool = 'pen';
var hwDrawing = false;
var hwStrokes = [];
var hwCurrentStroke = null;

function toggleHandwriting() {
  hwOpen = !hwOpen;
  var panel = document.getElementById('hw-panel');
  var btn = document.getElementById('handwrite-btn');
  if (panel) panel.classList.toggle('open', hwOpen);
  if (btn) btn.classList.toggle('active', hwOpen);
  if (hwOpen) initHWCanvas();
}

function initHWCanvas() {
  var wrap = document.getElementById('hw-canvas-wrap');
  var canvas = document.getElementById('hw-canvas');
  if (!wrap || !canvas) return;
  canvas.width = wrap.clientWidth || 360;
  canvas.height = wrap.clientHeight || 400;
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
  canvas.removeEventListener('pointerdown', hwStart);
  canvas.removeEventListener('pointermove', hwMove);
  canvas.removeEventListener('pointerup', hwEnd);
  canvas.addEventListener('pointerdown', hwStart);
  canvas.addEventListener('pointermove', hwMove);
  canvas.addEventListener('pointerup', hwEnd);
  canvas.addEventListener('pointercancel', hwEnd);
  hwRedraw();
}

function hwGetPos(e) {
  var canvas = document.getElementById('hw-canvas');
  var rect = canvas.getBoundingClientRect();
  return {x: e.clientX - rect.left, y: e.clientY - rect.top, pressure: e.pressure || 0.5};
}

function hwStart(e) {
  e.preventDefault();
  hwDrawing = true;
  var pos = hwGetPos(e);
  hwCurrentStroke = {tool: hwTool, points: [pos]};
}

function hwMove(e) {
  if (!hwDrawing || !hwCurrentStroke) return;
  e.preventDefault();
  hwCurrentStroke.points.push(hwGetPos(e));
  hwRenderStroke(hwCurrentStroke, true);
}

function hwEnd(e) {
  if (!hwDrawing || !hwCurrentStroke) return;
  hwDrawing = false;
  if (hwCurrentStroke.points.length > 1) hwStrokes.push(hwCurrentStroke);
  hwCurrentStroke = null;
}

function hwRenderStroke(stroke, incremental) {
  var canvas = document.getElementById('hw-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (!incremental) ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (stroke.points.length < 2) return;
  ctx.save();
  if (stroke.tool === 'erase') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.lineWidth = 20;
  } else if (stroke.tool === 'hi') {
    ctx.strokeStyle = 'rgba(255,220,0,0.4)';
    ctx.lineWidth = 16;
  } else {
    ctx.strokeStyle = '#1a2332';
    ctx.lineWidth = 2;
  }
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
  for (var i = 1; i < stroke.points.length; i++) ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
  ctx.stroke();
  ctx.restore();
}

function hwRedraw() {
  var canvas = document.getElementById('hw-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hwStrokes.forEach(function(s) { hwRenderStroke(s, false); });
}

function hwSetTool(tool) { hwTool = tool; }
function hwClear() { hwStrokes = []; hwRedraw(); }

function hwOCR() {
  var canvas = document.getElementById('hw-canvas');
  if (!canvas) return;
  var b64 = canvas.toDataURL('image/png').split(',')[1];
  fetch('https://prism-api.identitypartners.workers.dev/api/ocr', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({image:b64, mime_type:'image/png'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var text = d.text || d.content || '';
    if (text) {
      document.getElementById('hw-ocr-result') && (document.getElementById('hw-ocr-result').textContent = text);
      window._hwOCRText = text;
      alert('OCR: ' + text.substring(0,100) + (text.length>100?'...':'') + '\n\nClick Insert to add to editor.');
    } else {
      alert('No text detected.');
    }
  })
  .catch(function(e){alert('OCR error: '+e.message);});
}

function hwInsert() {
  var text = window._hwOCRText || '';
  if (!text) { alert('Run OCR first.'); return; }
  if (editor && editor.chain) {
    editor.chain().focus().insertContent('<p>' + text + '</p>').run();
  } else {
    var el = document.getElementById('quill-editor');
    if (el) el.innerHTML += '<p>' + text + '</p>';
  }
  window._hwOCRText = '';
}
