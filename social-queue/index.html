<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Calendar - Prism</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.sq-layout{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - var(--topbar-h));overflow:hidden;}
@media(max-width:1000px){.sq-layout{grid-template-columns:1fr;}.sq-right{display:none;}}
.sq-main{overflow-y:auto;padding:16px 20px;}
.sq-right{border-left:1px solid var(--border);background:var(--bg-surface);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.stat-box{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center;}
.stat-num{font-size:26px;font-weight:700;color:var(--accent);font-family:var(--font-heading);}
.stat-lbl{font-size:11px;color:var(--fg-muted);margin-top:2px;}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.fc{padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;color:var(--fg-secondary);background:var(--bg-elevated);transition:all 0.15s;}
.fc.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}
.q-item{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
.q-item:hover{border-color:var(--accent);}
.q-item-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.plt-pill{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;background:var(--bg-surface);color:var(--fg-muted);}
.q-content{font-size:13.5px;line-height:1.6;color:var(--fg-primary);margin-bottom:8px;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:hidden;}
.q-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.q-time{font-size:11.5px;color:var(--fg-muted);}
.q-actions{margin-left:auto;display:flex;gap:5px;}
.compose-sec{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;}
.compose-ttl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--fg-muted);margin-bottom:8px;}
.compose-ta{width:100%;min-height:80px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;font-family:var(--font-ui);resize:none;outline:none;background:var(--bg-primary);color:var(--fg-primary);line-height:1.6;}
.compose-ta:focus{border-color:var(--accent);}
.post-log{background:var(--fg-primary);color:#f0e9e0;border-radius:7px;padding:10px;font-family:var(--font-mono);font-size:11px;line-height:1.7;max-height:160px;overflow-y:auto;margin-top:8px;}
.log-ok{color:#7ecf7e;}.log-err{color:#f08080;}.log-info{color:#a8d4f0;}
.empty-state{text-align:center;padding:60px 20px;color:var(--fg-muted);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.plt-tog{padding:4px 9px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;cursor:pointer;color:var(--fg-secondary);background:var(--bg-surface);transition:all 0.15s;user-select:none;}
.plt-tog.active{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
</style>
</head>
<body>
<div class="prism-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content" id="main-content">
    <div class="topbar">
      <div class="topbar-title">Social Calendar</div>
      <div class="topbar-actions">
        <button class="btn btn-sm btn-secondary" onclick="loadQueue()" title="Refresh queue">&#x21BA; Refresh</button>
        <button class="btn btn-sm btn-secondary" onclick="postAllPending()" title="Post all pending">&#x1F680; Post All Pending</button>
        <button class="btn btn-sm btn-secondary" onclick="clearPosted()" title="Clear posted items">&#x1F5D1; Clear Posted</button>
        <a href="/atomise/" class="btn btn-sm btn-primary" title="Generate content">&#x26A1; Generate Content</a>
      </div>
    </div>
    <div class="sq-layout">
      <div class="sq-main">
        <div class="stats-row">
          <div class="stat-box"><div class="stat-num" id="s-total">-</div><div class="stat-lbl">Total</div></div>
          <div class="stat-box"><div class="stat-num" id="s-pending">-</div><div class="stat-lbl">Pending</div></div>
          <div class="stat-box"><div class="stat-num" id="s-posted">-</div><div class="stat-lbl">Posted</div></div>
          <div class="stat-box"><div class="stat-num" id="s-scheduled">-</div><div class="stat-lbl">Scheduled</div></div>
        </div>
        <div class="filters">
          <span class="fc active" onclick="filterQ(this,'all')">All</span>
          <span class="fc" onclick="filterQ(this,'pending')">Pending</span>
          <span class="fc" onclick="filterQ(this,'scheduled')">Scheduled</span>
          <span class="fc" onclick="filterQ(this,'posted')">Posted</span>
          <span class="fc" onclick="filterQ(this,'bluesky')">&#x1F98B; Bluesky</span>
          <span class="fc" onclick="filterQ(this,'x')">&#x1D54F; X</span>
          <span class="fc" onclick="filterQ(this,'linkedin')">&#x1F4BC; LinkedIn</span>
          <button class="btn btn-ghost btn-sm" onclick="exportCSV()" title="Export CSV">&#x2B07; CSV</button>
          <span style="font-size:12px;color:var(--fg-muted);margin-left:auto;" id="showing-count"></span>
        </div>
        <div id="queue-list">
          <div class="empty-state"><div class="empty-icon">&#x1F4C5;</div><div>Click Refresh to load your queue.</div></div>
        </div>
      </div>
      <div class="sq-right">
        <div class="compose-sec">
          <div class="compose-ttl">Compose Post</div>
          <textarea class="compose-ta" id="compose-text" placeholder="Write your post..." oninput="updateCC()"></textarea>
          <div style="font-size:11px;color:var(--fg-muted);text-align:right;margin-top:3px;" id="cc">0 / 280</div>
          <div style="display:flex;gap:5px;margin:8px 0;flex-wrap:wrap;">
            <div class="plt-tog active" data-p="bluesky" onclick="toggleCP(this)">&#x1F98B;</div>
            <div class="plt-tog" data-p="x" onclick="toggleCP(this)">&#x1D54F;</div>
            <div class="plt-tog" data-p="linkedin" onclick="toggleCP(this)">&#x1F4BC;</div>
            <div class="plt-tog" data-p="instagram" onclick="toggleCP(this)">&#x1F4F8;</div>
          </div>
          <div style="display:flex;gap:6px;margin-bottom:8px;">
            <input type="datetime-local" class="input" id="sched-time" style="flex:1;font-size:12px;padding:6px 8px;">
            <button class="btn btn-ghost btn-sm" onclick="setNow()" title="Now">Now</button>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-primary btn-sm" style="flex:1;" onclick="addToQueue()">&#x1F4C5; Queue</button>
            <button class="btn btn-rose btn-sm" style="flex:1;" onclick="postNow()">&#x1F680; Post Now</button>
          </div>
        </div>
        <div class="compose-sec">
          <div class="compose-ttl">AI Assist</div>
          <input class="input" id="ai-prompt" type="text" placeholder="e.g. Write about recovery..." style="margin-bottom:8px;">
          <div style="display:flex;gap:5px;flex-wrap:wrap;">
            <button class="btn btn-sm btn-secondary" onclick="aiGen()">&#x2728; Generate</button>
            <button class="btn btn-sm btn-secondary" onclick="aiImprove()">&#x2728; Improve</button>
            <button class="btn btn-sm btn-secondary" onclick="aiTags()">&#x1F3F7; Tags</button>
          </div>
        </div>
        <div class="compose-sec">
          <div class="compose-ttl">Posting Log</div>
          <div class="post-log" id="post-log"><span class="log-info">Ready.</span></div>
        </div>
        <div class="compose-sec">
          <div class="compose-ttl">Platform Status</div>
          <div id="plt-status" style="font-size:12.5px;display:flex;flex-direction:column;gap:5px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/shared/prism.js"></script>
<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var allQueue = [];
var currentFilter = 'all';
var composePlatforms = ['bluesky'];

var PLAT_ICONS = {bluesky:'🦋',x:'𝕏',linkedin:'💼',instagram:'📸',facebook:'👥',threads:'🧵'};
var PLAT_LIMITS = {bluesky:300,x:280,linkedin:3000,instagram:2200,facebook:63206,threads:500};

function toggleCP(el) {
  el.classList.toggle('active');
  var p = el.getAttribute('data-p');
  if (el.classList.contains('active')) { if (composePlatforms.indexOf(p) < 0) composePlatforms.push(p); }
  else composePlatforms = composePlatforms.filter(function(x) { return x !== p; });
}

function updateCC() {
  var t = document.getElementById('compose-text').value;
  var el = document.getElementById('cc');
  if (el) { el.textContent = t.length + ' / 280'; el.style.color = t.length > 280 ? 'var(--danger)' : ''; }
}

function setNow() {
  var el = document.getElementById('sched-time');
  if (el) el.value = new Date(Date.now() + 3600000).toISOString().slice(0, 16);
}

function loadQueue() {
  var list = document.getElementById('queue-list');
  if (list) list.innerHTML = '<div class="empty-state"><div class="spinner"></div><div style="margin-top:8px;">Loading...</div></div>';
  var controller = new AbortController();
  var tid = setTimeout(function() { controller.abort(); }, 20000);
  fetch(WORKER + '/api/social/queue?limit=100', { signal: controller.signal })
    .then(function(r) { clearTimeout(tid); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(r) {
      allQueue = r.queue || [];
      updateStats();
      renderQueue(allQueue);
      renderPlatformStatus();
    })
    .catch(function(e) {
      clearTimeout(tid);
      if (list) list.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠</div><div>' + (e.name === 'AbortError' ? 'Timed out' : e.message) + '<br><button class="btn btn-sm btn-secondary" onclick="loadQueue()" style="margin-top:8px;">Retry</button></div></div>';
    });
}

function updateStats() {
  var s = function(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; };
  s('s-total', allQueue.length);
  s('s-pending', allQueue.filter(function(i) { return i.status === 'pending'; }).length);
  s('s-posted', allQueue.filter(function(i) { return i.status === 'posted'; }).length);
  s('s-scheduled', allQueue.filter(function(i) { return i.status === 'scheduled'; }).length);
}

function filterQ(el, filter) {
  currentFilter = filter;
  var chips = document.querySelectorAll('.fc');
  for (var i = 0; i < chips.length; i++) chips[i].classList.remove('active');
  el.classList.add('active');
  var filtered = filter === 'all' ? allQueue : allQueue.filter(function(item) {
    return item.status === filter || item.platform === filter;
  });
  renderQueue(filtered);
}

function renderQueue(items) {
  var list = document.getElementById('queue-list');
  var countEl = document.getElementById('showing-count');
  if (!list) return;
  if (countEl) countEl.textContent = 'Showing ' + items.length + ' of ' + allQueue.length;
  if (!items || items.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div><div>No posts in queue.<br><a href="/atomise/" class="btn btn-sm btn-primary" style="margin-top:8px;">Generate Content</a></div></div>';
    return;
  }
  list.innerHTML = '';
  items.forEach(function(item) {
    var el = document.createElement('div');
    el.className = 'q-item';
    var platform = item.platform || 'post';
    var header = document.createElement('div');
    header.className = 'q-item-header';
    var pill = document.createElement('span');
    pill.className = 'plt-pill';
    pill.textContent = (PLAT_ICONS[platform] || '📝') + ' ' + (item.type || platform);
    var badge = document.createElement('span');
    badge.className = 'badge ' + (item.status === 'posted' ? 'badge-success' : item.status === 'scheduled' ? 'badge-accent' : 'badge-warning');
    badge.style.marginLeft = 'auto';
    badge.textContent = item.status || 'pending';
    header.appendChild(pill); header.appendChild(badge);
    var content = document.createElement('div');
    content.className = 'q-content';
    var text = item.content || '';
    content.textContent = text.substring(0, 200) + (text.length > 200 ? '...' : '');
    var footer = document.createElement('div');
    footer.className = 'q-footer';
    var time = document.createElement('span');
    time.className = 'q-time';
    if (item.status === 'posted' && item.postedAt) {
        time.textContent = '✓ Posted ' + new Date(item.postedAt).toLocaleString('en-GB', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) + (item.postedTo ? ' → ' + item.postedTo : '');
        time.style.color = 'var(--success)';
      } else {
        time.textContent = item.scheduledAt ? '📅 ' + new Date(item.scheduledAt).toLocaleString('en-GB', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'No schedule';
      }
    var actions = document.createElement('div');
    actions.className = 'q-actions';
    if (item.status !== 'posted') {
      var postBtn = document.createElement('button');
      postBtn.className = 'btn btn-sm btn-primary';
      postBtn.textContent = '🚀 Post';
      postBtn.onclick = (function(it) { return function() { postItem(it); }; })(item);
      actions.appendChild(postBtn);
    }
    var delBtn = document.createElement('button');
    delBtn.className = 'btn btn-sm btn-ghost';
    delBtn.textContent = '🗑';
    delBtn.onclick = (function(it) { return function() { deleteItem(it.id); }; })(item);
    actions.appendChild(delBtn);
    footer.appendChild(time); footer.appendChild(actions);
    el.appendChild(header); el.appendChild(content); el.appendChild(footer);
    list.appendChild(el);
  });
}

function postItem(item) {
  var text = item.content || '';
  var platform = item.platform || 'bluesky';
  log('info', 'Posting to ' + platform + '...');
  // Immediate visual feedback
  item.status = 'posting';
  updateStats(); renderQueue(allQueue);
  fetch(WORKER + '/api/social/post', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: text.substring(0, PLAT_LIMITS[platform] || 280), platforms: [platform]})
  })
  .then(function(r) { return r.json(); })
  .then(function(r) {
    var results = r.results || {};
    var anyPosted = false;
    Object.keys(results).forEach(function(p) {
      if (!results[p].error) {
        log('ok', p + ': ✓ posted at ' + new Date().toLocaleTimeString('en-GB'));
        item.status = 'posted';
        item.postedAt = new Date().toISOString();
        item.postedTo = p;
        anyPosted = true;
      } else {
        log('err', p + ': ' + results[p].error);
        item.status = 'failed';
      }
    });
    // Update in KV
    var cleanId = (item.id || '').replace('queue:', '');
    fetch(WORKER + '/api/social/queue/' + cleanId, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({status: item.status, postedAt: item.postedAt, postedTo: item.postedTo})
    });
    updateStats(); renderQueue(allQueue);
    if (anyPosted) Toast.success('Posted to ' + platform + ' ✓');
  })
  .catch(function(e) {
    log('err', e.message);
    item.status = 'pending';
    updateStats(); renderQueue(allQueue);
  });
}

function postAllPending() {
  var pending = allQueue.filter(function(i) { return i.status === 'pending' || i.status === 'scheduled'; });
  if (pending.length === 0) { Toast.warning('No pending posts'); return; }
  log('info', 'Posting ' + pending.length + ' items...');
  pending.forEach(function(item) { postItem(item); });
}

function deleteItem(id) {
  var cleanId = (id || '').replace('queue:', '');
  fetch(WORKER + '/api/social/queue/' + cleanId, { method: 'DELETE' })
    .then(function() {
      allQueue = allQueue.filter(function(i) { return i.id !== id; });
      updateStats(); renderQueue(allQueue);
    });
}

function clearPosted() {
  var posted = allQueue.filter(function(i) { return i.status === 'posted'; });
  if (posted.length === 0) { Toast.info('No posted items'); return; }
  posted.forEach(function(item) { deleteItem(item.id); });
  Toast.success('Cleared ' + posted.length + ' posted items');
}

function addToQueue() {
  var text = document.getElementById('compose-text').value.trim();
  if (!text) { Toast.warning('Write something first'); return; }
  var schedEl = document.getElementById('sched-time');
  var scheduledAt = schedEl && schedEl.value ? new Date(schedEl.value).toISOString() : new Date(Date.now() + 3600000).toISOString();
  var platform = composePlatforms[0] || 'bluesky';
  fetch(WORKER + '/api/social/queue', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({platform: platform, content: text, type: platform + ' post', status: 'scheduled', scheduledAt: scheduledAt})
  })
  .then(function() { Toast.success('Added to queue'); document.getElementById('compose-text').value = ''; updateCC(); loadQueue(); });
}

function postNow() {
  var text = document.getElementById('compose-text').value.trim();
  if (!text) { Toast.warning('Write something first'); return; }
  log('info', 'Posting to ' + composePlatforms.join(', ') + '...');
  fetch(WORKER + '/api/social/post', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: text, platforms: composePlatforms})
  })
  .then(function(r) { return r.json(); })
  .then(function(r) {
    if (r.success) { Toast.success('Posted!'); document.getElementById('compose-text').value = ''; updateCC(); }
    else Toast.error(r.error || 'Post failed');
  })
  .catch(function(e) { log('err', e.message); });
}

function aiGen() {
  var p = document.getElementById('ai-prompt').value.trim();
  if (!p) { Toast.warning('Enter a prompt'); return; }
  fetch(WORKER + '/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({messages: [{role:'system',content:'Write a social media post for Identity Partners. British English. Professional. Under 280 chars.'},{role:'user',content:p}], profile:'fast'})
  })
  .then(function(r) { return r.json(); })
  .then(function(r) { var el = document.getElementById('compose-text'); if (el && r.content) { el.value = r.content; updateCC(); } });
}

function aiImprove() {
  var text = document.getElementById('compose-text').value.trim();
  if (!text) { Toast.warning('Write something first'); return; }
  fetch(WORKER + '/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({messages: [{role:'system',content:'Improve this social media post. Keep under 280 chars. British English.'},{role:'user',content:text}], profile:'fast'})
  })
  .then(function(r) { return r.json(); })
  .then(function(r) { var el = document.getElementById('compose-text'); if (el && r.content) { el.value = r.content; updateCC(); } });
}

function aiTags() {
  var text = document.getElementById('compose-text').value.trim();
  if (!text) { Toast.warning('Write something first'); return; }
  fetch(WORKER + '/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({messages: [{role:'system',content:'Generate 5 relevant hashtags. Return only hashtags space-separated.'},{role:'user',content:text}], profile:'fast'})
  })
  .then(function(r) { return r.json(); })
  .then(function(r) { var el = document.getElementById('compose-text'); if (el && r.content) { el.value = text + '\n\n' + r.content; updateCC(); } });
}

function renderPlatformStatus() {
  var el = document.getElementById('plt-status');
  if (!el) return;
  var platforms = [{name:'Bluesky',icon:'🦋',connected:true,note:'Active'},{name:'X',icon:'𝕏',connected:false,note:'OAuth needed'},{name:'LinkedIn',icon:'💼',connected:false,note:'OAuth needed'},{name:'Instagram',icon:'📸',connected:false,note:'Meta OAuth needed'}];
  el.innerHTML = '';
  platforms.forEach(function(p) {
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);';
    var left = document.createElement('span'); left.textContent = p.icon + ' ' + p.name;
    var right = document.createElement('span'); right.className = p.connected ? 'badge badge-success' : 'badge badge-muted'; right.textContent = p.connected ? '✓ ' + p.note : p.note;
    row.appendChild(left); row.appendChild(right); el.appendChild(row);
  });
}

function exportCSV() {
  var rows = ['ID,Platform,Content,Status,Scheduled'];
  allQueue.forEach(function(item) { rows.push([item.id, item.platform || '', '"' + (item.content || '').replace(/"/g, '""') + '"', item.status || '', item.scheduledAt || ''].join(',')); });
  var blob = new Blob([rows.join('\n')], {type:'text/csv'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'social-queue-' + Date.now() + '.csv'; a.click();
}

function log(type, msg) {
  var el = document.getElementById('post-log');
  if (!el) return;
  var line = document.createElement('div'); line.className = 'log-' + type;
  line.textContent = '[' + new Date().toLocaleTimeString('en-GB') + '] ' + msg;
  el.appendChild(line); el.scrollTop = el.scrollHeight;
}

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount) { var sb = buildSidebar('/social-queue/'); mount.parentNode.insertBefore(sb, mount); mount.parentNode.removeChild(mount); }
  setNow();
  renderPlatformStatus();
  // Don't auto-load - let user click Refresh to avoid CORS issues on first load
});
</script>
</body>
</html>
