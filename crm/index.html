<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Argentica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3b3a'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.crm-shell { display:flex; height:100vh; overflow:hidden; }
.crm-list { width:300px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--bg-surface); overflow:hidden; }
.crm-detail { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.crm-hdr { padding:10px 14px 8px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.crm-hdr h3 { font-size:13px; font-weight:600; margin:0; }
.crm-search { padding:8px 10px; border-bottom:1px solid var(--border); flex-shrink:0; }
.crm-search input { width:100%; padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:12px; background:var(--bg); color:var(--fg); box-sizing:border-box; }
.crm-list-body { flex:1; overflow-y:auto; }
.contact-item { padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.1s; }
.contact-item:hover { background:var(--bg-sunken); }
.contact-item.active { background:var(--accent-light,#e8f0f8); border-left:3px solid var(--accent); }
.contact-name { font-size:13px; font-weight:600; color:var(--fg); }
.contact-role { font-size:11px; color:var(--fg-muted); margin-top:1px; }
.contact-tags { display:flex; gap:3px; margin-top:4px; flex-wrap:wrap; }
.tag { padding:1px 7px; border-radius:8px; font-size:10px; background:var(--bg-sunken); color:var(--fg-muted); border:1px solid var(--border); }
.tag.client { background:rgba(45,106,159,0.1); color:var(--accent); border-color:var(--accent); }
.tag.prospect { background:rgba(245,158,11,0.1); color:#f59e0b; border-color:#f59e0b; }
.tag.partner { background:rgba(22,163,74,0.1); color:#16a34a; border-color:#16a34a; }
.crm-detail-hdr { padding:16px 20px; border-bottom:1px solid var(--border); background:var(--bg-elevated); flex-shrink:0; }
.crm-detail-name { font-size:20px; font-weight:700; margin-bottom:4px; }
.crm-detail-role { font-size:13px; color:var(--fg-muted); margin-bottom:10px; }
.crm-detail-actions { display:flex; gap:6px; }
.crm-tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg-elevated); flex-shrink:0; }
.crm-tab { padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; color:var(--fg-muted); }
.crm-tab.active { border-bottom-color:var(--accent); color:var(--accent); }
.crm-tab-body { flex:1; overflow-y:auto; padding:16px; }
.field-row { display:flex; gap:12px; margin-bottom:12px; }
.field-group { flex:1; }
.field-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--fg-muted); margin-bottom:3px; }
.field-value { font-size:13px; color:var(--fg); padding:6px 8px; background:var(--bg-sunken); border-radius:5px; min-height:30px; }
.field-input { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:5px; font-size:13px; background:var(--bg); color:var(--fg); box-sizing:border-box; font-family:inherit; }
.note-item { padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--bg-elevated); }
.note-text { font-size:13px; line-height:1.5; }
.note-date { font-size:10px; color:var(--fg-muted); margin-top:4px; }
.note-add { display:flex; gap:8px; margin-top:12px; }
.note-add textarea { flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; resize:none; min-height:60px; background:var(--bg); color:var(--fg); }
.btn-primary { padding:7px 14px; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-family:inherit; }
.btn-secondary { padding:7px 14px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:12px; background:var(--bg); color:var(--fg); font-family:inherit; }
.empty-state { text-align:center; padding:40px; color:var(--fg-muted); }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:9999; display:none; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal-box { background:var(--bg-elevated); border-radius:12px; padding:22px; width:480px; max-height:80vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
.modal-box h3 { margin:0 0 14px; font-size:15px; }
.form-row { margin-bottom:10px; }
.form-label { font-size:11px; font-weight:600; color:var(--fg-muted); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:0.4px; }
.form-input, .form-select { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; background:var(--bg); color:var(--fg); box-sizing:border-box; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="crm-shell">

<div class="crm-list">
  <div class="crm-hdr">
    <h3>👥 Contacts</h3>
    <button class="btn-primary" onclick="openAddContact()" style="font-size:11px;padding:4px 10px;">+ Add</button>
  </div>
  <div class="crm-search">
    <input type="text" id="crm-search" placeholder="Search contacts..." oninput="filterContacts(this.value)">
  </div>
  <div class="crm-list-body" id="contact-list">
    <div style="padding:20px;text-align:center;font-size:12px;color:var(--fg-muted);">Loading...</div>
  </div>
</div>

<div class="crm-detail" id="crm-detail">
  <div class="empty-state">
    <div style="font-size:48px;margin-bottom:12px;">👥</div>
    <div style="font-size:14px;font-weight:600;margin-bottom:6px;">Identity Partners CRM</div>
    <div style="font-size:12px;">Select a contact or add a new one.</div>
  </div>
</div>

</div>
</div>

<div class="modal-overlay" id="add-modal">
<div class="modal-box">
  <h3>Add Contact</h3>
  <div class="form-row"><label class="form-label">Name *</label><input class="form-input" id="new-name" type="text" placeholder="Full name"></div>
  <div class="form-row"><label class="form-label">Role / Title</label><input class="form-input" id="new-role" type="text" placeholder="e.g. Therapist, Coach"></div>
  <div class="form-row"><label class="form-label">Organisation</label><input class="form-input" id="new-org" type="text"></div>
  <div class="form-row"><label class="form-label">Email</label><input class="form-input" id="new-email" type="email"></div>
  <div class="form-row"><label class="form-label">Phone</label><input class="form-input" id="new-phone" type="tel"></div>
  <div class="form-row"><label class="form-label">Type</label>
    <select class="form-select" id="new-type">
      <option value="contact">Contact</option>
      <option value="client">Client</option>
      <option value="prospect">Prospect</option>
      <option value="partner">Partner</option>
      <option value="referral">Referral</option>
    </select>
  </div>
  <div class="form-row"><label class="form-label">Notes</label><textarea class="form-input" id="new-notes" rows="3" style="resize:vertical;"></textarea></div>
  <div class="modal-actions">
    <button class="btn-secondary" onclick="closeAddContact()">Cancel</button>
    <button class="btn-primary" onclick="saveContact()">Save Contact</button>
  </div>
</div>
</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var contacts = [];
var currentContact = null;
var currentTab = 'details';

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/crm/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  loadContacts();
});

function loadContacts() {
  fetch(WORKER + '/api/crm/contacts')
    .then(function(r){return r.json();})
    .then(function(d){
      contacts = d.contacts || [];
      renderContactList(contacts);
    })
    .catch(function(e){
      document.getElementById('contact-list').innerHTML = '<div style="padding:12px;font-size:12px;color:#dc2626;">Error: '+e.message+'</div>';
    });
}

function renderContactList(list) {
  var el = document.getElementById('contact-list');
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><div style="font-size:32px;margin-bottom:8px;">👤</div><p style="font-size:12px;">No contacts yet.</p></div>';
    return;
  }
  el.innerHTML = list.map(function(c) {
    var active = currentContact && currentContact.id === c.id ? ' active' : '';
    var tagClass = c.type === 'client' ? 'client' : c.type === 'prospect' ? 'prospect' : c.type === 'partner' ? 'partner' : '';
    return '<div class="contact-item'+active+'" id="ci-'+c.id+'" onclick="openContact(\''+c.id+'\')">' +
      '<div class="contact-name">'+c.name.replace(/</g,'&lt;')+'</div>' +
      '<div class="contact-role">'+(c.role||c.org||'').replace(/</g,'&lt;')+'</div>' +
      (c.type ? '<div class="contact-tags"><span class="tag '+tagClass+'">'+c.type+'</span></div>' : '') +
      '</div>';
  }).join('');
}

function filterContacts(q) {
  var filtered = q ? contacts.filter(function(c){return (c.name+c.role+c.org+c.email).toLowerCase().includes(q.toLowerCase());}) : contacts;
  renderContactList(filtered);
}

function openContact(id) {
  currentContact = contacts.find(function(c){return c.id===id;});
  if (!currentContact) return;
  document.querySelectorAll('.contact-item').forEach(function(el){el.classList.remove('active');});
  var ci = document.getElementById('ci-'+id);
  if (ci) ci.classList.add('active');
  renderDetail();
}

function renderDetail() {
  if (!currentContact) return;
  var c = currentContact;
  var detail = document.getElementById('crm-detail');
  detail.innerHTML = '';

  var hdr = document.createElement('div');
  hdr.className = 'crm-detail-hdr';
  hdr.innerHTML = '<div class="crm-detail-name">'+c.name.replace(/</g,'&lt;')+'</div>' +
    '<div class="crm-detail-role">'+(c.role||'')+(c.org?' · '+c.org:'')+'</div>' +
    '<div class="crm-detail-actions">' +
      '<button class="btn-secondary" onclick="editContact()">✏ Edit</button>' +
      '<button class="btn-secondary" onclick="deleteContact()" style="color:#dc2626;">🗑 Delete</button>' +
    '</div>';
  detail.appendChild(hdr);

  var tabs = document.createElement('div');
  tabs.className = 'crm-tabs';
  [['details','Details'],['notes','Notes'],['activity','Activity']].forEach(function(t){
    var tab = document.createElement('div');
    tab.className = 'crm-tab'+(currentTab===t[0]?' active':'');
    tab.textContent = t[1];
    tab.onclick = function(){currentTab=t[0];renderDetail();};
    tabs.appendChild(tab);
  });
  detail.appendChild(tabs);

  var body = document.createElement('div');
  body.className = 'crm-tab-body';

  if (currentTab === 'details') {
    var fields = [
      ['Email', c.email||'—'],['Phone', c.phone||'—'],
      ['Organisation', c.org||'—'],['Type', c.type||'contact'],
      ['Created', c.created ? new Date(c.created).toLocaleDateString('en-GB') : '—'],
    ];
    body.innerHTML = fields.map(function(f){
      return '<div class="field-row"><div class="field-group"><div class="field-label">'+f[0]+'</div><div class="field-value">'+f[1].replace(/</g,'&lt;')+'</div></div></div>';
    }).join('') + (c.notes ? '<div class="field-group"><div class="field-label">Notes</div><div class="field-value" style="white-space:pre-wrap;">'+c.notes.replace(/</g,'&lt;')+'</div></div>' : '');
  } else if (currentTab === 'notes') {
    renderNotes(body);
  } else {
    body.innerHTML = '<div style="font-size:12px;color:var(--fg-muted);padding:8px 0;">Activity log coming soon.</div>';
  }

  detail.appendChild(body);
}

function renderNotes(body) {
  fetch(WORKER + '/api/crm/notes/' + currentContact.id)
    .then(function(r){return r.json();})
    .then(function(d){
      var notes = d.notes || [];
      body.innerHTML = '';
      if (notes.length) {
        notes.slice().reverse().forEach(function(n){
          var item = document.createElement('div');
          item.className = 'note-item';
          item.innerHTML = '<div class="note-text">'+n.text.replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</div>' +
            '<div class="note-date">'+new Date(n.created).toLocaleString('en-GB')+'</div>';
          body.appendChild(item);
        });
      } else {
        body.innerHTML = '<div style="font-size:12px;color:var(--fg-muted);margin-bottom:12px;">No notes yet.</div>';
      }
      var addDiv = document.createElement('div');
      addDiv.className = 'note-add';
      addDiv.innerHTML = '<textarea id="note-text" placeholder="Add a note..."></textarea>' +
        '<button class="btn-primary" onclick="addNote()">Add</button>';
      body.appendChild(addDiv);
    });
}

function addNote() {
  var text = document.getElementById('note-text').value.trim();
  if (!text || !currentContact) return;
  fetch(WORKER + '/api/crm/notes', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contactId:currentContact.id, text:text})
  }).then(function(){currentTab='notes';renderDetail();});
}

function openAddContact() { document.getElementById('add-modal').classList.add('open'); }
function closeAddContact() { document.getElementById('add-modal').classList.remove('open'); }

function saveContact() {
  var name = document.getElementById('new-name').value.trim();
  if (!name) { alert('Name is required.'); return; }
  var contact = {
    name: name,
    role: document.getElementById('new-role').value,
    org: document.getElementById('new-org').value,
    email: document.getElementById('new-email').value,
    phone: document.getElementById('new-phone').value,
    type: document.getElementById('new-type').value,
    notes: document.getElementById('new-notes').value,
  };
  fetch(WORKER + '/api/crm/contacts', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(contact)
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if (d.success) { closeAddContact(); loadContacts(); }
  });
}

function editContact() {
  if (!currentContact) return;
  var c = currentContact;
  document.getElementById('new-name').value = c.name||'';
  document.getElementById('new-role').value = c.role||'';
  document.getElementById('new-org').value = c.org||'';
  document.getElementById('new-email').value = c.email||'';
  document.getElementById('new-phone').value = c.phone||'';
  document.getElementById('new-type').value = c.type||'contact';
  document.getElementById('new-notes').value = c.notes||'';
  openAddContact();
}

function deleteContact() {
  if (!currentContact || !confirm('Delete '+currentContact.name+'?')) return;
  fetch(WORKER + '/api/crm/contacts/' + currentContact.id, {method:'DELETE'})
    .then(function(){
      currentContact = null;
      loadContacts();
      document.getElementById('crm-detail').innerHTML = '<div class="empty-state"><div style="font-size:48px;margin-bottom:12px;">👥</div><div style="font-size:14px;">Select a contact.</div></div>';
    });
}
</script>
</body>
</html>
