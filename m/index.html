<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Argentica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3b3a'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/themes.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f4f8; --bg-elevated: #fff; --bg-sunken: #e4eaf0;
  --fg: #1a2332; --fg-muted: #5a6a7e; --border: #c8d4e0;
  --accent: #2d6a9f; --accent-light: #e8f0f8;
  --radius: 10px; --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 16px; background: var(--bg); color: var(--fg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* Top bar */
.m-topbar { padding: 12px 16px 8px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.m-logo { width: 28px; height: 28px; border-radius: 6px; background: linear-gradient(135deg,#0f3b3a,#5c2d3f); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.m-title { font-size: 16px; font-weight: 700; flex: 1; }
.m-status { font-size: 11px; color: var(--fg-muted); }

/* Chat area */
.m-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.m-msg { display: flex; gap: 8px; align-items: flex-end; }
.m-msg.user { flex-direction: row-reverse; }
.m-bubble { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
.m-msg.assistant .m-bubble { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--fg); border-radius: 4px 18px 18px 18px; }
.m-msg.user .m-bubble { background: var(--accent); color: #fff; border-radius: 18px 4px 18px 18px; }
.m-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; background: linear-gradient(135deg,#0f3b3a,#5c2d3f); color: #fff; }
.m-msg.user .m-avatar { background: var(--accent); }
.m-meta { font-size: 10px; color: var(--fg-muted); margin-top: 3px; }
.m-msg.user .m-meta { text-align: right; }

/* Thinking */
.m-thinking { background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.2); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #7c3aed; font-style: italic; margin: 4px 0; }

/* Status */
.m-status-bar { padding: 6px 16px; font-size: 12px; color: var(--fg-muted); display: flex; align-items: center; gap: 6px; background: var(--bg-elevated); border-top: 1px solid var(--border); display: none; }
.m-status-dot { width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

/* Input area */
.m-input-area { padding: 10px 12px; padding-bottom: calc(10px + var(--safe-bottom)); background: var(--bg-elevated); border-top: 1px solid var(--border); flex-shrink: 0; }
.m-input-row { display: flex; gap: 8px; align-items: flex-end; }
.m-textarea { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 22px; font-size: 16px; font-family: inherit; resize: none; min-height: 44px; max-height: 120px; background: var(--bg); color: var(--fg); line-height: 1.4; -webkit-appearance: none; }
.m-textarea:focus { outline: none; border-color: var(--accent); }
.m-send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; border: none; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.m-toolbar { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.m-tool-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 16px; font-size: 13px; cursor: pointer; background: var(--bg); color: var(--fg-muted); white-space: nowrap; flex-shrink: 0; }
.m-tool-btn:active { background: var(--accent-light); border-color: var(--accent); }

/* Bottom nav */
.m-bottom-nav { display: flex; background: var(--bg-elevated); border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom); flex-shrink: 0; }
.m-nav-btn { flex: 1; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; border: none; background: none; color: var(--fg-muted); font-size: 10px; font-family: inherit; }
.m-nav-btn.active { color: var(--accent); }
.m-nav-icon { font-size: 22px; }

/* Welcome */
.m-welcome { text-align: center; padding: 40px 20px; color: var(--fg-muted); }
.m-welcome .icon { font-size: 48px; margin-bottom: 12px; }
.m-welcome h2 { font-size: 20px; font-weight: 700; color: var(--fg); margin-bottom: 6px; }
.m-welcome p { font-size: 14px; }
</style>
</head>
<body>
<!-- Top bar -->
<div class="m-topbar">
  <div class="m-logo">🎩</div>
  <div class="m-title">Argentica</div>
  <div class="m-status" id="m-status">ready</div>
</div>

<!-- Messages -->
<div class="m-messages" id="m-messages">
  <div class="m-welcome">
    <div class="icon">🎩</div>
    <h2>Good day, sir.</h2>
    <p>What are we working on?</p>
  </div>
</div>

<!-- Status bar -->
<div class="m-status-bar" id="m-status-bar">
  <span class="m-status-dot" id="m-dot"></span>
  <span id="m-status-text">Connecting...</span>
</div>

<!-- Input -->
<div class="m-input-area">
  <div class="m-toolbar">
    <button class="m-tool-btn" onclick="mQuick('research')">🔍 Research</button>
    <button class="m-tool-btn" onclick="mQuick('draft')">✍️ Draft</button>
    <button class="m-tool-btn" onclick="mQuick('atomise')">⚡ Atomise</button>
    <button class="m-tool-btn" onclick="mDictate()">🎤 Dictate</button>
    <button class="m-tool-btn" onclick="window.location.href='/chat/'">💻 Full chat</button>
  </div>
  <div class="m-input-row">
    <textarea class="m-textarea" id="m-input" placeholder="What are we working on?" rows="1"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();mSend();}"></textarea>
    <button class="m-send" onclick="mSend()">↑</button>
  </div>
</div>

<!-- Bottom nav -->
<div class="m-bottom-nav">
  <button class="m-nav-btn active" onclick="mNav('chat',this)"><span class="m-nav-icon">💬</span>Chat</button>
  <button class="m-nav-btn" onclick="mNav('study',this)"><span class="m-nav-icon">📚</span>Study</button>
  <button class="m-nav-btn" onclick="mNav('inbox',this)"><span class="m-nav-icon">📬</span>Inbox</button>
  <button class="m-nav-btn" onclick="mNav('create',this)"><span class="m-nav-icon">🎨</span>Create</button>
  <button class="m-nav-btn" onclick="mNav('more',this)"><span class="m-nav-icon">⚙️</span>More</button>
</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var mHistory = [];
var mStreaming = false;

function mSetStatus(text, type) {
  var bar = document.getElementById('m-status-bar');
  var dot = document.getElementById('m-dot');
  var label = document.getElementById('m-status-text');
  var topStatus = document.getElementById('m-status');
  if (!text) { bar.style.display = 'none'; if(topStatus) topStatus.textContent = 'ready'; return; }
  bar.style.display = 'flex';
  if (dot) dot.style.background = type === 'ok' ? '#16a34a' : type === 'thinking' ? '#7c3aed' : '#f59e0b';
  if (label) label.textContent = text;
  if (topStatus) topStatus.textContent = type === 'ok' ? 'responding' : 'connecting';
}

function mAddMsg(role, text, provider) {
  var msgs = document.getElementById('m-messages');
  var welcome = msgs.querySelector('.m-welcome');
  if (welcome) welcome.remove();
  var div = document.createElement('div');
  div.className = 'm-msg ' + role;
  var avatar = document.createElement('div');
  avatar.className = 'm-avatar';
  avatar.textContent = role === 'user' ? 'S' : '🎩';
  var body = document.createElement('div');
  var bubble = document.createElement('div');
  bubble.className = 'm-bubble';
  bubble.textContent = text;
  var meta = document.createElement('div');
  meta.className = 'm-meta';
  meta.textContent = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) + (provider ? ' · ' + provider : '');
  body.appendChild(bubble);
  body.appendChild(meta);
  div.appendChild(avatar);
  div.appendChild(body);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

function mSend() {
  var inp = document.getElementById('m-input');
  var text = inp.value.trim();
  if (!text || mStreaming) return;
  inp.value = '';
  inp.style.height = 'auto';
  mHistory.push({role:'user',content:text});
  mAddMsg('user', text);
  mStreaming = true;
  mSetStatus('Connecting to Mistral...', 'connecting');
  
  var bubble = mAddMsg('assistant', '●●●');
  var thinkDiv = null;
  var streamText = '';
  var buffer = '';
  var lastPos = 0;
  
  var xhr = new XMLHttpRequest();
  xhr.open('POST', WORKER + '/api/chat/stream', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.timeout = 60000;
  
  xhr.onprogress = function() {
    var newData = xhr.responseText.substring(lastPos);
    lastPos = xhr.responseText.length;
    buffer += newData;
    var blocks = buffer.split('\n\n');
    buffer = blocks.pop() || '';
    blocks.forEach(function(block) {
      var eventType = 'message', dataStr = '';
      block.split('\n').forEach(function(line) {
        if (line.startsWith('event: ')) eventType = line.slice(7).trim();
        else if (line.startsWith('data: ')) dataStr = line.slice(6).trim();
      });
      if (!dataStr) return;
      try {
        var data = JSON.parse(dataStr);
        if (eventType === 'status' && data.status === 'connected') {
          mSetStatus(data.provider + ' responding...', 'thinking');
        } else if (eventType === 'thinking') {
          if (!thinkDiv) {
            thinkDiv = document.createElement('div');
            thinkDiv.className = 'm-thinking';
            thinkDiv.textContent = '🧠 ' + (data.text||'').substring(0,100);
            bubble.parentNode.insertBefore(thinkDiv, bubble);
          }
        } else if (eventType === 'token') {
          streamText += data.text || '';
          bubble.textContent = streamText;
          document.getElementById('m-messages').scrollTop = 99999;
        } else if (eventType === 'done') {
          var final = data.content || streamText;
          mHistory.push({role:'assistant',content:final});
          bubble.textContent = final;
          if (thinkDiv) thinkDiv.style.display = 'none';
          mSetStatus('', '');
          mStreaming = false;
        } else if (eventType === 'error') {
          mFallback(text, bubble);
        }
      } catch(e) {}
    });
  };
  
  xhr.onload = function() { if (!streamText) mFallback(text, bubble); else { mSetStatus('',''); mStreaming=false; } };
  xhr.onerror = function() { mFallback(text, bubble); };
  xhr.ontimeout = function() { if (!streamText) mFallback(text, bubble); else { mSetStatus('',''); mStreaming=false; } };
  xhr.send(JSON.stringify({messages:mHistory,profile:'balanced'}));
}

function mFallback(text, bubble) {
  fetch(WORKER + '/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:mHistory,profile:'balanced'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var content = d.content || 'No response.';
    mHistory.push({role:'assistant',content:content});
    if (bubble) bubble.textContent = content;
    mSetStatus('','');
    mStreaming = false;
  })
  .catch(function(e){
    if (bubble) bubble.textContent = 'Error: ' + e.message;
    mSetStatus('','');
    mStreaming = false;
  });
}

function mQuick(type) {
  var inp = document.getElementById('m-input');
  var prefixes = {research:'Research: ',draft:'Draft: ',atomise:'Atomise for social: '};
  inp.value = prefixes[type] || '';
  inp.focus();
}

function mDictate() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition not supported.'); return; }
  var rec = new SR();
  rec.lang = 'en-GB';
  rec.onresult = function(e) {
    var inp = document.getElementById('m-input');
    inp.value += e.results[0][0].transcript + ' ';
  };
  rec.start();
}

function mNav(section, btn) {
  document.querySelectorAll('.m-nav-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var urls = {
    study: '/study-hub/',
    inbox: '/inbox/',
    create: '/creator/canvas/',
    more: '/settings/',
  };
  if (urls[section]) window.location.href = urls[section];
}
</script>
</body>
</html>
