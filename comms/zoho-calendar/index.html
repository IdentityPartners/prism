<!DOCTYPE html>
<html lang="en-GB">
<head>
<!-- cache-bust-1792819446 -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Argentica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3b3a'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.cal-shell { display:flex; height:100vh; overflow:hidden; }
.cal-main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.cal-hdr { padding:12px 16px; border-bottom:1px solid var(--border); background:var(--bg-elevated); display:flex; align-items:center; gap:10px; flex-shrink:0; }
.cal-hdr h2 { font-size:16px; font-weight:700; margin:0; flex:1; }
.cal-nav { display:flex; gap:4px; }
.cal-nav button { padding:5px 12px; border:1px solid var(--border); border-radius:6px; cursor:pointer; background:var(--bg); font-size:12px; font-family:inherit; }
.cal-nav button:hover { border-color:var(--accent); color:var(--accent); }
.cal-view-btns { display:flex; gap:3px; }
.cal-view-btn { padding:5px 10px; border:1px solid var(--border); border-radius:5px; cursor:pointer; font-size:11px; background:var(--bg); color:var(--fg-muted); font-family:inherit; }
.cal-view-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.cal-body { flex:1; overflow:hidden; display:flex; flex-direction:column; }

/* Month view */
.month-grid { display:grid; grid-template-columns:repeat(7,1fr); flex:1; overflow:hidden; }
.month-day-label { padding:6px; text-align:center; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--fg-muted); border-bottom:1px solid var(--border); background:var(--bg-elevated); }
.month-day { border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:4px; min-height:80px; cursor:pointer; transition:background 0.1s; overflow:hidden; }
.month-day:hover { background:var(--bg-sunken); }
.month-day.today { background:rgba(45,106,159,0.06); }
.month-day.other-month { opacity:0.4; }
.month-day-num { font-size:12px; font-weight:600; color:var(--fg); margin-bottom:3px; }
.month-day.today .month-day-num { background:var(--accent); color:#fff; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; }
.month-event { font-size:10px; padding:1px 5px; border-radius:3px; background:var(--accent); color:#fff; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }

/* Week view */
.week-grid { display:grid; grid-template-columns:50px repeat(7,1fr); flex:1; overflow-y:auto; }
.week-time { font-size:10px; color:var(--fg-muted); text-align:right; padding-right:6px; border-right:1px solid var(--border); }
.week-day-col { border-right:1px solid var(--border); position:relative; min-height:40px; }
.week-day-hdr { padding:6px; text-align:center; font-size:11px; font-weight:600; border-bottom:1px solid var(--border); background:var(--bg-elevated); position:sticky; top:0; z-index:1; }
.week-day-hdr.today { color:var(--accent); }
.week-event { position:absolute; left:2px; right:2px; background:var(--accent); color:#fff; border-radius:4px; font-size:10px; padding:2px 4px; overflow:hidden; cursor:pointer; }

/* Event detail panel */
.event-panel { width:280px; flex-shrink:0; border-left:1px solid var(--border); display:flex; flex-direction:column; background:var(--bg-surface); overflow-y:auto; }
.event-panel-hdr { padding:12px 14px; border-bottom:1px solid var(--border); font-size:13px; font-weight:600; }
.event-detail { padding:12px 14px; }
.event-detail-title { font-size:15px; font-weight:700; margin-bottom:8px; }
.event-detail-meta { font-size:12px; color:var(--fg-muted); margin-bottom:6px; display:flex; gap:6px; align-items:center; }
.upcoming-event { padding:8px 12px; border-bottom:1px solid var(--border); cursor:pointer; }
.upcoming-event:hover { background:var(--bg-sunken); }
.upcoming-time { font-size:11px; color:var(--accent); font-weight:600; }
.upcoming-title { font-size:12.5px; color:var(--fg); }

/* Add event modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:9999; display:none; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal-box { background:var(--bg-elevated); border-radius:12px; padding:22px; width:420px; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
.modal-box h3 { margin:0 0 14px; font-size:15px; }
.form-row { margin-bottom:10px; }
.form-label { font-size:11px; font-weight:600; color:var(--fg-muted); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:0.4px; }
.form-input { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; background:var(--bg); color:var(--fg); box-sizing:border-box; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
.btn-primary { padding:7px 16px; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-family:inherit; }
.btn-secondary { padding:7px 16px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:12px; background:var(--bg); font-family:inherit; }
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="cal-shell">

<div class="cal-main">
  <div class="cal-hdr">
    <h2 id="cal-title">Calendar</h2>
    <div class="cal-nav">
      <button onclick="navigate(-1)">‹</button>
      <button onclick="goToday()">Today</button>
      <button onclick="navigate(1)">›</button>
    </div>
    <div class="cal-view-btns">
      <button class="cal-view-btn active" id="btn-month" onclick="setView('month',this)">Month</button>
      <button class="cal-view-btn" id="btn-week" onclick="setView('week',this)">Week</button>
      <button class="cal-view-btn" id="btn-agenda" onclick="setView('agenda',this)">Agenda</button>
    </div>
    <button onclick="openAddEvent()" style="padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;">+ Add Event</button>
  </div>

  <div class="cal-body" id="cal-body">
    <div style="text-align:center;padding:40px;color:var(--fg-muted);">Loading calendar...</div>
  </div>
</div>

<!-- Right: Event detail + upcoming -->
<div class="event-panel">
  <div class="event-panel-hdr">📅 Upcoming</div>
  <div id="upcoming-list">
    <div style="padding:20px;font-size:12px;color:var(--fg-muted);">Loading...</div>
  </div>
</div>

</div>
</div>

<!-- Add event modal -->
<div class="modal-overlay" id="add-modal">
<div class="modal-box">
  <h3>Add Event</h3>
  <div class="form-row"><label class="form-label">Title *</label><input class="form-input" id="ev-title" type="text" placeholder="Event title"></div>
  <div class="form-row"><label class="form-label">Start</label><input class="form-input" id="ev-start" type="datetime-local"></div>
  <div class="form-row"><label class="form-label">End</label><input class="form-input" id="ev-end" type="datetime-local"></div>
  <div class="form-row"><label class="form-label">Description</label><input class="form-input" id="ev-desc" type="text" placeholder="Optional"></div>
  <div class="modal-actions">
    <button class="btn-secondary" onclick="closeAddEvent()">Cancel</button>
    <button class="btn-primary" onclick="saveEvent()">Save Event</button>
  </div>
</div>
</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var currentView = 'month';
var currentDate = new Date();
var allEvents = [];
var selectedEvent = null;

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/comms/zoho-calendar/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  // Set default event times
  var now = new Date();
  var end = new Date(now.getTime() + 3600000);
  document.getElementById('ev-start').value = now.toISOString().slice(0,16);
  document.getElementById('ev-end').value = end.toISOString().slice(0,16);
  loadEvents();
});

function loadEvents() {
  fetch(WORKER + '/api/calendar/events')
    .then(function(r){return r.json();})
    .then(function(d){
      if (d.status === 'not_connected') {
        document.getElementById('cal-body').innerHTML = '<div style="text-align:center;padding:60px;color:var(--fg-muted);"><div style="font-size:48px;margin-bottom:12px;">📅</div><div style="font-size:14px;font-weight:600;margin-bottom:8px;">Calendar not connected</div><a href="/comms/zoho-calendar/" style="color:var(--accent);">Connect Zoho Calendar →</a></div>';
        return;
      }
      allEvents = [...(d.today||[]), ...(d.week||[]), ...(d.next_week||[])];
      renderUpcoming(allEvents);
      renderView();
    })
    .catch(function(e){
      document.getElementById('cal-body').innerHTML = '<div style="padding:20px;font-size:12px;color:#dc2626;">Error: ' + e.message + '</div>';
    });
}

function renderUpcoming(events) {
  var list = document.getElementById('upcoming-list');
  if (!events.length) { list.innerHTML = '<div style="padding:20px;font-size:12px;color:var(--fg-muted);">No upcoming events.</div>'; return; }
  list.innerHTML = '';
  events.slice(0,15).forEach(function(ev) {
    var div = document.createElement('div');
    div.className = 'upcoming-event';
    var start = ev.start ? new Date(ev.start) : null;
    var timeStr = start ? start.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
    div.innerHTML = '<div class="upcoming-time">' + timeStr + '</div><div class="upcoming-title">' + (ev.title||'').replace(/</g,'&lt;') + '</div>';
    div.onclick = function() { showEventDetail(ev); };
    list.appendChild(div);
  });
}

function showEventDetail(ev) {
  selectedEvent = ev;
  var list = document.getElementById('upcoming-list');
  var start = ev.start ? new Date(ev.start) : null;
  var timeStr = start ? start.toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  list.innerHTML = '<div class="event-detail">' +
    '<div class="event-detail-title">' + (ev.title||'').replace(/</g,'&lt;') + '</div>' +
    '<div class="event-detail-meta">🕐 ' + timeStr + '</div>' +
    (ev.calendar ? '<div class="event-detail-meta">📅 ' + ev.calendar.replace(/</g,'&lt;') + '</div>' : '') +
    '<button onclick="backToUpcoming()" style="margin-top:12px;padding:5px 12px;border:1px solid var(--border);border-radius:5px;cursor:pointer;background:var(--bg);font-size:12px;">← Back</button>' +
    '</div>';
}

function backToUpcoming() { renderUpcoming(allEvents); }

function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.cal-view-btn').forEach(function(b){b.classList.remove('active');});
  if (btn) btn.classList.add('active');
  renderView();
}

function navigate(dir) {
  if (currentView === 'month') currentDate.setMonth(currentDate.getMonth() + dir);
  else if (currentView === 'week') currentDate.setDate(currentDate.getDate() + dir * 7);
  else currentDate.setDate(currentDate.getDate() + dir * 7);
  renderView();
}

function goToday() { currentDate = new Date(); renderView(); }

function renderView() {
  if (currentView === 'month') renderMonth();
  else if (currentView === 'week') renderWeek();
  else renderAgenda();
}

function renderMonth() {
  var year = currentDate.getFullYear();
  var month = currentDate.getMonth();
  document.getElementById('cal-title').textContent = new Date(year, month, 1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  var body = document.getElementById('cal-body');
  body.style.overflow = 'hidden';
  var days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var html = '<div class="month-grid" style="height:100%;">';
  days.forEach(function(d){ html += '<div class="month-day-label">' + d + '</div>'; });
  var first = new Date(year, month, 1);
  var startDay = (first.getDay() + 6) % 7; // Monday = 0
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var today = new Date();
  // Previous month days
  var prevDays = new Date(year, month, 0).getDate();
  for (var i = startDay - 1; i >= 0; i--) {
    html += '<div class="month-day other-month"><div class="month-day-num">' + (prevDays - i) + '</div></div>';
  }
  // Current month
  for (var d2 = 1; d2 <= daysInMonth; d2++) {
    var isToday = d2 === today.getDate() && month === today.getMonth() && year === today.getFullYear();
    var dayDate = new Date(year, month, d2);
    var dayEvents = allEvents.filter(function(ev) {
      if (!ev.start) return false;
      var evDate = new Date(ev.start);
      return evDate.getDate() === d2 && evDate.getMonth() === month && evDate.getFullYear() === year;
    });
    html += '<div class="month-day' + (isToday?' today':'') + '" onclick="dayClick(' + d2 + ',' + month + ',' + year + ')">';
    html += '<div class="month-day-num">' + d2 + '</div>';
    dayEvents.slice(0,3).forEach(function(ev) {
      html += '<div class="month-event" title="' + (ev.title||'').replace(/"/g,'&quot;') + '">' + (ev.title||'').replace(/</g,'&lt;') + '</div>';
    });
    if (dayEvents.length > 3) html += '<div style="font-size:9px;color:var(--fg-muted);">+' + (dayEvents.length-3) + ' more</div>';
    html += '</div>';
  }
  // Next month fill
  var total = startDay + daysInMonth;
  var remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (var n = 1; n <= remaining; n++) {
    html += '<div class="month-day other-month"><div class="month-day-num">' + n + '</div></div>';
  }
  html += '</div>';
  body.innerHTML = html;
}

function dayClick(d, m, y) {
  var dayEvents = allEvents.filter(function(ev) {
    if (!ev.start) return false;
    var evDate = new Date(ev.start);
    return evDate.getDate() === d && evDate.getMonth() === m && evDate.getFullYear() === y;
  });
  if (dayEvents.length === 1) { showEventDetail(dayEvents[0]); }
  else if (dayEvents.length > 1) { renderUpcoming(dayEvents); }
}

function renderWeek() {
  var startOfWeek = new Date(currentDate);
  var day = (startOfWeek.getDay() + 6) % 7;
  startOfWeek.setDate(startOfWeek.getDate() - day);
  var endOfWeek = new Date(startOfWeek);
  endOfWeek.setDate(endOfWeek.getDate() + 6);
  document.getElementById('cal-title').textContent = startOfWeek.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' – ' + endOfWeek.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  var body = document.getElementById('cal-body');
  body.style.overflow = 'auto';
  var today = new Date();
  var weekDays = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(startOfWeek);
    d.setDate(d.getDate() + i);
    weekDays.push(d);
  }
  var html = '<div style="display:grid;grid-template-columns:50px repeat(7,1fr);position:sticky;top:0;z-index:2;background:var(--bg-elevated);">';
  html += '<div style="border-right:1px solid var(--border);border-bottom:1px solid var(--border);"></div>';
  weekDays.forEach(function(d) {
    var isToday = d.toDateString() === today.toDateString();
    html += '<div class="week-day-hdr' + (isToday?' today':'') + '">' + d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'}) + '</div>';
  });
  html += '</div><div style="display:grid;grid-template-columns:50px repeat(7,1fr);">';
  for (var h = 0; h < 24; h++) {
    html += '<div class="week-time" style="height:40px;line-height:40px;">' + (h < 10?'0':'') + h + ':00</div>';
    weekDays.forEach(function(d) {
      var dayEvents = allEvents.filter(function(ev) {
        if (!ev.start) return false;
        var evDate = new Date(ev.start);
        return evDate.toDateString() === d.toDateString() && evDate.getHours() === h;
      });
      html += '<div class="week-day-col" style="height:40px;">';
      dayEvents.forEach(function(ev) {
        html += '<div class="week-event" onclick="showEventDetail(' + JSON.stringify(ev).replace(/</g,'&lt;') + ')">' + (ev.title||'').replace(/</g,'&lt;') + '</div>';
      });
      html += '</div>';
    });
  }
  html += '</div>';
  body.innerHTML = html;
}

function renderAgenda() {
  document.getElementById('cal-title').textContent = 'Agenda';
  var body = document.getElementById('cal-body');
  body.style.overflow = 'auto';
  if (!allEvents.length) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--fg-muted);">No upcoming events.</div>';
    return;
  }
  var html = '<div style="padding:12px;">';
  var lastDate = '';
  allEvents.forEach(function(ev) {
    var start = ev.start ? new Date(ev.start) : null;
    var dateStr = start ? start.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}) : 'Unknown date';
    if (dateStr !== lastDate) {
      html += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent);padding:12px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px;">' + dateStr + '</div>';
      lastDate = dateStr;
    }
    var timeStr = start ? start.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
    html += '<div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="showEventDetail(' + JSON.stringify(ev).replace(/</g,'&lt;') + ')">' +
      '<div style="font-size:12px;color:var(--accent);font-weight:600;min-width:50px;">' + timeStr + '</div>' +
      '<div><div style="font-size:13px;font-weight:500;">' + (ev.title||'').replace(/</g,'&lt;') + '</div>' +
      (ev.calendar ? '<div style="font-size:11px;color:var(--fg-muted);">' + ev.calendar.replace(/</g,'&lt;') + '</div>' : '') +
      '</div></div>';
  });
  html += '</div>';
  body.innerHTML = html;
}

function openAddEvent() {
  document.getElementById('add-modal').classList.add('open');
  document.getElementById('ev-title').focus();
}
function closeAddEvent() { document.getElementById('add-modal').classList.remove('open'); }

function saveEvent() {
  var title = document.getElementById('ev-title').value.trim();
  if (!title) { alert('Enter a title.'); return; }
  var start = document.getElementById('ev-start').value;
  var end = document.getElementById('ev-end').value;
  var desc = document.getElementById('ev-desc').value;
  fetch(WORKER + '/api/calendar/add', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:title, start:new Date(start).toISOString(), end:new Date(end).toISOString(), description:desc})
  }).then(function(r){return r.json();}).then(function(d){
    if (d.success) { closeAddEvent(); loadEvents(); }
    else alert('Error: ' + (d.error||JSON.stringify(d)));
  }).catch(function(e){alert('Error: '+e.message);});
}
</script>
</body>
</html>
