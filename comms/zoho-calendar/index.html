<!DOCTYPE html>
<html lang="en-GB">
<head>
<!-- cache-bust-1793057851 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Zoho — Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">

<style>
.zoho-wrap{max-width:560px;margin:40px auto;padding:0 20px;}
.zoho-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:16px;}
.zoho-card h2{margin:0 0 6px;font-size:18px;}
.info-box{background:var(--bg-sunken);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:12px;}
.info-box strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--fg-muted);margin-bottom:4px;}
.info-box code{font-family:monospace;font-size:12px;color:var(--accent);word-break:break-all;}
.btn-primary{display:block;width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:8px;}
.btn-secondary{display:block;width:100%;padding:11px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:8px;}
.status-ok{background:rgba(22,163,74,0.1);border:1px solid #16a34a;border-radius:8px;padding:14px;color:#16a34a;font-size:13px;margin-bottom:14px;}
.status-err{background:rgba(220,38,38,0.1);border:1px solid #dc2626;border-radius:8px;padding:14px;color:#dc2626;font-size:13px;margin-bottom:14px;}
.debug-log{background:#111;color:#0f0;border-radius:8px;padding:12px;font-family:monospace;font-size:11px;white-space:pre-wrap;max-height:200px;overflow-y:auto;margin-top:10px;}
.event-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.event-item:last-child{border-bottom:none;}
.event-time{font-size:11px;color:var(--accent);font-weight:600;}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="zoho-wrap">
  <div class="zoho-card">
    <h2>&#x1F4C5; Zoho Calendar &amp; Mail</h2>
    <div id="status-area"><p style="color:var(--fg-muted);font-size:13px;">Checking connection...</p></div>
    <div id="events-area"></div>
    <div id="action-area"></div>
    <div class="debug-log" id="debug-log"></div>
  </div>
  <div class="zoho-card" id="setup-card" style="display:none;">
    <h2>Setup</h2>
    <div class="info-box">
      <strong>Register this EXACT redirect URI in Zoho console (api-console.zoho.eu)</strong>
      <code id="show-uri"></code>
    </div>
    <div class="info-box">
      <strong>Client ID</strong>
      <code>1000.BXJ9CZSVLMX25OO9L0KKG95KR8Y05P</code>
    </div>
  </div>
</div>
</div>
<script>

var WORKER = 'https://prism-api.identitypartners.workers.dev';
var CLIENT_ID = '1000.BXJ9CZSVLMX25OO9L0KKG95KR8Y05P';
var REDIRECT_URI = window.location.origin + '/comms/zoho-calendar/';

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/comms/zoho-calendar/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  var uriEl = document.getElementById('show-uri');
  if (uriEl) uriEl.textContent = REDIRECT_URI;
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error');
  if (error) { showError('Zoho error: ' + error); showConnectUI(); return; }
  if (code) {
    window.history.replaceState({}, '', '/comms/zoho-calendar/');
    log('Received authorisation code. Exchanging...');
    exchangeCode(code);
    return;
  }
  checkConnection();
});

function checkConnection() {
  log('Checking connection...');
  fetch(WORKER + '/api/calendar/events')
    .then(function(r){return r.json();})
    .then(function(d){
      log('Calendar API: ' + JSON.stringify(d).substring(0,100));
      if (d.status === 'not_connected' || d.status === 'api_error') {
        showConnectUI();
      } else {
        showConnectedUI(d);
      }
    })
    .catch(function(e){ log('Error: '+e.message); showConnectUI(); });
}

function showConnectedUI(data) {
  var status = document.getElementById('status-area');
  if (status) status.innerHTML = '<div class="status-ok">Connected to Zoho Calendar and Mail</div>';
  var events = [].concat(data.today||[]).concat(data.week||[]).slice(0,10);
  var evArea = document.getElementById('events-area');
  if (evArea) {
    if (events.length) {
      evArea.innerHTML = '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--fg-muted);margin-bottom:8px;">Upcoming Events</div>' +
        events.map(function(ev) {
          var time = ev.start ? new Date(ev.start).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
          return '<div class="event-item"><div class="event-time">'+time+'</div><div>'+(ev.title||'')+'</div></div>';
        }).join('');
    } else {
      evArea.innerHTML = '<div style="font-size:13px;color:var(--fg-muted);">No upcoming events found.</div>';
    }
  }
  var actionArea = document.getElementById('action-area');
  if (actionArea) {
    actionArea.innerHTML = '<button class="btn-secondary" onclick="disconnectZoho()" style="margin-top:14px;">Disconnect</button>';
  }
}

function showConnectUI() {
  var status = document.getElementById('status-area');
  if (status) status.innerHTML = '<p style="color:var(--fg-muted);font-size:13px;">Not connected. Click below to authorise Argentica.</p>';
  var actionArea = document.getElementById('action-area');
  if (actionArea) {
    actionArea.innerHTML = '<button class="btn-primary" onclick="connectZoho()">Connect Zoho</button>' +
      '<button class="btn-secondary" onclick="toggleSetup()">Setup / Debug</button>';
  }
}

function connectZoho() {
  var scope = 'ZohoCalendar.calendar.READ,ZohoCalendar.event.READ,ZohoCalendar.event.CREATE,ZohoMail.messages.ALL,ZohoMail.folders.ALL,ZohoMail.accounts.READ';
  var url = 'https://accounts.zoho.eu/oauth/v2/auth' +
    '?response_type=code' +
    '&client_id=' + encodeURIComponent(CLIENT_ID) +
    '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
    '&scope=' + encodeURIComponent(scope) +
    '&access_type=offline' +
    '&prompt=consent';
  log('Redirecting to Zoho...');
  window.location.href = url;
}

function exchangeCode(code) {
  fetch(WORKER + '/api/zoho/exchange', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:code, redirect_uri:REDIRECT_URI})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    log('Exchange: ' + JSON.stringify(d).substring(0,100));
    if (d.success) { checkConnection(); }
    else { showError('Token exchange failed: '+(d.error||'unknown')); showConnectUI(); }
  })
  .catch(function(e){ showError('Network error: '+e.message); showConnectUI(); });
}

function disconnectZoho() {
  fetch(WORKER+'/api/kv/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'zoho:calendar:token',value:''})})
    .then(function(){checkConnection();});
}

function toggleSetup() {
  var card = document.getElementById('setup-card');
  if (card) card.style.display = card.style.display === 'none' ? 'block' : 'none';
}

function showError(msg) {
  var status = document.getElementById('status-area');
  if (status) status.innerHTML = '<div class="status-err">'+msg+'</div>';
  log('ERROR: '+msg);
}

function log(msg) {
  var el = document.getElementById('debug-log');
  if (el) { el.textContent += new Date().toLocaleTimeString('en-GB')+' '+msg+'\n'; el.scrollTop = el.scrollHeight; }
}

</script>
</body>
</html>
