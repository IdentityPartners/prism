<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Zoho — Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.zoho-wrap { max-width:560px; margin:60px auto; padding:0 20px; }
.zoho-card { background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px; padding:28px; }
.zoho-card h2 { margin:0 0 6px; font-size:18px; }
.zoho-card p { font-size:13px; color:var(--fg-muted); margin:0 0 20px; }
.zoho-info { background:var(--bg-sunken); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:20px; font-size:12px; }
.zoho-info strong { display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--fg-muted); margin-bottom:4px; }
.zoho-info code { font-family:monospace; font-size:13px; color:var(--accent); word-break:break-all; }
.zoho-btn { display:block; width:100%; padding:12px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; margin-bottom:10px; }
.zoho-btn:hover { opacity:0.85; }
.zoho-btn.secondary { background:var(--bg); color:var(--fg); border:1px solid var(--border); }
.zoho-log { background:#1a1a1a; color:#0f0; border-radius:8px; padding:12px; font-family:monospace; font-size:11px; margin-top:16px; min-height:60px; white-space:pre-wrap; display:none; }
.zoho-log.show { display:block; }
.zoho-success { background:rgba(22,163,74,0.1); border:1px solid #16a34a; border-radius:8px; padding:14px; color:#16a34a; font-size:13px; display:none; }
.zoho-success.show { display:block; }
.zoho-error { background:rgba(220,38,38,0.1); border:1px solid #dc2626; border-radius:8px; padding:14px; color:#dc2626; font-size:13px; display:none; }
.zoho-error.show { display:block; }
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="zoho-wrap">
<div class="zoho-card">
  <h2>🔑 Connect Zoho</h2>
  <p>Connects Calendar and Mail. One app covers both.</p>

  <div class="zoho-info">
    <strong>Client ID (in Zoho console)</strong>
    <code id="show-client-id">1000.HMH9CMYHZ9TPTN1FAXK6VTC6R8ISMZ</code>
  </div>

  <div class="zoho-info">
    <strong>Redirect URI — register this EXACTLY in Zoho console → api-console.zoho.eu → Argentica app → Client Details</strong>
    <code id="show-redirect-uri"></code>
  </div>

  <div class="zoho-success" id="success-msg">
    ✓ Connected! Calendar and Mail access granted. <a href="/home/" style="color:#16a34a;">Go to Home →</a>
  </div>
  <div class="zoho-error" id="error-msg"></div>

  <button class="zoho-btn" onclick="connectZoho()">Connect Zoho →</button>
  <button class="zoho-btn secondary" onclick="window.location.href='/settings/'">Back to Settings</button>

  <div class="zoho-log" id="zoho-log"></div>
</div>
</div>
</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var CLIENT_ID = '1000.HMH9CMYHZ9TPTN1FAXK6VTC6R8ISMZ';
// Redirect URI = this page's URL exactly
var REDIRECT_URI = window.location.origin + '/comms/zoho-calendar/';

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/comms/zoho-calendar/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }

  // Show the exact redirect URI being used
  document.getElementById('show-redirect-uri').textContent = REDIRECT_URI;

  // Handle callback (?code=...)
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error');

  if (error) {
    showError('Zoho error: ' + error + (params.get('error_description') ? ' — ' + params.get('error_description') : ''));
    return;
  }

  if (code) {
    log('Received authorisation code. Exchanging for token...');
    window.history.replaceState({}, '', '/comms/zoho-calendar/');
    exchangeCode(code);
  }
});

function connectZoho() {
  var scope = 'ZohoCalendar.calendar.READ,ZohoCalendar.event.READ,ZohoCalendar.event.CREATE,ZohoMail.messages.READ,ZohoMail.accounts.READ';
  var authUrl = 'https://accounts.zoho.eu/oauth/v2/auth' +
    '?response_type=code' +
    '&client_id=' + encodeURIComponent(CLIENT_ID) +
    '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
    '&scope=' + encodeURIComponent(scope) +
    '&access_type=offline' +
    '&prompt=consent';
  log('Redirecting to Zoho...');
  log('Redirect URI: ' + REDIRECT_URI);
  setTimeout(function() { window.location.href = authUrl; }, 500);
}

function exchangeCode(code) {
  log('Calling /api/zoho/exchange...');
  fetch(WORKER + '/api/zoho/exchange', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code, redirect_uri: REDIRECT_URI })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) {
      log('Token stored. API domain: ' + d.api_domain);
      document.getElementById('success-msg').classList.add('show');
    } else {
      showError('Token exchange failed: ' + (d.error || JSON.stringify(d)));
    }
  })
  .catch(function(e) { showError('Network error: ' + e.message); });
}

function log(msg) {
  var el = document.getElementById('zoho-log');
  el.classList.add('show');
  el.textContent += new Date().toLocaleTimeString('en-GB') + ' ' + msg + '\n';
}

function showError(msg) {
  var el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('show');
  log('ERROR: ' + msg);
}
</script>
</body>
</html>
