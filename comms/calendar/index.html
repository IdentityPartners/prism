<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar - Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
.cal-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.cal-topbar{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg-elevated);}
.cal-topbar h1{font-size:1rem;font-weight:700;margin:0;flex:1;}
.cal-body{flex:1;overflow:hidden;padding:16px;}
.btn{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:0.82rem;font-weight:600;font-family:inherit;text-decoration:none;display:inline-block;}
.btn-secondary{background:var(--bg-sunken);color:var(--fg);border:1px solid var(--border);}
.fc{height:100%;font-family:inherit;font-size:0.85rem;}
.fc-toolbar-title{font-size:1rem !important;font-weight:700;}
.fc-button{background:var(--bg-sunken) !important;border-color:var(--border) !important;color:var(--fg) !important;font-family:inherit !important;font-size:0.82rem !important;}
.fc-button-active,.fc-button:hover{background:var(--accent) !important;color:#fff !important;border-color:var(--accent) !important;}
.fc-daygrid-day-number,.fc-col-header-cell-cushion{color:var(--fg) !important;text-decoration:none !important;}
.fc-day-today{background:rgba(45,106,159,0.08) !important;}
.fc-event{border-radius:4px !important;font-size:0.78rem !important;}
.not-connected{text-align:center;padding:60px 20px;color:var(--fg-muted);}
.api-warn{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:10px 14px;font-size:0.85rem;margin-bottom:12px;}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="cal-shell">
  <div class="cal-topbar">
    <span class="iconify" data-icon="ph:calendar-bold" style="font-size:1.4rem;color:var(--accent);"></span>
    <h1>Calendar</h1>
    <button class="btn btn-secondary" onclick="if(calendar)calendar.refetchEvents()">Refresh</button>
    <a href="https://calendar.google.com" target="_blank" class="btn btn-secondary">Open Google Calendar</a>
    <a href="/comms/google/" class="btn btn-secondary">Google Account</a>
  </div>
  <div class="cal-body">
    <div id="cal-warn" style="display:none;"></div>
    <div id="cal-container" style="height:100%;"></div>
  </div>
</div>
</div>
<script>
var WORKER = "https://prism-api.identitypartners.workers.dev";
var calendar = null;
document.addEventListener("DOMContentLoaded", function() {
  var mount = document.getElementById("sidebar-mount");
  if (mount && typeof buildSidebar === "function") {
    var sb = buildSidebar("/comms/");
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  initCalendar();
});
function initCalendar() {
  var el = document.getElementById("cal-container");
  calendar = new FullCalendar.Calendar(el, {
    initialView: "dayGridMonth",
    headerToolbar: {left:"prev,next today",center:"title",right:"dayGridMonth,timeGridWeek,listWeek"},
    height: "100%",
    firstDay: 1,
    locale: "en-GB",
    buttonText: {today:"Today",month:"Month",week:"Week",list:"List"},
    events: fetchEvents,
    eventClick: function(info) {
      var ev = info.event;
      var loc = ev.extendedProps.location ? "\nLocation: " + ev.extendedProps.location : "";
      var desc = ev.extendedProps.description ? "\n\n" + ev.extendedProps.description.substring(0,200) : "";
      alert(ev.title + "\n" + (ev.start ? ev.start.toLocaleString("en-GB") : "") + loc + desc);
    },
    noEventsContent: "No events. Add them in Google Calendar.",
  });
  calendar.render();
}
function fetchEvents(info, successCallback, failureCallback) {
  fetch(WORKER + "/api/google/calendar")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var warn = document.getElementById("cal-warn");
      if (d.status === "not_connected") {
        warn.style.display = "block";
        warn.innerHTML = "<div class=\"not-connected\"><div style=\"font-size:2rem;margin-bottom:10px;\">&#x1F4C5;</div><div style=\"font-size:0.95rem;font-weight:600;margin-bottom:8px;\">Google not connected</div><a href=\"/comms/google/\" style=\"color:var(--accent);\">Connect Google Account</a></div>";
        successCallback([]);
        return;
      }
      if (d.status === "api_error") {
        warn.style.display = "block";
        warn.innerHTML = "<div class=\"api-warn\">&#x26A0; Google Calendar API not enabled. <a href=\"https://console.developers.google.com/apis/api/calendar-json.googleapis.com/overview?project=944507774917\" target=\"_blank\" style=\"color:var(--accent);\">Enable it here</a></div>";
      }
      var events = [];
      var all = (d.today || []).concat(d.week || []);
      all.forEach(function(ev) {
        events.push({
          id: ev.id,
          title: ev.title || "Event",
          start: ev.starts_at,
          end: ev.ends_at || null,
          extendedProps: {location: ev.location || "", description: ev.description || ""},
          backgroundColor: "#2d6a9f",
          borderColor: "#2d6a9f",
        });
      });
      successCallback(events);
    })
    .catch(function(e) { failureCallback(e); });
}
</script>
</body>
</html>
