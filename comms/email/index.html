<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email - Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
.email-shell{display:flex;height:100vh;overflow:hidden;}
.email-list-panel{width:320px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface);}
.email-list-hdr{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg-elevated);}
.email-list-hdr h2{font-size:0.95rem;font-weight:700;margin:0;flex:1;}
.email-list-body{flex:1;overflow-y:auto;}
.email-detail{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.email-detail-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg-elevated);}
.email-detail-body{flex:1;overflow-y:auto;padding:20px;}
.msg-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;}
.msg-item:hover,.msg-item.active{background:var(--bg-sunken);}
.msg-item.unread .msg-subject{font-weight:700;}
.msg-subject{font-size:0.88rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-from{font-size:0.78rem;color:var(--fg-muted);margin-bottom:2px;}
.msg-snippet{font-size:0.78rem;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-date{font-size:0.72rem;color:var(--fg-muted);float:right;margin-top:-18px;}
.btn{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:0.82rem;font-weight:600;font-family:inherit;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--bg-sunken);color:var(--fg);border:1px solid var(--border);}
.compose-overlay{display:none;position:fixed;bottom:60px;right:20px;width:480px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,0.2);z-index:100;}
.compose-overlay.open{display:block;}
.compose-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;font-weight:700;font-size:0.9rem;}
.compose-body{padding:12px;}
.compose-field{margin-bottom:8px;}
.compose-field input,.compose-field textarea{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--fg);font-family:inherit;}
.compose-field textarea{min-height:200px;resize:vertical;}
.not-connected{text-align:center;padding:60px 20px;color:var(--fg-muted);}
.folder-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.folder-tab{padding:6px 12px;font-size:0.8rem;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--fg-muted);}
.folder-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="email-shell">

  <!-- Left: message list -->
  <div class="email-list-panel">
    <div class="email-list-hdr">
      <span class="iconify" data-icon="ph:envelope-bold" style="font-size:1.2rem;color:var(--accent);"></span>
      <h2>Email</h2>
      <button class="btn btn-primary" onclick="openCompose()" style="font-size:0.75rem;padding:4px 10px;">
        <span class="iconify" data-icon="ph:pencil-bold" style="vertical-align:middle;"></span> Compose
      </button>
      <button class="btn btn-secondary" onclick="loadInbox()" style="font-size:0.75rem;padding:4px 8px;" title="Refresh">
        <span class="iconify" data-icon="ph:arrows-clockwise-bold"></span>
      </button>
    </div>
    <div class="folder-tabs">
      <div class="folder-tab active" onclick="setFolder('INBOX',this)">Inbox</div>
      <div class="folder-tab" onclick="setFolder('SENT',this)">Sent</div>
      <div class="folder-tab" onclick="setFolder('DRAFTS',this)">Drafts</div>
    </div>
    <div class="email-list-body" id="email-list">
      <div style="padding:20px;text-align:center;color:var(--fg-muted);font-size:0.85rem;">Loading...</div>
    </div>
  </div>

  <!-- Right: message detail -->
  <div class="email-detail">
    <div class="email-detail-hdr">
      <span id="detail-subject" style="font-size:0.95rem;font-weight:700;flex:1;">Select a message</span>
      <div id="detail-actions"></div>
    </div>
    <div class="email-detail-body" id="email-detail">
      <div id="not-connected-msg" class="not-connected" style="display:none;">
        <div style="font-size:2rem;margin-bottom:10px;">&#x1F4E7;</div>
        <div style="font-size:0.95rem;font-weight:600;margin-bottom:8px;">Email not connected</div>
        <p style="font-size:0.85rem;margin-bottom:14px;">Connect your Proton Mail account via Nylas to read and send email.</p>
        <a href="/comms/nylas/connect/" class="btn btn-primary">Connect Email Account</a>
      </div>
      <div id="detail-content" style="display:none;"></div>
    </div>
  </div>

</div>
</div>

<!-- Compose overlay -->
<div class="compose-overlay" id="compose-overlay">
  <div class="compose-hdr">
    New Message
    <button onclick="closeCompose()" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--fg-muted);">&times;</button>
  </div>
  <div class="compose-body">
    <div class="compose-field"><input type="text" id="compose-to" placeholder="To"></div>
    <div class="compose-field"><input type="text" id="compose-subject" placeholder="Subject"></div>
    <div class="compose-field"><textarea id="compose-body" placeholder="Write your message..."></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="closeCompose()">Cancel</button>
      <button class="btn btn-primary" onclick="sendEmail()">Send</button>
    </div>
  </div>
</div>

<script>
var WORKER = "https://prism-api.identitypartners.workers.dev";
var currentFolder = "INBOX";
var currentMessage = null;

document.addEventListener("DOMContentLoaded", function() {
  var mount = document.getElementById("sidebar-mount");
  if (mount && typeof buildSidebar === "function") {
    var sb = buildSidebar("/comms/");
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  checkStatus();
});

function checkStatus() {
  fetch(WORKER + "/api/nylas/status")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.connected) {
        document.getElementById("not-connected-msg").style.display = "none";
        loadInbox();
      } else {
        document.getElementById("not-connected-msg").style.display = "block";
        document.getElementById("email-list").innerHTML =
          "<div class=\"not-connected\"><a href=\"/comms/nylas/connect/\" class=\"btn btn-primary\">Connect Email</a></div>";
      }
    });
}

function setFolder(folder, btn) {
  currentFolder = folder;
  document.querySelectorAll(".folder-tab").forEach(function(t) { t.classList.remove("active"); });
  if (btn) btn.classList.add("active");
  loadInbox();
}

function loadInbox() {
  var list = document.getElementById("email-list");
  list.innerHTML = "<div style=\"padding:20px;text-align:center;color:var(--fg-muted);font-size:0.85rem;\">Loading...</div>";
  fetch(WORKER + "/api/nylas/inbox?limit=30&folder=" + currentFolder)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status === "not_connected") {
        list.innerHTML = "<div class=\"not-connected\"><a href=\"/comms/nylas/connect/\" class=\"btn btn-primary\">Connect Email</a></div>";
        return;
      }
      if (d.status === "api_error") {
        list.innerHTML = "<div style=\"padding:14px;color:#dc2626;font-size:0.85rem;\">Error: " + esc(d.error || "Unknown") + "</div>";
        return;
      }
      var messages = d.messages || [];
      if (!messages.length) {
        list.innerHTML = "<div style=\"padding:20px;text-align:center;color:var(--fg-muted);font-size:0.85rem;\">No messages.</div>";
        return;
      }
      list.innerHTML = messages.map(function(msg) {
        var dt = msg.date ? new Date(msg.date * 1000).toLocaleDateString("en-GB", {day:"numeric",month:"short"}) : "";
        return "<div class=\"msg-item " + (msg.unread ? "unread" : "") + "\" data-id=\"" + msg.id + "\" onclick=\"openMessage(this)\">" +
          "<div class=\"msg-date\">" + dt + "</div>" +
          "<div class=\"msg-subject\">" + esc(msg.subject) + "</div>" +
          "<div class=\"msg-from\">" + esc(msg.fromName || msg.from) + "</div>" +
          "<div class=\"msg-snippet\">" + esc(msg.snippet) + "</div>" +
          "</div>";
      }).join("");
    })
    .catch(function(e) {
      list.innerHTML = "<div style=\"padding:14px;color:#dc2626;font-size:0.85rem;\">Error: " + e.message + "</div>";
    });
}

function openMessage(el) {
  document.querySelectorAll(".msg-item").forEach(function(m) { m.classList.remove("active"); });
  el.classList.add("active");
  el.classList.remove("unread");
  var msgId = el.dataset.id;
  var detail = document.getElementById("email-detail");
  document.getElementById("detail-content").style.display = "block";
  document.getElementById("not-connected-msg").style.display = "none";
  document.getElementById("detail-content").innerHTML = "<div style=\"color:var(--fg-muted);padding:20px;\">Loading message...</div>";
  fetch(WORKER + "/api/nylas/message/" + msgId)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var msg = d.message || {};
      currentMessage = msg;
      document.getElementById("detail-subject").textContent = msg.subject || "(no subject)";
      document.getElementById("detail-actions").innerHTML =
        "<button class=\"btn btn-secondary\" onclick=\"replyTo()\" style=\"font-size:0.78rem;\">Reply</button>";
      var from = msg.from && msg.from[0] ? msg.from[0].name + " <" + msg.from[0].email + ">" : "";
      var dt = msg.date ? new Date(msg.date * 1000).toLocaleString("en-GB") : "";
      var body = msg.body || msg.snippet || "(no content)";
      document.getElementById("detail-content").innerHTML =
        "<div style=\"margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);\">" +
        "<div style=\"font-size:0.85rem;font-weight:600;\">" + esc(from) + "</div>" +
        "<div style=\"font-size:0.78rem;color:var(--fg-muted);\">" + dt + "</div>" +
        "</div>" +
        "<div style=\"font-size:0.9rem;line-height:1.7;\">" + body + "</div>";
    })
    .catch(function(e) {
      document.getElementById("detail-content").innerHTML = "<div style=\"color:#dc2626;\">Error: " + e.message + "</div>";
    });
}

function replyTo() {
  if (!currentMessage) return;
  var from = currentMessage.from && currentMessage.from[0] ? currentMessage.from[0].email : "";
  document.getElementById("compose-to").value = from;
  document.getElementById("compose-subject").value = "Re: " + (currentMessage.subject || "");
  document.getElementById("compose-body").value = "";
  openCompose();
}

function openCompose() { document.getElementById("compose-overlay").classList.add("open"); }
function closeCompose() { document.getElementById("compose-overlay").classList.remove("open"); }

function sendEmail() {
  var to = document.getElementById("compose-to").value.trim();
  var subject = document.getElementById("compose-subject").value.trim();
  var body = document.getElementById("compose-body").value.trim();
  if (!to || !body) { alert("To and body are required."); return; }
  fetch(WORKER + "/api/nylas/send", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      to: [{email: to}],
      subject: subject,
      body: body,
      reply_to_message_id: currentMessage ? currentMessage.id : undefined
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) { closeCompose(); alert("Sent!"); }
    else { alert("Send failed: " + (d.error || "Unknown error")); }
  });
}

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
</script>
</body>
</html>
