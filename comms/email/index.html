<!DOCTYPE html>
<html lang="en-GB">
<head>
<!-- cache-bust-1792945005 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail — Argentica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3b3a'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<style>
.mail-shell { display:flex; height:100vh; overflow:hidden; }
.mail-left { width:240px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--bg-surface); overflow:hidden; }
.mail-list-panel { flex:1; overflow:hidden; display:flex; flex-direction:column; border-right:1px solid var(--border); min-width:280px; max-width:340px; }
.mail-detail-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

/* Left nav */
.mail-nav-hdr { padding:10px 12px 8px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.mail-nav-hdr h3 { font-size:13px; font-weight:600; margin:0; }
.mail-compose-btn { padding:5px 12px; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-family:inherit; }
.mail-folder { display:flex; align-items:center; gap:8px; padding:7px 12px; cursor:pointer; border-radius:6px; margin:2px 6px; font-size:13px; color:var(--fg); transition:background 0.1s; }
.mail-folder:hover { background:var(--bg-sunken); }
.mail-folder.active { background:var(--accent-light,#e8f0f8); color:var(--accent); font-weight:600; }
.mail-folder-count { margin-left:auto; font-size:10px; background:var(--accent); color:#fff; border-radius:8px; padding:1px 6px; }

/* List panel */
.mail-list-hdr { padding:8px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.mail-list-hdr h4 { font-size:12px; font-weight:600; margin:0; color:var(--fg-muted); text-transform:uppercase; letter-spacing:0.4px; }
.mail-list-body { flex:1; overflow-y:auto; }
.mail-item { padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.1s; }
.mail-item:hover { background:var(--bg-sunken); }
.mail-item.active { background:var(--accent-light,#e8f0f8); border-left:3px solid var(--accent); }
.mail-item.unread .mail-subject { font-weight:700; }
.mail-from { font-size:12.5px; font-weight:600; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mail-subject { font-size:12px; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.mail-preview { font-size:11px; color:var(--fg-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.mail-meta { font-size:10px; color:var(--fg-muted); margin-top:3px; display:flex; justify-content:space-between; align-items:center; }
.unread-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; }

/* Detail */
.mail-detail-hdr { padding:16px 20px; border-bottom:1px solid var(--border); background:var(--bg-elevated); flex-shrink:0; }
.mail-detail-subject { font-size:18px; font-weight:700; margin-bottom:8px; }
.mail-detail-meta { font-size:12px; color:var(--fg-muted); display:flex; gap:16px; flex-wrap:wrap; margin-bottom:10px; }
.mail-detail-actions { display:flex; gap:6px; }
.mail-detail-body { flex:1; overflow-y:auto; padding:20px; font-size:14px; line-height:1.7; }
.mail-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--fg-muted); }

/* Compose */
.compose-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:9999; display:none; align-items:flex-end; justify-content:flex-end; padding:20px; }
.compose-overlay.open { display:flex; }
.compose-box { background:var(--bg-elevated); border-radius:12px 12px 0 0; width:520px; display:flex; flex-direction:column; box-shadow:0 -4px 32px rgba(0,0,0,0.2); max-height:70vh; }
.compose-hdr { padding:12px 16px; background:var(--accent); color:#fff; border-radius:12px 12px 0 0; display:flex; align-items:center; justify-content:space-between; }
.compose-hdr strong { font-size:14px; }
.compose-field { padding:8px 16px; border-bottom:1px solid var(--border); }
.compose-field input { width:100%; border:none; font-size:13px; background:transparent; color:var(--fg); outline:none; }
.compose-body { flex:1; }
.compose-body textarea { width:100%; height:200px; padding:12px 16px; border:none; font-size:14px; font-family:inherit; resize:none; background:transparent; color:var(--fg); outline:none; box-sizing:border-box; }
.compose-footer { padding:10px 16px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
.btn-sm { padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer; font-family:inherit; }
.btn-primary { background:var(--accent); color:#fff; border:none; }
.btn-secondary { background:var(--bg); color:var(--fg); border:1px solid var(--border); }
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="mail-shell">

<!-- Left: Folder nav -->
<div class="mail-left">
  <div class="mail-nav-hdr">
    <h3>📬 Mail</h3>
    <button class="mail-compose-btn" onclick="openCompose()">+ Compose</button>
  </div>
  <div style="padding:6px 0;" id="folder-nav">
    <div class="mail-folder active" id="folder-inbox" onclick="loadFolder('inbox','Inbox')">
      <span>📬</span><span>Inbox</span><span class="mail-folder-count" id="inbox-count" style="display:none;"></span>
    </div>
    <div class="mail-folder" id="folder-sent" onclick="loadFolder('sent','Sent')"><span>📤</span><span>Sent</span></div>
    <div class="mail-folder" id="folder-drafts" onclick="loadFolder('drafts','Drafts')"><span>📝</span><span>Drafts</span></div>
    <div class="mail-folder" id="folder-trash" onclick="loadFolder('trash','Trash')"><span>🗑</span><span>Trash</span></div>
    <div style="border-top:1px solid var(--border);margin:6px 12px;"></div>
    <div id="custom-folders"></div>
  </div>
</div>

<!-- Centre: Message list -->
<div class="mail-list-panel">
  <div class="mail-list-hdr">
    <h4 id="current-folder-name">Inbox</h4>
    <button onclick="loadCurrentFolder()" style="padding:3px 8px;border:1px solid var(--border);border-radius:5px;cursor:pointer;background:var(--bg);font-size:11px;">↻</button>
  </div>
  <div class="mail-list-body" id="mail-list">
    <div style="padding:20px;text-align:center;font-size:12px;color:var(--fg-muted);">Loading...</div>
  </div>
</div>

<!-- Right: Message detail -->
<div class="mail-detail-panel" id="mail-detail">
  <div class="mail-empty">
    <div style="font-size:48px;margin-bottom:12px;">📬</div>
    <div style="font-size:14px;font-weight:600;margin-bottom:6px;">hello@identitypartners.uk</div>
    <div style="font-size:12px;">Select a message to read it.</div>
  </div>
</div>

</div>
</div>

<!-- Compose -->
<div class="compose-overlay" id="compose-overlay">
<div class="compose-box">
  <div class="compose-hdr">
    <strong>New Message</strong>
    <button onclick="closeCompose()" style="background:none;border:none;color:#fff;cursor:pointer;font-size:18px;">✕</button>
  </div>
  <div class="compose-field"><input id="compose-to" type="email" placeholder="To:"></div>
  <div class="compose-field"><input id="compose-subject" type="text" placeholder="Subject:"></div>
  <div class="compose-body"><textarea id="compose-body" placeholder="Write your message..."></textarea></div>
  <div class="compose-footer">
    <button class="btn-sm btn-secondary" onclick="closeCompose()">Discard</button>
    <button class="btn-sm btn-primary" onclick="sendMail()">Send ↑</button>
  </div>
</div>
</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var messages = [];
var currentMsg = null;
var currentFolderId = 'inbox';
var currentFolderName = 'Inbox';

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/comms/email/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  loadFolders();
  loadCurrentFolder();
});

function loadFolders() {
  fetch(WORKER + '/api/zoho/mail/folders')
    .then(function(r){return r.json();})
    .then(function(d){
      var folders = d.folders || [];
      var customEl = document.getElementById('custom-folders');
      customEl.innerHTML = '';
      var knownNames = ['inbox','sent','drafts','trash','spam','junk'];
      folders.forEach(function(f) {
        var nameLower = f.name.toLowerCase();
        // Update unread count on known folders
        if (nameLower === 'inbox' && f.unread > 0) {
          var ic = document.getElementById('inbox-count');
          if (ic) { ic.textContent = f.unread; ic.style.display = 'inline'; }
        }
        // Add custom folders
        if (!knownNames.some(function(k){return nameLower.includes(k);})) {
          var div = document.createElement('div');
          div.className = 'mail-folder';
          div.innerHTML = '<span>📁</span><span>' + f.name.replace(/</g,'&lt;') + '</span>';
          if (f.unread > 0) {
            var badge = document.createElement('span');
            badge.className = 'mail-folder-count';
            badge.textContent = f.unread;
            div.appendChild(badge);
          }
          div.onclick = (function(fid, fname){ return function(){ loadFolder(fid, fname); }; })(f.id, f.name);
          customEl.appendChild(div);
        }
      });
    }).catch(function(){});
}

function loadFolder(folderId, folderName) {
  currentFolderId = folderId;
  currentFolderName = folderName;
  document.getElementById('current-folder-name').textContent = folderName;
  // Update active state
  document.querySelectorAll('.mail-folder').forEach(function(el){el.classList.remove('active');});
  var activeEl = document.getElementById('folder-' + folderId);
  if (activeEl) activeEl.classList.add('active');
  loadCurrentFolder();
}

function loadCurrentFolder() {
  var list = document.getElementById('mail-list');
  list.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:var(--fg-muted);">Loading...</div>';
  var url = currentFolderId === 'inbox'
    ? WORKER + '/api/zoho/mail/inbox'
    : WORKER + '/api/zoho/mail/folder?id=' + encodeURIComponent(currentFolderId);
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(d){
      if (d.status === 'not_connected') {
        list.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;"><a href="/comms/zoho-calendar/" style="color:var(--accent);">Connect Zoho →</a></div>';
        return;
      }
      messages = d.messages || [];
      renderList(messages);
    })
    .catch(function(e){
      list.innerHTML = '<div style="padding:12px;font-size:12px;color:#dc2626;">Error: ' + e.message + '</div>';
    });
}

function renderList(msgs) {
  var list = document.getElementById('mail-list');
  if (!msgs.length) {
    list.innerHTML = '<div style="padding:30px;text-align:center;font-size:12px;color:var(--fg-muted);">No messages in ' + currentFolderName + '.</div>';
    return;
  }
  list.innerHTML = '';
  msgs.forEach(function(m, i) {
    var date = m.date ? new Date(parseInt(m.date)).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
    var div = document.createElement('div');
    div.className = 'mail-item' + (!m.read ? ' unread' : '');
    div.onclick = function() { openMessage(i); };
    var fromName = (m.from || '').split('<')[0].trim() || m.from || '';
    div.innerHTML = '<div class="mail-from">' + fromName.replace(/</g,'&lt;') + '</div>' +
      '<div class="mail-subject">' + (m.subject||'(no subject)').replace(/</g,'&lt;') + '</div>' +
      '<div class="mail-preview">' + (m.preview||'').replace(/</g,'&lt;') + '</div>' +
      '<div class="mail-meta"><span>' + date + '</span>' + (!m.read ? '<span class="unread-dot"></span>' : '') + '</div>';
    list.appendChild(div);
  });
}

function openMessage(idx) {
  currentMsg = messages[idx];
  document.querySelectorAll('.mail-item').forEach(function(el,i){el.classList.toggle('active',i===idx);});
  var detail = document.getElementById('mail-detail');
  var date = currentMsg.date ? new Date(parseInt(currentMsg.date)).toLocaleString('en-GB') : '';
  var fromName = (currentMsg.from||'').split('<')[0].trim();
  detail.innerHTML = '<div class="mail-detail-hdr">' +
    '<div class="mail-detail-subject">' + (currentMsg.subject||'(no subject)').replace(/</g,'&lt;') + '</div>' +
    '<div class="mail-detail-meta"><span>From: ' + (currentMsg.from||'').replace(/</g,'&lt;') + '</span><span>' + date + '</span></div>' +
    '<div class="mail-detail-actions">' +
      '<button class="btn-sm btn-secondary" onclick="replyTo()">↩ Reply</button>' +
      '<button class="btn-sm btn-secondary" onclick="forwardMsg()">→ Forward</button>' +
    '</div></div>' +
    '<div class="mail-detail-body">' + (currentMsg.preview||'Full message body not available in preview. Open in Zoho Mail for complete content.').replace(/</g,'&lt;').replace(/\n/g,'<br>') + '</div>';
}

function replyTo() {
  if (!currentMsg) return;
  document.getElementById('compose-to').value = currentMsg.from || '';
  document.getElementById('compose-subject').value = 'Re: ' + (currentMsg.subject||'');
  document.getElementById('compose-body').value = '';
  openCompose();
}

function forwardMsg() {
  if (!currentMsg) return;
  document.getElementById('compose-to').value = '';
  document.getElementById('compose-subject').value = 'Fwd: ' + (currentMsg.subject||'');
  document.getElementById('compose-body').value = '\n\n--- Forwarded message ---\nFrom: ' + (currentMsg.from||'') + '\nSubject: ' + (currentMsg.subject||'');
  openCompose();
}

function openCompose() { document.getElementById('compose-overlay').classList.add('open'); document.getElementById('compose-to').focus(); }
function closeCompose() { document.getElementById('compose-overlay').classList.remove('open'); }

function sendMail() {
  var to = document.getElementById('compose-to').value.trim();
  var subject = document.getElementById('compose-subject').value.trim();
  var body = document.getElementById('compose-body').value.trim();
  if (!to || !body) { alert('Enter recipient and message.'); return; }
  fetch(WORKER + '/api/zoho/mail/send', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({to:to, subject:subject, content:body.replace(/\n/g,'<br>')})
  }).then(function(r){return r.json();}).then(function(d){
    if (d.success) { closeCompose(); alert('Sent.'); }
    else alert('Send failed: ' + (d.error||JSON.stringify(d)));
  }).catch(function(e){alert('Error: '+e.message);});
}
</script>
</body>
</html>
