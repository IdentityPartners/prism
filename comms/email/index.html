<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email - Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
.email-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.email-topbar{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg-elevated);}
.email-topbar h1{font-size:1rem;font-weight:700;margin:0;flex:1;}
.email-body{flex:1;overflow-y:auto;padding:16px;}
.btn{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:0.82rem;font-weight:600;font-family:inherit;text-decoration:none;display:inline-block;}
.btn-secondary{background:var(--bg-sunken);color:var(--fg);border:1px solid var(--border);}
.msg-item{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color 0.15s;}
.msg-item:hover{border-color:var(--accent);}
.msg-item.unread{border-left:3px solid var(--accent);}
.msg-subject{font-size:0.9rem;font-weight:600;margin-bottom:3px;}
.msg-from{font-size:0.78rem;color:var(--fg-muted);margin-bottom:3px;}
.msg-snippet{font-size:0.82rem;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.not-connected{text-align:center;padding:48px 20px;color:var(--fg-muted);}
.warn-box{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:10px 14px;font-size:0.85rem;margin-bottom:12px;}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="email-shell">
  <div class="email-topbar">
    <span class="iconify" data-icon="ph:envelope-bold" style="font-size:1.4rem;color:var(--accent);"></span>
    <h1>Email <span style="font-size:0.75rem;color:var(--fg-muted);font-weight:400;">via Zoho Mail</span></h1>
    <button class="btn btn-secondary" onclick="loadEmail()">Refresh</button>
    <a href="https://mail.zoho.eu" target="_blank" class="btn btn-secondary">Open Zoho Mail</a>
    <a href="/comms/zoho-calendar/" class="btn btn-secondary">Zoho Connect</a>
  </div>
  <div class="email-body">
    <div id="email-content"><div style="color:var(--fg-muted);font-size:0.9rem;">Loading...</div></div>
  </div>
</div>
</div>
<script>
var WORKER = "https://prism-api.identitypartners.workers.dev";
document.addEventListener("DOMContentLoaded", function() {
  var mount = document.getElementById("sidebar-mount");
  if (mount && typeof buildSidebar === "function") {
    var sb = buildSidebar("/comms/");
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  loadEmail();
});
function loadEmail() {
  var content = document.getElementById("email-content");
  content.innerHTML = "<div style=\"color:var(--fg-muted);font-size:0.9rem;\">Loading...</div>";
  fetch(WORKER + "/api/zoho/mail/inbox")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status === "not_connected") {
        content.innerHTML = "<div class=\"not-connected\"><div style=\"font-size:2rem;margin-bottom:10px;\">&#x1F4E7;</div><div style=\"font-size:0.95rem;font-weight:600;margin-bottom:8px;\">Zoho not connected</div><a href=\"/comms/zoho-calendar/\" style=\"color:var(--accent);\">Connect Zoho</a></div>";
        return;
      }
      if (d.status === "api_error") {
        content.innerHTML = "<div class=\"warn-box\">&#x26A0; " + esc(d.error || "Zoho Mail error") + "<br><a href=\"/comms/zoho-calendar/\" style=\"color:var(--accent);\">Reconnect Zoho</a></div>";
        return;
      }
      var messages = d.messages || [];
      if (!messages.length) {
        content.innerHTML = "<div style=\"color:var(--fg-muted);padding:20px;text-align:center;\">Inbox is empty.</div>";
        return;
      }
      content.innerHTML = messages.map(function(msg) {
        var dt = msg.date ? new Date(parseInt(msg.date)).toLocaleString("en-GB", {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
        return "<div class=\"msg-item " + (msg.unread ? "unread" : "") + "\" onclick=\"window.open('https://mail.zoho.eu', '_blank')\">" +
          "<div class=\"msg-subject\">" + esc(msg.subject) + "</div>" +
          "<div class=\"msg-from\">" + esc(msg.fromName || msg.from) + " &middot; " + dt + "</div>" +
          "<div class=\"msg-snippet\">" + esc(msg.snippet) + "</div>" +
          "</div>";
      }).join("");
    })
    .catch(function(e) {
      content.innerHTML = "<div style=\"color:#dc2626;padding:12px;\">Error: " + e.message + "</div>";
    });
}
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
</script>
</body>
</html>
