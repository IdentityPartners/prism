<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email - Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
.email-shell{display:flex;height:100vh;overflow:hidden;}
.email-list-panel{width:340px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface);}
.email-list-hdr{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg-elevated);}
.email-list-hdr h2{font-size:0.95rem;font-weight:700;margin:0;flex:1;}
.email-list-body{flex:1;overflow-y:auto;}
.email-detail{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.email-detail-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px;flex-shrink:0;background:var(--bg-elevated);}
.email-detail-body{flex:1;overflow-y:auto;padding:20px;}
.msg-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;}
.msg-item:hover,.msg-item.active{background:var(--bg-sunken);}
.msg-item.unread .msg-subject{font-weight:700;}
.msg-subject{font-size:0.88rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-from{font-size:0.78rem;color:var(--fg-muted);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-snippet{font-size:0.78rem;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-date{font-size:0.72rem;color:var(--fg-muted);float:right;margin-top:-18px;}
.btn{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:0.82rem;font-weight:600;font-family:inherit;text-decoration:none;display:inline-block;}
.btn-secondary{background:var(--bg-sunken);color:var(--fg);border:1px solid var(--border);}
.btn-primary{background:var(--accent);color:#fff;}
.not-connected{text-align:center;padding:60px 20px;color:var(--fg-muted);}
.folder-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.folder-tab{padding:7px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--fg-muted);}
.folder-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.detail-subject{font-size:1rem;font-weight:700;margin:0 0 4px;}
.detail-meta{font-size:0.8rem;color:var(--fg-muted);}
.detail-body{font-size:0.9rem;line-height:1.7;margin-top:16px;white-space:pre-wrap;word-break:break-word;}
.warn-box{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:10px 14px;font-size:0.85rem;margin-bottom:12px;}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="email-shell">

  <div class="email-list-panel">
    <div class="email-list-hdr">
      <span class="iconify" data-icon="ph:envelope-bold" style="font-size:1.2rem;color:var(--accent);"></span>
      <h2>Email</h2>
      <button class="btn btn-secondary" onclick="loadInbox()" style="font-size:0.75rem;padding:4px 8px;" title="Refresh">
        <span class="iconify" data-icon="ph:arrows-clockwise-bold"></span>
      </button>
      <button class="btn btn-primary" onclick="openCompose(null)" style="font-size:0.75rem;padding:4px 10px;">
        <span class="iconify" data-icon="ph:pencil-bold" style="vertical-align:middle;"></span> Compose
      </button>
      <a href="https://mail.google.com" target="_blank" class="btn btn-secondary" style="font-size:0.75rem;padding:4px 8px;" title="Open Gmail">
        <span class="iconify" data-icon="ph:arrow-square-out-bold"></span>
      </a>
    </div>
    <div class="folder-tabs">
      <div class="folder-tab active" onclick="setLabel('INBOX',this)">Inbox</div>
      <div class="folder-tab" onclick="setLabel('SENT',this)">Sent</div>
      <div class="folder-tab" onclick="setLabel('STARRED',this)">Starred</div>
    </div>
    <div class="email-list-body" id="email-list">
      <div style="padding:20px;text-align:center;color:var(--fg-muted);font-size:0.85rem;">Loading...</div>
    </div>
  </div>

  <div class="email-detail">
    <div class="email-detail-hdr" id="detail-hdr">
      <div style="flex:1;">
        <div class="detail-subject" id="detail-subject">Select a message</div>
        <div class="detail-meta" id="detail-meta"></div>
      </div>
      <div id="detail-actions"></div>
    </div>
    <div class="email-detail-body" id="email-detail">
      <div id="not-connected-msg" class="not-connected" style="display:none;">
        <div style="font-size:2rem;margin-bottom:10px;">&#x1F4E7;</div>
        <div style="font-size:0.95rem;font-weight:600;margin-bottom:8px;">Google not connected</div>
        <a href="https://prism.identitypartners.uk/comms/google/" class="btn btn-primary">Connect Google Account</a>
      </div>
      <div id="detail-content"></div>
    </div>
  </div>

</div>
</div>

<script>
var WORKER = "https://prism.identitypartners.uk";
var currentLabel = "INBOX";
var currentMsg = null;
var currentMsgId = null;

document.addEventListener("DOMContentLoaded", function() {
  var mount = document.getElementById("sidebar-mount");
  if (mount && typeof buildSidebar === "function") {
    var sb = buildSidebar("/comms/");
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  checkStatus();
});

function checkStatus() {
  fetch(WORKER + "/api/google/status")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.connected) {
        document.getElementById("not-connected-msg").style.display = "none";
        loadInbox();
      } else {
        document.getElementById("not-connected-msg").style.display = "block";
        document.getElementById("email-list").innerHTML =
          "<div class=\"not-connected\"><a href=\"https://prism.identitypartners.uk/comms/google/\" class=\"btn btn-primary\">Connect Google Account</a></div>";
      }
    })
    .catch(function() { loadInbox(); });
}

function setLabel(label, btn) {
  currentLabel = label;
  document.querySelectorAll(".folder-tab").forEach(function(t) { t.classList.remove("active"); });
  if (btn) btn.classList.add("active");
  loadInbox();
}

function loadInbox() {
  var list = document.getElementById("email-list");
  list.innerHTML = "<div style=\"padding:20px;text-align:center;color:var(--fg-muted);font-size:0.85rem;\">Loading...</div>";
  fetch(WORKER + "/api/google/gmail?maxResults=30&label=" + currentLabel)
    .then(function(r) {
      var ct = r.headers.get('content-type') || '';
      if (!ct.includes('application/json')) {
        // HTML response = auth error or worker not ready
        return { error: 'Authentication required', status: 'not_connected' };
      }
      return r.json();
    })
    .then(function(d) {
      if (d.status === "not_connected") {
        list.innerHTML = "<div class=\"not-connected\"><a href=\"https://prism.identitypartners.uk/comms/google/\" class=\"btn btn-primary\">Connect Google Account</a></div>";
        return;
      }
      if (d.status === "api_error") {
        list.innerHTML = "<div class=\"warn-box\">&#x26A0; " + esc(d.error || "Gmail API error") + "<br><small>Enable Gmail API at <a href=\"https://console.developers.google.com/apis/api/gmail.googleapis.com/overview?project=944507774917\" target=\"_blank\" style=\"color:var(--accent);\">Google Cloud Console</a></small></div>";
        return;
      }
      var messages = d.messages || [];
      if (!messages.length) {
        list.innerHTML = "<div style=\"padding:20px;text-align:center;color:var(--fg-muted);font-size:0.85rem;\">No messages in " + currentLabel + ".</div>";
        return;
      }
      list.innerHTML = messages.map(function(msg) {
        var dt = msg.date ? new Date(msg.date).toLocaleDateString("en-GB", {day:"numeric",month:"short"}) : "";
        return "<div class=\"msg-item " + (msg.unread ? "unread" : "") + "\" data-id=\"" + esc(msg.id) + "\" onclick=\"openMessage(this)\">"
          + "<div class=\"msg-date\">" + dt + "</div>"
          + "<div class=\"msg-subject\">" + esc(msg.subject) + "</div>"
          + "<div class=\"msg-from\">" + esc(msg.fromName || msg.from) + "</div>"
          + "<div class=\"msg-snippet\">" + esc(msg.snippet) + "</div>"
          + "</div>";
      }).join("");
    })
    .catch(function(e) {
      list.innerHTML = "<div style=\"padding:14px;color:#dc2626;font-size:0.85rem;\">Error: " + esc(e.message) + "</div>";
    });
}

function openMessage(el) {
  document.querySelectorAll(".msg-item").forEach(function(m) { m.classList.remove("active"); });
  el.classList.add("active");
  el.classList.remove("unread");
  var msgId = el.dataset.id;
  currentMsgId = msgId;
  document.getElementById("detail-subject").textContent = "Loading...";
  document.getElementById("detail-meta").textContent = "";
  document.getElementById("detail-content").innerHTML = "<div style=\"color:var(--fg-muted);\">Loading message...</div>";
  document.getElementById("detail-actions").innerHTML = "";

  // Fetch full message via Gmail API
  fetch(WORKER + "/api/google/gmail/message?id=" + encodeURIComponent(msgId))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var msg = d.message || {};
      currentMsg = msg;
      document.getElementById("detail-subject").textContent = msg.subject || "(no subject)";
      document.getElementById("detail-meta").textContent =
        "From: " + (msg.from || "") + "  ·  " + (msg.date ? new Date(msg.date).toLocaleString("en-GB") : "");
      document.getElementById("detail-actions").innerHTML =
        "<a href=\"https://mail.google.com/mail/u/0/#inbox/" + esc(msgId) + "\" target=\"_blank\" class=\"btn btn-secondary\" style=\"font-size:0.78rem;\">Open in Gmail</a>";
      var body = msg.body || msg.snippet || "(no content)";
      // Render HTML body safely in an iframe, or plain text
      if (msg.bodyHtml) {
        var iframe = document.createElement("iframe");
        iframe.style.cssText = "width:100%;height:500px;border:none;background:#fff;";
        iframe.sandbox = "allow-same-origin";
        document.getElementById("detail-content").innerHTML = "";
        document.getElementById("detail-content").appendChild(iframe);
        iframe.contentDocument.open();
        iframe.contentDocument.write(msg.bodyHtml);
        iframe.contentDocument.close();
      } else {
        document.getElementById("detail-content").innerHTML =
          "<div class=\"detail-body\">" + esc(body) + "</div>";
      }
    })
    .catch(function(e) {
      document.getElementById("detail-content").innerHTML =
        "<div style=\"color:#dc2626;\">Error loading message: " + esc(e.message) + "</div>";
    });
}


function openCompose(replyTo) {
  var existing = document.getElementById("compose-overlay");
  if (existing) existing.remove();
  var overlay = document.createElement("div");
  overlay.id = "compose-overlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;";
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  var toVal = replyTo ? (replyTo.from || "") : "";
  var subVal = replyTo ? ("Re: " + (replyTo.subject || "")) : "";
  var modal = document.createElement("div");
  modal.style.cssText = "background:var(--bg-elevated);border-radius:12px;width:min(640px,94vw);display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.4);overflow:hidden;";
  modal.innerHTML =
    "<div style=\"padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;\">"
    + "<span style=\"font-size:0.95rem;font-weight:700;flex:1;\">New Message</span>"
    + "<button onclick=\"document.getElementById('compose-overlay').remove()\" style=\"background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--fg-muted);\">&#x2715;</button>"
    + "</div>"
    + "<div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:8px;\">"
    + "<div style=\"display:flex;align-items:center;gap:8px;\"><label style=\"font-size:0.82rem;font-weight:600;width:52px;flex-shrink:0;\">From</label>"
    + "<select id=\"compose-from\" style=\"flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--fg);font-family:inherit;\">"
    + "<option value=\"hello@identitypartners.uk\">hello@identitypartners.uk</option>"
    + "<option value=\"simon@identitypartners.uk\">simon@identitypartners.uk</option>"
    + "</select></div>"
    + "<div style=\"display:flex;align-items:center;gap:8px;\"><label style=\"font-size:0.82rem;font-weight:600;width:52px;flex-shrink:0;\">To</label>"
    + "<input id=\"compose-to\" value=\"" + esc(toVal) + "\" style=\"flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--fg);font-family:inherit;\"></div>"
    + "<div style=\"display:flex;align-items:center;gap:8px;\"><label style=\"font-size:0.82rem;font-weight:600;width:52px;flex-shrink:0;\">Subject</label>"
    + "<input id=\"compose-subject\" value=\"" + esc(subVal) + "\" style=\"flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--fg);font-family:inherit;\"></div>"
    + "<textarea id=\"compose-body\" style=\"padding:8px;border:1px solid var(--border);border-radius:6px;font-size:0.88rem;background:var(--bg);color:var(--fg);font-family:inherit;min-height:220px;resize:vertical;line-height:1.6;\" placeholder=\"Write your message...\"></textarea>"
    + "<div style=\"display:flex;gap:8px;justify-content:flex-end;\">"
    + "<div id=\"compose-status\" style=\"flex:1;font-size:0.82rem;color:var(--fg-muted);align-self:center;\"></div>"
    + "<button class=\"btn btn-secondary\" onclick=\"document.getElementById('compose-overlay').remove()\">Cancel</button>"
    + "<button class=\"btn btn-primary\" onclick=\"sendEmail()\">Send</button>"
    + "</div></div>";
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  setTimeout(function() { var t = document.getElementById("compose-to"); if (t) t.focus(); }, 50);
}

function sendEmail() {
  var to = document.getElementById("compose-to").value.trim();
  var subject = document.getElementById("compose-subject").value.trim();
  var body = document.getElementById("compose-body").value.trim();
  var from = document.getElementById("compose-from").value;
  var status = document.getElementById("compose-status");
  if (!to || !body) { if (status) status.textContent = "To and message are required."; return; }
  if (status) status.textContent = "Sending...";
  fetch(WORKER + "/api/google/gmail/send", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({to: to, subject: subject, text: body, from: from})
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) {
      document.getElementById("compose-overlay").remove();
      loadInbox();
    } else {
      if (status) status.textContent = "Failed: " + (d.error || "unknown").substring(0, 120);
    }
  })
  .catch(function(e) { if (status) status.textContent = "Error: " + e.message; });
}

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>
</body>
</html>
