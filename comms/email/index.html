<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email — Prism</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
</head>
<body>
<div class="prism-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content" id="main-content">
    <div class="topbar"><div class="topbar-title">Email</div><div class="topbar-actions"><a href="/oauth/zoho/mail" class="btn btn-sm btn-secondary" title="Connect Zoho Mail">🔑 Connect Zoho</a><button class="btn btn-sm btn-primary" onclick="openCompose()" title="Compose new email">✏ Compose</button></div></div>
    <div class="page-content">

      <div class="grid-2" style="gap:20px;align-items:start;">
        <div class="card">
          <div class="card-header"><span class="card-title">Inbox</span><span class="badge badge-muted">Connect Zoho to load emails</span></div>
          <div id="inbox-list" style="font-size:13px;color:var(--fg-muted);padding:20px 0;text-align:center;">Connect your Zoho Mail account to view your inbox.<br><br><a href="/oauth/zoho/mail" class="btn btn-primary btn-sm" title="Connect Zoho Mail">Connect Zoho Mail</a></div>
        </div>
        <div class="card" id="compose-card">
          <div class="card-header"><span class="card-title">Compose</span></div>
          <div class="form-group"><label class="form-label">To</label><input class="input" id="email-to" type="email" placeholder="recipient@example.com"></div>
          <div class="form-group"><label class="form-label">Subject</label><input class="input" id="email-subject" type="text" placeholder="Subject…"></div>
          <div class="form-group"><label class="form-label">Message</label><textarea class="textarea textarea-lg" id="email-body" placeholder="Write your message…"></textarea></div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary" onclick="sendEmail()" title="Send email">📧 Send</button>
            <button class="btn btn-secondary" onclick="aiDraftEmail()" title="AI draft this email">✨ AI Draft</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/shared/prism.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Check if Zoho Mail is connected
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://prism-api.identitypartners.workers.dev/api/zoho/status', true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    try {
      var r = JSON.parse(xhr.responseText);
      if (r.status && r.status.mail && r.status.mail.connected) {
        var banner = document.getElementById('inbox-list');
        if (banner) banner.innerHTML = '<div style="padding:20px;text-align:center;color:var(--success);font-size:13px;">Zoho Mail connected. Loading inbox...</div>';
        loadInbox();
      }
    } catch(e) {}
  };
  xhr.send();

  var mount = document.getElementById('sidebar-mount');
  if (mount) { var sb = buildSidebar('/comms/email/'); mount.parentNode.insertBefore(sb, mount); mount.parentNode.removeChild(mount); }
  checkEmailPrefill();
});

var WORKER = ''; // Relative paths via _redirects proxy
function openCompose() { document.getElementById('email-to').focus(); }
function checkEmailPrefill() {
  var params = new URLSearchParams(window.location.search);
  var to = params.get('to');
  if (to) { var el = document.getElementById('email-to'); if (el) el.value = to; }
}
function loadInbox() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://prism-api.identitypartners.workers.dev/api/zoho/mail/inbox', true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    try {
      var r = JSON.parse(xhr.responseText);
      var list = document.getElementById('inbox-list');
      if (!list) return;
      if (r.messages && r.messages.length > 0) {
        list.innerHTML = '';
        r.messages.forEach(function(msg) {
          var item = document.createElement('div');
          item.style.cssText = 'padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;';
          item.innerHTML = '<div style="font-weight:500;font-size:13px;">' + (msg.fromAddress||msg.sender||'Unknown') + '</div>' +
            '<div style="font-size:12.5px;color:var(--fg-secondary);">' + (msg.subject||'No subject') + '</div>' +
            '<div style="font-size:11px;color:var(--fg-muted);">' + (msg.receivedTime||'') + '</div>';
          list.appendChild(item);
        });
      } else if (r.error) {
        if (list) list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--fg-muted);font-size:13px;">Could not load inbox: ' + r.error + '</div>';
      } else {
        if (list) list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--fg-muted);font-size:13px;">Inbox is empty.</div>';
      }
    } catch(e) {}
  };
  xhr.send();
}

function sendEmail() {
  var to = document.getElementById('email-to').value.trim();
  var subject = document.getElementById('email-subject').value.trim();
  var body = document.getElementById('email-body').value.trim();
  if (!to || !subject || !body) { Toast.warning('Please fill in all fields'); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://prism-api.identitypartners.workers.dev/api/zoho/mail/send', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    try {
      var r = JSON.parse(xhr.responseText);
      if (r.success) {
        Toast.success('Email sent to ' + to);
        document.getElementById('email-to').value = '';
        document.getElementById('email-subject').value = '';
        document.getElementById('email-body').value = '';
      } else if (r.error && r.error.indexOf('not connected') >= 0) {
        Toast.warning('Connect Zoho Mail first — click Connect Zoho above');
      } else {
        Toast.error('Send failed: ' + (r.error || 'Unknown error'));
      }
    } catch(e) { Toast.error('Send failed'); }
  };
  xhr.onerror = function() { Toast.error('Network error'); };
  xhr.send(JSON.stringify({to:to, subject:subject, body:body, from:'simon@identitypartners.uk'}));
}
function aiDraftEmail() {
  var subject = document.getElementById('email-subject').value.trim();
  var to = document.getElementById('email-to').value.trim();
  if (!subject) { Toast.warning('Enter a subject first'); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('POST', WORKER + '/api/chat', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    try { var r = JSON.parse(xhr.responseText); var el = document.getElementById('email-body'); if (el && r.content) el.value = r.content; }
    catch(e) { Toast.error('AI draft failed'); }
  };
  xhr.send(JSON.stringify({messages:[{role:'system',content:'You are an email writing assistant for Identity Partners. Write professional, warm emails in British English. Sign off as Simon Johnson, Identity Partners.'},{role:'user',content:'Write an email with subject: "' + subject + '"' + (to ? ' to ' + to : '')}],profile:'balanced'}));
}

</script>
</body>
</html>
