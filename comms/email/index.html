<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email â Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
.email-wrap{max-width:800px;margin:0 auto;padding:20px;}
.email-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.email-hdr h1{font-size:1.3rem;font-weight:700;margin:0;flex:1;}
.msg-item{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color 0.15s;}
.msg-item:hover{border-color:var(--accent);}
.msg-item.unread{border-left:3px solid var(--accent);}
.msg-subject{font-size:0.9rem;font-weight:600;margin-bottom:3px;}
.msg-from{font-size:0.78rem;color:var(--fg-muted);margin-bottom:3px;}
.msg-snippet{font-size:0.82rem;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:0.85rem;font-weight:600;font-family:inherit;}
.btn-secondary{background:var(--bg-sunken);color:var(--fg);border:1px solid var(--border);}
.not-connected{text-align:center;padding:48px 20px;color:var(--fg-muted);}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="email-wrap">
  <div class="email-hdr">
    <span class="iconify" data-icon="ph:envelope-bold" style="font-size:1.8rem;color:var(--accent);"></span>
    <h1>Inbox</h1>
    <button class="btn btn-secondary" onclick="loadEmail()">Refresh</button>
    <a href="https://mail.google.com" target="_blank" class="btn btn-secondary">Open Gmail</a>
    <a href="/comms/google/" class="btn btn-secondary">Google Account</a>
  </div>
  <div id="email-content"><div style="color:var(--fg-muted);font-size:0.9rem;">Loading...</div></div>
</div>
</div>
<script>
var WORKER = "https://prism-api.identitypartners.workers.dev";
document.addEventListener("DOMContentLoaded", function() {
  var mount = document.getElementById("sidebar-mount");
  if (mount && typeof buildSidebar === "function") {
    var sb = buildSidebar("/comms/");
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  loadEmail();
});
function loadEmail() {
  var content = document.getElementById("email-content");
  content.innerHTML = "<div style=\"color:var(--fg-muted);font-size:0.9rem;\">Loading...</div>";
  fetch(WORKER + "/api/google/gmail")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status === "not_connected") {
        content.innerHTML = "<div class=\"not-connected\"><div style=\"font-size:2rem;margin-bottom:10px;\">\uD83D\uDCE7</div><div style=\"font-size:0.95rem;font-weight:600;margin-bottom:8px;\">Google not connected</div><a href=\"/comms/google/\" style=\"color:var(--accent);\">Connect Google Account</a></div>";
        return;
      }
      if (d.status === "api_error") {
        content.innerHTML = "<div class=\"not-connected\"><div style=\"font-size:2rem;margin-bottom:10px;\">\u26A0\uFE0F</div><div style=\"font-size:0.95rem;font-weight:600;margin-bottom:8px;\">Gmail API not enabled</div><p style=\"font-size:0.85rem;\">Enable it at <a href=\"https://console.developers.google.com/apis/api/gmail.googleapis.com/overview?project=944507774917\" target=\"_blank\" style=\"color:var(--accent);\">Google Cloud Console</a></p></div>";
        return;
      }
      var messages = d.messages || [];
      if (!messages.length) {
        content.innerHTML = "<div style=\"color:var(--fg-muted);padding:20px;text-align:center;\">Inbox is empty.</div>";
        return;
      }
      content.innerHTML = messages.map(function(msg) {
        return "<div class=\"msg-item " + (msg.unread ? "unread" : "") + "\" onclick=\"window.open('https://mail.google.com/mail/u/0/#inbox/' + '" + msg.id + "', '_blank')\">"
          + "<div class=\"msg-subject\">" + esc(msg.subject) + "</div>"
          + "<div class=\"msg-from\">" + esc(msg.from) + " · " + esc(msg.date) + "</div>"
          + "<div class=\"msg-snippet\">" + esc(msg.snippet) + "</div>"
          + "</div>";
      }).join("");
    })
    .catch(function(e) {
      content.innerHTML = "<div style=\"color:#dc2626;padding:12px;\">Error: " + e.message + "</div>";
    });
}
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
</script>
</body>
</html>
