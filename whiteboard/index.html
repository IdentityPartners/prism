<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whiteboard — Argentica</title>
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<!-- cache-bust-1792935772 -->
<style>
.wb-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.wb-hdr{padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg-elevated);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.wb-hdr h2{font-size:15px;font-weight:700;margin:0;flex:1;}
.wb-frame{flex:1;overflow:hidden;}
.wb-frame iframe{width:100%;height:100%;border:none;}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="wb-shell">
  <div class="wb-hdr">
    <h2>&#x270F; Whiteboard</h2>
    <span style="font-size:12px;color:var(--fg-muted);">Powered by Excalidraw — infinite canvas, pressure-sensitive, exports to SVG/PNG</span>
    <a href="https://excalidraw.com/" target="_blank" style="font-size:12px;color:var(--accent);">Open full screen &#x2197;</a>
  </div>
  <div class="wb-frame">
    <iframe src="https://excalidraw.com/" allow="clipboard-read; clipboard-write" title="Excalidraw Whiteboard"></iframe>
  </div>
</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/whiteboard/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
});
</script>
</body>
</html>
