<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Zoho Crm - Prism</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,system-ui,sans-serif;background:#f7f3e9;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.card{background:#fff;border-radius:16px;padding:32px;max-width:500px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.1);text-align:center;}
.icon{font-size:48px;margin-bottom:14px;}
.title{font-size:22px;font-weight:600;color:#0f3b3a;margin-bottom:10px;}
.msg{font-size:14px;color:#7a4254;line-height:1.6;margin-bottom:16px;}
.ok{background:#edf5eb;border:1px solid #5a7a4f;border-radius:8px;padding:14px;margin:12px 0;font-size:13px;color:#3a5a2f;line-height:1.6;}
.err{background:#fbeaea;border:1px solid #8b3a3a;border-radius:8px;padding:14px;margin:12px 0;font-size:13px;color:#8b3a3a;text-align:left;line-height:1.6;}
.info{background:#e8f4f4;border:1px solid #0f3b3a;border-radius:8px;padding:12px;margin:10px 0;font-size:12.5px;color:#0f3b3a;text-align:left;}
.spin{width:40px;height:40px;border:3px solid #ddd0c8;border-top-color:#0f3b3a;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.btn{display:block;width:100%;padding:13px;background:#0f3b3a;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;margin-top:10px;}
.btn:hover{background:#1a5550;color:#fff;text-decoration:none;}
.btn2{background:#fff;color:#0f3b3a;border:1.5px solid #0f3b3a;}
.btn2:hover{background:#e8f4f4;}
.log{background:#1a1a1a;color:#7ecf7e;border-radius:8px;padding:10px;font-family:monospace;font-size:11px;text-align:left;margin-top:10px;max-height:120px;overflow-y:auto;display:none;word-break:break-all;}
code{background:#f0e9e0;padding:2px 6px;border-radius:3px;font-size:11px;word-break:break-all;}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">🔑</div>
  <div class="title" id="title">Zoho Crm</div>
  <div class="spin" id="spin"></div>
  <div class="msg" id="msg"></div>
  <div id="body"></div>
  <div class="log" id="log"></div>
</div>
<script>
(function(){
  var W = 'https://prism-api.identitypartners.workers.dev';
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error');
  var errorDesc = params.get('error_description') || '';

  function log(m) {
    var e = document.getElementById('log');
    if (e) { e.style.display = 'block'; e.textContent += new Date().toLocaleTimeString() + ': ' + m + '\n'; e.scrollTop = e.scrollHeight; }
  }

  function set(icon, title, msg, html, spinning) {
    document.getElementById('icon').textContent = icon;
    document.getElementById('title').textContent = title;
    document.getElementById('msg').textContent = msg || '';
    document.getElementById('spin').style.display = spinning ? 'block' : 'none';
    document.getElementById('body').innerHTML = html || '';
  }

  // ERROR from Zoho
  if (error) {
    set('✗', 'Authorisation Failed', '',
      '<div class="err"><strong>Zoho error:</strong> ' + decodeURIComponent(error) +
      (errorDesc ? '<br>' + decodeURIComponent(errorDesc) : '') +
      '<br><br>Common causes:<br>' +
      '&bull; Scope not registered in Zoho console<br>' +
      '&bull; Redirect URI mismatch<br><br>' +
      'Redirect URI needed in <a href="https://api-console.zoho.eu" target="_blank" style="color:#8b3a3a;">api-console.zoho.eu</a>:<br>' +
      '<code>https://prism.identitypartners.uk/oauth/zoho/crm</code></div>' +
      '<a href="/oauth/zoho/crm/" class="btn">Try Again</a>' +
      '<a href="/settings/" class="btn btn2" style="margin-top:8px;">Back to Settings</a>');
    return;
  }

  // CODE received — exchange for tokens
  if (code) {
    set('🔄', 'Connecting…', 'Exchanging authorisation code with Zoho…', '', true);
    log('Code received: ' + code.substring(0, 20) + '...');
    log('Calling /api/zoho/token...');

    var xhr = new XMLHttpRequest();
    xhr.open('POST', W + '/api/zoho/token', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 30000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      document.getElementById('spin').style.display = 'none';
      log('HTTP ' + xhr.status + ': ' + xhr.responseText.substring(0, 150));

      try {
        var r = JSON.parse(xhr.responseText);
        if (r.success) {
          set('✅', 'Zoho Crm Connected!', '',
            '<div class="ok">Connected successfully. Tokens stored in Prism.</div>' +
            '<a href="/comms/zoho-crm/" class="btn">Open Crm →</a>' +
            '<a href="/settings/" class="btn btn2" style="margin-top:8px;">Back to Settings</a>');
        } else {
          set('✗', 'Connection Failed', '',
            '<div class="err"><strong>Error:</strong> ' + (r.error || 'Token exchange failed') + '</div>' +
            '<a href="/oauth/zoho/crm/" class="btn">Try Again</a>');
        }
      } catch(e) {
        set('✗', 'Error', '', '<div class="err">Parse error: ' + e.message + '<br>Response: ' + xhr.responseText.substring(0, 200) + '</div><a href="/oauth/zoho/crm/" class="btn">Try Again</a>');
      }
    };

    xhr.ontimeout = function() {
      set('✗', 'Timeout', '', '<div class="err">Request timed out after 30s.</div><a href="/oauth/zoho/crm/" class="btn">Try Again</a>');
    };

    xhr.onerror = function() {
      log('Network error');
      set('✗', 'Network Error', '', '<div class="err">Could not reach Prism API. Check your connection.</div><a href="/oauth/zoho/crm/" class="btn">Try Again</a>');
    };

    xhr.send(JSON.stringify({
      service: 'crm',
      code: code,
      redirectUri: 'https://prism.identitypartners.uk/oauth/zoho/crm'
    }));
    return;
  }

  // NO CODE — show connect button (goes DIRECTLY to Zoho, not via Worker)
  set('🔑', 'Connect Zoho Crm',
    'Click below to authorise Prism to access your Zoho Crm account.',
    '<div class="info">Scope: <code>ZohoCRM.modules.ALL,ZohoCRM.settings.ALL,ZohoCRM.users.READ</code><br>Redirect URI: <code>https://prism.identitypartners.uk/oauth/zoho/crm</code></div>' +
    '<a href="https://accounts.zoho.eu/oauth/v2/auth?response_type=code&client_id=1000.3OLT0KYOJIGADEUPVTRPX4CCPWZHXY&scope=ZohoCRM.modules.ALL%2CZohoCRM.settings.ALL%2CZohoCRM.users.READ&redirect_uri=https%3A//prism.identitypartners.uk/oauth/zoho/crm&access_type=offline&prompt=consent" class="btn">Connect Zoho Crm →</a>' +
    '<a href="/settings/" class="btn btn2" style="margin-top:8px;">Back to Settings</a>');
})();
</script>
</body>
</html>
