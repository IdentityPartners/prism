<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Zoho Calendar — Prism</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,system-ui,sans-serif;background:#f7f3e9;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.card{background:#fff;border-radius:16px;padding:32px;max-width:500px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.1);text-align:center;}
.icon{font-size:48px;margin-bottom:14px;}
.title{font-size:22px;font-weight:600;color:#0f3b3a;margin-bottom:10px;}
.msg{font-size:14px;color:#7a4254;line-height:1.6;margin-bottom:20px;}
.info{background:#e8f4f4;border:1px solid #0f3b3a;border-radius:8px;padding:14px;margin:12px 0;font-size:13px;color:#0f3b3a;line-height:1.6;text-align:left;}
.error{background:#fbeaea;border:1px solid #8b3a3a;border-radius:8px;padding:14px;margin:12px 0;font-size:13px;color:#8b3a3a;line-height:1.6;text-align:left;}
.success{background:#edf5eb;border:1px solid #5a7a4f;border-radius:8px;padding:14px;margin:12px 0;font-size:13px;color:#3a5a2f;line-height:1.6;}
.btn{display:block;width:100%;padding:13px;background:#0f3b3a;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;margin-top:10px;}
.btn:hover{background:#1a5550;color:#fff;text-decoration:none;}
.btn-outline{background:#fff;color:#0f3b3a;border:1.5px solid #0f3b3a;}
.btn-outline:hover{background:#e8f4f4;}
.spinner{width:40px;height:40px;border:3px solid #ddd0c8;border-top-color:#0f3b3a;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
code{background:#f0e9e0;padding:6px 10px;border-radius:4px;font-family:monospace;font-size:12px;word-break:break-all;display:block;margin:8px 0;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon" id="icon">🔑</div>
  <div class="title" id="title">Zoho Calendar</div>
  <div class="msg" id="msg"></div>
  <div id="body"></div>
</div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var connected = params.get('connected');
  var error = params.get('error');
  var WORKER = 'https://prism-api.identitypartners.workers.dev';
  var service = 'calendar';

  function render(icon, title, msg, bodyHtml){
    document.getElementById('icon').textContent = icon;
    document.getElementById('title').textContent = title;
    document.getElementById('msg').textContent = msg;
    document.getElementById('body').innerHTML = bodyHtml;
  }

  // SUCCESS — Worker exchanged token and redirected back with ?connected=1
  if (connected === '1') {
    render('✅', 'Zoho Calendar Connected!', 'Your Zoho Calendar account is now connected to Prism.',
      '<div class="success">Connection successful. Tokens stored securely in Cloudflare KV.</div>' +
      '<a href="/comms/zoho-calendar/" class="btn">Open Calendar →</a>' +
      '<a href="/settings/" class="btn btn-outline" style="margin-top:8px;">Back to Settings</a>'
    );
    return;
  }

  // ERROR — Zoho returned an error
  if (error) {
    render('✗', 'Connection Failed', '',
      '<div class="error"><strong>Error:</strong> ' + decodeURIComponent(error) + '<br><br>' +
      'Check that this redirect URI is registered in <a href="https://api-console.zoho.eu" target="_blank" style="color:#8b3a3a;font-weight:600;">api-console.zoho.eu</a>:<br>' +
      '<code>https://prism.identitypartners.uk/oauth/zoho/calendar</code></div>' +
      '<a href="' + WORKER + '/oauth/zoho/calendar" class="btn">Try Again</a>' +
      '<a href="/settings/" class="btn btn-outline" style="margin-top:8px;">Back to Settings</a>'
    );
    return;
  }

  // NO CODE — show connect button (initiates flow via Worker)
  render('🔑', 'Connect Zoho Calendar', 'Click below to authorise Prism to access your Zoho Calendar account.',
    '<div class="info">Before connecting, make sure this redirect URI is registered in ' +
    '<a href="https://api-console.zoho.eu" target="_blank" style="color:#0f3b3a;font-weight:600;">api-console.zoho.eu</a> ' +
    '→ Prism app → Edit → Redirect URIs:<br>' +
    '<code>https://prism.identitypartners.uk/oauth/zoho/calendar</code></div>' +
    '<a href="' + WORKER + '/oauth/zoho/calendar" class="btn">Connect Zoho Calendar →</a>' +
    '<a href="/settings/" class="btn btn-outline" style="margin-top:8px;">Back to Settings</a>'
  );
})();
</script>
</body>
</html>
