<html lang="en-GB">
<head>
<meta charset="UTF-8">

<title>Study Hub &mdash; Argentica</title>

<style>
.hub-shell{display:flex;height:100vh;overflow:hidden;}
.hub-tree{width:260px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface);overflow:hidden;}
.hub-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.tree-hdr{padding:10px 12px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.tree-hdr h3{font-size:14px;font-weight:700;margin:0;}
.tree-search{padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.tree-search input{width:100%;padding:5px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--fg);box-sizing:border-box;}
.tree-body{flex:1;overflow-y:auto;padding:6px;}
.mod-item{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg);transition:background 0.1s;display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.mod-item:hover{background:var(--bg-sunken);}
.mod-item.active{background:var(--accent-light,#e8f0f8);color:var(--accent);}
.week-item{padding:5px 10px 5px 28px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--fg-muted);transition:background 0.1s;display:flex;align-items:center;gap:6px;}
.week-item:hover{background:var(--bg-sunken);}
.week-item.active{background:var(--accent);color:#fff;}
.hub-hdr{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg-elevated);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.hub-hdr h2{font-size:16px;font-weight:700;margin:0;flex:1;}
.hub-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg-elevated);flex-shrink:0;overflow-x:auto;}
.hub-tab{padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--fg-muted);white-space:nowrap;flex-shrink:0;}
.hub-tab.active{border-bottom-color:var(--accent);color:var(--accent);}
.hub-body{flex:1;overflow-y:auto;padding:16px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px;}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;}
.card-icon{font-size:26px;margin-bottom:8px;}
.card-label{font-size:13px;font-weight:700;color:var(--fg);margin-bottom:3px;}
.card-count{font-size:22px;font-weight:700;}
.card-bar{position:absolute;bottom:0;left:0;right:0;height:3px;opacity:0.5;}
.detail-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.detail-card h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--fg-muted);margin:0 0 10px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.field-group{display:flex;flex-direction:column;gap:3px;}
.field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--fg-muted);}
.field-input{padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--fg);}
.field-textarea{padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--fg);resize:vertical;min-height:60px;}
.save-btn{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;}
.week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.week-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all 0.15s;}
.week-card h4{font-size:14px;font-weight:700;margin:0 0 4px;}
.week-card p{font-size:12px;color:var(--fg-muted);margin:0;}
.res-item{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--bg-elevated);cursor:pointer;transition:border-color 0.15s;}
.res-item:hover{border-color:var(--accent);}
.res-icon{font-size:20px;flex-shrink:0;margin-top:2px;}
.res-info{flex:1;min-width:0;}
.res-title{font-size:13px;font-weight:600;color:var(--fg);margin-bottom:2px;}
.res-meta{font-size:11px;color:var(--fg-muted);display:flex;gap:8px;}
.res-type{padding:1px 7px;border-radius:8px;font-size:10px;font-weight:600;}
.type-ppt,.type-pptx{background:rgba(220,38,38,0.1);color:#dc2626;}
.type-reading,.type-recommended,.type-further{background:rgba(45,106,159,0.1);color:var(--accent);}
.type-paper{background:rgba(22,163,74,0.1);color:#16a34a;}
.type-news{background:rgba(245,158,11,0.1);color:#f59e0b;}
.type-note{background:rgba(124,58,237,0.1);color:#7c3aed;}
.type-link{background:rgba(15,59,58,0.1);color:#0f3b3a;}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all 0.15s;margin-bottom:12px;}
.upload-zone:hover{border-color:var(--accent);background:var(--accent-light,#e8f0f8);}
.form-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.form-input{flex:1;min-width:120px;padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--fg);}
.form-select{padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--fg);cursor:pointer;}
.form-btn{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;}
.notes-ta{width:100%;min-height:200px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--fg);resize:vertical;line-height:1.7;box-sizing:border-box;}
.search-bar{display:flex;gap:8px;margin-bottom:12px;}
.search-input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--fg);}
.search-btn{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;}
.search-result{padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--bg-elevated);}
.search-result-title{font-size:13px;font-weight:600;margin-bottom:3px;}
.search-result-excerpt{font-size:12px;color:var(--fg-muted);line-height:1.5;}
.search-result-meta{font-size:10px;color:var(--fg-muted);margin-top:4px;display:flex;gap:8px;}
.src-badge{padding:1px 6px;border-radius:6px;font-size:9px;font-weight:700;text-transform:uppercase;}
.src-course{background:rgba(45,106,159,0.15);color:var(--accent);}
.src-note{background:rgba(124,58,237,0.15);color:#7c3aed;}
.empty-state{text-align:center;padding:60px 20px;color:var(--fg-muted);}
.empty-state .icon{font-size:48px;margin-bottom:12px;}
.tts-btn{padding:4px 10px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:11px;background:var(--bg);color:var(--fg-muted);font-family:inherit;}
.tts-btn:hover{border-color:var(--accent);color:var(--accent);}
.del-btn{padding:4px 8px;border:1px solid #dc2626;border-radius:5px;cursor:pointer;font-size:11px;background:var(--bg);color:#dc2626;font-family:inherit;}
.global-search-wrap{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg-elevated);flex-shrink:0;}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="hub-shell">
<div class="hub-tree">
  <div class="tree-hdr">
    <h3>&#x1F4DA; Study Hub</h3>
    <button onclick="openAddModule()" style="padding:3px 8px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;">+ Module</button>
  </div>
  <div class="tree-search">
    <input type="text" id="tree-search" placeholder="Filter modules..." oninput="filterTree(this.value)">
  </div>
  <div class="tree-body" id="tree-body">
    <div style="padding:20px;text-align:center;font-size:13px;color:var(--fg-muted);">Loading...</div>
  </div>
</div>
<div class="hub-main">
  <div class="global-search-wrap">
    <div class="search-bar">
      <input class="search-input" id="global-search" type="text" placeholder="Search everything: course material, notes, papers, web..." onkeydown="if(event.key==='Enter')runGlobalSearch()">
      <button class="search-btn" onclick="runGlobalSearch()">&#x1F50D; Search</button>
    </div>
  </div>
  <div class="hub-hdr">
    <h2 id="hub-title">Select a module</h2>
    <div style="display:flex;gap:6px;">
      <button onclick="addResource()" style="padding:5px 12px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">+ Add Resource</button>
      <button onclick="exportWeek()" style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;background:var(--bg);">&#x2B07; Export</button>
    </div>
  </div>
  <div class="hub-tabs">
    <div class="hub-tab active" id="tab-overview" onclick="switchTab('overview',this)">&#x1F3E0; Overview</div>
    <div class="hub-tab" id="tab-resources" onclick="switchTab('resources',this)">&#x1F4CB; Resources</div>
    <div class="hub-tab" id="tab-notes" onclick="switchTab('notes',this)">&#x270D; My Notes</div>
    <div class="hub-tab" id="tab-search" onclick="switchTab('search',this)">&#x1F50D; Search</div>
    <div class="hub-tab" id="tab-upload" onclick="switchTab('upload',this)">&#x2B06; Upload</div>
  </div>
  <div class="hub-body" id="hub-body">
    <div class="empty-state">
      <div class="icon">&#x1F4DA;</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:8px;">Select a module from the left</div>
      <div style="font-size:13px;">Or use the search bar above to find anything.</div>
    </div>
  </div>
</div>
</div>
</div>
<script>

var WORKER = 'https://prism-api.identitypartners.workers.dev';
var modules = [];
var currentModule = null;
var currentWeek = null;
var currentTab = 'overview';
var currentResourceFilter = null;

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/study-hub/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  loadModules();
});

function loadModules() {
  fetch(WORKER + '/api/kv/get?key=study:modules')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.value) {
        try { modules = JSON.parse(d.value); } catch(e) {}
      }
      if (!modules.length) initDefaultModules();
      renderTree();
    })
    .catch(function() {
      try { modules = JSON.parse(localStorage.getItem('study:modules') || '[]'); } catch(e) {}
      if (!modules.length) initDefaultModules();
      renderTree();
    });
}

function initDefaultModules() {
  modules = [
    {id:'qrm', name:'Quant Research Methods', icon:'\uD83D\uDCCA', colour:'#2d6a9f', weeks:[], researchQ:'', lecturer:'', vle:''},
    {id:'mn',  name:'Methodology Now',         icon:'\uD83D\uDD2C', colour:'#0f3b3a', weeks:[], researchQ:'', lecturer:'', vle:''},
    {id:'rp',  name:'Research Project',        icon:'\uD83D\uDCDD', colour:'#5c2d3f', weeks:[], researchQ:'', lecturer:'', vle:''},
    {id:'diss',name:'Dissertation',            icon:'\uD83C\uDF93', colour:'#16a34a', weeks:[], researchQ:'', lecturer:'', vle:''},
    {id:'con', name:'Concepts & Thinkers',     icon:'\uD83E\uDDE0', colour:'#7c3aed', weeks:[], researchQ:'', lecturer:'', vle:''},
    {id:'phd', name:'PhD Material',            icon:'\uD83D\uDCD6', colour:'#f59e0b', weeks:[], researchQ:'', lecturer:'', vle:''},
  ];
  saveModules();
}

function saveModules() {
  var j = JSON.stringify(modules);
  try { localStorage.setItem('study:modules', j); } catch(e) {}
  fetch(WORKER + '/api/kv/set', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({key: 'study:modules', value: j})
  }).catch(function() {});
}

function renderTree(filter) {
  var body = document.getElementById('tree-body');
  if (!body) return;
  body.innerHTML = '';
  var list = filter ? modules.filter(function(m) { return m.name.toLowerCase().includes(filter.toLowerCase()); }) : modules;
  list.forEach(function(mod) {
    var el = document.createElement('div');
    el.className = 'mod-item' + (currentModule && currentModule.id === mod.id ? ' active' : '');
    el.innerHTML = '<span>' + (mod.icon || '\uD83D\uDCDA') + '</span><span style="flex:1;">' + mod.name + '</span>';
    el.onclick = (function(m) { return function() { selectModule(m); }; })(mod);
    body.appendChild(el);
    if (currentModule && currentModule.id === mod.id) {
      (mod.weeks || []).forEach(function(week) {
        var we = document.createElement('div');
        we.className = 'week-item' + (currentWeek && currentWeek.id === week.id ? ' active' : '');
        we.innerHTML = '<span>\uD83D\uDCC5</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + week.name + '</span><span style="font-size:10px;background:var(--bg-sunken);padding:1px 5px;border-radius:8px;">' + (week.resources || []).length + '</span>';
        we.onclick = (function(m2, w) { return function(e) { e.stopPropagation(); selectWeek(m2, w); }; })(mod, week);
        body.appendChild(we);
      });
      var addW = document.createElement('div');
      addW.style.cssText = 'padding:4px 10px 4px 28px;font-size:11px;color:var(--fg-muted);cursor:pointer;';
      addW.textContent = '+ Add week';
      addW.onclick = (function(mid) { return function(e) { e.stopPropagation(); addWeekToModule(mid); }; })(mod.id);
      body.appendChild(addW);
    }
  });
}

function filterTree(q) { renderTree(q); }

function selectModule(mod) {
  currentModule = mod;
  currentWeek = null;
  document.getElementById('hub-title').textContent = mod.name;
  renderTree();
  switchTab('overview');
}

function selectWeek(mod, week) {
  currentModule = mod;
  currentWeek = week;
  document.getElementById('hub-title').textContent = mod.name + ' \u2014 ' + week.name;
  renderTree();
  switchTab('overview');
}

function openAddModule() {
  var name = prompt('Module name:');
  if (!name) return;
  var icons = ['\uD83D\uDCCA', '\uD83D\uDD2C', '\uD83D\uDCDD', '\uD83C\uDF93', '\uD83E\uDDE0', '\uD83D\uDCD6'];
  var colours = ['#2d6a9f', '#0f3b3a', '#5c2d3f', '#16a34a', '#7c3aed', '#f59e0b'];
  var idx = modules.length % icons.length;
  modules.push({id: 'mod-' + Date.now(), name: name, icon: icons[idx], colour: colours[idx], weeks: [], researchQ: '', lecturer: '', vle: ''});
  saveModules();
  renderTree();
}

function addWeekToModule(modId) {
  var name = prompt('Week name (e.g. "Week 1: Introduction"):');
  if (!name) return;
  var mod = modules.find(function(m) { return m.id === modId; });
  if (!mod) return;
  if (!mod.weeks) mod.weeks = [];
  var week = {id: 'w-' + Date.now(), name: name, vle_url: '', topic: '', notes: '', resources: [], created: new Date().toISOString()};
  mod.weeks.push(week);
  saveModules();
  selectWeek(mod, week);
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.hub-tab').forEach(function(t) { t.classList.remove('active'); });
  var tabEl = document.getElementById('tab-' + tab);
  if (tabEl) tabEl.classList.add('active');
  var body = document.getElementById('hub-body');
  if (!currentModule && tab !== 'search') {
    body.innerHTML = '<div class="empty-state"><div class="icon">\uD83D\uDCDA</div><div style="font-size:16px;font-weight:600;">Select a module from the left</div></div>';
    return;
  }
  if (tab === 'overview') renderOverview(body);
  else if (tab === 'resources') renderResources(body);
  else if (tab === 'notes') renderNotes(body);
  else if (tab === 'search') renderSearchTab(body);
  else if (tab === 'upload') renderUpload(body);
}

function showModuleOverview(mod) {
  document.getElementById('hub-title').textContent = mod.name;
  var body = document.getElementById('hub-body');
  body.innerHTML = '';
  var detailCard = document.createElement('div');
  detailCard.className = 'detail-card';
  detailCard.innerHTML = '<h4>Module Details</h4>' +
    '<div class="field-row">' +
      '<div class="field-group"><label class="field-label">Module Name</label>' +
      '<input class="field-input" id="edit-name" type="text" value="' + (mod.name || '').replace(/"/g, '&quot;') + '"></div>' +
      '<div class="field-group"><label class="field-label">Lecturer / Professor</label>' +
      '<input class="field-input" id="edit-lecturer" type="text" value="' + (mod.lecturer || '').replace(/"/g, '&quot;') + '" placeholder="Dr / Prof name..."></div>' +
    '</div>' +
    '<div class="field-row">' +
      '<div class="field-group"><label class="field-label">Research Question / Focus</label>' +
      '<textarea class="field-textarea" id="edit-rq">' + (mod.researchQ || '') + '</textarea></div>' +
      '<div class="field-group"><label class="field-label">VLE URL</label>' +
      '<input class="field-input" id="edit-vle" type="url" value="' + (mod.vle || '').replace(/"/g, '&quot;') + '" placeholder="https://learn.gold.ac.uk/...">' +
      (mod.vle ? '<a href="' + mod.vle + '" target="_blank" style="font-size:11px;color:var(--accent);display:block;margin-top:4px;">Open VLE \u2197</a>' : '') +
      '</div>' +
    '</div>' +
    '<button class="save-btn" id="week-save-btn" onclick="saveDetails()">Save Details</button>' +
    '<span id="save-status" style="font-size:12px;color:var(--fg-muted);margin-left:10px;"></span>';
  body.appendChild(detailCard);
  var weekHdr = document.createElement('div');
  weekHdr.style.cssText = 'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--fg-muted);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;';
  weekHdr.innerHTML = '<span>Weeks (' + (mod.weeks || []).length + ')</span><button onclick="addWeekToModule(\'' + mod.id + '\')" style="padding:3px 10px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;">+ Add Week</button>';
  body.appendChild(weekHdr);
  var weekGrid = document.createElement('div');
  weekGrid.className = 'week-grid';
  (mod.weeks || []).forEach(function(week) {
    var wc = document.createElement('div');
    wc.className = 'week-card';
    var rc = (week.resources || []).length;
    var hn = !!(week.notes && week.notes.trim());
    wc.innerHTML = '<h4>' + week.name + '</h4><p>' + rc + ' resources' + (hn ? ' \u00b7 notes' : '') + '</p>';
    wc.onclick = (function(m, w) { return function() { selectWeek(m, w); }; })(mod, week);
    wc.onmouseenter = function() { wc.style.borderColor = 'var(--accent)'; };
    wc.onmouseleave = function() { wc.style.borderColor = 'var(--border)'; };
    weekGrid.appendChild(wc);
  });
  if (!(mod.weeks || []).length) {
    var empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;padding:30px;color:var(--fg-muted);font-size:13px;border:2px dashed var(--border);border-radius:10px;grid-column:1/-1;';
    empty.textContent = 'No weeks yet. Click "+ Add Week" to get started.';
    weekGrid.appendChild(empty);
  }
  body.appendChild(weekGrid);
}

function showWeekOverview(week, mod) {
  var body = document.getElementById('hub-body');
  body.innerHTML = '';
  var detailCard = document.createElement('div');
  detailCard.className = 'detail-card';
  detailCard.innerHTML = '<h4>Week Details</h4>' +
    '<div id="week-edit-form">' +
    '<div class="field-row">' +
      '<div class="field-group"><label class="field-label">Week Name</label>' +
      '<div style="display:flex;gap:6px;"><input class="field-input" id="edit-name" type="text" value="' + (week.name || '').replace(/"/g, '&quot;') + '" style="flex:1;" onkeydown="if(event.key===\'Enter\'){saveDetails();}">' +
      '<button id="week-save-btn" onclick="saveDetails()" style="padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;">Save</button></div></div>' +
      '<div class="field-group"><label class="field-label">Lecturer / Professor</label>' +
      '<input class="field-input" id="edit-lecturer" type="text" value="' + (week.lecturer || mod.lecturer || '').replace(/"/g, '&quot;') + '" placeholder="Dr / Prof name..."></div>' +
    '</div>' +
    '<div class="field-row">' +
      '<div class="field-group"><label class="field-label">Topic / Focus</label>' +
      '<textarea class="field-textarea" id="edit-rq">' + (week.topic || week.researchQ || '') + '</textarea></div>' +
      '<div class="field-group"><label class="field-label">VLE Link</label>' +
      '<input class="field-input" id="edit-vle" type="url" value="' + (week.vle_url || week.vle || '').replace(/"/g, '&quot;') + '" placeholder="https://learn.gold.ac.uk/...">' +
      (week.vle_url || week.vle ? '<a href="' + (week.vle_url || week.vle) + '" target="_blank" style="font-size:11px;color:var(--accent);display:block;margin-top:4px;">Open VLE \u2197</a>' : '') +
      '</div>' +
    '</div>' +
    '</div>' +
    '<span id="save-status" style="font-size:12px;color:var(--fg-muted);margin-left:10px;"></span>';
  body.appendChild(detailCard);
  var resources = week.resources || [];
  var COURSE = ['ppt','pptx','reading','recommended','further','sample','markscheme','handout','lecture'];
  var SELF = ['news','paper','blog','report','podcast','video','link'];
  var cardDefs = [
    {label:'Course Material', icon:'\uD83D\uDCDA', colour:'#2d6a9f', count:resources.filter(function(r){return COURSE.indexOf(r.type)!==-1;}).length, tab:'resources', filter:'course'},
    {label:'Self-Sourced',    icon:'\uD83D\uDCF0', colour:'#f59e0b', count:resources.filter(function(r){return SELF.indexOf(r.type)!==-1;}).length,   tab:'resources', filter:'self'},
    {label:'My Notes',        icon:'\u270D',        colour:'#7c3aed', count:week.notes&&week.notes.trim()?1:0,                                          tab:'notes',     filter:null},
    {label:'All Resources',   icon:'\uD83D\uDCCB', colour:'#16a34a', count:resources.length,                                                           tab:'resources', filter:null},
    {label:'Upload',          icon:'\u2B06',        colour:'#6b7280', count:0,                                                                          tab:'upload',    filter:null},
  ];
  var grid = document.createElement('div');
  grid.className = 'card-grid';
  cardDefs.forEach(function(card) {
    var el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = '<div class="card-icon">' + card.icon + '</div><div class="card-label">' + card.label + '</div><div class="card-count" style="color:' + card.colour + ';">' + card.count + '</div><div class="card-bar" style="background:' + card.colour + ';"></div>';
    el.onclick = (function(t, f) { return function() { currentResourceFilter = f; switchTab(t); }; })(card.tab, card.filter);
    el.onmouseenter = (function(c, e) { return function() { e.style.borderColor = c; e.style.transform = 'translateY(-2px)'; }; })(card.colour, el);
    el.onmouseleave = function() { el.style.borderColor = 'var(--border)'; el.style.transform = ''; };
    grid.appendChild(el);
  });
  body.appendChild(grid);
}

function renderOverview(body) {
  if (currentWeek) {
    showWeekOverview(currentWeek, currentModule);
  } else if (currentModule) {
    showModuleOverview(currentModule);
  }
}

function saveDetails() {
  var target = currentWeek || currentModule;
  if (!target) return;
  var n = document.getElementById('edit-name');
  var l = document.getElementById('edit-lecturer');
  var rq = document.getElementById('edit-rq');
  var v = document.getElementById('edit-vle');
  if (n && n.value.trim()) target.name = n.value.trim();
  if (l) target.lecturer = l.value;
  if (rq) { target.researchQ = rq.value; target.topic = rq.value; }
  if (v) { target.vle = v.value; target.vle_url = v.value; }
  saveModules();
  document.getElementById('hub-title').textContent = currentWeek ? (currentModule.name + ' \u2014 ' + target.name) : target.name;
  renderTree();
  var s = document.getElementById('save-status');
  if (s) { s.textContent = '\u2713 Saved'; setTimeout(function() { s.textContent = ''; }, 2000); }
  var btn = document.getElementById('week-save-btn');
  if (btn) { btn.textContent = '\u2713 Saved!'; btn.style.background = '#16a34a'; setTimeout(function() { btn.textContent = 'Save'; btn.style.background = 'var(--accent)'; }, 2000); }
}

function getAllResources() {
  var all = [];
  if (currentModule) (currentModule.weeks || []).forEach(function(w) { all = all.concat(w.resources || []); });
  return all;
}

function renderResources(body) {
  body.innerHTML = '';
  var resources = currentWeek ? (currentWeek.resources || []) : getAllResources();
  if (currentResourceFilter === 'course') {
    var COURSE = ['ppt','pptx','reading','recommended','further','sample','markscheme','handout','lecture'];
    resources = resources.filter(function(r) { return COURSE.indexOf(r.type) !== -1; });
  } else if (currentResourceFilter === 'self') {
    var SELF = ['news','paper','blog','report','podcast','video','link'];
    resources = resources.filter(function(r) { return SELF.indexOf(r.type) !== -1; });
  }
  if (!resources.length) {
    body.innerHTML = '<div class="empty-state"><div class="icon">\uD83D\uDCC2</div><div style="font-size:14px;font-weight:600;margin-bottom:6px;">No resources yet</div><div style="font-size:13px;">Use the Upload tab to add files and links.</div></div>';
    return;
  }
  var icons = {ppt:'\uD83D\uDCCA',pptx:'\uD83D\uDCCA',reading:'\uD83D\uDCD6',recommended:'\uD83D\uDCD5',further:'\uD83D\uDCD4',paper:'\uD83D\uDCC4',news:'\uD83D\uDCF0',note:'\u270D',link:'\uD83D\uDD17',audio:'\uD83C\uDFA7',video:'\uD83C\uDFAC',blog:'\uD83D\uDCDD',report:'\uD83D\uDCCA'};
  resources.forEach(function(r) {
    var item = document.createElement('div');
    item.className = 'res-item';
    item.onclick = function() { openResource(r); };
    item.innerHTML = '<div class="res-icon">' + (icons[r.type] || '\uD83D\uDCC4') + '</div>' +
      '<div class="res-info"><div class="res-title">' + r.title.replace(/</g, '&lt;') + '</div>' +
      '<div class="res-meta"><span class="res-type type-' + (r.type || 'link') + '">' + (r.type || 'link') + '</span>' +
      (r.url ? '<a href="' + r.url + '" target="_blank" onclick="event.stopPropagation()" style="color:var(--accent);font-size:11px;">Open \u2197</a>' : '') +
      '</div></div>' +
      '<div style="display:flex;gap:4px;flex-shrink:0;">' +
      '<button class="tts-btn" onclick="event.stopPropagation();readAloud(\'' + r.id + '\')" title="Read aloud">\uD83D\uDD0A</button>' +
      '<button class="tts-btn" onclick="event.stopPropagation();askAboutResource(\'' + r.id + '\')" title="Ask AI">\uD83D\uDCAC</button>' +
      '<button class="del-btn" onclick="event.stopPropagation();deleteResource(\'' + r.id + '\')" title="Delete">\u2715</button>' +
      '</div>';
    body.appendChild(item);
  });
}

function openResource(r) {
  if (r.url) {
    var params = new URLSearchParams({id: r.id, name: r.title, type: r.type, url: r.url});
    window.open('/doc-viewer/?' + params.toString(), '_blank');
  } else if (r.content) {
    try { sessionStorage.setItem('doc-viewer-content-' + r.id, r.content); } catch(e) {}
    var params2 = new URLSearchParams({id: r.id, name: r.title, type: r.type});
    window.open('/doc-viewer/?' + params2.toString(), '_blank');
  } else {
    alert('No content or URL for this resource.');
  }
}

function deleteResource(id) {
  if (!currentWeek || !confirm('Delete this resource?')) return;
  currentWeek.resources = (currentWeek.resources || []).filter(function(r) { return r.id !== id; });
  saveModules();
  renderResources(document.getElementById('hub-body'));
}

function readAloud(id) {
  var resource = currentWeek ? (currentWeek.resources || []).find(function(r) { return r.id === id; }) : null;
  if (!resource || !resource.content) { alert('No text content to read.'); return; }
  fetch(WORKER + '/api/tts/read', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:resource.content.substring(0,5000),voice:'aura-arcas-en',provider:'deepgram'})})
    .then(function(r) { return r.blob(); })
    .then(function(blob) { new Audio(URL.createObjectURL(blob)).play(); })
    .catch(function(e) { alert('TTS error: ' + e.message); });
}

function askAboutResource(id) {
  var resource = currentWeek ? (currentWeek.resources || []).find(function(r) { return r.id === id; }) : null;
  if (!resource) return;
  var q = 'Tell me about "' + resource.title + '". What are the key arguments, methods, and findings? How does it relate to the module themes?';
  if (typeof GlobalUI !== 'undefined' && GlobalUI.toggleChat) {
    GlobalUI.toggleChat();
    setTimeout(function() { var inp = document.getElementById('pill-input'); if (inp) { inp.value = q; inp.focus(); } }, 200);
  } else {
    window.location.href = '/chat/?q=' + encodeURIComponent(q);
  }
}

function renderNotes(body) {
  body.innerHTML = '';
  var target = currentWeek || currentModule;
  if (!target) return;
  var lbl = document.createElement('div');
  lbl.style.cssText = 'font-size:11px;font-weight:700;text-transform:uppercase;color:var(--fg-muted);margin-bottom:8px;';
  lbl.textContent = 'My notes for ' + target.name;
  var ta = document.createElement('textarea');
  ta.className = 'notes-ta';
  ta.value = target.notes || '';
  ta.placeholder = 'Write your notes here... Markdown supported. Auto-saves.';
  ta.oninput = function() {
    target.notes = ta.value;
    clearTimeout(ta._t);
    ta._t = setTimeout(function() { saveModules(); }, 1500);
  };
  body.appendChild(lbl);
  body.appendChild(ta);
}

function renderUpload(body) {
  body.innerHTML = '';
  if (!currentWeek) {
    body.innerHTML = '<div class="empty-state"><div class="icon">\uD83D\uDCC2</div><div style="font-size:14px;font-weight:600;">Select a week first</div></div>';
    return;
  }
  var zone = document.createElement('div');
  zone.className = 'upload-zone';
  zone.innerHTML = '<div style="font-size:36px;margin-bottom:8px;">\uD83D\uDCCE</div><div style="font-size:14px;font-weight:600;margin-bottom:4px;">Drop files here or click to upload</div><div style="font-size:12px;color:var(--fg-muted);">PDF, PPTX, DOCX, MD, TXT</div>';
  var fi = document.createElement('input');
  fi.type = 'file'; fi.multiple = true; fi.style.display = 'none';
  fi.accept = '.pdf,.pptx,.ppt,.docx,.doc,.md,.txt,.csv';
  fi.onchange = function() { handleUpload(this.files); };
  zone.onclick = function() { fi.click(); };
  zone.ondragover = function(e) { e.preventDefault(); zone.style.borderColor = 'var(--accent)'; };
  zone.ondragleave = function() { zone.style.borderColor = 'var(--border)'; };
  zone.ondrop = function(e) { e.preventDefault(); zone.style.borderColor = 'var(--border)'; handleUpload(e.dataTransfer.files); };
  body.appendChild(zone);
  body.appendChild(fi);
  var urlForm = document.createElement('div');
  urlForm.className = 'detail-card';
  urlForm.innerHTML = '<h4>Add by URL</h4>' +
    '<div class="form-row">' +
    '<input class="form-input" id="url-input" type="url" placeholder="https://...">' +
    '<input class="form-input" id="url-title" type="text" placeholder="Title">' +
    '<select class="form-select" id="url-type">' +
    '<optgroup label="Course Material"><option value="ppt">Slides / PPT</option><option value="reading">Essential Reading</option><option value="recommended">Recommended</option><option value="further">Further Reading</option><option value="sample">Sample Answer</option><option value="markscheme">Mark Scheme</option><option value="handout">Handout</option><option value="lecture">Lecture Notes</option></optgroup>' +
    '<optgroup label="Self-Sourced"><option value="news">News Article</option><option value="paper">Research Paper</option><option value="blog">Blog / Opinion</option><option value="report">Report / Policy</option><option value="podcast">Podcast</option><option value="video">Video</option></optgroup>' +
    '<optgroup label="Other"><option value="link">Link</option></optgroup>' +
    '</select>' +
    '<button class="form-btn" onclick="addUrlResource()">Add</button>' +
    '</div>';
  body.appendChild(urlForm);
}

function handleUpload(files) {
  if (!currentWeek) { alert('Select a week first.'); return; }
  Array.from(files).forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var ext = file.name.split('.').pop().toLowerCase();
      var type = (ext === 'pptx' || ext === 'ppt') ? 'ppt' : ext === 'pdf' ? 'pdf' : 'reading';
      var resource = {id:'r-'+Date.now()+'-'+Math.random().toString(36).slice(2,6), type:type, title:file.name, url:null, content:e.target.result.substring(0,50000), size:file.size, tags:[], added:new Date().toISOString()};
      if (!currentWeek.resources) currentWeek.resources = [];
      currentWeek.resources.push(resource);
      saveModules();
      renderTree();
      switchTab('resources');
    };
    reader.readAsText(file);
  });
}

function addUrlResource() {
  if (!currentWeek) { alert('Select a week first.'); return; }
  var url = document.getElementById('url-input').value.trim();
  var title = document.getElementById('url-title').value.trim() || url;
  var type = document.getElementById('url-type').value;
  if (!url) { alert('Enter a URL.'); return; }
  if (!currentWeek.resources) currentWeek.resources = [];
  currentWeek.resources.push({id:'r-'+Date.now(), type:type, title:title, url:url, tags:[], added:new Date().toISOString()});
  saveModules();
  renderTree();
  switchTab('resources');
}

function addResource() {
  if (!currentWeek) { switchTab('upload'); return; }
  switchTab('upload');
}

function renderSearchTab(body) {
  body.innerHTML = '<div class="search-bar"><input class="search-input" id="tab-search-input" type="text" placeholder="Search notes, resources, thinkers..." onkeydown="if(event.key===\'Enter\')runTabSearch()"><button class="search-btn" onclick="runTabSearch()">Search</button></div><div id="search-results"></div>';
}

function runGlobalSearch() {
  var q = document.getElementById('global-search').value.trim();
  if (!q) return;
  switchTab('search');
  var inp = document.getElementById('tab-search-input');
  if (inp) inp.value = q;
  runTabSearch();
}

function runTabSearch() {
  var inp = document.getElementById('tab-search-input');
  var q = inp ? inp.value.trim() : '';
  if (!q) return;
  var results = document.getElementById('search-results');
  if (!results) return;
  var ql = q.toLowerCase();
  var found = [];
  modules.forEach(function(mod) {
    (mod.weeks || []).forEach(function(week) {
      (week.resources || []).forEach(function(r) {
        if ((r.title + ' ' + (r.content || '')).toLowerCase().includes(ql)) {
          found.push({title:r.title, excerpt:(r.content||'').substring(0,150), location:mod.name+' > '+week.name, url:r.url, source:'course'});
        }
      });
      if (week.notes && week.notes.toLowerCase().includes(ql)) {
        var ni = week.notes.toLowerCase().indexOf(ql);
        found.push({title:'Notes: '+week.name, excerpt:week.notes.substring(Math.max(0,ni-60),ni+120), location:mod.name+' > '+week.name, source:'note'});
      }
    });
  });
  results.innerHTML = '';
  if (!found.length) {
    results.innerHTML = '<div style="padding:12px;color:var(--fg-muted);font-size:13px;">No local results. The AI assistant can search the web for related content.</div>';
    if (typeof GlobalUI !== 'undefined' && GlobalUI.toggleChat) {
      GlobalUI.toggleChat();
      setTimeout(function() { var inp2 = document.getElementById('pill-input'); if (inp2) { inp2.value = 'Search my study materials and the web for: ' + q; inp2.focus(); } }, 200);
    }
  } else {
    found.forEach(function(r) {
      var div = document.createElement('div');
      div.className = 'search-result';
      div.innerHTML = '<div class="search-result-title">' + r.title.replace(/</g,'&lt;') + '</div>' +
        '<div class="search-result-excerpt">' + (r.excerpt||'').replace(/</g,'&lt;') + '</div>' +
        '<div class="search-result-meta"><span class="src-badge ' + (r.source==='course'?'src-course':'src-note') + '">' + (r.source==='course'?'Course':'Notes') + '</span><span>' + r.location + '</span>' +
        (r.url?'<a href="'+r.url+'" target="_blank" style="color:var(--accent);">Open \u2197</a>':'') + '</div>';
      results.appendChild(div);
    });
  }
}

function exportWeek() {
  var target = currentWeek || currentModule;
  if (!target) return;
  var lines = ['# ' + (currentModule ? currentModule.name : '') + (currentWeek ? ' \u2014 ' + currentWeek.name : ''), ''];
  if (target.vle || target.vle_url) lines.push('VLE: ' + (target.vle || target.vle_url), '');
  var resources = currentWeek ? (currentWeek.resources || []) : getAllResources();
  resources.forEach(function(r) { lines.push('## ' + r.title + ' [' + r.type + ']'); if (r.url) lines.push('URL: ' + r.url); lines.push(''); });
  if (target.notes) lines.push('## My Notes', '', target.notes, '');
  var blob = new Blob([lines.join('\n')], {type:'text/markdown'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (target.name || 'export') + '.md';
  a.click();
}

</script>
</body>
</html>
