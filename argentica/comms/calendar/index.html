<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argentica — Calendar</title>
<link rel="stylesheet" href="/shared/argentica.css">
<style>
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-head { text-align: center; font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 0; }
  .cal-cell { min-height: 84px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font-size: 11.5px; position: relative; }
  .cal-cell.other { opacity: 0.4; }
  .cal-cell.today { border-color: var(--teal); border-width: 2px; }
  .cal-cell .dnum { font-size: 11px; color: var(--ink-soft); }
  .cal-ev { border-radius: 4px; padding: 1px 5px; margin-top: 3px; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(15,59,58,0.1); color: var(--teal); }
  .cal-ev.soc-posted { background: rgba(61,139,110,0.18); color: #2c6e52; }
  .cal-ev.soc-queued { background: rgba(15,59,58,0.08); color: var(--teal); }
  .cal-ev.soc-sched { background: rgba(92,45,63,0.12); color: var(--rose); }
</style>
</head>
<body>
<div class="arg-page" data-key="calendar">
  <div class="arg-pagehead spread">
    <div>
      <h1>Calendar</h1>
      <div class="sub">Your diary and the social pipeline on one grid.</div>
    </div>
    <div class="row" style="gap:6px;">
      <button class="ghost small" id="cal-prev">←</button>
      <h3 id="cal-month" style="margin:0; min-width:150px; text-align:center;"></h3>
      <button class="ghost small" id="cal-next">→</button>
    </div>
  </div>

  <div class="card">
    <div class="cal-grid" id="cal-grid"></div>
    <div class="row mt" style="gap:14px;">
      <span class="row" style="gap:5px;"><span class="cal-ev" style="display:inline-block; width:22px;">&nbsp;</span> Diary</span>
      <span class="row" style="gap:5px;"><span class="cal-ev soc-posted" style="display:inline-block; width:22px;">&nbsp;</span> Posted</span>
      <span class="row" style="gap:5px;"><span class="cal-ev soc-queued" style="display:inline-block; width:22px;">&nbsp;</span> Queued</span>
      <span class="row" style="gap:5px;"><span class="cal-ev soc-sched" style="display:inline-block; width:22px;">&nbsp;</span> Scheduled</span>
    </div>
  </div>
</div>

<script src="/shared/argentica.js"></script>
<script>
ARG.buildShell('calendar');
const { api, esc } = ARG;

let view = new Date();
let diary = [];
let social = [];

async function load() {
  try {
    const cal = await api('/google/calendar');
    diary = cal.status === 'ok' ? (cal.today || []).concat(cal.week || []) : [];
  } catch (e) { diary = []; }
  try {
    const q = await api('/mm/queue');
    social = (q.queue || []).filter(i => i.status === 'pending' || i.status === 'scheduled' || i.status === 'posted');
  } catch (e) { social = []; }
  render();
}

function render() {
  const grid = document.getElementById('cal-grid');
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById('cal-month').textContent = view.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const first = new Date(y, m, 1);
  const start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7)); // Monday start
  const today = new Date();
  let html = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => '<div class="cal-head">' + d + '</div>').join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    const inMonth = d.getMonth() === m;
    const isToday = d.toDateString() === today.toDateString();
    const evs = diary.filter(e => (e.starts_at || '').slice(0, 10) === iso);
    const socs = social.filter(s => (s.createdAt || s.scheduledFor || '').slice(0, 10) === iso);
    html += '<div class="cal-cell' + (inMonth ? '' : ' other') + (isToday ? ' today' : '') + '">' +
      '<div class="dnum">' + d.getDate() + '</div>' +
      evs.map(e => '<div class="cal-ev" title="' + esc(e.title) + '">' + esc((e.starts_at || '').slice(11, 16)) + ' ' + esc(e.title.slice(0, 18)) + '</div>').join('') +
      socs.map(s => {
        const cls = s.status === 'posted' ? 'soc-posted' : s.status === 'scheduled' ? 'soc-sched' : 'soc-queued';
        const label = s.status === 'posted' ? 'posted' : s.status === 'scheduled' ? 'sched' : 'queued';
        return '<div class="cal-ev ' + cls + '" title="' + esc(String(s.text || '').slice(0, 80)) + '">' + label + ' · ' + esc((s.platforms || []).join('/').slice(0, 12)) + '</div>';
      }).join('') +
      '</div>';
  }
  grid.innerHTML = html;
}

document.getElementById('cal-prev').addEventListener('click', () => { view.setMonth(view.getMonth() - 1); render(); });
document.getElementById('cal-next').addEventListener('click', () => { view.setMonth(view.getMonth() + 1); render(); });
load();
</script>
</body>
</html>
