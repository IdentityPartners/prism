<!DOCTYPE html>
<html lang="en-GB">
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argentica — Canvas Studio</title>
<link rel="stylesheet" href="/shared/argentica.css">
<style>
  .tpl-btn { border: 2px solid var(--line); border-radius: 8px; padding: 0; background: #fff; cursor: pointer; overflow: hidden; text-align: left; }
  .tpl-btn.active { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(15,59,58,0.15); }
  .tpl-btn img, .tpl-btn svg { width: 100%; aspect-ratio: 1; display: block; }
  .tpl-btn .lbl { padding: 5px 7px; font-size: 11.5px; color: var(--teal); display: block; }
  #size-row button { min-width: 74px; }
  #tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .stage-shape { display: flex; gap: 14px; flex-wrap: wrap; }
  .stage-col { flex: 1; min-width: 240px; }
  .stage-box { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px; background: rgba(240,233,224,0.4); }
  .stage-box h5 { margin: 0 0 8px; font-family: var(--serif, 'EB Garamond', Georgia, serif); font-size: 15px; color: var(--berry, #5c2d3f); }
  .img-chip { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .img-chip img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  #img-modal { position: fixed; inset: 0; background: rgba(28,26,23,0.45); display: none; align-items: flex-start; justify-content: center; z-index: 90; padding: 4vh 12px; }
  #img-modal.open { display: flex; }
  #img-modal .panel { background: #f7f3e9; border-radius: 14px; max-width: 780px; width: 100%; max-height: 88vh; overflow: auto; padding: 18px 20px; box-shadow: 0 18px 50px rgba(28,26,23,0.35); }
  .ip-tabs { display: flex; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap; }
  .ip-tabs button { padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line,#7a4254); background: transparent; cursor: pointer; font-size: 13px; color: #5c2d3f; }
  .ip-tabs button.on { background: #5c2d3f; color: #f7f3e9; border-color: #5c2d3f; }
  #ip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
  .close-x { float: right; border: none; background: none; font-size: 20px; cursor: pointer; color: #5c2d3f; }
</style>
</head>
<body>
<div class="arg-page" data-key="canvas">
  <div class="arg-pagehead">
    <h1>Canvas Studio</h1>
    <div class="sub">Pick a template — it shapes the inputs below — then generate, save it to the Asset library or send it to Publishing.</div>
  </div>

  <!-- 1 · Templates across the top -->
  <div class="card">
    <h3>Templates</h3>
    <div id="tpl-grid"></div>
  </div>

  <!-- 2 · Stage: the input area, its shape defined by the chosen template -->
  <div class="card mt" id="stage-card">
    <h3 id="stage-title">Content</h3>
    <div id="stage"></div>

    <!-- image slot chip (shown for photographic templates) -->
    <div id="stage-image" style="display:none; margin-top:12px;"></div>

    <div id="extra-fields" style="margin-top:12px;"></div>

    <div class="muted mt" id="gen-will-use" style="font-size:12px; color:#7a4254;"></div>
  </div>

  <!-- 3 · Finishing: palette, size, text layout -->
  <div class="card mt">
    <h3>Finishing</h3>
    <label class="muted">Palette</label>
    <div class="row" id="palette-row" style="flex-wrap:wrap; gap:6px; margin:6px 0 12px;"></div>

    <label class="muted">Platform size</label>
    <div class="row" id="size-row" style="flex-wrap:wrap; gap:6px; margin:6px 0 12px;"></div>

    <div class="row" style="gap:12px; align-items:flex-end; flex-wrap:wrap;">
      <div><label class="muted" style="display:block;">Text position</label>
        <select id="lay-pos" style="margin-top:4px;"><option value="middle">Middle</option><option value="top">Top</option><option value="bottom">Bottom</option></select></div>
      <div><label class="muted" style="display:block;">Alignment</label>
        <select id="lay-align" style="margin-top:4px;"><option value="center">Centre</option><option value="left">Left</option><option value="right">Right</option></select></div>
      <div><label class="muted" style="display:block;">Font colour</label>
        <select id="lay-ink" style="margin-top:4px;">
          <option value="">Auto (parchment)</option>
          <option value="f7f3e9">Parchment #f7f3e9</option>
          <option value="5c2d3f">Deep berry #5c2d3f</option>
          <option value="0f3b3a">Deep teal #0f3b3a</option>
          <option value="a88792">Dusty rose #a88792</option>
          <option value="ffffff">White</option>
        </select></div>
    </div>

    <button id="gen" style="margin-top:16px;">Generate</button>
    <div class="muted mt" id="gen-status"></div>
  </div>

  <!-- 4 · Result -->
  <div class="card mt" id="result-card" style="display:none;">
    <h3>Result</h3>
    <div class="row" style="align-items:flex-start; flex-wrap:wrap;">
      <img id="result-img" style="max-width:340px; border-radius:8px; border:1px solid var(--line);">
      <div style="flex:1; min-width:220px;">
        <div class="muted" id="result-note"></div>
        <div class="row mt" style="flex-wrap:wrap; gap:8px;">
          <button class="small" id="export-png">Export PNG at chosen size</button>
          <button class="ghost small" id="send-publish">Send to Publishing</button>
          <button class="ghost small" id="save-assets">Save to Asset library</button>
          <button class="ghost small" id="open-full">Open full size</button>
        </div>
        <div class="muted mt" id="export-status"></div>
      </div>
    </div>
  </div>
</div>

<!-- Image picker dialogue -->
<div id="img-modal">
  <div class="panel">
    <button class="close-x" onclick="closeImgPicker()">&times;</button>
    <h3 style="margin-top:0;">Choose an image</h3>
    <div class="ip-tabs">
      <button id="ipt-search" class="on" onclick="ipTab('search')">Live sources</button>
      <button id="ipt-ai" onclick="ipTab('ai')">AI-generated</button>
      <button id="ipt-upload" onclick="ipTab('upload')">My images</button>
    </div>

    <div id="ip-pane-search">
      <div class="row">
        <input type="text" id="ip-q" placeholder="Search Pexels · Unsplash · Pixabay · Openverse · Wikimedia — e.g. forest path, calm seascape…">
        <button id="ip-search-run">Search</button>
      </div>
      <div id="ip-grid"></div>
    </div>

    <div id="ip-pane-ai" style="display:none;">
      <label class="muted" style="display:block; margin-bottom:6px;">Describe the image you want</label>
      <textarea id="ip-ai-prompt" rows="3" style="width:100%; box-sizing:border-box;" placeholder="e.g. soft dawn light over a quiet estuary, muted parchment tones, no people"></textarea>
      <label class="muted" style="display:block; margin:10px 0 4px;">Image model</label>
      <select id="ip-ai-model" style="width:100%; box-sizing:border-box; max-width:420px;">
        <option value="auto">Auto — best available (free first, then paid)</option>
        <option value="gemini">Gemini Flash Image — free (Google quota)</option>
        <option value="fal">Fal fast-sdxl — your Fal credits</option>
        <option value="pollinations|black-forest-labs/flux.1-schnell">Pollinations FLUX.1 Schnell — quick drafts (≈500 per $1)</option>
        <option value="pollinations|tongyi-mai/z-image-turbo">Pollinations Z-Image Turbo — sharp, built-in upscale (≈250 per $1)</option>
        <option value="pollinations|black-forest-labs/flux.2-klein-4b">Pollinations FLUX.2 Klein 4B — quality, up to 2.4 MP (≈200 per $1)</option>
        <option value="stability">Stability SD 3.5 Core — painterly (intro credits)</option>
        <option value="ideogram">Ideogram 3 — best for text-in-image (needs top-up)</option>
        <option value="imagerouter">ImageRouter auto — one key, ~200 models (needs top-up)</option>
      </select>
      <button id="ip-ai-run" style="margin-top:8px;">Generate image</button>
      <div class="muted mt" id="ip-ai-status"></div>
      <div id="ip-ai-result" style="margin-top:10px;"></div>
    </div>

    <div id="ip-pane-upload" style="display:none;">
      <input type="file" id="ip-file" accept="image/*">
      <div class="muted mt" id="ip-upload-status">Your own images are uploaded to your library and used in the canvas.</div>
      <div id="ip-upload-preview" class="mt"></div>
    </div>
  </div>
</div>

<script src="/shared/argentica.js"></script>
<script>
ARG.buildShell('canvas');
const { api, esc } = ARG;

const PALETTES = { teal: '#0f3b3a', rose: '#5c2d3f', ivory: '#f7f3e9', dark: '#111111' };
const ACCENTS = { teal: '#7ecfcd', rose: '#d4899a', ivory: '#5c2d3f', dark: '#ddd0c8' };
const SIZES = [
  ['Instagram post', 1080, 1080], ['Instagram portrait', 1080, 1350], ['Instagram story', 1080, 1920],
  ['Facebook post', 1200, 630], ['X post', 1600, 900], ['LinkedIn', 1200, 627]
];

const TEMPLATES = [
  { id: 'block', label: 'Quote card', kind: 'quote' },
  { id: 'stat', label: 'Statistic', kind: 'stat' },
  { id: 'news-reaction', label: 'News reaction', kind: 'news' },
  { id: 'myth-vs-fact', label: 'Myth vs fact', kind: 'myth' },
  { id: 'data-infographic', label: 'Data infographic', kind: 'data' },
  { id: 'awareness-day', label: 'Awareness day', kind: 'awareness' },
  { id: 'service-explainer', label: 'Service explainer', kind: 'service' },
  { id: 'testimonial', label: 'Testimonial', kind: 'quote' },
  { id: 'semantic', label: 'Photographic', kind: 'photo' },
  { id: 'dual-partnership', label: 'Side by side', kind: 'dual' },
  { id: 'img-landscape', label: 'Photo + caption', kind: 'photo' }
];

// Which templates use an image, and how
const IMAGE_SLOTS = {
  'semantic':        { chip: 'Background image', hint: 'Fills the whole background behind your text.' },
  'img-landscape':   { chip: 'Background photo',  hint: 'Fills the background; your caption sits over it.' },
  'dual-partnership':{ chip: 'Side panel image',  hint: 'Fills the right-hand panel; text sits in the left parchment panel.' },
  'awareness-day':   { chip: 'Background image',  hint: 'Soft background wash behind the campaign ring.' }
};

// Stage shape per template — clicking a template reshapes the input area
const STAGE_DEFS = {
  'block':            { title: 'Quote card', shape: 'single', fields: [['text', 'The quote or line', 'textarea'], ['attribution', 'Attribution (optional)']] },
  'testimonial':      { title: 'Testimonial', shape: 'single', fields: [['text', 'The testimonial', 'textarea'], ['attribution', 'Attribution — e.g. a former client (anonymised)']] },
  'stat':             { title: 'Statistic', shape: 'single', fields: [['text', 'The number / stat + wording', 'textarea'], ['source', 'Source (e.g. ONS, 2024)']] },
  'news-reaction':    { title: 'News reaction', shape: 'single', fields: [['headline', 'Headline being reacted to'], ['outlet', 'Outlet'], ['commentary', 'Your commentary', 'textarea'], ['date', 'Date (optional)']] },
  'myth-vs-fact':     { title: 'Myth vs fact', shape: 'twocol', cols: [['The myth', [['myth', 'The myth', 'textarea']]], ['The fact', [['fact', 'The fact', 'textarea']]]], tail: [['source', 'Source (optional)']] },
  'data-infographic': { title: 'Data infographic', shape: 'single', fields: [['title', 'Headline'], ['subtitle', 'Subtitle'], ['points_data', 'Data points, one per line', 'textarea'], ['source', 'Source (optional)']] },
  'awareness-day':    { title: 'Awareness day', shape: 'single', fields: [['campaignName', 'Campaign'], ['date', 'Date'], ['message', 'Message', 'textarea']] },
  'service-explainer':{ title: 'Service explainer', shape: 'single', fields: [['serviceName', 'Service name'], ['description', 'Description', 'textarea'], ['whoFor', 'Who it is for'], ['contact', 'Contact (optional)']] },
  'semantic':         { title: 'Photographic', shape: 'single', fields: [['text', 'The line', 'textarea'], ['subtext', 'Sub-line (optional)']] },
  'dual-partnership': { title: 'Side by side', shape: 'twocol', cols: [['Text panel', [['text', 'The line', 'textarea'], ['subtext', 'Sub-line (optional)']]], ['Image panel', []]] },
  'img-landscape':   { title: 'Photo + caption', shape: 'single', fields: [['text', 'Caption', 'textarea']] }
};

let activeTemplate = 'block', activePalette = 'teal', activeSize = 0;
let lastUrl = null, lastPngUrl = null, lastKind = 'canvas';
let stageImage = null;   // { url | dataUrl, label }

// ── Template previews ──
function previewSVG(t) {
  const bg = t.kind === 'photo' ? '#55524a' : PALETTES[activePalette];
  const fg = activePalette === 'ivory' ? '#1c1a17' : '#ffffff';
  const ac = ACCENTS[activePalette];
  const W = 1080, H = 1080;
  const parts = [`<rect width="${W}" height="${H}" fill="${bg}"/>`];
  const text = (x, y, w, h, fill, op) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" opacity="${op || 0.9}"/>`;
  const logo = `<circle cx="90" cy="90" r="34" fill="${ac}" opacity="0.9"/><circle cx="130" cy="90" r="34" fill="${fg}" opacity="0.25"/>`;
  switch (t.kind) {
    case 'quote': parts.push(logo, text(120, 380, 840, 40, fg, 0.85), text(120, 450, 760, 40, fg, 0.85), text(120, 520, 820, 40, fg, 0.85), text(120, 620, 500, 26, ac, 0.95)); break;
    case 'stat': parts.push(logo, `<text x="540" y="560" font-family="Georgia" font-size="300" font-weight="bold" fill="${fg}" text-anchor="middle">42%</text>`, text(340, 640, 400, 26, ac, 0.95)); break;
    case 'news': parts.push(logo, text(120, 300, 840, 34, ac, 0.95), text(120, 380, 840, 46, fg, 0.9), text(120, 460, 700, 46, fg, 0.9), text(120, 620, 400, 22, fg, 0.5)); break;
    case 'myth': parts.push(`<rect x="90" y="200" width="410" height="680" rx="16" fill="${fg}" opacity="0.12"/><rect x="580" y="200" width="410" height="680" rx="16" fill="${ac}" opacity="0.22"/>`, text(130, 260, 200, 24, fg, 0.7), text(620, 260, 200, 24, fg, 0.7), text(130, 330, 300, 34, fg, 0.5), text(130, 390, 300, 34, fg, 0.5), text(620, 330, 300, 34, fg, 0.5), text(620, 390, 300, 34, fg, 0.5)); break;
    case 'data': parts.push(logo, text(120, 300, 840, 30, fg, 0.85), [200, 380, 560, 740].map((x, i) => `<rect x="${x}" y="${700 - i * 90}" width="120" height="${i * 90 + 120}" rx="8" fill="${ac}" opacity="${0.5 + i * 0.15}"/>`).join('')); break;
    case 'awareness': parts.push(logo, `<circle cx="540" cy="430" r="180" fill="${ac}" opacity="0.3"/>`, text(340, 660, 400, 34, fg, 0.9), text(420, 720, 240, 22, ac, 0.95)); break;
    case 'service': parts.push(logo, text(120, 340, 840, 40, fg, 0.85), text(120, 420, 840, 40, fg, 0.85), [0,1,2].map(i => `<rect x="${120 + i * 290}" y="540" width="240" height="180" rx="12" fill="${fg}" opacity="${0.12 + i * 0.06}"/>`).join('')); break;
    case 'dual': parts.push(`<rect x="90" y="200" width="420" height="680" rx="16" fill="${fg}" opacity="0.16"/>`, text(580, 340, 400, 34, fg, 0.85), text(580, 410, 400, 34, fg, 0.85), text(580, 500, 300, 22, ac, 0.95)); break;
    case 'photo': parts.push(`<rect width="${W}" height="${H}" fill="#3d5a5a"/>`, `<circle cx="820" cy="260" r="90" fill="#f7e8c9" opacity="0.8"/>`, `<path d="M0 780 Q270 640 540 780 T1080 780 L1080 1080 L0 1080 Z" fill="#22434a"/>`, `<rect x="90" y="840" width="700" height="60" rx="12" fill="#000" opacity="0.35"/>`, `<text x="120" y="880" font-family="Georgia" font-size="36" fill="#fff">Caption over photo</text>`); break;
  }
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${parts.join('')}</svg>`);
}

function templateId() {
  const p = activePalette === 'dark' ? 'dark' : activePalette;
  switch (activeTemplate) {
    case 'block': return 'block-' + (p === 'dark' ? 'teal' : p);
    case 'testimonial': return 'testimonial-' + (p === 'dark' ? 'teal' : p);
    case 'myth-vs-fact': return 'myth-vs-fact-' + (activePalette === 'ivory' ? 'ivory' : 'teal');
    case 'awareness-day': return activePalette === 'rose' ? 'awareness-day-rose' : 'awareness-day';
    case 'semantic': return 'semantic-' + (p === 'dark' ? 'teal' : p);
    default: return activeTemplate;
  }
}

// ── Templates grid (top) ──
function renderGallery() {
  const grid = document.getElementById('tpl-grid');
  grid.innerHTML = TEMPLATES.map(t =>
    '<button class="tpl-btn' + (t.id === activeTemplate ? ' active' : '') + '" data-id="' + t.id + '">' +
    '<img src="' + previewSVG(t) + '" alt="">' +
    '<span class="lbl">' + t.label + '</span></button>'
  ).join('');
  grid.querySelectorAll('.tpl-btn').forEach(b => b.addEventListener('click', () => {
    activeTemplate = b.dataset.id;
    stageImage = null;
    renderGallery(); renderStage(); updateWillUse();
    document.getElementById('stage-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
}

// ── Stage: the template-shaped input area ──
function fieldHTML(id, label, kind) {
  if (kind === 'textarea')
    return '<div class="stage-box" style="flex:1;"><h5>' + esc(label) + '</h5>' +
      '<textarea id="tplf-' + id + '" rows="4" style="width:100%; box-sizing:border-box; min-height:90px;"></textarea></div>';
  return '<div><label class="muted" style="font-size:12px; display:block; margin:8px 0 4px;">' + esc(label) + '</label>' +
    '<input type="text" id="tplf-' + id + '" style="width:100%; box-sizing:border-box;"></div>';
}

function renderStage() {
  const def = STAGE_DEFS[activeTemplate] || { title: activeTemplate, shape: 'single', fields: [['text', 'The line', 'textarea']] };
  document.getElementById('stage-title').textContent = def.title;
  const st = document.getElementById('stage');
  let html = '';
  if (def.shape === 'twocol') {
    html = '<div class="stage-shape">' + def.cols.map(([colTitle, fields], ci) =>
      '<div class="stage-col"><div class="stage-box" style="height:100%;"><h5>' + esc(colTitle) + '</h5>' +
      (fields.length ? fields.map(([id, label, k]) => fieldHTML(id, label, k)).join('')
      : imagePanelHTML()) +
      '</div></div>').join('') + '</div>';
  } else {
    html = (def.fields || []).map(([id, label, k]) => fieldHTML(id, label, k)).join('');
  }
  st.innerHTML = html;
  const tail = def.tail || [];
  document.getElementById('extra-fields').innerHTML = tail.map(([id, label]) => fieldHTML(id, label)).join('');

  // image slot (for dual's second column is inline; for others a chip below)
  const slot = IMAGE_SLOTS[activeTemplate];
  const holder = document.getElementById('stage-image');
  if (slot && def.shape !== 'twocol') {
    holder.style.display = 'block';
    renderImageChip(slot, holder);
  } else if (def.shape === 'twocol') {
    holder.style.display = 'none';
    paintInlineImagePanel();
  } else {
    holder.style.display = 'none';
  }
}

function imagePanelHTML() {
  return '<div id="dual-img-panel" style="min-height:170px; display:flex; align-items:center; justify-content:center; border:1.5px dashed #7a4254; border-radius:10px; cursor:pointer; color:#5c2d3f; font-size:13px; padding:10px; background:rgba(226,235,234,0.35);" onclick="openImgPicker(\'dual\')">' +
    (stageImage ? '<img src="' + esc(stageImage.url || stageImage.dataUrl) + '" style="max-width:100%; max-height:180px; border-radius:8px;">' : 'Click to choose the side-panel image — sources, AI or your own') + '</div>';
}
function paintInlineImagePanel() { const p = document.getElementById('dual-img-panel'); if (p) p.outerHTML = imagePanelHTML(); }

function renderImageChip(slot, holder) {
  holder.innerHTML =
    '<label class="muted" style="font-size:12px; display:block; margin-bottom:4px;">' + esc(slot.chip) + ' <span style="opacity:0.7;">— ' + esc(slot.hint) + '</span></label>' +
    '<div class="img-chip">' +
    (stageImage ? '<img src="' + esc(stageImage.url || stageImage.dataUrl) + '"><div><b>' + esc(stageImage.label || 'Image') + '</b><br><button class="ghost small" onclick="clearStageImage()">Remove</button></div>'
      : '<button class="small" onclick="openImgPicker(\'chip\')">Choose image…</button> <span class="muted" style="font-size:12px;">five sources, AI-generated, or your own</span>') +
    '</div>';
}
window.clearStageImage = function () { stageImage = null; renderStage(); };

// ── Image picker dialogue ──
let pickCtx = 'chip';
window.openImgPicker = function (ctx) {
  pickCtx = ctx || 'chip';
  document.getElementById('img-modal').classList.add('open');
};
window.closeImgPicker = function () { document.getElementById('img-modal').classList.remove('open'); };
window.ipTab = function (which) {
  ['search','ai','upload'].forEach(w => {
    document.getElementById('ipt-' + w).classList.toggle('on', w === which);
    document.getElementById('ip-pane-' + w).style.display = (w === which) ? 'block' : 'none';
  });
};
document.getElementById('img-modal').addEventListener('click', e => { if (e.target.id === 'img-modal') closeImgPicker(); });

function chooseImage(img) {
  stageImage = img;
  closeImgPicker();
  renderStage();
  ARG.toast('Image set — it will be baked into the canvas.');
}

// Live sources
document.getElementById('ip-search-run').addEventListener('click', async () => {
  const q = document.getElementById('ip-q').value.trim();
  const grid = document.getElementById('ip-grid');
  if (!q) { ARG.toast('What are we looking for?'); return; }
  grid.innerHTML = '<div class="muted">Searching five sources…</div>';
  try {
    const d = await api('/image-search/multi', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q, limit: 12, sources: ['pexels', 'unsplash', 'pixabay', 'openverse', 'wikimedia'] })
    });
    const results = d.results || [];
    grid.innerHTML = results.map((r, i) =>
      '<button class="tpl-btn" data-i="' + i + '"><img src="' + esc(r.thumbnail || r.url) + '" alt=""><span class="lbl">' + esc((r.photographer || r.source || '').slice(0, 20)) + '</span></button>'
    ).join('') || '<div class="muted">Nothing found — try another phrase.</div>';
    grid.querySelectorAll('.tpl-btn').forEach(b => b.addEventListener('click', () =>
      chooseImage({ url: results[+b.dataset.i].url, label: (results[+b.dataset.i].photographer || results[+b.dataset.i].source || 'Image') })));
  } catch (e) { grid.innerHTML = '<div class="muted">Search failed: ' + esc(e.message) + '</div>'; }
});

// AI-generated
let aiImg = null;
document.getElementById('ip-ai-run').addEventListener('click', async () => {
  const prompt = document.getElementById('ip-ai-prompt').value.trim();
  const status = document.getElementById('ip-ai-status'), holder = document.getElementById('ip-ai-result');
  if (!prompt) { ARG.toast('Describe the image first.'); return; }
  status.textContent = 'Generating… (this can take a while)';
  holder.innerHTML = ''; aiImg = null;
  try {
    const [prov, polModel] = (document.getElementById('ip-ai-model').value || 'auto').split('|');
    const d = await api('/image/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt, model: prov || 'auto', ...(polModel ? { pollinationsModel: polModel } : {}) })
    });
    if (!d.url) throw new Error(d.error || (d.failed ? ('attempted: ' + d.failed.join('; ')) : 'nothing came back'));
    status.textContent = 'Ready — generated via ' + (d.provider || 'AI') + '.';
    holder.innerHTML = '<img id="ip-ai-img" src="' + esc(d.url) + '" style="max-width:100%; border-radius:8px; border:1px solid var(--line);"><button class="small mt" id="ip-ai-use">Use this image</button>';
    aiImg = d;
    document.getElementById('ip-ai-use').addEventListener('click', () => chooseImage({ url: d.url, label: 'AI-generated (' + (d.provider || 'ai') + ')' }));
  } catch (e) { status.textContent = 'Failed: ' + esc(e.message); }
});

// My images (upload → R2)
document.getElementById('ip-file').addEventListener('change', async (ev) => {
  const f = ev.target.files[0];
  const status = document.getElementById('ip-upload-status'), holder = document.getElementById('ip-upload-preview');
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { status.textContent = 'That file is over 8 MB — please use a smaller image.'; return; }
  status.textContent = 'Uploading…';
  try {
    const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
    const up = await api('/r2/upload', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: 'uploads/user-' + Date.now() + '-' + f.name.replace(/[^a-zA-Z0-9.\-]/g, '_'), content: dataUrl.split(',')[1], mimeType: f.type || 'image/jpeg', fileName: f.name })
    });
    status.textContent = 'Uploaded to your library.';
    holder.innerHTML = '<img src="' + esc(up.url) + '" style="max-width:100%; max-height:280px; border-radius:8px; border:1px solid var(--line);"><br><button class="small mt" id="ip-up-use">Use this image</button>';
    document.getElementById('ip-up-use').addEventListener('click', () => chooseImage({ url: up.url, label: f.name }));
  } catch (e) { status.textContent = 'Upload failed: ' + esc(e.message); }
});

// ── Controls ──
function renderControls() {
  const pr = document.getElementById('palette-row');
  pr.innerHTML = Object.entries(PALETTES).map(([k, c]) =>
    '<button class="ghost small" data-k="' + k + '"' + (k === activePalette ? ' style="background:' + c + '; color:#fff; border-color:' + c + '"' : ' style="border-color:' + c + '"') + '>' + k + '</button>').join('');
  pr.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { activePalette = b.dataset.k; renderControls(); renderGallery(); }));

  const sr = document.getElementById('size-row');
  sr.innerHTML = SIZES.map(([name, w, h], i) =>
    '<button class="ghost small" data-i="' + i + '"' + (i === activeSize ? ' style="background:var(--teal); color:#fff;"' : '') + ' title="' + w + '×' + h + '">' + esc(name) + '</button>').join('');
  sr.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { activeSize = +b.dataset.i; renderControls(); }));
}

function updateWillUse() {
  const t = TEMPLATES.find(x => x.id === activeTemplate);
  document.getElementById('gen-will-use').textContent =
    'Rendering as: ' + (t ? t.label : activeTemplate) + ' (' + templateId() + ')' + (stageImage ? ' — with your chosen image baked in' : '');
}

// ── Generate ──
document.getElementById('gen').addEventListener('click', async () => {
  const btn = document.getElementById('gen'), status = document.getElementById('gen-status');
  const def = STAGE_DEFS[activeTemplate] || {};
  const fields = stageValues();
  const mainText = (fields.text || fields.headline || fields.title || fields.campaignName || fields.serviceName || '').trim();
  if (!mainText) { ARG.toast('Give it something to work with first.'); return; }
  btn.disabled = true; status.textContent = 'Rendering…';
  try {
    const body = {
      topic: mainText,
      text: fields.text || mainText,
      template: templateId(),
      ...fields,
      position: document.getElementById('lay-pos').value,
      align: document.getElementById('lay-align').value,
      ink: document.getElementById('lay-ink').value || null,
      platform: 'instagram', skipQueue: true, skipQA: true
    };
    if (stageImage) {
      if (stageImage.dataUrl) body.imageDataUrl = stageImage.dataUrl;
      else body.imageUrl = stageImage.url;
    }
    const data = await api('/canvas/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    status.textContent = '';
    const usedNote = document.createElement('div');
    usedNote.style.cssText = 'font-size:12px; color:#0f3b3a; margin-top:6px;';
    usedNote.id = 'gen-will-use';
    usedNote.textContent = 'Rendered as: ' + (data.template || templateId()) + (data.type ? ' (type: ' + data.type + ')' : '');
    document.getElementById('gen-will-use').replaceWith(usedNote);
    const url = data.url || (data.urls && data.urls[0]);
    if (url) {
      lastUrl = url; lastPngUrl = null; lastKind = 'canvas';
      const key = url.replace(/^https:\/\/[^/]+\//, '');
      document.getElementById('result-img').src = '/api/r2/file?key=' + encodeURIComponent(key);
      document.getElementById('result-card').style.display = 'block';
      document.getElementById('result-note').textContent = (data.autoFiled ? 'Saved to the Asset library automatically. ' : '') + 'SVG rendered — export a PNG at your chosen platform size before publishing, or send as-is.';
      document.getElementById('result-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      status.textContent = 'Canvas ready.';
    } else {
      status.textContent = 'Nothing came back: ' + esc(data.error || 'try again.');
    }
  } catch (e) { status.textContent = 'Generation failed: ' + esc(e.message); }
  btn.disabled = false;
});

function stageValues() {
  const def = STAGE_DEFS[activeTemplate] || {};
  const all = [].concat(def.fields || [], ...((def.cols || []).map(c => c[1])), def.tail || []);
  const out = {};
  all.forEach(([id]) => {
    const el = document.getElementById('tplf-' + id);
    if (!el) return;
    const v = el.value.trim();
    if (id === 'points_data') out.points = v ? v.split('\n').map(x => x.trim()).filter(Boolean) : [];
    else if (v) out[id] = v;
  });
  return out;
}

// ── Export PNG ──
document.getElementById('export-png').addEventListener('click', async () => {
  const status = document.getElementById('export-status');
  if (!lastUrl) return;
  const [name, w, h] = SIZES[activeSize];
  status.textContent = 'Rasterising at ' + w + '×' + h + '…';
  try {
    const key = lastUrl.replace(/^https:\/\/[^/]+\//, '');
    const svgText = await fetch('/api/r2/file?key=' + encodeURIComponent(key)).then(r => r.text());
    const blobUrl = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml' }));
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = blobUrl; });
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    const scale = Math.max(w, h) / Math.max(img.width, img.height);
    ctx.drawImage(img, (w - img.width * scale) / 2, (h - img.height * scale) / 2, img.width * scale, img.height * scale);
    const png64 = canvas.toDataURL('image/png').split(',')[1];
    const up = await api('/r2/upload', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: 'canvas/png-' + Date.now() + '-' + w + 'x' + h + '.png', content: png64, mimeType: 'image/png', fileName: 'canvas.png' })
    });
    lastPngUrl = up.url;
    try { await api('/assets/log', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ kind:'canvas-png', url: up.url, meta:{ template: templateId(), size: name } }) }); } catch(e){}
    status.textContent = 'PNG exported at ' + name + ' (' + w + '×' + h + ') and saved. Publishing will use it.';
    ARG.toast('PNG ready.');
  } catch (e) { status.textContent = 'Export failed: ' + esc(e.message); }
});

// ── Send to publishing ──
document.getElementById('send-publish').addEventListener('click', () => {
  if (!lastUrl) { ARG.toast('Generate a canvas first.'); return; }
  sessionStorage.setItem('arg:canvas-url', lastPngUrl || lastUrl);
  location.href = '/argentica/commercial/publishing/';
});

// ── Save to Asset library ──
document.getElementById('save-assets').addEventListener('click', async () => {
  if (!lastUrl) { ARG.toast('Generate a canvas first.'); return; }
  const url = lastPngUrl || lastUrl;
  try {
    await api('/assets/log', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ kind: lastKind, url, meta: { template: templateId(), savedFrom: 'Canvas Studio' } })
    });
    const r = confirm('Saved to the Asset library. Open it now?');
    if (r) location.href = '/argentica/create/assets/';
  } catch (e) { ARG.toast('Save failed: ' + e.message); }
});

document.getElementById('open-full').addEventListener('click', () => { if (lastUrl) window.open(lastUrl, '_blank'); });

renderControls();
renderGallery();
renderStage();
updateWillUse();
</script>
</body>
</html>
