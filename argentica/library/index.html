<!DOCTYPE html>
<html lang="en-GB">
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argentica — Study</title>
<link rel="stylesheet" href="/shared/argentica.css">
<style>
  .zonebar { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .zonebar a { padding: 8px 18px; border-radius: 8px 8px 0 0; color: var(--ink-soft); font-size: 14px; }
  .zonebar a.active { background: var(--teal); color: #fff; }
  .zonebar a:hover { text-decoration: none; background: var(--ivory); }
  .tabbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabbar button { background: var(--paper); color: var(--teal); border: 1px solid var(--line); }
  .tabbar button.active { background: var(--teal); color: #fff; }
  .weekbar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 16px; }
  .weekbar button { min-width: 42px; padding: 5px 9px; font-size: 12.5px; }
  .typecard h3 .count { font-size: 11px; color: var(--ink-soft); font-family: var(--sans); margin-left: 4px; }
  .crumb { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; letter-spacing: 0.02em; }
  .crumb b { color: var(--teal); font-weight: 600; }
</style>
</head>
<body>
<div class="arg-page" data-key="library">
  <div class="arg-pagehead spread">
    <div>
      <h1>Library</h1>
      <div class="crumb" id="crumb"></div>
    </div>
  </div>

  <div class="tabbar" id="section-tabs"></div>
  <div class="tabbar" id="module-tabs" style="display:none;"></div>
  <div class="weekbar" id="week-bar"></div>

  <div class="grid" id="dashboard" style="grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); align-items:start;"></div>
</div>

<script src="/shared/argentica.js"></script>
<script>
ARG.buildShell('library');
const { api, esc } = ARG;
const pen_style = ' style="font-size:12px;opacity:.6;margin-left:4px;cursor:pointer;color:#5c2d3f;"';
let overviewMode = true;   // the Hub opens on the section card view

const DEFAULT_STRUCTURE = {
  sections: [
    { id: 'taught', name: 'Taught', modules: [
      { id: 'quant', name: 'Quant Research Methods', kind: 'weeks', weeks: 12 },
      { id: 'methodology', name: 'Methodology Now', kind: 'weeks', weeks: 12 }
    ]},
    { id: 'dissertation', name: 'Dissertation', modules: [
      { id: 'dissertation', name: 'Dissertation', kind: 'sections', sections: ['Literature Review', 'Elena Sources', 'Disability & Deservingness'] }
    ]},
    { id: 'phd', name: 'PhD Material', modules: [ { id: 'phd', name: 'PhD Material', kind: 'free' } ]},
    { id: 'concepts', name: 'Concepts & Thinkers', modules: [ { id: 'concepts', name: 'Concepts & Thinkers', kind: 'free' } ]}
  ]
};

let structure = null;
let allDocs = [];
let curSection = 'taught', curModule = 'quant', curWeek = 'Week 1';

const TYPE_GROUPS = [
  { id: 'assigned', label: 'Assigned Readings', match: d => ['pdf', 'file'].includes(d.type) && (d.tags || []).includes('kind:assigned') },
  { id: 'lecture', label: 'Lecture Notes', match: d => (d.tags || []).includes('kind:lecture') },
  { id: 'slides', label: 'Slides', match: d => /\.pptx/i.test(d.title || '') || (d.tags || []).includes('kind:slides') },
  { id: 'notes', label: 'Own Notes', match: d => d.type === 'note' },
  { id: 'refs', label: 'References', match: d => d.type === 'reference' },
  { id: 'other', label: 'Other Files', match: d => ['pdf', 'file'].includes(d.type) && !(d.tags || []).some(t => t.startsWith('kind:')) }
];

// ── Structure ──────────────────────────────────────────
async function loadStructure() {
  try {
    const d = await api('/kv/get?key=study:structure');
    const raw = d.value || d.result || d.data;
    structure = raw ? (typeof raw === 'string' ? JSON.parse(raw) : raw) : null;
  } catch (e) {}
  if (!structure || !structure.sections) {
    // migrate the older flat shape if present
    const old = (structure && Array.isArray(structure.modules)) ? structure.modules : [];
    const weeks = old.filter(m => m.kind === 'weeks');
    const others = old.filter(m => m.kind !== 'weeks');
    structure = { sections: [
      { id: 'taught', name: 'Taught', modules: weeks.length ? weeks : DEFAULT_STRUCTURE.sections[0].modules }
    ] };
    for (const m of others) structure.sections.push({ id: m.id, name: m.name, modules: [m] });
    for (const s of DEFAULT_STRUCTURE.sections) {
      if (!structure.sections.some(x => x.id === s.id)) structure.sections.push(s);
    }
    saveStructure();
  }
  renderAll();
}

async function saveStructure() {
  try {
    await api('/kv/set', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'study:structure', value: JSON.stringify(structure) }) });
  } catch (e) {}
}

// ── Structure management: sections, subsections, units ──
function addSection() {
  askNew('New section', 'Name of the new section (e.g. Dissertation, PhD):', async v => {
    const id = 'sec-' + Date.now();
    structure.sections.push({ id, name: v, modules: [ { id: 'mod-' + Date.now(), name: v, kind: 'sections', sections: ['General'] } ] });
    await saveStructure();
    curSection = id; curModule = structure.sections.find(x => x.id === id).modules[0].id;
    curWeek = 'General';
    renderTabs();
    ARG.toast('Section added.');
  });
}

function addSubsection() {
  askNew('New subsection', 'Name of the new subsection of ' + esc(section().name) + ' (weeks, themes, categories — your choice):', async v => {
    const id = 'mod-' + Date.now();
    section().modules.push({ id, name: v, kind: 'sections', sections: ['General'], notebooks: [] });
    await saveStructure();
    curModule = id; curWeek = 'General';
    renderTabs();
    ARG.toast('Subsection added.');
  });
}

function addUnit(isWeek) {
  if (isWeek) {
    const m = module_();
    m.weeks = (m.weeks || 12) + 1;
    saveStructure();
    curWeek = 'Week ' + m.weeks;
  } else {
    askNew('New unit', 'Name of the unit inside ' + esc(module_().name) + ' (theme, category, chapter…):', async v => {
      module_().sections.push(v);
      await saveStructure();
      curWeek = v;
      renderTabs();
      ARG.toast('Unit added.');
    });
    return;
  }
  renderTabs();
}

// ── Inline edit affordances: pen/delete on every section, subsection and unit ──
function openMiniModal(title, bodyHtml, actions) {
  document.getElementById('mini-title').textContent = title;
  document.getElementById('mini-body').innerHTML = bodyHtml;
  const act = document.getElementById('mini-actions');
  act.innerHTML = '';
  actions.forEach(([label, cls, fn]) => {
    const b = document.createElement('button');
    b.className = cls; b.textContent = label;
    b.onclick = () => fn();
    act.appendChild(b);
  });
  document.getElementById('mini-modal').style.display = 'flex';
}
function closeMiniModal() { document.getElementById('mini-modal').style.display = 'none'; }
const askRename = (label, current, onName) => {
  openMiniModal('Rename ' + label,
    '<label class="muted" style="font-size:12px;display:block;margin:0 0 4px;">New name — use "&&nbsp;" for depth (e.g. Assignment &gt; Part 1)</label>' +
    '<input type="text" id="mini-input" value="' + esc(current) + '" style="width:100%;box-sizing:border-box;">',
    [['Cancel', 'ghost', closeMiniModal], ['Save', '', async () => {
      const v = document.getElementById('mini-input').value.trim();
      if (!v) { ARG.toast('Give it a name.'); return; }
      closeMiniModal(); await onName(v);
    }]]);
  setTimeout(() => { const i = document.getElementById('mini-input'); i.focus(); i.select(); }, 40);
};
const askDelete = (label, what, onDelete) => {
  openMiniModal('Delete ' + label, '<p>' + what + '</p><p class="muted" style="font-size:12px;">Documents are never deleted — anything filed here surfaces under General.</p>',
    [['Cancel', 'ghost', closeMiniModal], ['Delete', '', async () => { closeMiniModal(); await onDelete(); }]]);
};

const askNew = (title, hint, onName) => {
  openMiniModal(title,
    '<label class="muted" style="font-size:12px;display:block;margin:0 0 4px;">' + hint + '</label>' +
    '<input type="text" id="mini-input" value="" style="width:100%;box-sizing:border-box;">',
    [['Cancel', 'ghost', closeMiniModal], ['Create', '', async () => {
      const v = document.getElementById('mini-input').value.trim();
      if (!v) { ARG.toast('Give it a name.'); return; }
      closeMiniModal(); await onName(v);
    }]]);
  setTimeout(() => document.getElementById('mini-input').focus(), 40);
};
window.secEdit = id => { const sec = structure.sections.find(x => x.id === id); if (!sec) return;
  askRename('section "' + sec.name + '"', sec.name, async v => { sec.name = v; await saveStructure(); renderTabs(); }); };
window.secDelete = id => { if (structure.sections.length < 2) { ARG.toast('Keep at least one section.'); return; }
  const sec = structure.sections.find(x => x.id === id); if (!sec) return;
  askDelete('section "' + sec.name + '"', 'Delete the <b>' + esc(sec.name) + '</b> section and all its subsections?', async () => {
    structure.sections = structure.sections.filter(x => x.id !== id);
    if (curSection === id) { curSection = structure.sections[0].id; curModule = section().modules[0].id; curWeek = unitList()[0]; }
    await saveStructure(); renderTabs(); }); };
window.modEdit = id => { const sec = section(); const mod = sec.modules.find(x => x.id === id); if (!mod) return;
  askRename('subsection "' + mod.name + '"', mod.name, async v => { mod.name = v; await saveStructure(); renderTabs(); }); };
window.modDelete = id => { const sec = section(); if (sec.modules.length < 2) { ARG.toast('Keep at least one subsection.'); return; }
  const mod = sec.modules.find(x => x.id === id); if (!mod) return;
  askDelete('subsection "' + mod.name + '"', 'Delete the <b>' + esc(mod.name) + '</b> subsection?', async () => {
    sec.modules = sec.modules.filter(x => x.id !== id);
    if (curModule === id) { curModule = sec.modules[0].id; curWeek = unitList()[0]; }
    await saveStructure(); renderTabs(); }); };
window.unitEdit = name => { const mod = module_(); if (mod.kind !== 'sections') { ARG.toast('Week entries rename via the week number — edit the week count instead.'); return; }
  const i = mod.sections.indexOf(name); if (i < 0) return;
  askRename('unit "' + name + '"', name, async v => {
    mod.sections[i] = v; if (curWeek === name) curWeek = v; await saveStructure(); renderTabs(); }); };
window.unitDelete = name => { const mod = module_(); if (mod.kind !== 'sections' || mod.sections.length < 2) return;
  askDelete('unit "' + name + '"', 'Delete the <b>' + esc(name) + '</b> unit?', async () => {
    mod.sections = mod.sections.filter(u => u !== name); if (curWeek === name) curWeek = mod.sections[0];
    await saveStructure(); renderTabs(); }); };

// ── Document actions: edit, delete, send to knowledge base ──
window.docEdit = async id => {
  try {
    const rec = await api('/documents/' + id);
    const d = rec.document || rec;
    openMiniModal('Edit document',
      '<label class="muted" style="font-size:12px;display:block;margin:0 0 4px;">Title</label>' +
      '<input type="text" id="mini-title-in" value="' + esc(d.title) + '" style="width:100%;box-sizing:border-box;">' +
      '<label class="muted" style="font-size:12px;display:block;margin:12px 0 4px;">Content</label>' +
      '<textarea id="mini-content" rows="8" style="width:100%;box-sizing:border-box;">' + esc(typeof d.content === 'string' ? d.content.slice(0, 20000) : '') + '</textarea>',
      [['Cancel', 'ghost', closeMiniModal], ['Save', '', async () => {
        const title = document.getElementById('mini-title-in').value.trim();
        const content = document.getElementById('mini-content').value;
        await api('/documents', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: d.id, title: title || d.title, type: d.type, content, tags: d.tags || [], annotations: d.annotations || [], moduleSource: d.moduleSource }) });
        closeMiniModal(); await loadDocs(); renderTabs();
        ARG.toast('Document saved.');
      }]]);
  } catch (e) { ARG.toast('Could not load the document: ' + e.message); }
};
window.docDelete = id => {
  askDelete('document', 'Delete this document for good?', async () => {
    try { await api('/documents/' + id, { method: 'DELETE' }); allDocs = allDocs.filter(d => d.id !== id); renderTabs(); ARG.toast('Deleted.'); } catch (e) { ARG.toast('Could not delete: ' + e.message); }
  });
};
window.docToKb = async id => {
  try {
    const rec = await api('/documents/' + id);
    const d = rec.document || rec;
    const kb = await api('/kb');
    const paths = [...new Set((kb.pages || []).map(p => (p.section || '').trim()).filter(Boolean))].sort();
    openMiniModal('Copy to the Knowledge Base',
      '<label class="muted" style="font-size:12px;display:block;margin:0 0 4px;">Title</label>' +
      '<input type="text" id="mini-title-in" value="' + esc(d.title) + '" style="width:100%;box-sizing:border-box;">' +
      '<label class="muted" style="font-size:12px;display:block;margin:12px 0 4px;">Section path (new or existing)</label>' +
      '<datalist id="mini-dl">' + paths.map(p => '<option value="' + esc(p) + '">').join('') + '</datalist>' +
      '<input type="text" id="mini-path" list="mini-dl" value="' + esc(section().name + ' > ' + module_().name) + '" style="width:100%;box-sizing:border-box;">',
      [['Cancel', 'ghost', closeMiniModal], ['Copy to KB', '', async () => {
        const title = document.getElementById('mini-title-in').value.trim() || d.title;
        const path = document.getElementById('mini-path').value.trim();
        const content = typeof d.content === 'string' ? d.content : '';
        const kbId = 'kb-from-hub-' + Date.now();
        await api('/kb', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: kbId, title, section: path, source: 'study-hub', format: 'html', content: content.startsWith('<') ? content : '<p>' + esc(content) + '</p>' }) });
        closeMiniModal();
        ARG.toast('Copied to the Knowledge Base' + (path ? ' under ' + path : '') + '.');
      }]]);
  } catch (e) { ARG.toast('Could not load the document: ' + e.message); }
};

function manageStructure() {
  const sec = section(), mod = module_();
  const canDelUnit = mod.kind === 'sections' && mod.sections.length > 1;
  const canDelMod = sec.modules.length > 1;
  const canDelSec = structure.sections.length > 1;
  const docCount = docsHere().length;
  let html = '<div class="muted" style="font-size:12px;margin-bottom:12px;">Managing <b>' + esc(sec.name) + '</b> &rsaquo; <b>' + esc(mod.name) + '</b> &rsaquo; <b>' + esc(curWeek) + '</b> &nbsp;(' + docCount + ' document' + (docCount === 1 ? '' : 's') + ' filed here)</div>';
  const field = (id, label, val) => '<label class="muted" style="font-size:12px;display:block;margin:10px 0 4px;">' + label + '</label><input type="text" id="stm-' + id + '" value="' + esc(val) + '" style="width:100%;box-sizing:border-box;">';
  html += field('sec', 'Section name', sec.name);
  html += field('mod', 'Subsection name', mod.name);
  if (mod.kind === 'sections') html += field('unit', 'Unit name &mdash; use &ldquo;&&nbsp;&rdquo; for depth, e.g. <i>Assignment &gt; Part 1</i>', curWeek);
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">';
  if (canDelUnit) html += '<button class="ghost small" id="stm-del-unit">Delete unit ' + esc(curWeek) + '</button>';
  if (canDelMod) html += '<button class="ghost small" id="stm-del-mod">Delete subsection ' + esc(mod.name) + '</button>';
  if (canDelSec) html += '<button class="ghost small" id="stm-del-sec">Delete section ' + esc(sec.name) + '</button>';
  html += '</div><div class="muted" style="font-size:11px;margin-top:8px;">Deleting a unit, subsection or section removes the filing place, not the documents &mdash; anything filed there surfaces under General.</div>';
  const f = document.getElementById('smgr-fields');
  f.innerHTML = html;
  document.getElementById('smgr-modal').style.display = 'flex';
  const saveBtn = document.getElementById('smgr-save');
  saveBtn.onclick = async () => {
    const nvSec = document.getElementById('stm-sec').value.trim();
    const nvMod = document.getElementById('stm-mod').value.trim();
    if (nvSec) sec.name = nvSec;
    if (nvMod) mod.name = nvMod;
    if (mod.kind === 'sections') {
      const nvUnit = document.getElementById('stm-unit').value.trim();
      const i = mod.sections.indexOf(curWeek);
      if (nvUnit && i >= 0) { mod.sections[i] = nvUnit; curWeek = nvUnit; }
    }
    await saveStructure();
    document.getElementById('smgr-modal').style.display = 'none';
    renderTabs();
    ARG.toast('Structure saved.');
  };
  const delUnit = document.getElementById('stm-del-unit');
  if (delUnit) delUnit.onclick = async () => {
    askDelete('unit "' + esc(curWeek) + '"', 'Delete unit "' + esc(curWeek) + '"? Documents filed here will surface under General.', async () => {
      mod.sections = mod.sections.filter(u => u !== curWeek); curWeek = mod.sections[0];
      await saveStructure(); document.getElementById('smgr-modal').style.display = 'none'; renderTabs();
    });
  };
  const delMod = document.getElementById('stm-del-mod');
  if (delMod) delMod.onclick = async () => {
    askDelete('subsection "' + esc(mod.name) + '"', 'Delete subsection "' + esc(mod.name) + '"? Documents filed here will surface under the first remaining subsection.', async () => {
      sec.modules = sec.modules.filter(x => x.id !== mod.id); curModule = sec.modules[0].id; curWeek = unitList()[0];
      await saveStructure(); document.getElementById('smgr-modal').style.display = 'none'; renderTabs();
    });
  };
  const delSec = document.getElementById('stm-del-sec');
  if (delSec) delSec.onclick = async () => {
    askDelete('section "' + esc(sec.name) + '"', 'Delete section "' + esc(sec.name) + '" and all its subsections? Documents are kept.', async () => {
      structure.sections = structure.sections.filter(x => x.id !== sec.id);
      curSection = structure.sections[0].id; curModule = section().modules[0].id; curWeek = unitList()[0];
      await saveStructure(); document.getElementById('smgr-modal').style.display = 'none'; renderTabs();
    });
  };
}

function section() { return structure.sections.find(s => s.id === curSection) || structure.sections[0]; }
function module_() { return section().modules.find(m => m.id === curModule) || section().modules[0]; }
function unitList() {
  const m = module_();
  if (m.kind === 'weeks') return Array.from({ length: m.weeks }, (_, i) => 'Week ' + (i + 1));
  if (m.kind === 'sections') return m.sections;
  return ['General'];
}

function goOverview() { overviewMode = true; renderAll(); }
function renderAll() {
  if (overviewMode) { renderOverview(); return; }
  renderTabs(); renderDashboard();
}

// -- Section overview: full-page card view --
function renderOverview() {
  ['module-tabs','week-bar'].forEach(id => { const el = document.getElementById(id); el.style.display = 'none'; });
  document.getElementById('section-tabs').innerHTML = '<span class="muted" style="font-size:13px;">All sections \u2014 open one to see its weeks, units and documents.</span>';
  const dash = document.getElementById('dashboard');
  const nbs = allNotebooks();
  dash.innerHTML = structure.sections.map(sec => {
    const mods = sec.modules || [];
    const modRows = mods.map(m => {
      const mDocs = allDocs.filter(d => (d.tags || []).includes('module:' + m.id)).length;
      const nbNames = (m.notebooks || []).map(id2 => { const nb = nbs.find(n => n.id === id2); return nb ? nb.name : ''; }).filter(Boolean);
      return '<div style="padding:4px 0; border-top:1px solid rgba(15,59,58,.12); font-size:12.5px;">' +
        '<b style="color:#5c2d3f;">' + esc(m.name) + '</b> <span class="muted">\u00b7 ' + mDocs + ' doc' + (mDocs === 1 ? '' : 's') +
        (m.kind === 'weeks' ? ' \u00b7 ' + (m.weeks || 12) + ' weeks' : '') + '</span>' +
        (nbNames.length ? '<div class="muted" style="font-size:11.5px;">\uD83D\uDCD3 ' + esc(nbNames.join(', ')) + '</div>' : '') + '</div>';
    }).join('');
    const secDocs = allDocs.filter(d => mods.some(m => (d.tags || []).includes('module:' + m.id)));
    const total = secDocs.length;
    const edited = secDocs.map(d => d.updatedAt || d.ts || '').filter(Boolean).sort().pop();
    return '<div class="card" style="cursor:pointer;" onclick="openSectionCard(\'' + esc(sec.id) + '\')">' +
      '<h3 style="font-family:\'EB Garamond\',Georgia,serif;margin:0 0 6px;color:#5c2d3f;">' + esc(sec.name) + ' <span class="muted" style="font-size:11px;font-family:var(--sans,Inter,sans-serif);">' + total + ' doc' + (total === 1 ? '' : 's') + '</span></h3>' +
      (modRows || '<div class="muted" style="font-size:12px;">No subsections yet.</div>') +
      (edited ? '<div class="muted" style="font-size:11px;margin-top:8px;">Last edited ' + esc(String(edited).slice(0, 10)) + '</div>' : '') +
      '<div class="muted" style="font-size:11px;margin-top:2px;">Click to open</div></div>';
  }).join('');
}
window.openSectionCard = id => {
  overviewMode = false; curSection = id;
  const sec = structure.sections.find(x => x.id === id);
  curModule = sec && sec.modules[0] ? sec.modules[0].id : '';
  curWeek = sec ? unitList()[0] : 'General';
  renderTabs(); renderDashboard();
};


function renderTabs() {
  if (overviewMode) { renderOverview(); return; }
  const st = document.getElementById('section-tabs');
  st.innerHTML = '<button class="ghost small" onclick="goOverview()" title="Back to the section overview">\u2302 Sections</button>' +
    structure.sections.map(s => '<button data-id="' + esc(s.id) + '"' + (s.id === curSection ? ' class="active"' : '') + '>' + esc(s.name) +
    '<span title="Rename this section" onclick="event.stopPropagation();secEdit(\'' + esc(s.id) + '\')"' + pen_style + '>\u270E</span>' +
    '<span title="Delete this section" onclick="event.stopPropagation();secDelete(\'' + esc(s.id) + '\')"' + pen_style + '>\u2715</span></button>').join('') +
    '<button class="ghost small" onclick="addSection()" title="Add a top-level section">+ Section</button>' +
    '<button class="ghost small" onclick="manageStructure()" title="Rename or delete">✎</button>';
  st.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    curSection = b.dataset.id;
    curModule = section().modules[0].id;
    curWeek = unitList()[0];
    renderTabs();
  }));

  const mt = document.getElementById('module-tabs');
  mt.style.display = 'flex';
  mt.innerHTML = section().modules.map(m => '<button data-id="' + esc(m.id) + '"' + (m.id === curModule ? ' class="active"' : '') + '>' + esc(m.name) +
    '<span title="Rename this subsection" onclick="event.stopPropagation();modEdit(\'' + esc(m.id) + '\')"' + pen_style + '>\u270E</span>' +
    '<span title="Delete this subsection" onclick="event.stopPropagation();modDelete(\'' + esc(m.id) + '\')"' + pen_style + '>\u2715</span></button>').join('') +
    '<button class="ghost small" style="max-width:none;" onclick="addSubsection()" title="Add a subsection to ' + esc(section().name) + '">+ Subsection</button>';
  mt.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', () => {
    curModule = b.dataset.id;
    curWeek = unitList()[0];
    renderTabs();
  }));

  const m = module_();
  const flatUnits = unitList().slice().sort(function(a, b){
    const au = (a || '').split('>').map(function(x){return x.trim();});
    const bu = (b || '').split('>').map(function(x){return x.trim();});
    for (let i = 0; i < Math.max(au.length, bu.length); i++) {
      const av = au[i] === undefined ? -1 : au[i].localeCompare(bu[i] === undefined ? '' : bu[i]);
      if (av !== 0) return av;
    }
    return au.length - bu.length;
  });
  let wHtml = flatUnits.map(u => {
    const depth = (u.match(/>/g) || []).length;
    const leaf = (u.split('>').pop() || '').trim();
    const label = u.startsWith('Week ') ? u.replace('Week ', 'W') : leaf;
    const manage = m.kind === 'sections' && u !== 'General'
      ? '&nbsp;<span title="Rename this unit" onclick="event.stopPropagation();unitEdit(\'' + esc(u).replace(/'/g, "\\'") + '\')" style="font-size:9px;opacity:.55;">\u270E</span><span title="Delete this unit" onclick="event.stopPropagation();unitDelete(\'' + esc(u).replace(/'/g, "\\'") + '\')" style="font-size:9px;opacity:.55;">\u2715</span>' : '';
    return '<button class="ghost small"' + (u === curWeek ? ' style="background:var(--rose); color:#fff; border-color:var(--rose);"' : (depth > 0 ? ' style="margin-left:' + (depth * 10) + 'px;color:var(--ink-soft);"' : '')) + ' data-u="' + esc(u) + '" title="' + esc(u) + '">' + esc(label) + manage + '</button>';
  }).join('');
  if (m.kind === 'weeks') wHtml += '<button class="ghost small" style="max-width:none;" onclick="addUnit(true)" title="Add another week">+ Week</button>';
  else if (m.kind === 'sections') wHtml += '<button class="ghost small" style="max-width:none;" onclick="addUnit()" title="Add a category / theme / unit inside ' + esc(m.name) + '">+ Unit</button>';
  const wb = document.getElementById('week-bar');
  wb.innerHTML = wHtml;
  wb.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    curWeek = b.dataset.u === 'General' ? 'General' : (b.dataset.u.startsWith('W') && !b.dataset.u.startsWith('Week') ? 'Week ' + b.dataset.u.slice(1) : b.dataset.u);
    renderTabs();
  }));

  renderCrumb();
  renderDashboard();
}

function renderCrumb() {
  document.getElementById('crumb').innerHTML =
    '<b>Library</b> / ' + esc(section().name) + ' / ' + esc(module_().name) + ' / <b>' + esc(curWeek) + '</b>';
}

function docsHere() {
  return allDocs.filter(d => {
    const tags = d.tags || [];
    return tags.includes('module:' + curModule) &&
      (tags.includes('section:' + curWeek) || (!tags.some(t => t.startsWith('section:')) && curWeek === 'General'));
  });
}

function onedrivePath() {
  return 'Library/' + section().name + '/' + module_().name + '/' + curWeek;
}

function docItem(d) {
  return '<div class="item">' +
    '<div style="min-width:0;"><div>' + esc(d.title) + '</div>' +
    '<div class="muted">' + (d.updatedAt ? new Date(d.updatedAt).toLocaleDateString('en-GB') : '') +
    (d.archivedTo ? ' · <span class="badge green">archived</span>' : '') + '</div></div>' +
    '<div class="row">' +
    '<button class="ghost small" onclick="openDoc(\'' + esc(d.id) + '\')">Open</button>' +
    '<button class="ghost small" onclick="docEdit(\'' + esc(d.id) + '\')" title="Edit title and content">\u270E Edit</button>' +
    '<button class="ghost small" onclick="docToKb(\'' + esc(d.id) + '\')" title="Copy this document into the Knowledge Base">\u2192 KB</button>' +
    '<button class="ghost small" onclick="docDelete(\'' + esc(d.id) + '\')" title="Delete this document" style="color:#a05050;">\u2715</button>' +
    '<button class="ghost small" onclick="askAbout(\'' + esc(d.id) + '\')">Ask</button>' +
    (d.content && String(d.content).includes('r2.dev') ? '<button class="ghost small" onclick="archiveDoc(\'' + esc(d.id) + '\')">Archive</button>' : '') +
    '</div></div>';
}

// ── Notebook assignment (notebooks live in the Notebooks app, shared via browser storage) ──
function allNotebooks() {
  try { return JSON.parse(localStorage.getItem('wh-notebooks') || '[]'); } catch (e) { return []; }
}
function moduleNotebookIds() { const m = module_(); m.notebooks = m.notebooks || []; return m.notebooks; }
function notebookCard() {
  const ids = moduleNotebookIds();
  const all = allNotebooks();
  const assigned = all.filter(nb => ids.includes(nb.id));
  return '<div class="card typecard"><h3>Notebooks<span class="count">' + assigned.length + '</span></h3>' +
    (assigned.length ? '<div class="item-list">' + assigned.map(nb =>
      '<div class="item"><div><div>' + esc(nb.icon || '📓') + ' ' + esc(nb.name) + '</div>' +
      '<div class="muted">' + (nb.sections || []).length + ' sections</div></div>' +
      '<div class="row"><a class="ghost small" style="text-decoration:none;" href="/argentica/library/notebooks/">Open</a>' +
      '<button class="ghost small" onclick="unassignNb(\'' + esc(nb.id) + '\')">Unassign</button></div></div>'
    ).join('') + '</div>' : '<div class="muted">No notebooks assigned to this subsection yet.</div>') +
    '<button class="small mt" onclick="assignNotebookDialog()">Assign notebooks</button>' +
    '<button class="ghost small mt" style="margin-left:6px;" onclick="createAndAssignNotebook()">New notebook</button></div>';
}
function assignNotebookDialog() {
  const all = allNotebooks();
  if (!all.length) { ARG.toast('No notebooks exist yet — create one with "New notebook".'); return; }
  const m = module_();
  m.notebooks = m.notebooks || [];
  const listHtml = '<div style="max-height:260px;overflow-y:auto;">' + all.map(nb =>
    '<label style="display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13.5px;">' +
    '<input type="checkbox" class="nb-assign" data-id="' + esc(nb.id) + '"' + (m.notebooks.includes(nb.id) ? ' checked' : '') + '> ' +
    (nb.icon || '📓') + ' ' + esc(nb.name) + '</label>').join('') + '</div>';
  openMiniModal('Assign notebooks — ' + esc(m.name), listHtml,
    [['Cancel', 'ghost', closeMiniModal], ['Save', '', async () => {
      m.notebooks = [...document.querySelectorAll('.nb-assign:checked')].map(c => c.dataset.id);
      closeMiniModal(); await saveStructure(); renderTabs();
      ARG.toast('Notebook assignments saved.');
    }]]);
}
function createAndAssignNotebook() {
  const then = async name => {
    const all = allNotebooks();
    const nb = { id: 'nb-' + Date.now(), name: name.trim(), icon: '📓', sections: [ { id: 'sec-' + Date.now(), name: 'General', pages: [] } ] };
    all.unshift(nb);
    localStorage.setItem('wh-notebooks', JSON.stringify(all));
    const m = module_(); m.notebooks = m.notebooks || []; m.notebooks.push(nb.id);
    await saveStructure(); renderTabs();
    ARG.toast('Notebook "' + name.trim() + '" created and assigned.');
  };
  askNew('New notebook', 'Name of the new notebook:', then);
}
function unassignNb(id) { const m = module_(); m.notebooks = (m.notebooks || []).filter(x => x !== id); saveStructure(); renderTabs(); }

function renderDashboard() {
  const docs = docsHere();
  const dash = document.getElementById('dashboard');
  const kindSelect = '<select id="up-kind" style="max-width:140px; margin-top:8px;">' +
    '<option value="kind:assigned">Assigned reading</option>' +
    '<option value="kind:lecture">Lecture notes</option>' +
    '<option value="kind:slides">Slides</option>' +
    '<option value="" selected>Unclassified</option></select>';

  dash.innerHTML = notebookCard() + TYPE_GROUPS.map(g => {
    const items = docs.filter(g.match);
    return '<div class="card typecard">' +
      '<h3>' + g.label + '<span class="count">' + items.length + '</span></h3>' +
      (items.length ? '<div class="item-list">' + items.map(docItem).join('') + '</div>' : '<div class="muted">Nothing here yet.</div>') +
      '</div>';
  }).join('') +

  '<div class="card">' +
    '<h3>Add to ' + esc(curWeek) + '</h3>' +
    '<div id="drop" style="border:1.5px dashed var(--grey); border-radius:10px; padding:16px; text-align:center; cursor:pointer;">' +
    '<div style="font-family:var(--serif); font-size:15px; color:var(--teal);">Drop a reading here</div>' +
    '<div class="muted">PDF, DOCX, PPTX, image — filed to Drive as ' + 'Library/' + section().name + '/' + module_().name + '/' + curWeek + '</div>' +
    '<input type="file" id="file" accept=".pdf,.docx,.pptx,image/*,audio/*" hidden>' +
    '</div>' + kindSelect +
    '<input type="text" id="note-title" placeholder="New note title" style="margin-top:10px;">' +
    '<textarea id="note-body" style="min-height:56px; margin-top:6px;" placeholder="Write a note…"></textarea>' +
    '<button class="small mt" id="note-save">Save note</button>' +
    '<div class="muted mt" id="upload-status"></div>' +
    '</div>';

  wireUpload();
  document.getElementById('note-save').addEventListener('click', saveNote);
}

// ── Upload ────────────────────────────────────────────
function wireUpload() {
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor = 'var(--teal)'; });
  drop.addEventListener('dragleave', () => drop.style.borderColor = 'var(--grey)');
  drop.addEventListener('drop', e => { e.preventDefault(); drop.style.borderColor = 'var(--grey)'; if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) upload(fileInput.files[0]); });
}

function kindTag() { return (document.getElementById('up-kind') || {}).value || ''; }

async function upload(file) {
  const status = document.getElementById('upload-status');
  status.textContent = 'Uploading "' + file.name + '"…';
  try {
    const buf = await file.arrayBuffer();
    let bin = '';
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    const key = 'study/' + curModule + '/' + Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const up = await api('/r2/upload', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, content: btoa(bin), mimeType: file.type || 'application/octet-stream', fileName: file.name })
    });
    const tags = ['module:' + curModule, 'section:' + curWeek];
    const kt = kindTag(); if (kt) tags.push(kt);
    await api('/documents', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: file.name, type: /\.pdf$/i.test(file.name) ? 'pdf' : 'file', content: up.url, tags, moduleSource: curModule })
    });
    // Auto-index text-extractable files for semantic search (fire-and-forget)
    if (/\.(txt|md|csv|json|html?)$/i.test(file.name) || (file.type || '').startsWith('text/')) {
      try {
        const text = await file.text();
        fetch('/api/study/index-document', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: text.slice(0, 100000), fileName: file.name, moduleId: curModule, weekId: curWeek })
        }).catch(() => {});
        status.textContent += ' Indexed for search.';
      } catch (e) {}
    }
    // File it to Google Drive in the same structure (silently — R2 remains the working copy)
    try {
      await api('/gdrive/upload', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileName: 'Library/' + section().name + '/' + module_().name + '/' + curWeek + '/' + file.name, content: btoa(bin), mimeType: file.type || 'application/octet-stream' })
      });
      status.textContent = 'Uploaded to R2 and archived to Drive: ' + section().name + ' / ' + module_().name + ' / ' + curWeek + '.';
    } catch (e) {
      status.textContent = 'Uploaded to R2. Drive archive pending: ' + (e.message || '').slice(0, 80);
    }
    loadDocs();
  } catch (e) { status.textContent = 'Upload failed: ' + e.message; }
}

async function saveNote() {
  const title = document.getElementById('note-title').value.trim();
  const body = document.getElementById('note-body').value.trim();
  if (!title && !body) { ARG.toast('Nothing to save.'); return; }
  try {
    await api('/documents', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: title || 'Untitled note', type: 'note', content: body, tags: ['module:' + curModule, 'section:' + curWeek], moduleSource: curModule })
    });
    // Notes are indexed for semantic search too
    try {
      fetch('/api/study/index-document', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: (title ? title + '\n\n' : '') + body, fileName: (title || 'note') + '.txt', moduleId: curModule, weekId: curWeek })
      }).catch(() => {});
    } catch (e) {}
    // Notes also file to Google Drive as plain text
    try {
      await api('/gdrive/upload', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileName: 'Library/' + section().name + '/' + module_().name + '/' + curWeek + '/' + (title || 'note') + '.txt', content: (title ? title + '\n\n' : '') + body, mimeType: 'text/plain' })
      });
    } catch (e) {}
    ARG.toast('Note saved.');
    loadDocs();
  } catch (e) { ARG.toast('Could not save the note.'); }
}

// ── Archive an existing reading to OneDrive ───────────
window.archiveDoc = async id => {
  const d = allDocs.find(x => x.id === id);
  if (!d) return;
  ARG.toast('Archiving to Drive…');
  try {
    const key = String(d.content || '').replace(/^https:\/\/[^/]+\//, '');
    const resp = await fetch('/api/r2/file?key=' + encodeURIComponent(key));
    if (!resp.ok) throw new Error('file not in storage (HTTP ' + resp.status + ')');
    const buf = new Uint8Array(await resp.arrayBuffer());
    let bin = '';
    for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    const tags = d.tags || [];
    const mod = structure.sections.flatMap(s => s.modules).find(m => tags.includes('module:' + m.id));
    const sec = tags.find(t => t.startsWith('section:'));
    const folder = 'Library/' + (section().name) + '/' + (mod ? mod.name : 'Unfiled') + '/' + (sec ? sec.replace('section:', '') : 'General');
    const r = await api('/gdrive/upload', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileName: folder + '/' + d.title, content: btoa(bin), mimeType: 'application/octet-stream' })
    });
    await api('/documents/' + encodeURIComponent(id), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archivedTo: r.shareUrl || folder }) });
    ARG.toast('Archived to Drive.');
    loadDocs();
  } catch (e) { ARG.toast('Drive: ' + e.message.slice(0, 80)); }
};

window.openDoc = id => { location.href = '/argentica/viewer/?doc=' + encodeURIComponent(id); };
window.askAbout = id => {
  const d = allDocs.find(x => x.id === id) || {};
  sessionStorage.setItem('arg:pending-prompt', 'Summarise "' + d.title + '" and its key arguments.');
  location.href = '/argentica/chat/';
};



async function loadDocs() {
  try {
    const data = await api('/documents');
    allDocs = data.documents || [];
    renderAll();
  } catch (e) {}
}

loadStructure();
loadDocs();
</script>
