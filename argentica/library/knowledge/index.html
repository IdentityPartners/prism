<!DOCTYPE html>
<html lang="en-GB">
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base — Argentica</title>
<link rel="stylesheet" href="/shared/argentica.css">
<style>
:root {
  --border: rgba(15,59,58,.18); --bg: #fdfbf6; --fg: #1c1a17;
  --bg-surface: #fff; --bg-elevated: #fff; --bg-sunken: #f4f0e6;
  --fg-muted: #6b675f; --accent: #0f3b3a; --accent-light: #e7efe9;
  --font-ui: Georgia, serif; --font-heading: Georgia, serif;
}
.wiki-shell { height: calc(100vh - 60px); }
.wiki-tree { background: #fff; }
.wiki-hdr, .wiki-toolbar, .wiki-status { background: #fff; }
</style>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<!-- cache-bust-1792935669 -->
<style>
.wiki-shell{display:flex;height:100vh;overflow:hidden;}
.wiki-tree{width:240px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-surface);overflow:hidden;}
.wiki-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.wiki-tree-hdr{padding:10px 12px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.wiki-tree-hdr h3{font-size:13px;font-weight:700;margin:0;}
.wiki-tree-body{flex:1;overflow-y:auto;padding:6px;}
.wiki-page-item{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--fg-muted);transition:background 0.1s;display:flex;align-items:center;gap:6px;}
.wiki-page-item:hover{background:var(--bg-sunken);}
.wiki-page-item.active{background:var(--accent-light,#e8f0f8);color:var(--accent);font-weight:600;}
.wiki-hdr{padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg-elevated);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.wiki-hdr h2{font-size:16px;font-weight:700;margin:0;flex:1;}
.wiki-toolbar{padding:5px 12px;border-bottom:1px solid var(--border);background:var(--bg-elevated);display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.wiki-body{flex:1;overflow:hidden;display:flex;}
.wiki-editor-wrap{flex:1;overflow-y:auto;}
.ql-container{border:none!important;font-size:16px!important;font-family:var(--font-ui,Inter,sans-serif)!important;}
.ql-editor{min-height:calc(100vh - 200px);padding:24px 40px!important;color:var(--fg)!important;line-height:1.75!important;}
.ql-toolbar{display:none!important;}
.wiki-read-view{flex:1;overflow-y:auto;padding:24px 40px;max-width:800px;margin:0 auto;font-size:16px;line-height:1.75;color:var(--fg);}
.wiki-read-view h1{font-size:28px;font-weight:700;font-family:var(--font-heading,Georgia,serif);margin:20px 0 10px;}
.wiki-read-view h2{font-size:22px;font-weight:700;margin:16px 0 8px;}
.wiki-read-view p{margin:0 0 10px;}
.wiki-read-view ul,.wiki-read-view ol{padding-left:24px;margin:8px 0;}
.wiki-read-view li{margin:4px 0;}
.wiki-read-view blockquote{border-left:3px solid var(--accent);padding-left:14px;margin:10px 0;color:var(--fg-muted);font-style:italic;}
.wiki-read-view code{background:var(--bg-sunken);padding:2px 5px;border-radius:3px;font-family:monospace;}
.wiki-status{padding:4px 12px;border-top:1px solid var(--border);background:var(--bg-elevated);display:flex;gap:14px;font-size:12px;color:var(--fg-muted);flex-shrink:0;}
.wiki-tab{padding:6px 13px;border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;font-size:12.5px;white-space:nowrap;background:var(--bg-sunken);color:var(--fg-muted);transition:all .12s;}
.wiki-tab:hover{background:var(--bg);color:var(--fg);}
.wiki-tab.active{background:var(--bg-elevated);color:var(--accent);font-weight:600;}
#kb-home{flex:1;overflow-y:auto;padding:30px 40px;max-width:900px;margin:0 auto;}
#kb-home h1{font-size:30px;font-family:var(--font-heading,Georgia,serif);margin:0 0 4px;}
#kb-home .sub{color:var(--fg-muted);font-size:13.5px;margin-bottom:26px;}
.sec-card{border:1px solid var(--border);border-radius:12px;padding:18px 20px;background:var(--bg-surface);margin-bottom:14px;cursor:pointer;transition:all .15s;}
.sec-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,59,58,.08);}
.sec-card h2{margin:0 0 4px;font-size:18px;font-family:var(--font-heading,Georgia,serif);color:var(--accent);}
.sec-card .meta{font-size:12px;color:var(--fg-muted);}
.tb-btn{padding:5px 9px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:12px;background:var(--bg);color:var(--fg);font-family:inherit;transition:all 0.15s;}
.tb-btn:hover{border-color:var(--accent);color:var(--accent);}
.tb-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.backlink{display:inline-block;padding:2px 8px;background:rgba(45,106,159,0.1);border:1px solid rgba(45,106,159,0.2);border-radius:10px;font-size:11px;color:var(--accent);cursor:pointer;margin:2px;}
.backlink:hover{background:rgba(45,106,159,0.2);}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/shared/argentica.js"></script>

<!-- Import dialog -->
<div id="import-dialog" style="display:none;position:fixed;inset:0;background:rgba(20,18,14,.45);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;max-width:520px;width:92%;padding:22px 24px;box-shadow:0 18px 50px rgba(0,0,0,.25);">
    <h3 style="font-family:Georgia,serif;margin:0 0 6px;">Import a document</h3>
    <div style="font-size:12.5px;color:var(--fg-muted);margin-bottom:12px;">PDF and Word (.docx) are converted to clean Markdown (text only — <strong>images are not stored</strong>). .md and .txt import directly.</div>
    <input type="file" id="import-file" accept=".pdf,.md,.txt,.markdown,.docx,.doc,.rtf,.odt" style="width:100%;margin-bottom:10px;">
    <input type="text" id="import-section" placeholder="Section name, e.g. My Theories" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;box-sizing:border-box;">
    <label style="display:block;font-size:12.5px;margin-bottom:6px;"><input type="checkbox" id="import-split"> Split into subsection pages at each level-2 heading</label>
    <label style="display:block;font-size:12.5px;margin-bottom:14px;"><input type="checkbox" id="import-memory"> Also file this text in Memories (memory context)</label>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="tb-btn" onclick="hideImport()">Cancel</button>
      <button onclick="doImport()" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-family:Georgia,serif;">Import</button>
    </div>
    <div id="import-status" style="font-size:12px;color:var(--fg-muted);margin-top:10px;"></div>
  </div>
</div>
<div class="arg-page" data-key="knowledge" style="padding:0; max-width:none;">
<div class="wiki-shell">
<div class="wiki-tree">
  <div class="wiki-tree-hdr">
    <h3>&#x1F4D6; Knowledge Base</h3>
    <button onclick="newPage()" style="padding:3px 8px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;">+ New</button>
    <button onclick="goHome()" title="Knowledge Base home" style="padding:3px 8px;background:#fff;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:11px;color:var(--fg);">⌂</button>
    <button onclick="showImport()" style="padding:3px 8px;background:#fff;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:11px;color:var(--fg);">Import</button>
    <button onclick="backupNow()" title="Back up the Knowledge Base, memories and calendar to Google Drive" style="padding:3px 8px;background:#fff;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:11px;color:var(--fg);">Backup</button>
  </div>
  <div style="padding:6px 10px;border-bottom:1px solid var(--border);">
    <input type="text" id="wiki-search" placeholder="Search pages..." style="width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;background:var(--bg);color:var(--fg);box-sizing:border-box;" oninput="filterPages(this.value)">
  </div>
  <div class="wiki-tree-body" id="wiki-tree-body"></div>
</div>
<div class="wiki-main">
  <div class="wiki-hdr">
    <h2 id="wiki-title" contenteditable="true" onblur="saveTitle(this.textContent)" style="outline:none;cursor:text;">Untitled Page</h2>
    <div style="display:flex;gap:5px;">
      <button class="tb-btn active" id="btn-edit" onclick="setMode('edit',this)">Edit</button>
      <button class="tb-btn" id="btn-read" onclick="setMode('read',this)">Read</button>
      <button class="tb-btn" onclick="setSection()">Section…</button>
      <button class="tb-btn" onclick="exportPage()">Export</button>
      <button class="tb-btn" onclick="deletePage()" style="color:#dc2626;">Delete</button>
    </div>
  </div>
  <div id="wiki-tabs" style="display:none;border-bottom:1px solid var(--border);background:var(--bg-elevated);padding:4px 12px 0;display:flex;gap:2px;overflow-x:auto;flex-shrink:0;"></div>
  <div class="wiki-toolbar" id="wiki-toolbar">
    <select id="fmt-sel" onchange="applyFormat(this.value)" style="padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;background:var(--bg);color:var(--fg);">
      <option value="p">Paragraph</option>
      <option value="h1">Heading 1</option>
      <option value="h2">Heading 2</option>
      <option value="h3">Heading 3</option>
    </select>
    <button class="tb-btn" onclick="qcmd('bold')"><strong>B</strong></button>
    <button class="tb-btn" onclick="qcmd('italic')"><em>I</em></button>
    <button class="tb-btn" onclick="qcmd('list','bullet')">List</button>
    <button class="tb-btn" onclick="qcmd('list','ordered')">1. List</button>
    <button class="tb-btn" onclick="qcmd('blockquote',true)">Quote</button>
    <button class="tb-btn" onclick="qcmd('code-block',true)">Code</button>
    <button class="tb-btn" onclick="insertBacklink()">[[Link]]</button>
    <button class="tb-btn" onclick="aiExpand()">AI Expand</button>
  </div>
  <div class="wiki-body" id="wiki-body">
    <div class="wiki-editor-wrap" id="wiki-editor-wrap">
      <div id="wiki-quill"></div>
    </div>
  </div>
  <div class="wiki-status">
    <span id="wiki-word-count">0 words</span>
    <span id="wiki-save-status">Not saved</span>
    <span id="wiki-backlinks"></span>
  </div>
</div>
</div>
</div>
<script>

var WORKER = 'https://prism.identitypartners.uk';
var pages = [];
var currentPageId = null;
var quill = null;
var saveTimer = null;
var editMode = 'edit';

ARG.buildShell('knowledge');
document.addEventListener('DOMContentLoaded', function() {
  loadPages();
  initQuill();
});

function initQuill() {
  if (typeof Quill === 'undefined') { setTimeout(initQuill, 200); return; }
  quill = new Quill('#wiki-quill', {
    theme:'snow',
    placeholder:'Start writing... Use [[Page Name]] to link to other pages.',
    modules:{toolbar:false, history:{delay:1000,maxStack:200}}
  });
  quill.on('text-change', function() { updateWordCount(); scheduleSave(); detectBacklinks(); });
}

function qcmd(format, value) {
  if (!quill) return;
  var current = quill.getFormat();
  if (value === undefined) quill.format(format, !current[format]);
  else quill.format(format, current[format]===value ? false : value);
}

function applyFormat(tag) {
  if (!quill) return;
  if (tag==='p') quill.format('header',false);
  else quill.format('header',parseInt(tag.replace('h','')));
}

function setMode(mode, btn) {
  editMode = mode;
  document.querySelectorAll('.tb-btn[id^="btn-"]').forEach(function(b){b.classList.remove('active');});
  if (btn) btn.classList.add('active');
  var toolbar = document.getElementById('wiki-toolbar');
  var editorWrap = document.getElementById('wiki-editor-wrap');
  var existing = document.getElementById('wiki-read-view');
  if (existing) existing.remove();
  if (mode === 'edit') {
    toolbar.style.display = 'flex';
    editorWrap.style.display = 'block';
  } else {
    toolbar.style.display = 'none';
    editorWrap.style.display = 'none';
    var readDiv = document.createElement('div');
    readDiv.id = 'wiki-read-view';
    readDiv.className = 'wiki-read-view';
    readDiv.innerHTML = quill ? quill.root.innerHTML : '';
    document.getElementById('wiki-body').appendChild(readDiv);
  }
}

function loadPages() {
  fetch('/api/kb').then(function(r){return r.json();}).then(function(d){
    pages = (d.pages||[]).filter(function(p){ return p.id && p.title; });
    try { localStorage.setItem('wiki:pages', JSON.stringify(pages)); } catch(e){}
    renderTree();
    goHome();
  }).catch(function(){ document.getElementById('wiki-tree-body').innerHTML = '<div class="muted" style="padding:8px;font-size:12px;">Could not reach the Knowledge Base store.</div>'; });
}
function localSeed() {
  pages = [];
  try { localStorage.setItem('wiki:pages', '[]'); } catch(e){}
  renderTree();
  goHome();
}
function unusedLocalSeed() {
  if (false) {
    pages = [
      {id:'p-welcome',title:'Welcome',content:'<h1>Knowledge Base</h1><p>Your personal wiki. Create pages, link them with [[Page Name]], and build your knowledge graph.</p>',created:new Date().toISOString()},
      {id:'p-concepts',title:'Key Concepts',content:'<h1>Key Concepts</h1><p>Add your key sociological concepts here.</p>',created:new Date().toISOString()},
      {id:'p-thinkers',title:'Thinkers',content:'<h1>Thinkers</h1><p>Bourdieu, Goffman, Foucault, Crenshaw...</p>',created:new Date().toISOString()},
    ];
    savePages();
  }
  renderTree();
  goHome();
}

function savePages() {
  try { localStorage.setItem('wiki:pages', JSON.stringify(pages)); } catch(e){}
  pages.forEach(function(p){
    fetch('/api/kb', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(p) }).catch(function(){});
  });
}

function renderTree(filter) {
  var body = document.getElementById('wiki-tree-body');
  body.innerHTML = '';
  var filtered = filter ? pages.filter(function(p){return p.title.toLowerCase().includes(filter.toLowerCase());}) : pages;

  var groups = {};
  var order = [];
  filtered.forEach(function(p){
    var sec = (p.section || '').trim();
    if (!order.includes(sec)) { order.push(sec); groups[sec] = []; }
    groups[sec].push(p);
  });
  order.sort(function(a,b){ var un = function(s){return s?0:1;}; return un(a)-un(b) || a.localeCompare(b); });

  order.forEach(function(sec) {
    if (sec) {
      var collapsed = sessionStorage.getItem('kb:sec:'+sec) === '0';
      var hdr = document.createElement('div');
      hdr.style.cssText = 'padding:8px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;';
      var arrow = document.createElement('span');
      arrow.textContent = collapsed ? '\u25B8' : '\u25BE'; arrow.style.fontSize = '10px';
      hdr.appendChild(arrow);
      hdr.appendChild(document.createTextNode(sec));
      hdr.onclick = (function(s){ return function(){
        openSection(s);
      };})(sec);
      arrow.onclick = (function(s){ return function(ev){
        ev.stopPropagation();
        var isOpen = sessionStorage.getItem('kb:sec:'+s) !== '0';
        sessionStorage.setItem('kb:sec:'+s, isOpen ? '0' : '1');
        renderTree(filter);
      };})(sec);
      body.appendChild(hdr);
      groups[sec].sort(function(a,b){ return (a.idx||0)-(b.idx||0); });
    }
    groups[sec].forEach(function(p){ appendTreeItem(body, p); });
  });
}

function appendTreeItem(body, p) {
    var item = document.createElement('div');
    item.className = 'wiki-page-item' + (p.id===currentPageId?' active':'');
    var icon = document.createElement('span');
    icon.textContent = '\uD83D\uDCC4';
    var label = document.createElement('span');
    label.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
    label.textContent = p.title;
    item.appendChild(icon);
    item.appendChild(label);
    item.onclick = (function(pid){return function(){openPage(pid);};})(p.id);
    body.appendChild(item);
  }

function filterPages(q) { renderTree(q); }

// ── KB home: vertical section cards ──
function goHome() {
  if (currentPageId) saveCurrent();
  currentPageId = null;
  var tEl = document.getElementById('wiki-title');
  if (tEl) { tEl.style.display = 'none'; tEl.contentEditable = 'false'; }
  renderTree();
  var toolbar = document.getElementById('wiki-toolbar');
  var editorWrap = document.getElementById('wiki-editor-wrap');
  var tabsEl = document.getElementById('wiki-tabs');
  toolbar.style.display = 'none'; editorWrap.style.display = 'none'; tabsEl.style.display = 'none';
  document.querySelectorAll('#wiki-read-view,#kb-home').forEach(function(el){ el.remove(); });
  var homeDiv = document.createElement('div');
  homeDiv.id = 'kb-home';
  var secs = {}; var order = [];
  pages.forEach(function(p){
    var sec = (p.section || '').trim() || '';
    if (!order.includes(sec)) { order.push(sec); secs[sec] = []; }
    secs[sec].push(p);
  });
  order.sort(function(a,b){ var un=function(x){return x?0:1;}; return un(a)-un(b) || a.localeCompare(b); });
  var total = pages.length;
  var html = '<h1>Knowledge base</h1><div class="sub">' + (total ? (total + ' page' + (total===1?'':'s') + '. Click any section or page to begin.') : 'Empty and yours. Click New to write your first page.') + '</div>';
  order.forEach(function(sec){
    var list = secs[sec].slice().sort(function(a,b){ return (a.idx||0)-(b.idx||0); });
    var card = document.createElement('div');
    card.className = 'sec-card';
    var meta = list[0] || {title:'—', updated:''};
    if (!sec) {
      card.innerHTML = '<h2>Unfiled pages</h2><div class="meta">' + list.length + ' pages &middot; ' + list.slice(0,4).map(function(p){return '<span></span>'; }).length + ' shown in tree</div>';
      card.onclick = function(){ if (list.length) openPage(list[0].id); };
    } else {
      card.innerHTML = '<h2></h2><div class="meta"></div>';
      card.querySelector('h2').textContent = sec;
      card.querySelector('.meta').textContent = list.length + ' pages · home: ' + (meta.title || '—');
      card.onclick = (function(sv){ return function(){ openSection(sv); }; })(sec);
    }
    homeDiv._cards = homeDiv._cards || [];
    homeDiv._cards.push(card);
  });
  homeDiv.innerHTML = html;
  homeDiv._cards.forEach(function(c){ homeDiv.appendChild(c); });
  homeDiv.innerHTML = html;
  document.getElementById('wiki-body').appendChild(homeDiv);
}

function openSection(sec) {
  var list = pages.filter(function(p){ return (p.section||'').trim() === sec; })
                  .sort(function(a,b){ return (a.idx||0)-(b.idx||0); });
  if (list.length) openPage(list[0].id);
}

function openPageById(id) { if (id) openPage(id); }

// ── horizontal subsection tabs inside a section ──
function renderTabs() {
  var tabsEl = document.getElementById('wiki-tabs');
  var cur = pages.find(function(p){ return p.id === currentPageId; });
  document.querySelectorAll('#kb-home').forEach(function(el){ el.remove(); });
  if (!cur || !cur.section) { tabsEl.style.display = 'none'; tabsEl.innerHTML = ''; return; }
  var list = pages.filter(function(p){ return (p.section||'').trim() === cur.section.trim(); })
                  .sort(function(a,b){ return (a.idx||0)-(b.idx||0); });
  tabsEl.innerHTML = '<div style="align-self:center;font-size:11px;color:var(--fg-muted);padding:0 8px 0 2px;">' + cur.section + '</div>' + list.map(function(p){
    return '<div class="wiki-tab' + (p.id===currentPageId?' active':'') + '" data-pid="' + p.id + '">' + (p.title || 'Untitled') + '</div>';
  }).join('');
  tabsEl.style.display = 'flex';
  tabsEl.querySelectorAll('.wiki-tab').forEach(function(t){
    t.onclick = function(){ openPage(t.dataset.pid); };
  });
}

// ── Section tagging for the current page ──
function setSection() {
  if (!currentPageId) return;
  var page = pages.find(function(p){return p.id===currentPageId;});
  if (!page) return;
  var s = prompt('Section for this page (leave blank to un-file):', page.section || '');
  if (s === null) return;
  page.section = s.trim(); savePages(); renderTree();
}

// ── Import ──
function showImport() {
  var d = document.getElementById('import-dialog');
  d.style.display = 'flex';
  var cur = pages.find(function(p){return p.id===currentPageId;});
  document.getElementById('import-section').value = (cur && cur.section) || '';
  document.getElementById('import-status').textContent = '';
  if (typeof pdfjsLib !== 'undefined') pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
function hideImport() { document.getElementById('import-dialog').style.display = 'none'; }

function mdToHtml(md) {
  var esc = function(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  var lines = md.split(/\r?\n/), out = [], para = [], listMode = null;
  function endList(){ if (listMode) { out.push('</'+listMode+'>'); listMode = null; } }
  function inlineFmt(t) {
    t = esc(t);
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    return t;
  }
  function flush(){ if (para.length) { out.push('<p>'+inlineFmt(para.join(' '))+'</p>'); para=[]; } }
  for (var i=0; i<lines.length; i++) {
    var line = lines[i];
    var h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flush(); endList(); out.push('<h'+h[1].length+'>'+esc(h[2])+'</h'+h[1].length+'>'); continue; }
    if (/^\s*[-*+]\s+/.test(line)) { flush(); if (listMode!=='ul'){ endList(); out.push('<ul>'); listMode='ul'; } out.push('<li>'+esc(line.replace(/^\s*[-*+]\s+/,''))+'</li>'); continue; }
    if (/^\s*\d+\.\s+/.test(line)) { flush(); if (listMode!=='ol'){ endList(); out.push('<ol>'); listMode='ol'; } out.push('<li>'+esc(line.replace(/^\s*\d+\.\s+/,''))+'</li>'); continue; }
    if (/^>\s?/.test(line)) { flush(); endList(); out.push('<blockquote>'+esc(line.replace(/^>\s?/,''))+'</blockquote>'); continue; }
    if (!line.trim()) { flush(); endList(); continue; }
    para.push(line.trim());
  }
  flush(); endList();
  return out.join('\n');
}

async function extractPdfMarkdown(file) {
  var buf = await file.arrayBuffer();
  var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  var out = [], sizeSum = 0, len = 0;
  for (var i = 1; i <= pdf.numPages; i++) {
    var page = await pdf.getPage(i);
    var tc = await page.getTextContent();
    var maxH = 0;
    tc.items.forEach(function(it){ if (it.transform) maxH = Math.max(maxH, Math.abs(it.transform[3])); });
    sizeSum += maxH; len++;
    var lastY = null, line = '';
    var lines = [];
    tc.items.forEach(function(it){
      var y = Math.round(it.transform[5]);
      if (lastY !== null && Math.abs(y - lastY) > 3) { lines.push({y:lastY, t:line}); line = ''; }
      line += it.str + (it.hasEOL ? '\n' : '');
      lastY = y;
    });
    if (line.trim()) lines.push({y:lastY, t:line});
    var bodyFont = Math.round(sizeSum/len);
    lines.forEach(function(ln){
      var t = ln.t.replace(/\s+/g,' ').trim();
      if (!t) return;
      out.push(t);
    });
    out.push('');
  }
  // Heuristic: a short line in Title Case without terminal punctuation → heading
  var md = out.map(function(t){
    if (!t) return '';
    if (t.length < 70 && !/[.,;:]$/.test(t) && /^[A-Z0-9]/.test(t) && t.split(' ').length <= 9) {
      if (t === t.toUpperCase() && t.length < 50) return '## ' + t;
    }
    return t;
  }).join('\n');
  return md;
}

// ── .docx reader: unzip in-browser (PK local header scan + deflate-raw) ──
async function extractDocxText(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  // find local file header for word/document.xml by scanning for the filename
  const nameBytes = new TextEncoder().encode('word/document.xml');
  let dataStart = -1, compSize = 0, method = 0;
  for (let i = 0; i < buf.length - 4; i++) {
    if (buf[i] === 0x50 && buf[i+1] === 0x4b && buf[i+2] === 0x03 && buf[i+3] === 0x04) {
      const fnLen = (buf[i+26] | (buf[i+27] << 8));
      const exLen = (buf[i+28] | (buf[i+29] << 8));
      const fn = String.fromCharCode.apply(null, buf.slice(i + 30, i + 30 + fnLen));
      if (fn === 'word/document.xml') {
        method = (buf[i+8] | (buf[i+9] << 8));
        compSize = (buf[i+18] | (buf[i+19] << 8) | (buf[i+20] << 16) | (buf[i+21] << 24));
        dataStart = i + 30 + fnLen + exLen;
        if (compSize > 0) break;
      }
    }
  }
  if (dataStart < 0) throw new Error('Not a valid .docx (no document body found)');
  const chunk = buf.slice(dataStart, compSize > 0 ? dataStart + compSize : buf.length);
  let xmlBytes;
  if (method === 0) {
    xmlBytes = chunk;
  } else if (typeof DecompressionStream === 'function') {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([chunk]).stream().pipeThrough(ds);
    xmlBytes = new Uint8Array(await new Response(stream).arrayBuffer());
  } else {
    throw new Error('This browser cannot unzip .docx — use Chrome or Edge, or export as PDF');
  }
  let xml = new TextDecoder('utf-8').decode(xmlBytes);
  // paragraphs and breaks; headings via w:pStyle
  const parts = [];
  const paras = xml.match(/<w:p [^>]*>[\s\S]*?<\/w:p>|<w:p>[\s\S]*?<\/w:p>/g) || [];
  paras.forEach(pxml => {
    const style = (pxml.match(/<w:pStyle w:val="([^"]+)"/) || [])[1] || '';
    const text = (pxml.match(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g) || [])
      .map(t => t.replace(/<[^>]+>/g, '')
        .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'"))
      .join('');
    if (!text.trim()) return;
    if (/^Heading1$|^heading 1$|^Titre$/i.test(style)) parts.push('# ' + text.trim());
    else if (/Heading2/i.test(style)) parts.push('## ' + text.trim());
    else if (/Heading3/i.test(style)) parts.push('### ' + text.trim());
    else parts.push(text.trim());
  });
  return parts.join(String.fromCharCode(10) + String.fromCharCode(10));
}

async function doImport() {
  var st = document.getElementById('import-status');
  var file = document.getElementById('import-file').files[0];
  if (!file) { st.textContent = 'Choose a file first.'; return; }
  var section = document.getElementById('import-section').value.trim();
  var split = document.getElementById('import-split').checked;
  var toMemory = document.getElementById('import-memory').checked;
  st.textContent = 'Extracting text…';
  try {
    var isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    var isDocx = /\.docx$/i.test(file.name) || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    var md = isPdf ? await extractPdfMarkdown(file) : isDocx ? await extractDocxText(file) : await file.text();
    if (!md.trim()) { st.innerHTML = 'No selectable text found — this file looks like scanned images or a legacy .doc. Export it as .docx or PDF, or screenshot the pages to Memories (OCR).'; return; }
    var baseName = file.name.replace(/\.[^.]+$/, '');
    if (split) {
      // split at ## headings; pre-split intro becomes the parent page
      var parts = md.split(/^##\s+/m);
      var intro = parts[0].trim();
      var chunks = parts.slice(1).map(function(seg){
        var nl = seg.indexOf('\n');
        return (nl < 0) ? { title: seg.trim(), body: '' } : { title: seg.slice(0, nl).trim(), body: seg.slice(nl+1).trim() };
      }).filter(function(c){ return c.title; });
      if (!chunks.length) { document.getElementById('import-split').checked = false; return doImport(); }
      var parent = { id:'p-'+Date.now(), title: baseName, section: section, idx: 0, source: file.name, format:'md',
        content: mdToHtml(intro) + '<p>Subsections:</p><ul>' + chunks.map(function(c){ return '<li>[[ '+c.title+' ]]</li>'; }).join('') + '</ul>', created:new Date().toISOString() };
      pages.push(parent);
      chunks.forEach(function(c, i){
        pages.push({ id:'p-'+Date.now()+'-'+i, title: c.title, section: section, idx: i+1, source: file.name, format:'md',
          content: mdToHtml(c.body), created:new Date().toISOString() });
      });
      st.textContent = 'Imported as "' + baseName + '" + ' + chunks.length + ' subsection pages.';
    } else {
      var page = { id:'p-'+Date.now(), title: baseName, section: section, idx: pages.filter(function(p){return p.section===section;}).length, source: file.name, format: isPdf?'md':'txt',
        content: mdToHtml(md), created:new Date().toISOString() };
      pages.push(page);
      st.textContent = 'Imported as "' + baseName + '".';
    }
    savePages();
    if (toMemory) {
      fetch('/api/memory', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ content: '[Document: '+file.name+']\n'+md.slice(0,60000), category:'document', source:file.name }) }).catch(function(){});
    }
    renderTree();
    hideImport();
    ARG.toast('Imported "' + file.name + '"' + (isPdf ? ' — images were not stored, text only.' : ''));
  } catch (e) {
    st.textContent = 'Import failed: ' + (e.message || e);
  }
}

function openPage(id) {
  if (currentPageId) saveCurrent();
  currentPageId = id;
  var page = pages.find(function(p){return p.id===id;});
  if (!page) return;
  var toolbar = document.getElementById('wiki-toolbar');
  var editorWrap = document.getElementById('wiki-editor-wrap');
  toolbar.style.display = 'flex'; editorWrap.style.display = 'block';
  var tEl2 = document.getElementById('wiki-title');
  tEl2.textContent = page.title; tEl2.contentEditable = 'true'; tEl2.style.cursor = 'text'; tEl2.style.display = '';
  if (quill) { quill.root.innerHTML = page.content || ''; updateWordCount(); }
  document.querySelectorAll('#kb-home').forEach(function(el){ el.remove(); });
  renderTree();
  renderTabs();
  updateBacklinks();
  setMode('edit', document.getElementById('btn-edit'));
}

function saveCurrent() {
  if (!currentPageId || !quill) return;
  var page = pages.find(function(p){return p.id===currentPageId;});
  if (!page) return;
  page.content = quill.root.innerHTML;
  page.updated = new Date().toISOString();
  savePages();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  document.getElementById('wiki-save-status').textContent = 'Unsaved';
  saveTimer = setTimeout(function(){saveCurrent();document.getElementById('wiki-save-status').textContent='Saved';}, 1500);
}

function saveTitle(title) {
  if (!currentPageId) return;
  var page = pages.find(function(p){return p.id===currentPageId;});
  if (!page) return;
  page.title = title.trim() || 'Untitled';
  savePages();
  renderTree();
}

function newPage() {
  saveCurrent();
  var cur = pages.find(function(p){return p.id===currentPageId;});
  var page = {id:'p-'+Date.now(), title:'New Page', content:'<h1>New Page</h1><p>Start writing...</p>', section:(cur&&cur.section)||'', created:new Date().toISOString()};
  pages.push(page);
  savePages();
  renderTree();
  openPage(page.id);
  setTimeout(function(){document.getElementById('wiki-title').focus();document.execCommand('selectAll');},100);
}

function deletePage() {
  if (!currentPageId || !confirm('Delete this page?')) return;
  pages = pages.filter(function(p){return p.id!==currentPageId;});
  savePages();
  currentPageId = null;
  renderTree();
  if (pages.length > 0) openPage(pages[0].id);
  else { document.getElementById('wiki-title').textContent = 'No pages'; if (quill) quill.root.innerHTML = ''; }
}

function updateWordCount() {
  if (!quill) return;
  var text = quill.getText() || '';
  var words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('wiki-word-count').textContent = words + ' words';
}

function detectBacklinks() {
  if (!quill) return;
  var text = quill.getText();
  var matches = text.match(/\[\[([^\]]+)\]\]/g);
  if (matches) {
    var linked = matches.map(function(m){return m.slice(2,-2);});
    // Auto-create stub pages for [[links]] that don't exist yet (wiki behaviour)
    var created = 0;
    linked.forEach(function(name){
      var n = name.trim();
      if (!n) return;
      if (!pages.some(function(p){return p.title.toLowerCase()===n.toLowerCase();})) {
        var cur = pages.find(function(p){return p.id===currentPageId;});
        pages.push({id:'p-'+Date.now()+'-'+(created++), title:n, section:(cur&&cur.section)||'',
          content:'<p>Stub page — created automatically because another page links to it via [[' + n + ']].</p>', created:new Date().toISOString()});
        created++;
      }
    });
    if (created) { renderTree(); }
    document.getElementById('wiki-backlinks').textContent = 'Links: ' + linked.join(', ');
  }
}

function backupNow() {
  if (!confirm('Back up the Knowledge Base, Memories and Calendar to Google Drive now?')) return;
  ARG.toast('Backing up to Google Drive…');
  fetch('/api/kb/backup', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (d.success) ARG.toast('Backup saved to Drive: ' + (d.fileName||'') + ' (' + (d.pages||0) + ' KB pages, ' + (d.memories||0) + ' memories).');
    else ARG.toast('Backup failed: ' + (d.error || 'unknown error') + (d.error === 'Google not connected' ? ' — reconnect Google first.' : ''));
  })
  .catch(function(e){ ARG.toast('Backup failed: ' + e.message); });
}

function updateBacklinks() {
  if (!currentPageId) return;
  var currentPage = pages.find(function(p){return p.id===currentPageId;});
  if (!currentPage) return;
  var t = currentPage.title ? currentPage.title.toLowerCase() : null;
  var backlinks = pages.filter(function(p) {
    if (p.id === currentPageId) return false;
    var c = p.content || '';
    if (c.includes('[['+currentPage.title+']]')) return true;
    if (t && t.length > 3 && c.toLowerCase().indexOf(t) >= 0) return true; // plain title mention = automatic backlink
    return false;
  });
  if (backlinks.length > 0) {
    var bl = document.getElementById('wiki-backlinks');
    bl.innerHTML = 'Linked from: ';
    backlinks.forEach(function(p) {
      var span = document.createElement('span');
      span.className = 'backlink';
      span.textContent = p.title;
      span.onclick = (function(pid){return function(){openPage(pid);};})(p.id);
      bl.appendChild(span);
    });
  }
}

function insertBacklink() {
  var pageName = prompt('Link to page:');
  if (!pageName || !quill) return;
  var range = quill.getSelection(true);
  quill.insertText(range.index, '[['+pageName+']]');
}

function aiExpand() {
  if (!quill) return;
  var text = quill.getText().substring(0, 1000);
  if (!text.trim()) return;
  fetch(WORKER+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:'You are a knowledge base assistant. Expand and enrich this wiki page. Add relevant details, examples, and connections. British English. Return only expanded content in HTML.'},{role:'user',content:text}],profile:'balanced'})})
  .then(function(r){return r.json();})
  .then(function(d){
    if (d.content && quill) {
      var range = quill.getSelection(true);
      quill.clipboard.dangerouslyPasteHTML(range.index, '<p>' + d.content + '</p>');
      scheduleSave();
    }
  });
}

function exportPage() {
  if (!quill) return;
  var page = pages.find(function(p){return p.id===currentPageId;});
  var title = page ? page.title : 'page';
  var html = quill.root.innerHTML;
  var md = html.replace(/<h1[^>]*>(.*?)<\/h1>/gi,'# $1\n\n').replace(/<h2[^>]*>(.*?)<\/h2>/gi,'## $1\n\n').replace(/<h3[^>]*>(.*?)<\/h3>/gi,'### $1\n\n').replace(/<strong[^>]*>(.*?)<\/strong>/gi,'**$1**').replace(/<em[^>]*>(.*?)<\/em>/gi,'*$1*').replace(/<li[^>]*>(.*?)<\/li>/gi,'- $1\n').replace(/<p[^>]*>(.*?)<\/p>/gi,'$1\n\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ');
  var blob = new Blob([md],{type:'text/markdown'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = title + '.md';
  a.click();
}
