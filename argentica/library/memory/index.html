<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argentica — Memory</title>
<link rel="stylesheet" href="/shared/argentica.css">
<style>
  .mem { border: 1px solid rgba(15,59,58,.18); border-radius: 8px; padding: 12px 14px; background: #fff; margin-bottom: 10px; }
  .mem .content { font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; }
  .tag { display: inline-block; font-size: 11px; background: rgba(15,59,58,.08); border-radius: 10px; padding: 1px 8px; margin-right: 4px; }
</style>
</head>
<body>
<div class="arg-page" data-key="memory">
  <div class="arg-pagehead">
    <h1>Memory</h1>
    <div class="sub">What the system remembers about you, your work and your preferences — searchable, editable, yours.</div>
  </div>

  <div class="grid two">
    <div>
      <div class="card" style="padding:10px 14px;">
        <input type="text" id="mem-search" placeholder="Search memories…" style="width:100%;" oninput="render()">
      </div>
      <div id="memory-list" class="mt"><div class="muted">Loading…</div></div>
    </div>

    <div class="card">
      <h3>Add memory</h3>
      <textarea id="mem-content" rows="5" style="width:100%;" placeholder="What should Argentica remember?"></textarea>
      <input type="text" id="mem-tags" placeholder="Tags, comma-separated — e.g. research, preference" style="width:100%; margin-top:8px;">
      <button class="mt" id="mem-save">Save memory</button>
      <div class="muted mt" id="mem-status" style="font-size:12px;"></div>
    </div>
  </div>
</div>

<script src="/shared/argentica.js"></script>
<script>
ARG.buildShell('memory');
const { api, esc } = ARG;
let memories = [];

async function load() {
  try {
    const d = await api('/memory');
    memories = d.memories || [];
    render();
  } catch (e) { document.getElementById('memory-list').innerHTML = '<div class="muted">Could not load: ' + esc(e.message) + '</div>'; }
}

function render() {
  const q = (document.getElementById('mem-search').value || '').toLowerCase();
  const list = memories.filter(m => !q || (m.content || '').toLowerCase().includes(q) || (m.category || '').toLowerCase().includes(q));
  document.getElementById('memory-list').innerHTML = list.map(m =>
    '<div class="mem">' +
    '<div class="spread"><span class="tag">' + esc(m.category || 'general') + '</span>' +
    '<span class="muted" style="font-size:11px;">' + new Date(m.created).toLocaleDateString('en-GB') + '</span></div>' +
    '<div class="content mt">' + esc(m.content) + '</div>' +
    '<button class="ghost small mt" onclick="delMem(\'' + esc(m.id) + '\')">Forget</button>' +
    '</div>').join('') || '<div class="muted">Nothing remembered yet.</div>';
}

document.getElementById('mem-save').addEventListener('click', async () => {
  const content = document.getElementById('mem-content').value.trim();
  const tags = document.getElementById('mem-tags').value.trim();
  const st = document.getElementById('mem-status');
  if (!content) { st.textContent = 'Write something to remember.'; return; }
  try {
    await api('/memory', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, category: tags.split(',').map(t => t.trim()).filter(Boolean)[0] || 'general', tags }) });
    document.getElementById('mem-content').value = ''; document.getElementById('mem-tags').value = '';
    st.textContent = 'Remembered.';
    load();
  } catch (e) { st.textContent = 'Failed: ' + e.message; }
});

window.delMem = async id => {
  try { await api('/memory/' + encodeURIComponent(id), { method: 'DELETE' }); load(); } catch (e) { ARG.toast(e.message); }
};

load();
</script>
</body>
</html>
