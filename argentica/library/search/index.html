<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argentica — Search the library</title>
<link rel="stylesheet" href="/shared/argentica.css">
</head>
<body>
<div class="arg-page" data-key="library-search">
  <div class="arg-pagehead">
    <h1>Search</h1>
    <div class="sub">One term across everything you own — notes, readings, references — then the literature beneath it.</div>
  </div>

  <div class="card">
    <div class="row">
      <input type="text" id="q" placeholder="e.g. Goffman, stigma, zemiological harm…">
      <button id="run">Search</button>
    </div>
  </div>

  <div class="mt" id="results"></div>
</div>

<script src="/shared/argentica.js"></script>
<script>
ARG.buildShell('library-search');
const { api, esc } = ARG;

document.getElementById('run').addEventListener('click', async () => {
  const q = document.getElementById('q').value.trim();
  const out = document.getElementById('results');
  if (!q) return;
  out.innerHTML = '<div class="card"><div class="muted">Searching your notes and readings…</div></div>';

  const mine = [];
  const ql = q.toLowerCase();
  try {
    const data = await api('/documents');
    (data.documents || []).forEach(d => {
      if ((d.title || '').toLowerCase().includes(ql) || (d.tags || []).some(t => t.toLowerCase().includes(ql)))
        mine.push({ title: d.title, url: '/argentica/viewer/?doc=' + encodeURIComponent(d.id), snippet: 'In your library · ' + (d.moduleSource || '') + ' · ' + d.type });
    });
  } catch (e) {}
  try {
    const sem = await api('/study/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: q, limit: 10 }) });
    (sem.results || []).forEach(r => { if (!mine.some(m => m.title === r.title)) mine.push({ title: r.title || 'Indexed passage', url: r.url || '#', snippet: String(r.content || r.snippet || '').slice(0, 160) }); });
  } catch (e) {}

  let litHtml = '';
  try {
    const lit = await api('/research/scholarly', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: q, sources: ['semantic_scholar', 'openalex', 'crossref'] }) });
    const all = [];
    const r = lit.results || lit.sources || [];
    (Array.isArray(r) ? r : Object.values(r)).forEach(s => (s.items || []).forEach(i => all.push(i)));
    if (all.length) {
      const seen = new Set();
      litHtml = '<div class="card mt"><h3>The literature</h3><div class="item-list">' +
        all.filter(x => { const k = (x.url || x.title || '').replace(/[#?].*$/, ''); if (seen.has(k)) return false; seen.add(k); return true; })
           .slice(0, 10).map(x => '<div class="item"><div><a href="' + esc(x.url || '#') + '" target="_blank" rel="noopener">' + esc(x.title) + '</a> <span class="badge teal">' + esc(x.source) + '</span><div class="muted">' + esc([x.authors, x.year].filter(Boolean).join(', ')) + '</div></div></div>').join('') + '</div></div>';
    }
  } catch (e) {}

  out.innerHTML = '<div class="card"><h3>Your notes and readings</h3>' +
    (mine.length ? '<div class="item-list">' + mine.slice(0, 12).map(m =>
      '<div class="item"><div><a href="' + esc(m.url) + '">' + esc(m.title) + '</a><div class="muted">' + esc(m.snippet) + '</div></div></div>').join('') + '</div>'
      : '<div class="muted">Nothing of yours mentions "' + esc(q) + '" yet.</div>') + '</div>' + litHtml;
});
</script>
</body>
</html>
