<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argentica — Viewer</title>
<link rel="stylesheet" href="/shared/argentica.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="arg-page" data-key="study">
  <div class="arg-pagehead spread">
    <div>
      <h1 id="doc-title" style="font-size:20px;">Document</h1>
      <div class="sub" id="doc-sub"></div>
    </div>
    <div class="row" style="flex-wrap:wrap;">
      <button class="ghost small" id="zoom-out">−</button>
      <button class="ghost small" id="zoom-in">+</button>
      <button class="ghost small" id="tool-pen">Pen</button>
      <button class="ghost small" id="tool-hl">Highlighter</button>
      <button class="ghost small" id="tool-erase">Eraser</button>
      <button class="small" id="save">Save annotations</button>
      <button class="ghost small" id="ask">Ask Gerald</button>
      <button class="ghost small" onclick="location.href='/argentica/study/'">Close</button>
    </div>
  </div>

  <div class="viewer-stage" id="stage">
    <canvas id="pdf-canvas"></canvas>
    <canvas id="ink-canvas" style="position:absolute; left:0; top:0;"></canvas>
  </div>
  <div class="muted mt" id="viewer-status"></div>
</div>

<script src="/shared/argentica.js"></script>
<script>
ARG.buildShell('study');
const { api, esc } = ARG;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params = new URLSearchParams(location.search);
const docId = params.get('doc');
let doc = null, pdf = null, pageNum = 1, scale = 1.3;
let tool = 'pen', drawing = false, strokes = [];
const pdfCanvas = document.getElementById('pdf-canvas');
const inkCanvas = document.getElementById('ink-canvas');
const ctx = inkCanvas.getContext('2d');
const status = document.getElementById('viewer-status');

function redrawInk() {
  ctx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
  for (const s of strokes) {
    if (s.page !== pageNum) continue;
    ctx.strokeStyle = s.tool === 'hl' ? 'rgba(240, 200, 80, 0.4)' : '#0f3b3a';
    ctx.lineWidth = s.tool === 'hl' ? 14 : 2.2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    s.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
  }
}

function resizeInk() {
  const r = pdfCanvas.getBoundingClientRect();
  inkCanvas.width = r.width; inkCanvas.height = r.height;
  inkCanvas.style.width = r.width + 'px'; inkCanvas.style.height = r.height + 'px';
  redrawInk();
}

async function renderPage() {
  if (!pdf) return;
  const page = await pdf.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  pdfCanvas.width = viewport.width; pdfCanvas.height = viewport.height;
  await page.render({ canvasContext: pdfCanvas.getContext('2d'), viewport }).promise;
  resizeInk();
  status.textContent = 'Page ' + pageNum + ' of ' + pdf.numPages + '. Annotations save against this document; they reload with it.';
}

inkCanvas.addEventListener('pointerdown', e => {
  if (!pdf) return;
  drawing = true;
  inkCanvas.setPointerCapture(e.pointerId);
  const r = inkCanvas.getBoundingClientRect();
  const p = { x: e.clientX - r.left, y: e.clientY - r.top };
  let stroke = { page: pageNum, tool, pts: [p] };
  strokes.push(stroke);
  const move = ev => {
    const rr = inkCanvas.getBoundingClientRect();
    stroke.pts.push({ x: ev.clientX - rr.left, y: ev.clientY - rr.top });
    redrawInk();
  };
  const up = () => { drawing = false; inkCanvas.removeEventListener('pointermove', move); inkCanvas.removeEventListener('pointerup', up); };
  inkCanvas.addEventListener('pointermove', move);
  inkCanvas.addEventListener('pointerup', up);
});

document.getElementById('tool-pen').addEventListener('click', () => tool = 'pen');
document.getElementById('tool-hl').addEventListener('click', () => tool = 'hl');
document.getElementById('tool-erase').addEventListener('click', () => {
  const r = inkCanvas.getBoundingClientRect();
  // remove strokes near the last pointer position
  inkCanvas.addEventListener('pointerdown', function eraseOnce(ev) {
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    strokes = strokes.filter(s => !(s.page === pageNum && s.pts.some(p => Math.hypot(p.x - x, p.y - y) < 24)));
    redrawInk();
    inkCanvas.removeEventListener('pointerdown', eraseOnce);
  }, { once: false });
  tool = 'erase';
  ARG.toast('Tap a stroke to erase it.');
});
document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(3, scale + 0.2); renderPage(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.6, scale - 0.2); renderPage(); });

document.getElementById('save').addEventListener('click', async () => {
  if (!docId) { ARG.toast('Nothing to save against.'); return; }
  try {
    await api('/documents/' + encodeURIComponent(docId), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ annotations: strokes })
    });
    ARG.toast('Annotations saved.');
  } catch (e) { ARG.toast('Could not save annotations: ' + e.message); }
});

document.getElementById('ask').addEventListener('click', () => {
  sessionStorage.setItem('arg:pending-prompt', 'Regarding "' + (doc ? doc.title : 'this document') + '" — what are its central claims and how do they bear on my work?');
  location.href = '/argentica/chat/';
});

(async function init() {
  if (!docId) { status.textContent = 'No document specified.'; return; }
  try {
    const data = await api('/documents/' + encodeURIComponent(docId));
    doc = data.document;
    document.getElementById('doc-title').textContent = doc.title;
    document.getElementById('doc-sub').textContent = (doc.annotations || []).length + ' saved annotations';
    if (doc.annotations && doc.annotations.length) strokes = doc.annotations;
    const url = doc.content || '';
    if (url.includes('r2.dev')) {
      pdf = await pdfjsLib.getDocument(url).promise;
      renderPage();
    } else if (url) {
      status.innerHTML = 'This file is not a PDF — <a href="' + esc(url) + '" target="_blank" rel="noopener">open it directly</a>.';
    } else {
      status.textContent = 'No file attached to this record.';
    }
  } catch (e) {
    status.textContent = 'Could not open the document: ' + e.message;
  }
})();
</script>
</body>
</html>
