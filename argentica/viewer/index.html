<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argentica — Viewer</title>
<link rel="stylesheet" href="/shared/argentica.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  .viewer-stage { background: #3d3a34; border-radius: 8px; overflow: auto; max-height: calc(100vh - 260px); padding: 16px; position: relative; }
  .page-holder { position: relative; margin: 0 auto; width: fit-content; background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,0.4); }
  .page-holder canvas { display: block; }
  #ink-canvas { position: absolute; inset: 0; touch-action: none; }
</style>
</head>
<body>
<div class="arg-page" data-key="library">
  <div class="arg-pagehead spread">
    <div>
      <h1 id="doc-title" style="font-size:20px;">Document</h1>
      <div class="sub" id="doc-sub"></div>
    </div>
    <div class="row" style="flex-wrap:wrap;">
      <button class="ghost small" id="prev-page">← Prev</button>
      <span class="badge teal" id="page-ind">1 / 1</span>
      <button class="ghost small" id="next-page">Next →</button>
      <button class="ghost small" id="zoom-out">−</button>
      <button class="ghost small" id="zoom-in">+</button>
      <button class="ghost small" id="tool-pen">Pen</button>
      <button class="ghost small" id="tool-hl">Highlighter</button>
      <button class="ghost small" id="tool-erase">Eraser</button>
      <button class="ghost small" id="save">Save ink layer</button>
      <button class="small" id="archive">Flatten &amp; archive</button>
      <button class="ghost small" id="ask">Ask Gerald</button>
      <button class="ghost small" onclick="location.href='/argentica/library/'">Close</button>
    </div>
  </div>

  <div class="viewer-stage" id="stage">
    <div class="page-holder" id="page-holder">
      <canvas id="pdf-canvas"></canvas>
      <canvas id="ink-canvas"></canvas>
    </div>
  </div>
  <div class="muted mt" id="viewer-status"></div>
  <div class="mt" id="archive-result"></div>
</div>

<script src="/shared/argentica.js"></script>
<script>
ARG.buildShell('library');
const { api, esc } = ARG;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params = new URLSearchParams(location.search);
const docId = params.get('doc');
let doc = null, pdf = null, pdfBytes = null, pageNum = 1, scale = 1.3;
let tool = 'pen', strokes = [];
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

const holder = document.getElementById('page-holder');
const pdfCanvas = document.getElementById('pdf-canvas');
const inkCanvas = document.getElementById('ink-canvas');
const ctx = inkCanvas.getContext('2d');
const status = document.getElementById('viewer-status');

// Strokes are stored in PDF-normalised coordinates (0..1 of page size) so they
// render uniformly at any zoom, on any device, and flatten exactly.
function normPts(pts) {
  return pts.map(p => ({ x: p.x / inkCanvas.clientWidth, y: p.y / inkCanvas.clientHeight }));
}
function denorm(pts) {
  return pts.map(p => ({ x: p.x * inkCanvas.clientWidth, y: p.y * inkCanvas.clientHeight }));
}

function redrawInk() {
  ctx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
  for (const s of strokes) {
    if (s.page !== pageNum) continue;
    const pts = denorm(s.pts);
    ctx.strokeStyle = s.tool === 'hl' ? 'rgba(240, 200, 80, 0.4)' : '#0f3b3a';
    ctx.lineWidth = (s.tool === 'hl' ? 16 : 2.4) * DPR;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
  }
}

async function renderPage() {
  if (!pdf) return;
  const page = await pdf.getPage(pageNum);
  const viewport = page.getViewport({ scale: scale * DPR });
  pdfCanvas.width = Math.floor(viewport.width);
  pdfCanvas.height = Math.floor(viewport.height);
  pdfCanvas.style.width = Math.floor(viewport.width / DPR) + 'px';
  pdfCanvas.style.height = Math.floor(viewport.height / DPR) + 'px';
  inkCanvas.width = pdfCanvas.width;
  inkCanvas.height = pdfCanvas.height;
  inkCanvas.style.width = pdfCanvas.style.width;
  inkCanvas.style.height = pdfCanvas.style.height;
  await page.render({ canvasContext: pdfCanvas.getContext('2d'), viewport, transform: [DPR, 0, 0, DPR, 0, 0] }).promise;
  redrawInk();
  document.getElementById('page-ind').textContent = pageNum + ' / ' + pdf.numPages;
  status.textContent = 'Page ' + pageNum + ' of ' + pdf.numPages + '. Ink saves with the document; Flatten & archive burns it into the PDF and files it to Drive.';
  document.getElementById('prev-page').disabled = pageNum <= 1;
  document.getElementById('next-page').disabled = pageNum >= pdf.numPages;
}

// ── Ink: pointer events with capture, normalised storage ──
inkCanvas.addEventListener('pointerdown', e => {
  if (!pdf) return;
  e.preventDefault();
  inkCanvas.setPointerCapture(e.pointerId);
  const r = inkCanvas.getBoundingClientRect();
  let last = { x: e.clientX - r.left, y: e.clientY - r.top };
  const stroke = { page: pageNum, tool, pts: normPts([last]) };
  // live-draw incrementally for uniform strokes
  const drawSeg = (p) => {
    ctx.strokeStyle = tool === 'hl' ? 'rgba(240, 200, 80, 0.4)' : '#0f3b3a';
    ctx.lineWidth = (tool === 'hl' ? 16 : 2.4) * DPR;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
    stroke.pts.push(normPts([p])[0]);
  };
  const move = ev => {
    const rr = inkCanvas.getBoundingClientRect();
    drawSeg({ x: ev.clientX - rr.left, y: ev.clientY - rr.top });
  };
  const up = () => {
    inkCanvas.removeEventListener('pointermove', move);
    inkCanvas.removeEventListener('pointerup', up);
    inkCanvas.removeEventListener('pointercancel', up);
    if (stroke.pts.length < 2) strokes.pop();
  };
  strokes.push(stroke);
  inkCanvas.addEventListener('pointermove', move);
  inkCanvas.addEventListener('pointerup', up);
  inkCanvas.addEventListener('pointercancel', up);
});

document.getElementById('tool-pen').addEventListener('click', () => tool = 'pen');
document.getElementById('tool-hl').addEventListener('click', () => tool = 'hl');
document.getElementById('tool-erase').addEventListener('click', () => {
  tool = 'erase';
  ARG.toast('Tap a stroke to erase it.');
  inkCanvas.addEventListener('pointerdown', function eraseOnce(ev) {
    const r = inkCanvas.getBoundingClientRect();
    const p = { x: ev.clientX - r.left, y: ev.clientY - r.top };
    const np = normPts([p])[0];
    strokes = strokes.filter(s => !(s.page === pageNum && denorm(s.pts).some(q => Math.hypot(q.x - p.x, q.y - p.y) < 28)));
    redrawInk();
  }, { once: true });
});
document.getElementById('prev-page').addEventListener('click', () => { if (pageNum > 1) { pageNum--; renderPage(); } });
document.getElementById('next-page').addEventListener('click', () => { if (pdf && pageNum < pdf.numPages) { pageNum++; renderPage(); } });
document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(3, scale + 0.25); renderPage(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.6, scale - 0.25); renderPage(); });

document.getElementById('save').addEventListener('click', async () => {
  if (!docId) { ARG.toast('Nothing to save against.'); return; }
  try {
    await api('/documents/' + encodeURIComponent(docId), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ annotations: strokes })
    });
    ARG.toast('Ink layer saved.');
  } catch (e) { ARG.toast('Could not save annotations: ' + e.message); }
});

// Flatten ink into the PDF itself, archive to R2 + Drive
document.getElementById('archive').addEventListener('click', async () => {
  const btn = document.getElementById('archive');
  const out = document.getElementById('archive-result');
  if (!pdfBytes) { ARG.toast('Only PDFs can be flattened.'); return; }
  if (!strokes.length) { ARG.toast('Nothing drawn yet.'); return; }
  btn.disabled = true;
  out.innerHTML = '<div class="muted">Burning ink into the PDF and archiving…</div>';
  try {
    const { PDFDocument, rgb } = PDFLib;
    const flat = await PDFDocument.load(pdfBytes, { ignoreEncryption: true });
    const pages = flat.getPages();
    for (let pi = 0; pi < pages.length; pi++) {
      const pageNo = pi + 1;
      const pageStrokes = strokes.filter(s => s.page === pageNo);
      if (!pageStrokes.length) continue;
      const { width, height } = pages[pi].getSize();
      for (const s of pageStrokes) {
        const color = s.tool === 'hl' ? rgb(0.94, 0.78, 0.31) : rgb(0.06, 0.23, 0.23);
        const thickness = (s.tool === 'hl' ? 16 : 2.4) * (width / inkCanvas.clientWidth) / DPR * DPR;
        for (let i = 1; i < s.pts.length; i++) {
          pages[pi].drawLine({
            start: { x: s.pts[i - 1].x * width, y: height - s.pts[i - 1].y * height },
            end: { x: s.pts[i].x * width, y: height - s.pts[i].y * height },
            thickness: (s.tool === 'hl' ? 14 : 2.2) * (width / 792), color, opacity: s.tool === 'hl' ? 0.4 : 1
          });
        }
      }
    }
    const flatBytes = await flat.save();
    const b64 = btoa(String.fromCharCode(...new Uint8Array(flatBytes)));
    const safeName = ((doc && doc.title) || 'document').replace(/[^a-zA-Z0-9._-]/g, '_').replace(/\.pdf$/i, '') + '-annotated-' + new Date().toISOString().slice(0, 10) + '.pdf';

    const r2 = await api('/r2/upload', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: 'study/annotated/' + Date.now() + '-' + safeName, content: b64, mimeType: 'application/pdf', fileName: safeName })
    });

    let odLine = '';
    const driveName = 'Library/' + (doc && doc.moduleSource ? doc.moduleSource + '/' : '') + safeName;
    try {
      const od = await api('/gdrive/upload', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileName: driveName, content: b64, mimeType: 'application/pdf' })
      });
      odLine = od.success
        ? '<div class="badge green">Drive archived</div> <a href="' + esc(od.webViewLink || '#') + '" target="_blank" rel="noopener">open</a>'
        : '<div class="badge rose">Drive: ' + esc(od.error || 'failed') + '</div>';
    } catch (e) { odLine = '<div class="badge rose">Drive: ' + esc(e.message) + '</div>'; }

    out.innerHTML =
      '<div class="spread"><div><strong>' + esc(safeName) + '</strong></div></div>' +
      '<div class="row mt" style="flex-wrap:wrap; gap:8px;">' +
      '<div class="badge teal">R2 saved</div> <a href="' + esc(r2.url) + '" target="_blank" rel="noopener">view in R2</a> ' + odLine +
      '</div>';
    ARG.toast('Flattened and archived.');
  } catch (e) {
    out.innerHTML = '<div class="badge rose">Flattening failed: ' + esc(e.message) + '</div>';
  }
  btn.disabled = false;
});

document.getElementById('ask').addEventListener('click', () => {
  sessionStorage.setItem('arg:pending-prompt', 'Regarding "' + (doc ? doc.title : 'this document') + '" — what are its central claims and how do they bear on my work?');
  location.href = '/argentica/chat/';
});

(async function init() {
  if (!docId) { status.textContent = 'No document specified.'; return; }
  try {
    const data = await api('/documents/' + encodeURIComponent(docId));
    doc = data.document;
    document.getElementById('doc-title').textContent = doc.title;
    document.getElementById('doc-sub').textContent = (doc.annotations || []).length + ' saved annotations';
    if (doc.annotations && doc.annotations.length) {
      // migrate old pixel-coordinate strokes: mark them legacy (per-page render still shows current page's)
      strokes = doc.annotations;
    }
    const url = doc.content || '';
    if (url.includes('r2.dev') || url.endsWith('.pdf')) {
      const key = url.replace(/^https:\/\/[^/]+\//, '');
      const resp = await fetch('/api/r2/file?key=' + encodeURIComponent(key));
      if (!resp.ok) throw new Error('The file is not in storage (HTTP ' + resp.status + '). Try re-uploading it.');
      pdfBytes = new Uint8Array(await resp.arrayBuffer());
      pdf = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
      renderPage();
    } else if (url) {
      status.innerHTML = 'This file is not a PDF — <a href="' + esc(url) + '" target="_blank" rel="noopener">open it directly</a>.';
    } else {
      status.textContent = 'No file attached to this record.';
    }
  } catch (e) {
    status.textContent = 'Could not open the document: ' + e.message;
  }
})();
</script>
</body>
</html>
