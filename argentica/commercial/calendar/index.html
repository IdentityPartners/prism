<!DOCTYPE html>
<html lang="en-GB">
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argentica — Publishing calendar</title>
<link rel="stylesheet" href="/shared/argentica.css">
<style>
  .cal-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .cal-title { font-family: 'EB Garamond', Georgia, serif; font-size: 22px; color: #5c2d3f; }
  .cal-title small { display: block; font-family: 'Inter', sans-serif; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .cal-note { font-family: 'Caveat', cursive; font-size: 20px; color: #5c2d3f; line-height: 1.25; }
  .cal-note em { color: #7a4254; }

  /* week columns, journal style */
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-whead { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.14em;
    text-align: left; padding: 0 2px 5px; font-family: 'Inter', sans-serif; }
  .cal-wcell { min-height: 330px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 8px 10px; cursor: pointer; transition: border-color .12s; display: flex; flex-direction: column; gap: 4px; }
  .cal-wcell:hover { border-color: #a88792; }
  .cal-wcell.today { border-color: #5c2d3f; border-width: 1.5px; background: #fffdf6; }
  .cal-wcell .dnum { font-family: 'EB Garamond', Georgia, serif; font-size: 19px; color: #5c2d3f; text-align: right; line-height: 1; }
  .cal-wcell .dday { font-size: 10px; color: var(--ink-soft); letter-spacing: 0.06em; }

  .cal-ev { border-radius: 5px; padding: 2.5px 7px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-ev.diary { background: rgba(92, 45, 63, 0.07); color: #5c2d3f; border-left: 2px solid #5c2d3f; }
  .cal-ev.soc-posted { background: var(--t1, #e2ebea); color: #0f3b3a; }
  .cal-ev.soc-queued { background: #f0e9e0; color: #5c2d3f; }
  .cal-ev.soc-sched { background: #efe3e7; color: #5c2d3f; }
  .cal-ev.cadence { background: transparent; border: 1px dashed #a88792; color: #5c2d3f;
    font-family: 'Caveat', cursive; font-size: 15px; padding: 1px 7px 2px; }

  .cal-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--ink-soft); }
  .cal-legend .row { gap: 6px; }

  /* month view fallback */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-head { text-align: center; font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 0; }
  .cal-cell { min-height: 84px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font-size: 11.5px; position: relative; cursor: pointer; }
  .cal-cell.other { opacity: 0.42; }
  .cal-cell.today { border-color: #5c2d3f; border-width: 2px; }
  .cal-cell .dnum { font-size: 11px; color: var(--ink-soft); }

  .cal-adder { position: fixed; inset: 0; background: rgba(43, 33, 23, 0.28); z-index: 400; display: none; align-items: center; justify-content: center; }
  .cal-adder .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; width: min(360px, 90vw); }
  .cal-adder input, .cal-adder select { width: 100%; margin: 4px 0 10px; }
  .view-pills { display: flex; gap: 6px; align-items: center; }
  .view-pills button { padding: 5px 13px; border-radius: 999px; font-size: 12px; background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .view-pills button.on { background: var(--t1, #e2ebea); color: #5c2d3f; border-color: transparent; }

  /* ── Plan view: multi-week planning rows with a theme column ── */
  .cal-plan { display: flex; flex-direction: column; gap: 10px; }
  .plan-row { display: grid; grid-template-columns: 210px repeat(7, 1fr); gap: 6px; }
  .plan-theme { background: var(--paper); border: 1.5px dashed #a88792; border-radius: 8px; padding: 8px 10px; cursor: pointer;
    transition: border-color .12s, background .12s; min-height: 62px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .plan-theme:hover { border-color: #5c2d3f; background: #fffdf6; }
  .plan-theme.set { border-style: solid; }
  .plan-theme .pw { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.1em; font-family: 'Inter', sans-serif; }
  .plan-theme .pn { font-family: 'EB Garamond', Georgia, serif; font-size: 17px; color: #5c2d3f; line-height: 1.15; }
  .plan-theme .ps { font-family: 'Caveat', cursive; font-size: 15px; color: #7a4254; line-height: 1.1; }
  .plan-theme .px { font-size: 10.5px; color: #0f3b3a; }
  .plan-day { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; min-height: 62px; padding: 4px 6px; font-size: 10.5px; }
  .plan-day .dnum { font-size: 10px; color: var(--ink-soft); text-align: right; }
  .plan-day.today { border-color: #5c2d3f; }

  /* ── Theme modal (proper sized popup, not prompt()) ── */
  .theme-modal { position: fixed; inset: 0; background: rgba(43, 33, 23, 0.34); z-index: 420; display: none;
    align-items: center; justify-content: center; }
  .theme-modal .panel { background: var(--paper, #f7f3e9); border: 1px solid var(--line, #d8cfc0); border-radius: 12px;
    padding: 22px 24px; width: min(640px, 94vw); max-height: 88vh; overflow-y: auto; box-shadow: 0 18px 50px rgba(43,33,23,.25); }
  .theme-modal h3 { margin: 0 0 2px; font-family: 'EB Garamond', Georgia, serif; color: #5c2d3f; }
  .theme-modal .wk { font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
  .theme-modal label { display: block; font-size: 12px; color: var(--ink-soft); margin: 12px 0 4px; }
  .theme-modal input[type=text] { width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--line, #d8cfc0);
    border-radius: 6px; background: #fffdf6; font-family: 'EB Garamond', Georgia, serif; font-size: 16px; color: #3a2b28; }
  .theme-modal .ex-row { display: grid; grid-template-columns: 130px 1fr; gap: 8px; align-items: center; margin: 5px 0; }
  .theme-modal .ex-row input[type=checkbox] { accent-color: #5c2d3f; }
  .theme-modal .ex-row .pname { font-size: 12.5px; color: #3a2b28; }
  .theme-modal .ex-row input[type=text] { font-family: 'Inter', sans-serif; font-size: 13px; }
  .theme-modal .ex-row input[type=text]:disabled { opacity: 0.35; }
  .theme-modal .modal-actions { display: flex; justify-content: space-between; margin-top: 18px; gap: 8px; }
</style>
</head>
<body>
<div class="arg-page" data-key="pubcalendar">
  <div class="arg-pagehead spread">
    <div>
      <h1>Publishing calendar</h1>
      <div class="sub">The publishing pipeline in overview — a month at a time. For the week-by-week shape of what goes out, use Weekly Cadence. Click any day to add an event.</div>
      <div id="theme-banner" style="display:none; margin-top:8px; align-items:center; gap:10px;">
        <span style="background:#5c2d3f; color:#f7f3e9; border-radius:10px; padding:3px 12px; font-size:12.5px; font-family:'Inter',sans-serif;">This week's theme</span>
        <span id="theme-name" style="font-family:'Caveat',cursive; font-size:20px; color:#5c2d3f;"></span>
        <button class="ghost small" style="margin-left:8px;" onclick="manageThemes()">&#9998; Themes</button>
      </div>
    </div>
    <div class="row" style="gap:6px;">
      <button class="ghost small" id="cal-prev">&#8592;</button>
      <h3 id="cal-month" style="margin:0; min-width:170px; text-align:center;"></h3>
      <button class="ghost small" id="cal-next">&#8594;</button>
      <div class="view-pills" style="margin-left:14px;">
        <button id="view-week">Week</button>
        <button id="view-month" class="on">Month</button>
        <button id="view-plan">Plan</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="cal-week" id="cal-week"></div>
    <div class="cal-grid" id="cal-grid" style="display:none;"></div>
    <div class="cal-plan" id="cal-plan" style="display:none;"></div>
    <div class="cal-legend" id="cal-legend" style="display:flex;">
      <span class="row" style="gap:5px;"><span class="cal-ev diary" style="display:inline-block; width:22px;">&nbsp;</span> Diary</span>
      <span class="row" style="gap:5px;"><span class="cal-ev soc-posted" style="display:inline-block; width:22px;">&nbsp;</span> Posted</span>
      <span class="row" style="gap:5px;"><span class="cal-ev soc-queued" style="display:inline-block; width:22px;">&nbsp;</span> Queued</span>
      <span class="row" style="gap:5px;"><span class="cal-ev soc-sched" style="display:inline-block; width:22px;">&nbsp;</span> Scheduled</span>
      <span class="row" style="gap:5px;"><span class="cal-ev cadence" style="display:inline-block; width:22px;">&nbsp;</span> Cadence (planned)</span>
    </div>
  </div>
</div>

<div class="cal-adder" id="cal-adder">
  <div class="panel">
    <h3 style="margin-top:0;">Add event <span class="muted" id="adder-date" style="font-size:13px;"></span></h3>
    <label class="muted" style="font-size:12px;">Title</label>
    <input type="text" id="adder-title" placeholder="e.g. Supervision, tutorial, client session">
    <label class="muted" style="font-size:12px;">Time</label>
    <select id="adder-time">
      <option value="">All day</option>
      <option value="08:00">08:00</option><option value="09:00">09:00</option><option value="10:00">10:00</option>
      <option value="11:00">11:00</option><option value="12:00">12:00</option><option value="13:00">13:00</option>
      <option value="14:00">14:00</option><option value="15:00">15:00</option><option value="16:00">16:00</option>
      <option value="17:00">17:00</option><option value="18:00">18:00</option><option value="19:00">19:00</option>
    </select>
    <div class="row" style="justify-content:flex-end; gap:8px;">
      <button class="ghost" id="adder-cancel">Cancel</button>
      <button id="adder-save">Add to diary</button>
    </div>
  </div>
</div>

<div class="theme-modal" id="theme-modal">
  <div class="panel">
    <h3>Week theme</h3>
    <div class="wk" id="tm-week"></div>
    <label>Primary theme</label>
    <input type="text" id="tm-primary" list="tm-suggestions" placeholder="e.g. Boundaries, Recovery capital, Sober joy...">
    <datalist id="tm-suggestions"></datalist>
    <label>Secondary theme (optional companion thread)</label>
    <input type="text" id="tm-secondary" list="tm-suggestions" placeholder="e.g. a lighter note, a counterpoint...">
    <label>Single-week per-platform exceptions &mdash; tick a platform to give it its own theme this week</label>
    <div id="tm-exceptions"></div>
    <div class="modal-actions">
      <div><button class="ghost" id="tm-clear" style="color:#8a3b3b;">Clear this week</button></div>
      <div class="row" style="gap:8px; justify-content:flex-end;">
        <button class="ghost" id="tm-cancel">Cancel</button>
        <button id="tm-save">Save theme</button>
      </div>
    </div>
  </div>
</div>

<script src="/shared/argentica.js"></script>
<script>
ARG.buildShell('pubcalendar');
const { api, esc } = ARG;

let view = new Date();
let diary = [], social = [];
let pickedDate = null;
let viewMode = 'month';  // Publishing calendar: pipeline overview by default
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

// ── Themed weeks ──
let THEMES = [];
function mondayISO(d) { const n = new Date(d); const dow = (n.getDay() + 6) % 7; n.setDate(n.getDate() - dow); n.setHours(0,0,0,0); return n.toISOString().slice(0, 10); }
async function loadThemes() {
  try { const d = await api('/themes'); THEMES = d.themes || []; } catch (e) { THEMES = []; }
  const banner = document.getElementById('theme-banner');
  if (!banner) return;
  const cur = THEMES.find(t => t.week === mondayISO(new Date()));
  banner.style.display = 'flex';
  document.getElementById('theme-name').textContent = cur ? (cur.name + (cur.secondary ? '  \u00b7  + ' + cur.secondary : '')) : 'no theme set this week';
  banner.querySelector('span').style.background = cur ? '' : 'rgba(0,0,0,.08)';
}
async function kvGet(key) {
  try { const r = await api('/kv/get?key=' + encodeURIComponent(key)); return typeof r.value === 'string' ? JSON.parse(r.value) : (r.value || null); }
  catch (e) { return null; }
}

// ── Cadence slots (planned weekly cadence) ──
let cadenceSlots = [];
async function loadCadence() { cadenceSlots = (await kvGet('cadence:slots')) || []; }

async function load() {
  loadThemes(); loadCadence();
  try {
    const cal = await api('/calendar/events?from=' + new Date().toISOString().slice(0,10) + '&to=' + new Date(Date.now() + 90*24*3600*1000).toISOString().slice(0,10));
    diary = (cal.events || []);
  } catch (e) { diary = []; }
  try {
    const q = await api('/mm/queue');
    social = (q.queue || []).filter(i => i.status === 'pending' || i.status === 'scheduled' || i.status === 'posted');
  } catch (e) { social = []; }
  render();
}

function chipsFor(iso) {
  const evs = diary.filter(e => (e.starts_at || '').slice(0, 10) === iso);
  const socs = social.filter(s => (s.createdAt || s.scheduledFor || '').slice(0, 10) === iso);
  let html = evs.map(e => '<div class="cal-ev diary" title="' + esc(e.title) + '">' + esc((e.starts_at || '').slice(11, 16)) + ' ' + esc(String(e.title || '').slice(0, 22)) + '</div>').join('');
  html += socs.map(s => {
    const cls = s.status === 'posted' ? 'soc-posted' : s.status === 'scheduled' ? 'soc-sched' : 'soc-queued';
    const label = s.status === 'posted' ? 'posted' : s.status === 'scheduled' ? 'sched' : 'queued';
    return '<div class="cal-ev ' + cls + '" title="' + esc(String(s.text || '').slice(0, 80)) + '">' + label + ' &middot; ' + esc((s.platforms || []).join('/').slice(0, 14)) + '</div>';
  }).join('');
  return html;
}

function cadenceChipsFor(dowIdx) {
  const dayName = DAYS[dowIdx];
  return cadenceSlots.filter(s => s.day === dayName)
    .map(s => '<div class="cal-ev cadence" title="Cadence: ' + esc(s.channels || '') + '">' + esc(s.note || s.contentType) + ' &rarr; ' + esc((s.channels || '').replace(/,/g, '/')) + '</div>').join('');
}

function renderWeek() {
  const grid = document.getElementById('cal-week');
  const base = new Date(view);
  const dow = (base.getDay() + 6) % 7;
  base.setDate(base.getDate() - dow);
  const today = new Date();
  document.getElementById('cal-month').textContent = base.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) + ' \u2013 ' +
    new Date(base.getFullYear(), base.getMonth(), base.getDate() + 6).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  let html = DAYS.map(d => '<div class="cal-whead">' + d + '</div>').join('');
  for (let i = 0; i < 7; i++) {
    const d = new Date(base); d.setDate(base.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    const isToday = d.toDateString() === today.toDateString();
    html += '<div class="cal-wcell' + (isToday ? ' today' : '') + '" onclick="cellClick(\'' + iso + '\')">' +
      '<div class="dday">' + d.toLocaleDateString('en-GB', { weekday: 'short' }) + '</div>' +
      '<div class="dnum">' + d.getDate() + '</div>' +
      chipsFor(iso) + cadenceChipsFor(i) +
      '</div>';
  }
  grid.innerHTML = html;
}

function renderMonth() {
  const grid = document.getElementById('cal-grid');
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById('cal-month').textContent = view.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const first = new Date(y, m, 1);
  const start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  const today = new Date();
  let html = DAYS.map(d => '<div class="cal-head">' + d + '</div>').join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    const inMonth = d.getMonth() === m;
    const isToday = d.toDateString() === today.toDateString();
    html += '<div class="cal-cell' + (inMonth ? '' : ' other') + (isToday ? ' today' : '') + '" onclick="cellClick(\'' + iso + '\')">' +
      '<div class="dnum">' + d.getDate() + '</div>' + chipsFor(iso) +
      '</div>';
  }
  grid.innerHTML = html;
}

function render() {
  const modes = ['week', 'month', 'plan'];
  modes.forEach(mv => document.getElementById('cal-' + (mv === 'week' ? 'week' : mv === 'month' ? 'grid' : 'plan')).style.display = viewMode === mv ? '' : 'none');
  document.getElementById('cal-legend').style.display = viewMode === 'plan' ? 'none' : 'flex';
  if (viewMode === 'week') renderWeek(); else if (viewMode === 'month') renderMonth(); else renderPlan();
  document.getElementById('cal-month').style.minWidth = viewMode === 'plan' ? '110px' : '170px';
}

function setView(mv) {
  viewMode = mv;
  ['week', 'month', 'plan'].forEach(id => document.getElementById('view-' + id).classList.toggle('on', id === mv));
  render();
}
document.getElementById('cal-prev').addEventListener('click', () => { if (viewMode === 'week') view.setDate(view.getDate() - 7); else if (viewMode === 'plan') view.setDate(view.getDate() - 28); else view.setMonth(view.getMonth() - 1); render(); });
document.getElementById('cal-next').addEventListener('click', () => { if (viewMode === 'week') view.setDate(view.getDate() + 7); else if (viewMode === 'plan') view.setDate(view.getDate() + 28); else view.setMonth(view.getMonth() + 1); render(); });
document.getElementById('view-week').addEventListener('click', () => setView('week'));
document.getElementById('view-month').addEventListener('click', () => setView('month'));
document.getElementById('view-plan').addEventListener('click', () => setView('plan'));

// ── Themed week management ──
async function saveThemes() {
  try { await api('/themes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ themes: THEMES }) }); }
  catch (e) { ARG.toast('Could not save themes.'); return; }
  ARG.toast('Week themes saved — the drafting agents will follow them.');
  loadThemes();
}
const PLATFORMS = ['substack', 'linkedin', 'x', 'threads', 'bluesky', 'instagram', 'facebook', 'tumblr'];

function themeFor(weekISO) { return THEMES.find(t => t.week === weekISO) || null; }

function renderPlan() {
  const grid = document.getElementById('cal-plan');
  const start = new Date(view);
  start.setHours(12, 0, 0, 0);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  const today = new Date();
  document.getElementById('cal-month').textContent =
    start.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' \u2013 ' +
    new Date(start.getFullYear(), start.getMonth(), start.getDate() + 27).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  let html = '<div class="plan-row">' + ['<div class="cal-whead" style="color:#5c2d3f;">Theme</div>'].concat(DAYS.map(d => '<div class="cal-whead">' + d + '</div>')).join('') + '</div>';
  for (let w = 0; w < 4; w++) {
    const base = new Date(start); base.setDate(start.getDate() + w * 7);
    const wISO = base.toISOString().slice(0, 10);
    const t = themeFor(wISO);
    let themeCell = '<div class="plan-theme' + (t && t.name ? ' set' : '') + '" onclick="openThemeModal(\'' + wISO + '\')">';
    themeCell += '<div class="pw">' + base.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' &middot; click to plan</div>';
    themeCell += t && t.name ? '<div class="pn">' + esc(t.name) + '</div>'
      + (t.secondary ? '<div class="ps">+ ' + esc(t.secondary) + '</div>' : '')
      + (t.exceptions && Object.keys(t.exceptions).length ? '<div class="px">exceptions: ' + Object.keys(t.exceptions).join(', ') + '</div>' : '')
      : '<div class="pn" style="color:#a88792;">\u2014 no theme set \u2014</div>';
    themeCell += '</div>';
    let daysHtml = '';
    for (let i = 0; i < 7; i++) {
      const d = new Date(base); d.setDate(base.getDate() + i);
      const iso = d.toISOString().slice(0, 10);
      daysHtml += '<div class="plan-day' + (d.toDateString() === today.toDateString() ? ' today' : '') + '"><div class="dnum">' + d.getDate() + '</div>' + chipsFor(iso) + cadenceChipsFor(i) + '</div>';
    }
    html += '<div class="plan-row">' + themeCell + daysHtml + '</div>';
  }
  grid.innerHTML = html;
}

let modalWeek = null;
function openThemeModal(weekISO) {
  modalWeek = weekISO;
  const d = new Date(weekISO + 'T12:00:00');
  document.getElementById('tm-week').textContent = 'Week of ' + d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const t = themeFor(weekISO) || {};
  document.getElementById('tm-primary').value = t.name || '';
  document.getElementById('tm-secondary').value = t.secondary || '';
  const suggestions = [...new Set(THEMES.map(x => x.name).filter(Boolean))];
  document.getElementById('tm-suggestions').innerHTML = suggestions.map(n => '<option value="' + esc(n) + '">').join('');
  const ex = t.exceptions || {};
  document.getElementById('tm-exceptions').innerHTML = PLATFORMS.map(p =>
    '<div class="ex-row"><label class="row" style="gap:6px;margin:0;align-items:center;"><input type="checkbox" id="tm-ex-' + p + '" ' + (ex[p] ? 'checked' : '') + ' onchange="document.getElementById(\'tm-exx-' + p + '\').disabled=!this.checked"><span class="pname">' + p + '</span></label>' +
    '<input type="text" id="tm-exx-' + p + '" placeholder="own theme for this week" value="' + esc(ex[p] || '') + '" ' + (ex[p] ? '' : 'disabled') + '></div>').join('');
  document.getElementById('theme-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('tm-primary').focus(), 50);
}
window.openThemeModal = openThemeModal;

document.getElementById('tm-cancel').addEventListener('click', () => { document.getElementById('theme-modal').style.display = 'none'; });
document.getElementById('theme-modal').addEventListener('click', e => { if (e.target.id === 'theme-modal') e.currentTarget.style.display = 'none'; });
document.getElementById('tm-clear').addEventListener('click', () => {
  THEMES = THEMES.filter(t => t.week !== modalWeek);
  saveThemes();
  document.getElementById('theme-modal').style.display = 'none';
});
document.getElementById('tm-save').addEventListener('click', () => {
  const primary = document.getElementById('tm-primary').value.trim();
  const secondary = document.getElementById('tm-secondary').value.trim();
  const exceptions = {};
  PLATFORMS.forEach(p => {
    const on = document.getElementById('tm-ex-' + p) && document.getElementById('tm-ex-' + p).checked;
    const val = document.getElementById('tm-exx-' + p).value.trim();
    if (on && val) exceptions[p] = val;
  });
  if (!primary) { ARG.toast('Give the week a primary theme.'); return; }
  THEMES = THEMES.filter(t => t.week !== modalWeek);
  THEMES.push({ week: modalWeek, name: primary, secondary: secondary || '', exceptions: exceptions });
  THEMES.sort((a, b) => a.week.localeCompare(b.week));
  saveThemes();
  document.getElementById('theme-modal').style.display = 'none';
});
document.getElementById('tm-primary').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('tm-save').click(); });

function manageThemes() { setView('plan'); }


// ── click day to add ──
window.cellClick = iso => {
  pickedDate = iso;
  document.getElementById('adder-date').textContent = new Date(iso).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('adder-title').value = '';
  document.getElementById('adder-time').value = '';
  document.getElementById('cal-adder').style.display = 'flex';
  setTimeout(() => document.getElementById('adder-title').focus(), 50);
};
document.getElementById('adder-cancel').addEventListener('click', () => { document.getElementById('cal-adder').style.display = 'none'; });
document.getElementById('adder-save').addEventListener('click', async () => {
  const title = document.getElementById('adder-title').value.trim();
  if (!title) { ARG.toast('Give the event a title.'); return; }
  const time = document.getElementById('adder-time').value;
  try {
    await api('/calendar/events', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, date: pickedDate, time: time || null }) });
    document.getElementById('cal-adder').style.display = 'none';
    ARG.toast('Added to the diary.');
    load();
  } catch (e) { ARG.toast('Could not add: ' + e.message); }
});
document.getElementById('adder-title').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('adder-save').click(); });

load();
</script>
