<!DOCTYPE html>
<html lang="en-GB">
<head>
<!-- cache-bust-1792935955 -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Team &mdash; Argentica</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3b3a'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23d4899a'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%237ecfcd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/prism.css">
<link rel="stylesheet" href="/shared/themes.css">
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<style>
.dt-shell{display:flex;height:100vh;overflow:hidden;}
.dt-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.dt-hdr{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg-elevated);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.dt-hdr h2{font-size:16px;font-weight:700;margin:0;flex:1;}
.dt-body{flex:1;display:grid;grid-template-columns:1fr 320px;overflow:hidden;}
.dt-chat{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);}
.dt-messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
.dt-msg{display:flex;gap:8px;align-items:flex-start;}
.dt-msg.user{flex-direction:row-reverse;}
.dt-bubble{max-width:85%;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5;font-family:monospace;}
.dt-msg.agent .dt-bubble{background:var(--bg-elevated);border:1px solid var(--border);color:var(--fg);border-radius:4px 10px 10px 10px;font-family:inherit;}
.dt-msg.user .dt-bubble{background:var(--accent);color:#fff;border-radius:10px 4px 10px 10px;font-family:inherit;}
.dt-msg.system .dt-bubble{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--fg);font-size:11px;font-style:italic;font-family:inherit;}
.dt-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;background:linear-gradient(135deg,#0f3b3a,#5c2d3f);color:#fff;}
.dt-input-area{border-top:1px solid var(--border);padding:10px 12px;background:var(--bg-elevated);flex-shrink:0;}
.dt-textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;resize:none;min-height:44px;max-height:120px;background:var(--bg);color:var(--fg);box-sizing:border-box;}
.dt-send{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;margin-top:6px;float:right;}
.dt-quick{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
.dt-quick-btn{padding:3px 9px;border:1px solid var(--border);border-radius:8px;font-size:11px;cursor:pointer;background:var(--bg);color:var(--fg-muted);font-family:inherit;}
.dt-quick-btn:hover{border-color:var(--accent);color:var(--accent);}
.dt-tools{overflow-y:auto;padding:12px;}
.tool-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;}
.tool-card h4{font-size:12px;font-weight:700;margin:0 0 8px;text-transform:uppercase;letter-spacing:0.4px;color:var(--fg-muted);}
.tool-btn{display:block;width:100%;padding:7px 10px;margin-bottom:5px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;background:var(--bg);color:var(--fg);font-family:inherit;text-align:left;transition:all 0.15s;}
.tool-btn:hover{border-color:var(--accent);color:var(--accent);}
.tool-btn.danger:hover{border-color:#dc2626;color:#dc2626;}
.tool-result{font-size:11px;font-family:monospace;background:var(--bg-sunken);border-radius:5px;padding:8px;margin-top:6px;max-height:120px;overflow-y:auto;white-space:pre-wrap;display:none;}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}
.status-ok{background:#16a34a;}
.status-warn{background:#f59e0b;}
.status-err{background:#dc2626;}
</style>
</head>
<body>
<script src="/shared/prism.js"></script>
<div id="sidebar-mount"></div>
<div id="main-content">
<div class="dt-shell">
<div class="dt-main">
  <div class="dt-hdr">
    <div class="dt-avatar">&#x1F6E0;</div>
    <div>
      <h2>Dev Team</h2>
      <div style="font-size:11px;color:var(--fg-muted);">Autonomous system maintenance. Can push to GitHub, test providers, read/write KV.</div>
    </div>
    <div style="display:flex;gap:6px;">
      <button onclick="runDiagnostic()" style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--bg);font-size:12px;">&#x1F50D; Diagnose</button>
      <button onclick="clearChat()" style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--bg);font-size:12px;">Clear</button>
    </div>
  </div>

  <div class="dt-body">
    <div class="dt-chat">
      <div class="dt-messages" id="dt-messages">
        <div class="dt-msg system"><div class="dt-bubble">Dev Team online. I can diagnose issues, test providers, push fixes to GitHub, and read/write KV. What needs fixing?</div></div>
      </div>
      <div class="dt-input-area">
        <div class="dt-quick">
          <button class="dt-quick-btn" onclick="quickMsg('Run full diagnostic')">Full diagnostic</button>
          <button class="dt-quick-btn" onclick="quickMsg('Test all providers and report which are working')">Test providers</button>
          <button class="dt-quick-btn" onclick="quickMsg('Check Worker status')">Worker status</button>
          <button class="dt-quick-btn" onclick="quickMsg('What is in the queue?')">Queue status</button>
          <button class="dt-quick-btn" onclick="quickMsg('Clean up test threads from KV')">Clean test threads</button>
        </div>
        <textarea class="dt-textarea" id="dt-input" placeholder="Describe the issue or task..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendDT();}"></textarea>
        <button class="dt-send" onclick="sendDT()">Send</button>
      </div>
    </div>

    <div class="dt-tools">
      <div class="tool-card">
        <h4>&#x26A1; Quick Actions</h4>
        <button class="tool-btn" onclick="toolAction('test_providers')">&#x25B6; Test all providers</button>
        <button class="tool-btn" onclick="toolAction('check_worker')">&#x1F50D; Check Worker status</button>
        <button class="tool-btn" onclick="toolAction('get_queue')">&#x1F4CB; Get MM queue</button>
        <button class="tool-btn" onclick="toolAction('check_kv')">&#x1F5C4; Check KV health</button>
        <div class="tool-result" id="result-quick"></div>
      </div>

      <div class="tool-card">
        <h4>&#x1F4C1; GitHub</h4>
        <button class="tool-btn" onclick="showPushFile()">&#x2B06; Push file to GitHub</button>
        <div id="push-file-form" style="display:none;margin-top:8px;">
          <input type="text" id="push-path" placeholder="Path e.g. shared/prism.js" style="width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:11px;background:var(--bg);color:var(--fg);box-sizing:border-box;margin-bottom:4px;">
          <div id="monaco-container" style="width:100%;height:180px;border:1px solid var(--border);border-radius:5px;margin-bottom:4px;overflow:hidden;"></div>
<textarea id="push-content" style="display:none;"></textarea>
          <input type="text" id="push-message" placeholder="Commit message" style="width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:11px;background:var(--bg);color:var(--fg);box-sizing:border-box;margin-bottom:4px;">
          <button onclick="executePushFile()" style="padding:5px 12px;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;">Push</button>
        </div>
        <div class="tool-result" id="result-github"></div>
      </div>

      <div class="tool-card">
        <h4>&#x1F5C4; KV Store</h4>
        <div style="display:flex;gap:4px;margin-bottom:4px;">
          <input type="text" id="kv-key" placeholder="Key" style="flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:11px;background:var(--bg);color:var(--fg);">
          <button onclick="kvGet()" style="padding:5px 10px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:11px;background:var(--bg);">Get</button>
        </div>
        <textarea id="kv-value" placeholder="Value (for set)" style="width:100%;min-height:50px;padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:11px;background:var(--bg);color:var(--fg);resize:vertical;box-sizing:border-box;margin-bottom:4px;"></textarea>
        <button onclick="kvSet()" style="padding:5px 10px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:11px;background:var(--bg);">Set</button>
        <div class="tool-result" id="result-kv"></div>
      </div>

      <div class="tool-card">
        <h4>&#x26A0; Danger Zone</h4>
        <button class="tool-btn danger" onclick="cleanTestThreads()">&#x1F5D1; Clean test threads</button>
        <button class="tool-btn danger" onclick="clearMMQueue()">&#x1F5D1; Clear MM queue</button>
        <div class="tool-result" id="result-danger"></div>
      </div>

      <div class="tool-card">
        <h4>&#x1F4CA; System Status</h4>
        <div id="system-status" style="font-size:11px;color:var(--fg-muted);">Loading...</div>
      </div>
    </div>
  </div>
</div>
</div>
</div>

<script>
var WORKER = 'https://prism-api.identitypartners.workers.dev';
var chatHistory = [];

document.addEventListener('DOMContentLoaded', function() {
  var mount = document.getElementById('sidebar-mount');
  if (mount && typeof buildSidebar === 'function') {
    var sb = buildSidebar('/dev-team/');
    mount.parentNode.insertBefore(sb, mount);
    mount.parentNode.removeChild(mount);
  }
  loadSystemStatus();
});

function addMsg(role, text) {
  var msgs = document.getElementById('dt-messages');
  var div = document.createElement('div');
  div.className = 'dt-msg ' + role;
  var avatar = document.createElement('div');
  avatar.className = 'dt-avatar';
  avatar.textContent = role === 'user' ? 'S' : role === 'agent' ? '&#x1F6E0;' : '!';
  if (role === 'user') avatar.style.background = 'var(--accent)';
  var bubble = document.createElement('div');
  bubble.className = 'dt-bubble';
  bubble.textContent = text;
  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function sendDT() {
  var input = document.getElementById('dt-input');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);
  chatHistory.push({role:'user',content:text});

  var sysPrompt = 'You are the Dev Team for Argentica. You have access to tools: test_providers, check_worker, push_file, get_kv, set_kv. When you need to use a tool, write TOOL: tool_name({"param":"value"}) on its own line. British English. Never ask Simon to do anything technical. Execute tasks directly.';
  var messages = [{role:'system',content:sysPrompt}].concat(chatHistory);

  fetch(WORKER + '/api/devteam', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({agent:'dev-team',messages:messages,message:text,profile:'balanced'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var response = d.content || 'No response.';
    chatHistory.push({role:'assistant',content:response});
    addMsg('agent', response);

    // Check for tool calls in response
    var toolMatch = response.match(/TOOL:\s*(\w+)\(({[^}]*})\)/);
    if (toolMatch) {
      var toolName = toolMatch[1];
      var toolArgs = {};
      try { toolArgs = JSON.parse(toolMatch[2]); } catch(e) {}
      executeTool(toolName, toolArgs);
    }
  })
  .catch(function(e){ addMsg('system', 'Error: ' + e.message); });
}

function quickMsg(text) {
  document.getElementById('dt-input').value = text;
  sendDT();
}

function clearChat() {
  chatHistory = [];
  var msgs = document.getElementById('dt-messages');
  msgs.innerHTML = '<div class="dt-msg system"><div class="dt-bubble">Chat cleared. Dev Team ready.</div></div>';
}

function executeTool(name, args) {
  addMsg('system', 'Executing tool: ' + name + '...');
  fetch(WORKER + '/api/devteam/execute', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:name, ...args})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    addMsg('agent', 'Tool result: ' + JSON.stringify(d.results || d, null, 2).substring(0, 500));
  })
  .catch(function(e){ addMsg('system', 'Tool error: ' + e.message); });
}

function toolAction(action) {
  var resultEl = document.getElementById('result-quick');
  resultEl.style.display = 'block';
  resultEl.textContent = 'Running ' + action + '...';
  fetch(WORKER + '/api/devteam/execute', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:action})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    resultEl.textContent = JSON.stringify(d.results || d, null, 2).substring(0, 800);
  })
  .catch(function(e){ resultEl.textContent = 'Error: ' + e.message; });
}

function showPushFile() {
  var form = document.getElementById('push-file-form');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

function executePushFile() {
  var path = document.getElementById('push-path').value.trim();
  var content = document.getElementById('push-content').value;
  var message = document.getElementById('push-message').value || 'Dev Team fix';
  if (!path || !content) { alert('Enter path and content.'); return; }
  var resultEl = document.getElementById('result-github');
  resultEl.style.display = 'block';
  resultEl.textContent = 'Pushing...';
  fetch(WORKER + '/api/devteam/execute', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'push_file', path:path, content:content, message:message})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    resultEl.textContent = d.results && d.results.push ? (d.results.push.success ? 'Pushed: ' + d.results.push.sha : 'Failed: ' + JSON.stringify(d.results.push)) : JSON.stringify(d).substring(0,200);
  })
  .catch(function(e){ resultEl.textContent = 'Error: ' + e.message; });
}

function kvGet() {
  var key = document.getElementById('kv-key').value.trim();
  if (!key) return;
  var resultEl = document.getElementById('result-kv');
  resultEl.style.display = 'block';
  resultEl.textContent = 'Getting...';
  fetch(WORKER + '/api/devteam/execute', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'get_kv', key:key})
  })
  .then(function(r){return r.json();})
  .then(function(d){ resultEl.textContent = d.results && d.results.value !== undefined ? (d.results.value || '(empty)') : JSON.stringify(d).substring(0,200); })
  .catch(function(e){ resultEl.textContent = 'Error: ' + e.message; });
}

function kvSet() {
  var key = document.getElementById('kv-key').value.trim();
  var value = document.getElementById('kv-value').value;
  if (!key) return;
  var resultEl = document.getElementById('result-kv');
  resultEl.style.display = 'block';
  resultEl.textContent = 'Setting...';
  fetch(WORKER + '/api/devteam/execute', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'set_kv', key:key, value:value})
  })
  .then(function(r){return r.json();})
  .then(function(d){ resultEl.textContent = d.results && d.results.set ? 'Set OK' : JSON.stringify(d).substring(0,200); })
  .catch(function(e){ resultEl.textContent = 'Error: ' + e.message; });
}

function cleanTestThreads() {
  if (!confirm('Delete all test threads from KV?')) return;
  var resultEl = document.getElementById('result-danger');
  resultEl.style.display = 'block';
  resultEl.textContent = 'Cleaning...';
  fetch(WORKER + '/api/chat/cleanup-test-threads', {method:'POST'})
  .then(function(r){return r.json();})
  .then(function(d){ resultEl.textContent = 'Cleaned: ' + JSON.stringify(d).substring(0,200); })
  .catch(function(e){ resultEl.textContent = 'Error: ' + e.message; });
}

function clearMMQueue() {
  if (!confirm('Clear all pending Media Manager queue items?')) return;
  var resultEl = document.getElementById('result-danger');
  resultEl.style.display = 'block';
  resultEl.textContent = 'Clearing...';
  fetch(WORKER + '/api/mm/queue/clear', {method:'POST'})
  .then(function(r){return r.json();})
  .then(function(d){ resultEl.textContent = 'Cleared: ' + JSON.stringify(d).substring(0,200); })
  .catch(function(e){ resultEl.textContent = 'Error: ' + e.message; });
}

function runDiagnostic() {
  addMsg('system', 'Running full diagnostic...');
  fetch(WORKER + '/api/devteam/execute', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'test_providers'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var results = d.results && d.results.providers ? d.results.providers : d;
    var ok = results.ok || 0;
    var tested = results.tested || 0;
    var lines = ['Provider test: ' + ok + '/' + tested + ' OK'];
    (results.results || []).forEach(function(r) {
      lines.push((r.status==='ok'?'OK':'FAIL') + ' ' + r.name + ': ' + r.status + (r.ms?' ('+r.ms+'ms)':'')+  (r.error?' - '+r.error:''));
    });
    addMsg('agent', lines.join('\n'));
  })
  .catch(function(e){ addMsg('system', 'Diagnostic error: ' + e.message); });
}

function loadSystemStatus() {
  var el = document.getElementById('system-status');
  fetch(WORKER + '/')
  .then(function(r){return r.json();})
  .then(function(d){
    el.innerHTML = '<span class="status-dot status-ok"></span>Worker v' + d.version + ' &middot; ' + new Date(d.timestamp).toLocaleTimeString('en-GB');
  })
  .catch(function(){
    el.innerHTML = '<span class="status-dot status-err"></span>Worker unreachable';
  });
}
</script>
<script>
(function() {
  if (typeof require === 'undefined') return;
  require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs'}});
  require(['vs/editor/editor.main'], function() {
    var container = document.getElementById('monaco-container');
    if (!container) return;
    var ed = monaco.editor.create(container, {
      value:'// Enter file content here',
      language:'javascript',
      theme:'vs-dark',
      minimap:{enabled:false},
      fontSize:12,
      lineNumbers:'on',
      scrollBeyondLastLine:false,
      automaticLayout:true,
    });
    ed.onDidChangeModelContent(function() {
      var ta = document.getElementById('push-content');
      if (ta) ta.value = ed.getValue();
    });
    var pathInput = document.getElementById('push-path');
    if (pathInput) {
      pathInput.addEventListener('input', function() {
        var ext = this.value.split('.').pop().toLowerCase();
        var langMap = {js:'javascript',ts:'typescript',html:'html',css:'css',json:'json',md:'markdown',py:'python',sh:'shell'};
        monaco.editor.setModelLanguage(ed.getModel(), langMap[ext] || 'plaintext');
      });
    }
    window._monacoEditor = ed;
  });
})();
</script>
</body>
</html>
